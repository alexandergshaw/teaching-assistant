  note: 'WHY THIS IS A ROW AND NOT A NO-OP. The owner uses this tool and asked for a control that is already on the screen, already labelled Regenerate, and already has an aria-label. That is a finding about the surface, not about the owner. Something is hiding it, and the candidates are cheap to check but MUST be checked against the RENDERED page rather than the source, because NO COMPONENT IS RENDERED BY ANY TEST HERE and every gate is green today. THE CANDIDATES, in the order worth testing. (1) IT MAY BE BEHIND A CONDITION: the control sits inside AnnouncementDraftSlot, which only exists once a slot HAS a draft - if the owner looked before drafting, or at a slot in a non-drafted phase, there was nothing to see. (2) IT MAY BE VISUALLY LOST: it is one of several arm-then-confirm controls in the same slot row, sharing one control contract and one stylesheet, so it can read as part of a cluster rather than as the primary way to redo a draft. (3) THE ARM-THEN-CONFIRM SHAPE MAY ITSELF BE THE PROBLEM: a first click does not regenerate, it arms - and a control that appears to do nothing on click is indistinguishable from a broken one. That shape is deliberate and it is a confirm step, which this repo does NOT trade away for fewer clicks, so the fix is disclosure and placement, never removing the confirm. DO NOT BUILD A SECOND REGENERATE. This repo has a recorded class where a capability shipped twice because the first copy was not found, and a separate recorded class where a feature shipped DEAD with every gate green. This row is the mirror of both: the feature is live and the REACHABILITY is what failed. FIRST STEP, owed before any code: the owner says where they looked and what they expected to click. That is one question, and it is the only instrument this checkout has - the network is blocked, there is no .env, and nothing renders under vitest, so no agent here can observe the rendered control at all.'
