  from: 'owner request, 2026-09-15'
  note: 'MEASURED SIZES, because they constrain every possible design: index.tsx 912, RepoGradeCellControl.tsx 628, RepoGradesControls.tsx 634, RepoGradesGrid.tsx 605, LinkUsernamesPanel.tsx 453, plus four smaller files. index.tsx is 88 lines from the 1000-line ceiling enforced by src/file-size-ceiling.structure.test.ts:30, and docs/aesthetics-pass-acceptance-criteria.md:420 already names it as one of the two largest components in the app. So an overhaul CANNOT be additive - it must extract before it adds, and the extraction is the wave, not a follow-up ticket. BLOCKED ON A5 AND A6 BY FILE SET, not by logic: both are in flight against RepoGradesControls.tsx and RepoGradesGrid.tsx right now, and parallel-disjointness.md forbids a third item in the same files. They are small and land first. WHAT THE SCOPING PASS OWES, and the order matters: (1) read docs/repo-grades-ux-overhaul-acceptance-criteria.md FIRST and list what it already decided, so this pass does not re-litigate settled questions or, worse, silently reverse them - it records specific decisions about sticky headers, badge systems, focus styles, the score box, and the mobile reflow; (2) the owner named FOUR things - streamlined, user friendly, intuitive, and TELEGRAPH WHAT STATE THINGS ARE IN - and the fourth is the most concrete and the most testable, so inventory every state this view can be in today (scanning, scan error, per-repo folder-scan failure, ungraded, grading, graded, missing folder, posting, posted, post failed, rate-limited, binding unconfirmed) and say for each where it is shown, how, and whether two states share one appearance; (3) the same doc records that this view runs TWO BADGE SYSTEMS in one surface and calls that a defect, which is exactly a telegraph-the-state problem the owner is now asking about independently - start there. RULING X-1 APPLIES AND IS THE ACCEPTANCE NUMBER: count interactions per graded repo before and after, setup separately from steady state.'
- id: 'A8'
  state: 'unscoped'
  title: 'The discussion grader treats a student''s REPLIES as independent posts. Owner, 2026-09-15, with a screenshot of the submission view: one student''s three contributions to a Student Introductions topic are listed as three peer items - their actual introduction, plus two replies addressed to other students ("@Seth Vander Vorst", "@Luke Demmel") - under a heading that calls all of them the assignment''s submissions. A reply to a classmate is not a second introduction, and grading it as one both misreads the work and inflates whatever a rubric counts.'
  owns: []
  verify: null
  blocked_by: []
  instrument: 'Owner screenshot plus a direct read of src/lib/canvas/discussions.ts:106-152, 2026-09-15'
  from: 'owner request, 2026-09-15'
  note: 'OWNER DECISION 2026-09-15, asked and answered: REPLIES ARE GRADED SEPARATELY, AGAINST DIFFERENT CRITERIA. Not excluded, not merely labelled. That is the reading most discussion rubrics already use - an initial post scored on substance against the prompt, and replies scored on engagement with a classmate - and it makes the current behaviour a real scoring error rather than a presentation one: a reply is being measured against criteria written for an introduction it was never trying to be. WHAT THE DECISION IMPLIES, for whoever scopes this. (1) THE RUBRIC GAINS A SECOND AXIS, and that is the design question: does the instructor supply two rubrics, or one rubric with a reply section, or does the app split a single rubric by convention? Do not default it - it decides the whole surface. (2) THE SCORE IS NO LONGER ONE NUMBER per student per discussion, which touches whatever posts to Canvas: check whether the grade path can carry two component scores or whether they must be combined before posting, and if combined, by what rule and whether the instructor sets it. (3) contributionCount (discussions.ts:152) sums posts and replies into ONE NUMBER and must become two, or the separation cannot be counted. (4) A STUDENT WITH NO REPLIES and a student with no initial post are now different failures and must read differently. (5) The UI in the owner''s screenshot lists every contribution as a peer item with no indication which is the initial post - under this decision that is not cosmetic, it is the surface where the two scores have to live. MEASURED BEFORE FILING, and the finding narrows the search usefully: THE DATA LAYER ALREADY KNOWS. DiscussionPost carries isReply (discussions.ts:13-14) and parentUserId (:15-16); extractDiscussionActivity splits a student''s work into initialPosts and replies (DiscussionActivity, :19-22), computing isReply from thread depth at :61 and pushing to the right bucket at :69. So the distinction is captured correctly at the source and something downstream flattens it. TWO CANDIDATES, both visible at discussions.ts:141-152. (1) The text handed to grading is built by concatenating [...initialPosts, ...replies] with each segment prefixed "Post: " or "Reply: " and joined by a --- separator - so the label IS present, and the question is whether the grading prompt is told what those labels MEAN or whether the model just sees three chunks of prose. (2) contributionCount is initialPosts.length + replies.length, ONE NUMBER with the distinction summed away - so anything counting contributions cannot tell a student who wrote one post and two replies from one who wrote three posts. THE SCOPING PASS MUST ALSO CHECK THE UI, which is what the owner actually saw: the screenshot is a submission-list surface that renders each contribution as a peer item with its own timestamp, and nothing in it says which one is the initial post. That may be a separate defect in the same family, and if it is, say so rather than fixing only the model-facing half. WORTH ASKING EARLY, because it changes the fix: does the owner want replies EXCLUDED from grading, graded SEPARATELY against different criteria (most discussion rubrics score the initial post and the replies on different lines), or merely LABELLED so the model and the instructor can tell them apart? Do not default this. SECOND OWNER DECISION 2026-09-15, closing implication (1), the one the scoping pass was told not to default: ONE RUBRIC WITH A REPLY SECTION - "one rubric with a reply section". Not two instructor-supplied rubrics, and not an app-side split of a single rubric by convention. So the rubric input gains an explicit reply section the instructor authors, the initial post is scored against the main body and the replies against that section, and the app never has to guess which criteria belong to which. Implications (2) through (5) are unchanged and still open.'
- id: 'A9'
  state: 'unscoped'
  title: 'Deleted assessments come back on the recording grading page. Owner, 2026-09-15: "when i record new grading assignments on this page, the previous ones that i deleted come back", with an exported activity log as evidence (grading-recording-log-automated-testing-20260915-161441.csv). The log shows the shape: thirteen extraction batches over half an hour, most reporting Added 1, several reporting Merged 1 - and the Rows section at export carries ONE row. So rows are being added and merged repeatedly against a table the instructor has been pruning, and a deletion does not survive the next extraction batch.'
  owns: []
  verify: null
  blocked_by: []
  instrument: 'Owner report plus the exported log at C:\Users\alexa\Downloads\grading-recording-log-automated-testing-20260915-161441.csv, 2026-09-15 - Batches section rows 12-24, Rows section row 37'
  from: 'owner request, 2026-09-15'
  note: 'THE LIKELY MECHANISM, named so the scoping pass can confirm or kill it fast rather than starting cold: mergeExtractedSubmissions (src/app/components/grading-recording/grading-submission-merge.ts:382) decides whether a newly extracted submission is the SAME as one already in the table, using isSameSubmission (:301), studentNamesMatch (:148) and submissionTextSimilarityDistance (:202). Nothing in that file mentions a deletion or a tombstone (grep for deleted/tombstone over it returns nothing), so a row the instructor removed is simply ABSENT from the table the merge compares against - and absent reads as new, so the next batch that sees the same student on screen re-adds them. If that is right, the fix is not in the merge rules at all: the table needs to REMEMBER what was deleted for the life of the session, and the merge needs to consult that memory before adding. VERIFY THE MECHANISM BEFORE DESIGNING - the merge path is well covered (grading-submission-merge.test.ts exists) and a wrong guess here would rewrite matching rules that are not the problem. THE PRODUCT QUESTION the scoping must put to the owner rather than default: does a deletion mean "not this student, ever, in this session" or "not this capture" - because a student who genuinely submits twice, or who reappears after the instructor scrolls back, is the case where a permanent tombstone becomes wrong. Note the same log shows three grading runs (4, 1 and 1 rows), so this table is being graded from while it churns. MECHANISM CONFIRMED 2026-09-15 by direct read, and it is NOT the merge rules - the guess above is wrong about WHERE, though right that there is no tombstone. GradingRecordingPanel.tsx:370 keeps `extractedRef`, a SHADOW ExtractedSubmission[] parallel to the row table; :431 merges each batch into it and :454 calls syncGradingRowsFromExtracted(merge.submissions, rawRowsRef.current). removeGradingRow (grading-rows.ts:279) filters ROWS ONLY and nothing touches extractedRef, so the deleted submission is still there and the next batch re-mints a row for it WITHOUT the student being back on screen. AND THE SECOND DEFECT, which nobody had noticed and which is the worse of the two: grading-capture-sync.ts correlates the two arrays BY INDEX ONLY (its documented POSITIONAL ALIGNMENT INVARIANT, rows[i] IS the row for extracted[i]), so a deletion SHIFTS the correlation. Delete row 0 of [A,B,C] and rows become [B,C] while extracted stays [A,B,C]; the next sync pairs submission A with row B''s id, score, feedback and userEdited flag. An instructor''s grading is silently reattached to the WRONG STUDENT, for every row after the deleted one. The owner''s log shows three grading runs against this table while it churned, so this is not hypothetical.'
- id: 'A11'
  state: 'unscoped'
  title: 'Snapshot grading always ships an EMPTY Strengths box, while the text that belongs in it sits in Overall comment. Found while scoping A10, not reported by the owner - so nobody has confirmed how it reads in the app, and that is the first thing to check.'
  owns: []
  verify: null
  blocked_by: []
  instrument: 'Direct read of src/app/components/snapshot-grading/useSnapshotGrade.ts:185-198, 2026-09-15, confirming the hardcoded empty literal'
  from: 'A10 scoping pass residual R-1, 2026-09-15'
  note: 'MEASURED 2026-09-15, one line and unambiguous: useSnapshotGrade.ts:194 hardcodes strengths: "" in the applyAssessmentResult call, alongside improvements: result.answer.improvements and overallComment: result.answer.overallComment. So on a fresh snapshot grade the Strengths field is empty BY CONSTRUCTION, not because the model declined to fill it. WHY THIS IS THE SAME ROOT AS A10 AND STILL A SEPARATE ITEM: A10''s scoping pass established that overallComment carries two incompatible meanings behind one shared type - DERIVED on grading-recording (grading-feedback-prompt.ts:150-153 sets strengths = parsed.overallComment and composes overallComment from the parts) and AUTHORED on snapshot-grading (snapshot-parse.ts:222 parses it straight off model JSON). This item is that split seen from the snapshot side: the model''s what-went-well prose lands in overallComment and the box named for it stays blank. Deliberately NOT folded into A10, whose brief is the duplicated copy - but the two will touch the same type, so whoever works this reads A10''s artifact first. WHAT MUST BE ESTABLISHED BEFORE A FIX, and it is a product question, not a code one: does the snapshot model''s response actually carry a separable strengths value that is being dropped, or does it emit ONE prose block that the recording surface happens to re-label as strengths? Read snapshot-parse.ts and the snapshot prompt. If it is one block, then the recording surface''s strengths = parsed.overallComment is the re-label and the honest fix may be to stop showing an empty box rather than to invent a value for it - do not default that. UNVERIFIED IN THE APP: this repo renders no component under vitest, so how the empty box actually reads to an instructor is a reading claim. The owner should look at a fresh snapshot grade before anyone designs around it.'
- id: 'A10'
  state: 'unscoped'
  title: 'Copying the overall comment on the recording grading page yields every part TWICE, because the copy joins the individual feedback fields AND the composed field that already contains them. Owner, 2026-09-15, correcting an earlier request that had been filed as a removal.'
  owns: []
  verify: null
  blocked_by: []
  instrument: 'Direct read of src/app/components/assessment-shared/assessment-row.ts:62-109 and a grep for overallComment across src, 2026-09-15'
  from: 'owner request, 2026-09-15'
  note: 'FILED WITHOUT owns AND verify DELIBERATELY, because the grep says this is not a one-file deletion and a file list written from the request would be wrong - which is L10''s exact class, five instances today. overallComment is referenced across at least four modules outside the component: grading-run-mapping.ts:47,54 composes it, grading-submission-grade.ts:7 documents it as part of the action''s return shape, grading.ts:518 posts it as the Canvas comment, and assessment-row.ts:109 joins it with strengths and improvements into the text that is actually posted. THE QUESTION THAT DECIDES THE SIZE, and the owner should answer it rather than have it defaulted: remove the TEXTBOX from the page but keep the field (the model may still produce one and it would still be posted), or remove the FIELD end to end (the type, the composer, the posted-comment join, and whatever tests pin the three-field shape)? The first is small and leaves a value the instructor can no longer see or edit being sent to students - which is worse than it sounds, and is the same hazard pattern as a stale disclosure. The second is a type change across the assessment-row contract, which assessment-shared is named for sharing - grep says snapshot grading and repo grades both build on that module, so the blast radius must be measured before a file list means anything. OWNER DECISION 2026-09-15, asked and answered: REMOVE THE FIELD END TO END - "remove the field end to end (type change across assessment-row". So this is the larger of the two readings, deliberately: the type, the composer (grading-run-mapping.ts:47,54), the action''s documented return shape (grading-submission-grade.ts:7), the posted-comment join (assessment-row.ts:109), the Canvas post (grading.ts:518) and every test that pins the three-field shape. The rejected alternative was leaving a value the instructor can no longer see or edit being sent to students. BLAST RADIUS MUST STILL BE MEASURED before a file list means anything - assessment-shared is named for sharing, and snapshot grading and repo grades both build on it. BLOCKED IN PRACTICE, not by dependency: A9 is being worked in grading-recording/ and assessment-shared/ right now, and this must not run concurrently against the same files. CORRECTED 2026-09-15, BY THE OWNER, AND THE CORRECTION CHANGES WHAT THIS ITEM IS. Verbatim: "don''t remove the overall comment per se, it''s just that when i copy the overall comment for one of the latest pages, i get the same comment twice (i assume because it''s copying the individual components and then the combined field)". So SUPERSEDE both readings above and the REMOVE THE FIELD END TO END decision recorded before this: the field stays, and the defect is a DUPLICATED COPY. The owner''s guess at the mechanism is exactly right and has been confirmed by direct read. composeOverallComment (src/lib/grade/types.ts:20-29) joins strengths, improvements and resubmitNotice with a space - overallComment is DERIVED, never authored, and grading-feedback-prompt.ts:153 builds the recording surface''s rows that way. joinAssessmentFeedback (assessment-row.ts:108) then joins [strengths, improvements, overallComment] with blank lines, and AssessmentFeedbackFields.tsx:108 is the Copy feedback control that calls it. So a copy is strengths + improvements + (strengths + improvements + resubmitNotice): every part twice. THE ORIGIN IS A STALE CONTRACT, which is the reusable lesson: joinAssessmentFeedback''s own doc comment cites CC14 as requiring exactly those three fields, and that rule was written while overallComment was still INDEPENDENTLY AUTHORED. A1 item 2 (documented at grade/types.ts:10-13) later made it derived, and nobody revisited the join that had been correct under the old contract. Grep for other readers of overallComment that also read strengths or improvements in the same breath - there may be more than this one. THE FIX IS NOT SIMPLY DROPPING overallComment FROM THE JOIN, and this is the trap: AssessmentFeedback (assessment-row.ts:64-69) carries totalScore/strengths/improvements/overallComment and has NO resubmitNotice field, so on this surface the resubmit notice exists ONLY inside the composed overallComment. Drop overallComment from the join and the copy silently loses the resubmit notice - which grade/types.ts:137-140 calls a promise about instructor policy that every producer must say identically or not at all. Losing it from a copied comment is a worse defect than the duplication being fixed. PROPOSED, and to be checked rather than adopted: give AssessmentFeedback its own resubmitNotice field and join [strengths, improvements, resubmitNotice], which matches GradeResult''s shape and continues the same each-part-is-its-own-field direction A1 item 2 already took. The alternative of copying overallComment ALONE is content-complete but space-joined, so the copy regresses to one run-on paragraph instead of blank-line-separated sections. Still an additive type change across assessment-shared, so blast radius must be measured. STILL SEQUENCED BEHIND A9, which is being worked in the same two directories.'
