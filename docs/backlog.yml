  from: 'A16 wave 3 scoping pass, docs/a16-wave3-scope.md, 2026-09-21'
  area: 'grading-run-survival-and-disclosure'
  kind: 'bug'
  note: 'SCOPED TOGETHER WITH A27 2026-09-21 TO docs/a26-a27-scope.md, AND BOTH ARE NOW PROVEN, NOT READ: the real handler was driven in a node test with a stand-in React and a stubbed grading action. A26: two clicks while the rubric fetch was pending sent SIX grading calls for three repos - every repo graded twice, possibly with different scores - and a control proved the harness does refuse a second click once the flag is visible. A27: one rejected call left every later render showing the column as running, the progress label frozen, the activity log and status line never written, and the failed cell stuck on Grading. The race began at 85fa958, when the rubric picker added an await before the run starts. THE FIX HAS THREE PARTS AND EACH WAS PROVEN NECESSARY by a broken variant its own test catches: a lock held in a ref and claimed at click time with the rubric fetch moved under it; a finally that releases it (claiming at click WITHOUT this creates a new stuck path - exactly the second stale-state path these rows warned about); and a catch on each grading call so a rejection becomes an ordinary failed repo. IT MUST AMEND A16 WAVE 3 PINS: one of them pins the stale read that IS the bug, so the amendment replaces it with a ref-based check and adds a check that the old guard fails - amending a guard openly, not loosening it. SEQUENCE: after the A16 wave 3 detector fixes land, since both edit the same wiring test. A MISLEADING COMMENT at useRepoGradesRubricSource.ts:339-343 claims the rubric-loading state disables every Grade button; it does not, and anyone trusting it would think this row was already fixed. RESIDUALS: RR-1, real browser timing of the race - owner, a real browser, after the fix ships; RR-2, the actual error text a platform failure produces - owner, same pass; RR-3, a misleading comment in A16''s classTrendsFolderEntry.ts - fold into the build; R-6, the per-cell Grade button has the same stuck-on-rejection defect - separable, and in scope only if the build stays small. RECORDED AS ITS OWN ROW BECAUSE IT IS OUT OF A16''s SCOPE AND A16''s WAVE 3 SHOULD NOT FIX IT SILENTLY - a concurrency fix inside a feature wave is the kind of change that ships unreviewed. WHY IT MATTERS IF REAL: two concurrent bulk runs over the same column would double-grade every repo and double the model spend, and once A16 wave 3 lands, two runs would race to set the column''s trends. SEQUENCE: establish the race first, by measurement, before anyone designs a fix - a reading of a stale-closure hazard has been wrong before in this repo, and the correct response to an unexecuted claim is to execute it. SHIPPED 2026-09-21 at 3366654: the lock is a ref claimed at click time with the rubric fetch under it (useRepoGradesBulkGrade.ts:216, :228-229), released in a finally (:234, :244), and each grading call has its own catch; useRepoGradesBulkGrade.lifecycle.test.ts (395 lines) drives the real handler. Read in the tree 2026-09-22, not taken from the commit message. STATE CORRECTED from unscoped to verification: only owner checks remain. A27 IS CLOSED AND DELETED AT THIS RECONCILIATION, and its remaining check moves here: the same commit put setRunningFolder(null) in the finally, so a rejected bulk run no longer leaves every Grade all button disabled until reload. RR-2 NOW COVERS BOTH: after a rejected run, the owner confirms in a real browser that Grade all is usable again AND records the actual error text a platform failure produces. OWNER: the repo owner. INSTRUMENT: a real browser against the deployed app; nothing in this checkout renders a component. STEP: the next owner verification pass. RR-1 is unchanged - the real browser timing of the two-click race. ONE RESIDUAL CARRIED IN FROM THE RECONCILIATION''S OWN REGISTER (RR-4, docs/backlog-reconciliation-2026-09-21.md section 7): 3366654''s message claims the lifecycle test was red before the fix (6 of 7) and NOBODY HAS REPRODUCED THAT. This reconciliation did not either - it edits docs only. OWNER: