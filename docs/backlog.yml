  note: 'THE WAVE 1 INSTANCE IS ALREADY FIXED - this row is about the other 116. UNSCOPED because a blanket sweep is the wrong shape and would be worse than nothing: stripComments is NOT always correct. Some assertions deliberately scan comments (this repo pins RULES and CITATIONS in comments, and docs/REGRESSION.md treats a stale comment as a defect, so a test asserting a comment exists is legitimate). Others assert a string is ABSENT, where stripping comments makes the test WEAKER rather than stronger. So the work is a triage, not a sweep, and the triage rule has to be authored before any file is touched. THE RULE I WOULD START FROM, for whoever scopes this: an assertion that something IS PRESENT in code - a call, a registration, a guard - must strip comments, because commented-out code satisfies it while doing nothing. An assertion that something is ABSENT must NOT strip them, because a commented-out forbidden call is still a signal worth failing on. Assertions about comments themselves are a third category and are left alone. WHERE TO LOOK FIRST: the five *.structure.test.ts files, since those are the ones this repo uses as construction guards, and any test whose name contains canary or wiring.'
