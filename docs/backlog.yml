graded counts (filed as A28, shipped at f6f0515) and RES-W3V-4 is the S-26 canary. Read the document''s numbering, not this row''s, when tracing either. OWNER CONFIRMED 2026-09-21, VERBATIM: 1-3 are good calls. That settles all three wave 3 defaults: a trend covers THE RUN, not the whole column; trends are labelled with THE FOLDER NAME, not the mapped Canvas assignment title; and wave 3 is accepted as a reachability and click-cost change with NO leverage claim beyond that - the owner made that call, not a seat. WAVES 0-2 SHIPPED 2026-09-21 (2e34886 baseline, 61b229f extraction, cbe84e2 feature, 434ad5e instrument fixes): a grading run on the recording panel now generates class trends. THE AS-BUILT VERIFICATION FOUND A FOURTH SILENT-GREEN AFTER SHIPPING - every pin asked whether an identifier was PRESENT, never what an expression MEANT, so negating the mount guard (the panel then renders only when there is nothing to show), negating the spread check, and TRANSPOSING the course and assignment values in the meta object (putting the course name into student-addressed copy) all passed every gate. Each now goes red on its named mutant. THE PANEL IS AT 990 OF 1000 - the plan reserved a 20-line margin and this leaves 10, because growth was 72 against a 33-46 estimate written BEFORE the constructions the rulings later ordered; the build attributed essentially all 72 to those rulings. THE NEXT CHANGE TO THAT PANEL NEEDS AN EXTRACTION FIRST. RESIDUALS FROM THE WAVE 2 VERIFICATION, recorded here because a residual that is not in the backlog does not exist: whether the panel APPEARS, whether defaultExpanded opens it, and whether the disclosure line READS as disclosure are reading claims nothing here can execute - owner, a real browser, after deploy; handleGradeAll is executed by NO test in this repo, so every provenance guarantee rests on source-text pins; and the Ask AI request size for a real org is unmeasured. WAVE 3 IS SCOPED to docs/a16-wave3-scope.md: REPO GRADES HAS A REA