      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - if: matrix.gate == 'build'
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: local-build-only
        run: npm run build
      - if: matrix.gate == 'typecheck'
        run: npx --no-install tsc --noEmit
      - if: matrix.gate == 'focused'
        env:
          VITEST_MAX_WORKERS: '2'
        run: npm run test:paths src/app/actions/eleven-voice-library.test.ts src/app/actions/media-voice.guard.test.ts src/app/actions/media-voice.budget.test.ts src/app/actions/wholesale-auth-mock-population.structure.test.ts src/app/components/lecture-videos src/app/components/ui/modalAdoption.wiring.test.ts src/app/url-state.rec-view.test.ts src/lib/no-emojis.test.ts src/file-size-ceiling.structure.test.ts
