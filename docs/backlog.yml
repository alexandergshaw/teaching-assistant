  instrument: 'RE-MEASURED 2026-09-14 and the row''s framing does not survive it. THREE findings. (1) BLAST RADIUS is understated ~60x: the row names two reachable paths, but grep -rn "callLlm(" src/ excluding tests returns 124 call sites. callLlm (src/lib/llm.ts:375) takes (req, provider) and no AbortSignal, and llm.ts contains ZERO AbortSignal or timeout references - the single "signal" hit at :718 is prose about something else. So a call-level bound is a 124-site seam change, or it is optional and therefore unenforced. (2) THE PAGE-LEVEL OPTION IS NOT AVAILABLE. src/app/page.tsx is "use client" (line 1), and a client component cannot export route segment config at all - maxDuration is a server-only export. So "page-level maxDuration" is not a cheaper alternative to a call-level bound; it is not on the table without converting the page to a server component. (3) THE REPO ALREADY HAS A THIRD ANSWER and documents it: move the feature off a Server Action to a Route Handler, which CAN declare its own ceiling. Twelve route handlers under src/app/api/ already declare maxDuration, and course-intel/ask/route.ts:48-59 plus automations/run-now/route.ts:35-38 explain they did it FOR EXACTLY THIS REASON. That file also records the constraint any fix inherits: prod is Vercel Hobby, whose hard cap is 60s regardless of what a route requests, and a value above 60 makes the deployment FAIL TO BUILD.'
