  note: 'OWNER DECISION 2026-09-15, asked and answered: REPOINT THE EXISTING ROW LINK. The one link per row stops going to the repo root and goes to /tree/<branch>/<folder> for the selected folder. No per-cell links. That is the owner''s own words read literally (link THEM out, about links that already exist), and it settles the cost argument too - zero new controls against roughly 360 new tab stops a per-cell design would have added to a 30-repo, 12-folder grid, on a screen the same owner has separately asked to streamline (A7). THE ONE GAP, stated not hidden: in the ALL_FOLDERS view there is no single folder to point at, so the link falls back to the repo root exactly as today. THREE MORE RULINGS the criteria seat must carry. (1) THE BRANCH NAME IS VISIBLE in the link''s text or accessible name - the scoping defended scan-time recording as "a stated approximation, not a silent one" and then stated it nowhere the instructor could see; this makes it honest AND assertable. (2) AN EMPTY htmlUrl YIELDS NO LINK, never a relative one: mapRepo sets htmlUrl to "" when GitHub omits it (github.repos.ts:92), and `${""}/tree/main/week-1` is a SAME-ORIGIN url that navigates inside this app - today''s link merely dies, a built one would go somewhere wrong. (3) scan-time recording is right for a reason the scoping missed: a per-grade branch CANNOT EXIST for an ungraded cell, so the scan value is the required fallback in every design and a precise one is purely additive. BRANCH QUESTION ANSWERED 2026-09-15 by the scoping pass, and the answer is the harder one: THE BRANCH IS IMPLICIT AND NEVER RECORDED. Traced end to end - the scan (actions/repo-grades.ts:60-79 into lib/github.files.ts:33) and BOTH grading call sites (useRepoGradesGradingActions.ts:283-292 and useRepoGradesBulkGrade.ts:193-202, each passing branch=undefined into gradeRepoAction) independently resolve whatever GitHub currently calls the default branch, through their own separate getRepo() calls. The result is discarded twice: RepoFolderRow (repo-grade-tree-scan.ts:124-134) drops a defaultBranch that listOrgRepos already fetched (github.repos.ts:90), and gradeRepoAction''s return shape has no branch field at all. SO THIS IS NOT A RENDERING CHANGE - the app does not know what branch it graded, it re-asks GitHub each time and assumes the answer is stable. The cheap fix is to record defaultBranch at scan time, where the data is already fetched and thrown away. THE FORK, now with the checker: recording at scan time is honest only until a rename or a default change between scan and grade, at which point the link names a branch that was NOT the one graded - carrying the branch out of gradeRepoAction''s return costs more and is exactly right. LINK SHAPE recommended: per-cell links in RepoGradeCellControl.tsx, which already receives row and column, leaving the row link alone - index.tsx:386-389 narrows the grid to one column whenever a folder is selected, so a row link is ambiguous only in the All folders view. Rejected: a repointed row-only link, and row-plus-cell together. ORIGINAL NOTE FOLLOWS. UNSCOPED because the BRANCH HALF IS NOT YET LOCATED and a file list written without it would be a guess. What is established: the folder is known per column, and src/lib/github.repos.ts:62,90,155-164 already models defaultBranch and listBranches, and src/lib/repo-grade-branch-scan.ts exists. What is NOT established: which branch a given grade was actually computed against, and whether that value reaches the grid at all - my grep for branch state in index.tsx and RepoGradesControls.tsx returned only comments about code flow, so either the scan pins a branch elsewhere or grading runs against the default branch implicitly. THE SURVEY MUST SETTLE THAT BEFORE ANY CODE, because the two answers give different features: if a branch is selected, the link is a rendering change; if grading implicitly uses the default branch, then "the branch that was just graded" is a value the app does not currently record, and the honest fix is to record it first. SECOND QUESTION for the survey, cheap and worth asking now: the link is per ROW while the folder is per COLUMN, so one row can have several graded folders - the design must say whether the row link points at the folder for the selected column, gains one link per cell, or both. Ruling X-1 applies: this is a click-cost feature, so a design that makes the instructor hunt for the right link has not delivered it.'
