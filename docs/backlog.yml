  note: 'SHIPPED 2026-09-23 AT 72058f9. THIS ROW IS NOW RES-A31-4 AND NOTHING ELSE (docs/a31-scope.md revision 2 section 10, commit f1a9a33). OWNER: the repo owner - not an agent, and the reason is structural rather than effort. INSTRUMENT: a browser, and a real run with GRADE_MAX_SUBMISSIONS set below the queue size so at least one row is dropped, inspected on BOTH surfaces - the review table''s What Went Well box (GradingResults) and the Drafted Grades comment field (DraftedGradesTab). DIRECTION OF FAILURE: the sentence is truncated, wraps badly, or does not read as this app''s voice; a pass is the owner reporting it reads correctly on both. STEP: the owner-verification pass, batched with A13''s RES-4 and RES-5, which need the same browser session. THE HONEST LIMIT, reported rather than hidden: reverting the Drafted Grades render-path correction entirely RUNS GREEN here, so that surface has no executable instrument at all - this row is the only thing standing between it and an unnoticed regression. THE LESSON WORTH KEEPING, because it cost a whole revision: the FIRST replacement sentence this row proposed was ALSO FALSE - it promised the row is only reached if what is submitted changes, while the bound is read from the environment PER RUN (so raising it reaches the row with nothing changed) and the deadline stop is WALL-CLOCK (so a faster run reaches it with byte-identical input). The shipped copy asserts only what holds at the moment the row is built and offers NO action, because none is reliably available. Two things went out that this row never named: a run where EVERY row went ungraded still called the model once per row with a not-graded notice, because the has-anything-to-analyse predicate counted rows rather than graded rows; and the second editable comment field rendered the retired sentence with no correction path - fixed at render, never by rewriting drafts already stored. THE RESIDUALS ARE FILED AS ROWS, 2026-09-23, and this row no longer carries them: RES-A31-5 is A34, RES-A31-3 is A35, the shared localStorage key (measured in the scope''s section 8.2 and missing from that document''s own residual register) is A36, and RES-A31-2 is A37, which carries RES-A31-1 folded in. DO NOT close this row to tidy the queue: closing deletes it, and the render check is the one thing A31 could never prove about itself.'
