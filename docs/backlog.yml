  verify: null
  blocked_by: []
  instrument: 'Located 2026-09-20. THE LOGIC ALREADY EXISTS AND IS SUBSTANTIAL - src/lib/grade/class-trends.ts (355 lines), class-trends-insight.ts (251), class-trends-draft.ts (214), plus an API route at src/app/api/class-trends-insight/route.ts, each with a sibling test. THE UI IS TWO COMPONENTS - drafted-grades/ClassTrendsPanel.tsx (201) and ClassTrendsDraftPanel.tsx (123), the second mounted by the first at ClassTrendsPanel.tsx:192 - plus classTrendsDraftState.ts and four test files. So this is a PLACEMENT AND TRIGGER change over shipped logic, not a new feature, which is why it can be top priority without being large. THE TOOLS TAB IS RecordingTab.tsx, whose strip at :591 is role=tablist aria-label="Recording tools" with TWELVE entries declared as one inline literal; the grading ones are "grading" (Grading (from a recording)) and "snapgrade" (Grading (from screenshots)). OTHER GRADING SURFACES EXIST OUTSIDE THAT STRIP and the scope must enumerate them rather than assume two: the Live Feed / Canvas path in GradingTab.tsx, repo grades, and the assignment-upload tool. "Each of the grading tools" is the scoping question, not a given.'
  from: 'Owner, 2026-09-20, flagged top priority mid-turn'
  area: 'grading-run-survival-and-disclosure'
  kind: 'feature'
  note: 'OWNER CONFIRMED 2026-09-21, VERBATIM: 1-3 are good calls. That settles all three wave 3 defaults: a trend covers THE RUN, not the whole column; trends are labelled with THE FOLDER NAME, not the mapped Canvas assignment title; and wave 3 is accepted as a reachability and click-cost change with NO leverage claim beyond that - the owner made that call, not a seat. WAVES 0-2 SHIPPED 2026-09-21 (2e34886 baseline, 61b229f extraction, cbe84e2 feature, 434ad5e instrument fixes): a grading run on the recording panel now generates class trends. THE AS-BUILT VERIFICATION FOUND A FOURTH SILENT-GREEN AFTER SHIPPING - every pin asked whether an identifier was PRESENT, never what an expression MEANT, so negating the mount guard (the panel then renders only when there is nothing to show), negating the spread check, and TRANSPOSING the course and assignment values in the meta object (putting the course name into student-addressed copy) all passed every gate. Each now goes red on its named mutant. THE PANEL IS AT 990 OF 1000 - the plan reserved a 20-line margin and this leaves 10, because growth was 72 against a 33-46 estimate written BEFORE the constructions the rulings later ordered; the build attributed essentially all 72 to those rulings. THE NEXT CHANGE TO THAT PANEL NEEDS AN EXTRACTION FIRST. RESIDUALS FROM THE WAVE 2 VERIFICATION, recorded here because a residual that is not in the backlog does not exist: whether the panel APPEARS, whether defaultExpanded opens it, and whether the disclosure line READS as disclosure are reading claims nothing here can execute - owner, a real browser, after deploy; handleGradeAll is executed by NO test in this repo, so every provenance guarantee rests on source-text pins; and the Ask AI request size for a real org is unmeasured. WAVE 3 IS SCOPED to docs/a16-wave3-scope.md: REPO GRADES HAS A REAL RUN BOUNDARY (one click of a column''s Grade all button grades one folder under one shared rubric), so it FITS A16 and does not route the way 