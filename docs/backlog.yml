at remains is docs/a18-ac.md section 6 - R-1 the REGRESSION entry (re-measured 2026-09-22: grep -acE "(^|[^A-Za-z0-9])A18([^0-9]|$)" docs/REGRESSION.md still returns 0, against a canary of 8 for A16), R-3 and R-4 (owner), R-5/R-6/R-7 (test seat), and layer (3), the tool living under a tab called Recording, which is an owner placement question. NOT RE-CHECKED HERE: whether d62aea3 discharged R-6 or R-7; that is owed to whoever closes this row.'
