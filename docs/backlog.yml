- id: 'A8'
  state: 'unscoped'
  title: 'The discussion grader treats a student''s REPLIES as independent posts. Owner, 2026-09-15, with a screenshot of the submission view: one student''s three contributions to a Student Introductions topic are listed as three peer items - their actual introduction, plus two replies addressed to other students ("@Seth Vander Vorst", "@Luke Demmel") - under a heading that calls all of them the assignment''s submissions. A reply to a classmate is not a second introduction, and grading it as one both misreads the work and inflates whatever a rubric counts.'
  owns: []
  verify: null
  blocked_by: []
  instrument: 'Owner screenshot plus a direct read of src/lib/canvas/discussions.ts:106-152, 2026-09-15'
  from: 'owner request, 2026-09-15'
  note: 'MEASURED BEFORE FILING, and the finding narrows the search usefully: THE DATA LAYER ALREADY KNOWS. DiscussionPost carries isReply (discussions.ts:13-14) and parentUserId (:15-16); extractDiscussionActivity splits a student''s work into initialPosts and replies (DiscussionActivity, :19-22), computing isReply from thread depth at :61 and pushing to the right bucket at :69. So the distinction is captured correctly at the source and something downstream flattens it. TWO CANDIDATES, both visible at discussions.ts:141-152. (1) The text handed to grading is built by concatenating [...initialPosts, ...replies] with each segment prefixed "Post: " or "Reply: " and joined by a --- separator - so the label IS present, and the question is whether the grading prompt is told what those labels MEAN or whether the model just sees three chunks of prose. (2) contributionCount is initialPosts.length + replies.length, ONE NUMBER with the distinction summed away - so anything counting contributions cannot tell a student who wrote one post and two replies from one who wrote three posts. THE SCOPING PASS MUST ALSO CHECK THE UI, which is what the owner actually saw: the screenshot is a submission-list surface that renders each contribution as a peer item with its own timestamp, and nothing in it says which one is the initial post. That may be a separate defect in the same family, and if it is, say so rather than fixing only the model-facing half. WORTH ASKING EARLY, because it changes the fix: does the owner want replies EXCLUDED from grading, graded SEPARATELY against different criteria (most discussion rubrics score the initial post and the replies on different lines), or merely LABELLED so the model and the instructor can tell them apart? Do not default this.'
