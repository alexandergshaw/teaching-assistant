  title: 'Owner asked 2026-09-20: make the announcement-from-walkthrough tool STOP REFERENCING A SCREEN RECORDING. The tool does not record anything - it reads frames off a shared screen and discards them - but its copy, its error strings and its surrounding furniture all tell the instructor they are recording. The wording is wrong about what the app does, and wrong in the direction that sounds more invasive than the truth.'
