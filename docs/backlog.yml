ertion "alt+s matches nothing" (snapshot-keys.test.ts:63-65) is now KEPT rather than replaced, and since the four landed altKey assertions cover s, n, 1 and 6 - none of them g or r - the wave may need to replace NO landed assertion at all, which is materially smaller and safer than briefed. The chord letters are NOT yet chosen - the choice is constrained by what a browser refuses to yield (Ctrl+Shift+R is a hard reload, Alt+D focuses the address bar) and by left-hand reach, so the criteria seat picks them and the check attacks them. Shot-capture keying must not silently change what the existing bare "s"/"n"/digit bindings do, since those are documented to the user in SnapshotCaptureBar.tsx keyHint.'
