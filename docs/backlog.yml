s designed around it. Owner: the W3B verification seat measures, the owner decides whether any disclosure is warranted. Instrument: a network-blocked unit test - extractRubricCriteria returns [] on prose, no-points and range fixtures; two gradeEntries calls with callLlm MOCKED (never fetch) returning differently worded areas go through the real buildRepoRunCohort and repoRunTrendsEntry; report computeClassTrends areas.length and each resultsWithArea beside the same run under a parseable rubric. Step: the W3B verification pass, finding to the owner with numbers. RES-W3-9, PRE-EXISTING AND NOT WAVE 3''S: a rejected runBulkGrade (a server-action transport failure reaching Promise.all, useRepoGradesBulkGrade.ts:372) never runs setRunningFolder(null) or setProgress(null) (:376-377), which sit in no finally, so every column''s Grade all button stays disabled (RepoGradesGrid.tsx:334, :421) until the view remounts. Owner: the orchestrator, to file its own bug row beside A26. Instrument: a reading today, sed -n 171,378p useRepoGradesBulkGrade.ts shows no try or finally; the fix''s test must execute the rejection. Step: that row''s scoping. RES-W3-10, STATUS REGIONS: the view already renders 10 conditional role=status nodes and the trends panel adds two click-triggered ones (ClassTrendsPanel.tsx:164, ClassTrendsDraftPanel.tsx:110); the scope judges no ruling is needed, but that is a screen-reader judgement nothing here observes. Owner: the accessibility seat. Instrument: reading, plus the owner''s screen reader if the seat asks. Step: W3B''s accessibility step. RES-W3-11, THE EMPTY-PLAN DEFAULT (ruling W3-4): a Nothing-to-grade click keeps the previous run''s trends, because nothing ran. Owner: the repo owner. Instrument: the owner''s answer. Step: the coordinator''s next batched owner question; if overturned, the scope''s section 8 names the two-line swap. WAVE-2 VERIFY RESIDUALS, IN SUBSTANCE (docs/a16-wave2-verify.md section 9). RES-V-1: GradingRecordingPanel.tsx is at 990 lines, so 10 of headroom, and nothing gates a wave''s own addition count - wave 2 added 72 against a 46-line budget. Owner: the orchestrator. Instrument: git show <pinned base>:<panel> against @(Get-Content <panel>).Count, never HEAD. Step: before dispatch of any wave whose write set contains GradingRecordingPanel.tsx. RES-V-3: handleGradeAll''s dependency array is correctness-neutral only because useGradingRows returns an unmemoized object literal (useGradingRows.ts:500); memoizing that return later silently restores the stale-capture bug, visible only as a lint WARNING. Owner: the orchestrator. Instrument: npx eslint on the panel, warning count against the repo lint baseline. Step: the first wave that adds a useMemo to useGradingRows.ts''s return. RES-V-4: the JOIN KEY and per-row assessment assertions in classTrendsRunCohort.test.ts build their oracle from r.result.student, so they are not independent of the student projection - mutant P14 fires all three. Owner: a loop-test-author. Instrument: re-run P14 (const student = empty string) and count the its that fire. Step: any round that must localise a join-versus-projection defect. RES-V-6: onClearTable and onRemoveRow do not clear lastRunCohort, so the recording trends outlive the rows they describe - never ruled on. Owner: the repo owner, a product decision. Instrument: a real browser. Step: owner verification, asked together with RES-W3-3. RES-V-7: GradingRecordingPanel.wiring.test.ts canaries that renderBody excludes the handler but nothing canaries that the handleGradeAll body excludes the render body. Owner: a loop-implementer, one canary it. Instrument: assert the handler body does not match <GradingTable. Step: the next wave whose write set contains GradingRecordingPanel.wiring.test.ts. RES-V-8: that file''s stripComments truncates any line with // inside a string literal; the panel has none today. Owner: a loop-implementer, one canary. Instrument: grep -c :// on the panel must stay 0, paired with a firing canary. Step: the same trigger as RES-V-7, and any wave adding a URL literal to the panel. WAVE 1 IS SCOPED 2026-09-21 TO docs/a16-wave1-scope.md, AND ITS THREE RESIDUALS ARE RECORDED HERE because DEV_LOOP step 0 rules that a residual living only in another document does not exist - the scoping seat correctly refused to write them itself, since this file has concurrent writers and was outside its write set. THE EXTRACTION FITS AND THE CONTINGENCY IS NOT INVOKED: the panel''s entire Capture fieldset moves to a NEW GradingCaptureSettings.tsx, measured on a simulated post-extraction panel rather than estimated - 966 to 917 by both counters, 49 lines out against a required 32, WITH THE COMMENT COUNT RISING FROM 298 TO 304 and zero comments deleted. The existing log leaf was rejected for a mechanical reason, not a stylistic one: after the prior extraction spent both its candidates, the panel''s remaining non-hook non-JSX surface is UNDER FIFTEEN LINES, so a 32-line pure-.ts extraction does not exist in this file - the extraction must be JSX, and JSX cannot go into a leaf whose own header declares it pure. THE COMMENT FLOOR WAS THE REAL DESIGN PROBLEM and the fix is specific: the gate counts only the line that OPENS a comment, so one long block comment would pay back 1 against 3 removed and break the floor at 296; instead the comments move WITH their markup and the panel gets a nine-line // block on the new import. RESIDUAL W1-1: the occurrence figure wave 2 asserts against CHANGES UNDER WAVE 1 - HEAD is 7 lines / 10 occurrences (confirmed, and revision 3''s eight was wrong), but post-wave-1 it is 6 lines / 12, because occurrences go UP when three of the four survivors are prop bindings. Any wave-2 assertion written against seven lines is WRONG ON ARRIVAL. RESIDUAL W1-2: two of the nine it blocks in GradingRecordingPanel.assessment.test.ts pin the moved markup to the panel and WILL go red - they are re-pointed at the leaf, never deleted, and a gate row counts it blocks before and after so a silent deletion cannot make the refactor green. RESIDUAL W1-3, WHICH THE SEAT CORRECTLY CALLED A DELETION RATHER THAN DRESSING IT UP: that the fieldset still LOOKS and BEHAVES identically after the move - tab order, fieldset and legend grouping, the autocomplete opening - has an owner and an instrument but NO STEP, because nothing renders under vitest here and the post-deploy visual check is suspended. It is an accepted, named gap. ALSO MEASURED AND WORTH KEEPING: three of the eight source-text readers reach the panel through a DIRECTORY WALK rather than an import, so a name-shaped grep does not find them at all. PLANNED 2026-09-21 TO docs/a16-plan.md, AND THE PLAN RESHAPES THE ROW: A16-1 AND A16-2 ALREADY SHIPPED, on 2026-09-20 at 6ecc226 and e9670d1, while this row still said unscoped with owns empty. GradingResults.tsx:593 already renders <ClassTrendsPanel entry={classTrendsEntry} defaultExpanded /> behind hasTrendableResults, and GradingRow carries a required rubricAreas at grading-row.ts:224 - so the scope doc''s chunking, its owns lists and its V and S series are HISTORY, NOT A PLAN. THE SHAPE IS A PANEL WITHIN EACH TOOL, NO NEW STRIP ENTRY, and the hardcoded strip counts provably do not move: recording-split.structure.test.ts readdirSyncs recording/ NON-RECURSIVELY and cannot see grading-recording/ at all (grep -c grading-recording on that file returns 0, with a canary proving the instrument fires). That is the argument the row already suspected was the stronger one. FOUR WAVES, ALL SEQUENTIAL: wave 0 is the REGRESSION baseline at entry 433; wave 1 is the panel headroom extraction gated on <= 945 lines by both counters; wave 2 is the run cohort plus an adapter leaf, the cohort disclosure line and the gated mount; wave 3 is Repo Grades, which scopes itself first. A16-4, SNAPSHOT GRADING, IS ROUTED OUT AND IS NOT A WAVE - no run boundary exists there, so mounting the panel would ship exactly the cross-assignment mixing owner answer 1 excluded, AND IT WOULD SHIP GREEN. THE GIT BOOKKEEPING IS WRONG IN A WAY THAT MATTERS: A8-R wave 2 landed inside commit db747cc, whose message describes only a docs relocation for A18. The work is correct and present in the tree, and it is what frees grading-recording/ for A16-3 - without knowing it, a later pass reads the log and holds that directory for no reason. ELEVEN DISAGREEMENTS BETWEEN THE SCOPE DOC AND THE TREE, three that matter: GradingRecordingPanel.tsx is 966 not the 995 the scope doc calls a HARD BLOCKER with 5 lines free, so 34 are free and A8-R''s reservation on that headroom is discharged; EVERY A16-3 edit-point citation is stale by -10 to -31, so every brief cites by SYMBOL rather than by line; and the canary-3 roots are FIVE at :213-223 not four at :213-218, with the it() title enumerating them by name, so wave 2 edits the title too or ships a test whose own description is false. SEQUENCING: A16 x A18 write sets are empty in both senses, so A18 runs concurrently with any A16 wave; N13a is independent; N13b FOLLOWS A16, because it redefines AreaTrend to carry per-student attribution and broadens the signal from scored-below-60 to missed-any-points, which wave 2''s cohort line would otherwise be designed against. The coupling is benign now - toClassTrendsEntry returns { ...meta, run } BY REFERENCE, so N13b enriches all four LMS mounts with no placement work, PROVIDED wave 2 emits student: row.studentName with no userId key. TEN RESIDUALS, each with owner, instrument and step, including: A16-1 and A16-2 shipped with NO REGRESSION BASELINE AT ALL; the recording cohort does not survive a reload while the github path''s does; and the panel appearing, defaultExpanded opening it, and the cohort line reading as disclosure are ALL READING CLAIMS - nothing renders under vitest here, so they route to owner verification. WHAT THE OWNER ASKED FOR HAS TWO HALVES AND THEY ARE NOT THE SAME SIZE. (1) PLACEMENT - trends renders alongside each grading tool instead of only in Drafted Grades. (2) TRIGGER - "when i run a tool over a series of assignments, THAT RUN should generate trends", i.e. trends become an OUTPUT OF A RUN rather than a thing the instructor navigates to afterwards. Half (2) is the substantive one: it needs the run to carry enough identity to group its results into a series, and the scope must establish whether each grading tool''s run already has that or whether it is being invented. A CONSTRAINT FROM THIS REPO''S OWN HISTORY, and it is the one to watch: recording-split.structure.test.ts holds HARDCODED COUNTS for that strip - exactly 12 sub-tab entries, exactly 11 role=tabpanel occurrences, and panelTargets.size === 11 - and the card records that adding a sub-tab breaks three of those and passes the fourth FALSELY. If the answer is a new strip entry, that test is in owns and its counts move in the same commit. If the answer is a panel WITHIN each existing grading tool, they may not move at all - which is an argument for the second shape. ALSO: the DraftedGradesTab site is not obviously to be deleted - decide whether trends move or fan out, because a run-generated panel and a per-entry review panel answer different questions. And note N13a/N13b are open against this same code; sequence them, since N13b (name the SUBSET of students who missed the same area) is what makes a per-run trend worth reading at all. SCOPED 2026-09-20 to docs/a16-scope.md, and THE OWNER ANSWERED TWO FORKS THE SAME DAY. OWNER ANSWER 1 - "A SERIES" MEANS ONE RUN OVER MANY STUDENTS'' SUBMISSIONS FOR THE SAME ASSIGNMENT, not trends spanning several assignments. That is the smaller path and it is available today: every grading tool already does exactly that, so trends can attach to a run without inventing a multi-assignment run object. This matters because the scoping measured that NO INTERACTIVE GRADING TOOL RUNS OVER A SERIES OF ASSIGNMENTS AT ALL - GradingRunEntry is ONE assignment (types.ts:320-338), and the only GradingRunEntry[] producers are the workflow grade step (steps.grading-run.ts:425,496) and GradingDraftPayload.runs (grading-drafts.ts:33), whose consumer is the Drafted Grades site trends ALREADY occupies. Cross-assignment accumulation is therefore a separate, larger item and is NOT in A16. OWNER ANSWER 2 - FIX THE RECORDING TOOL''S DATA GAP INSIDE A16. Measured: "Grading (from a recording)" CANNOT feed trends at all, because composeGradingRowResult parses rubricAreas and then THROWS THEM AWAY, returning only four strings (grading-feedback-prompt.ts:146-155; GradingRecordingFeedback at :47-58), while computeClassTrends reads result.rubricAreas[].area/.score. Mounting today''s panel there would render "Trends (0)" FOREVER. Snapshot grading is unaffected (snapshot-row.ts:122-124). The owner chose to widen that result rather than ship one of the two strip grading tools without trends - a silent empty panel being worse than no panel. THREE MEASURED FINDINGS THAT RESHAPE THE ROW. (1) TRENDS IS ALREADY IN THE TOOLS TAB - tab-sections.ts:40 has manual: "Tools" - so the ask is not to move it INTO that tab but to stop it being a DESTINATION within it. (2) The "three other grading surfaces" are four MODES OF ONE COMPONENT (GradingMode = zip|canvas|livefeed|github, GradingTab.tsx:26), three of which render the same GradingResults.tsx - so ONE mount there serves four surfaces. (3) RECOMMENDATION FAN OUT, DO NOT MOVE: the Drafted Grades site is the only multi-assignment view and is baselined at REGRESSION 422; a run-generated panel and a per-entry review panel answer different questions. PANEL INSIDE EACH TOOL, NO NEW STRIP ENTRY - and the hardcoded strip counts are the SECOND reason, the first being that a 13th tab is a destination, which is the thing the owner asked to stop building. SEQUENCING CONSTRAINT, stated loudly by the seat rather than routed around: A16-1 is disjoint from the live work, but the two surfaces the owner most likely pictures are snapshot-grading/ and grading-recording/, both held by other chunks today. N13b is FOLLOWED not carried - it shares two files and redefines AreaTrend, which A16 would otherwise design against. CORRECTIONS: class-trends-draft.ts is 228 lines, not the 214 this row and my brief both said. GradingRecordingPanel.tsx is 995, not the 964 in this-repo.md - five lines of headroom on the very file a panel-inside reading edits first. And recording-split.structure.test.ts:219''s panelTargets.size is computed from the test''s OWN hardcoded key list, so it does pass falsely exactly as the card warns, while its strip regex silently misses a hyphenated key. REVISED 2026-09-20 on the owner answers; docs/a16-scope.md is now 845 lines. FOUR FINDINGS, and the first corrects MY OWN FRAMING in the most consequential way. (1) THE RECORDING TOOL''S BATCH BOUNDARY ALREADY EXISTS AND ALREADY PERSISTS. I told the seat no interactive grading tool had a run object; that is FALSE for this one. GradingRecordingPanel.tsx:791-807 renders an assessment selector, :291 derives assessmentId, :310 passes it into useGradingRows, useGradingRows.ts:362 stamps it, and `assessment` is in the persisted wire key set. What misled both me and revision 1 is a STALE COMMENT: grading-row.ts:156-162 states as an "HONEST FINDING, verified directly against GradingRecordingPanel.tsx" that the panel "has no assessment selector of any kind today" and that "nothing currently calls stampGradingRowsWithAssessment with a real value". Both false against the tree. FOURTH stale comment to mislead a pass today. The click at handleGradeAll:537-571 is a real batch and a per-run log record already exists. (2) SNAPSHOT GRADING GENUINELY HAS NO BOUNDARY - no course field, no assessment field, and SnapshotGradingPanel.tsx:931 records that the table survives reloads. Every candidate delimiter is an invention. SO MOUNTING TRENDS THERE FIRST WOULD SHIP THE EXACT CROSS-ASSIGNMENT MIXING THE OWNER''S ANSWER 1 PUT OUT OF SCOPE, and it would ship green. The assessment label is that surface''s first requirement, not the panel. (3) THE OWNER''S ANSWER 2 REVERSES A PINNED DECISION, not an unmade one - and the pin''s rationale is a BUNDLE. grading-submission-grade.test.ts:99 is titled "a graded row has exactly {id, totalScore, strengths, improvements, overallComment, failed} - no student, no userId, no rubricAreas, no feedback field" and :117 asserts not.toHaveProperty("rubricAreas") beside not.toHaveProperty("student"), not.toHaveProperty("userId") and JSON.stringify(result).not.toContain("userId"). That neighbourhood is a PII / minimal-surface constraint, and rubricAreas is THE ONE MEMBER OF THAT LIST THAT IS NOT PII - it is rubric area names and scores, already shown to the instructor. So the reversal does not violate the pin''s REASON, but the test title and the assertion both move and the commit must say why. (4) THE DATA FIX CROSSES 12 HOPS AND THE SECOND TRAP IS A COLLISION: applyAssessmentResult (assessment-row.ts:159-165) ENUMERATES SIX FIELDS RATHER THAN SPREADING, so a widened result type is SILENTLY DROPPED there - and that file belongs to A11''s live remediation, so the fix routes around it through grading-rows.ts''s own wrapper, following the useSnapshotGrade.ts:266-272 precedent. WITHDRAWN: revision 1''s "widen the panel''s prop" - GradingResults.tsx has no assignmentName to pass, so the widened prop had a hole at its very first consumer. Replaced by per-surface pure adapters building a GradingRunEntry, which leaves the panel prop, DraftedGradesTab.tsx, class-trends.ts and all three existing pins untouched and dissolves the contract-wave coupling. CHUNKING: A16-1 (adapter + defaultExpanded + ONE mount in GradingResults.tsx, serving all four LMS modes) and A16-2 (the recording data fix, no UI) run CONCURRENTLY - file-disjoint and informationally independent, because A16-2 has zero design freedom (computeClassTrends reads .area/.score and the type is the existing RubricAreaResult). A16-3/4/5 sequence after. TWO THINGS FOR THE CHECKER: A16-3''s line budget is a HARD BLOCKER (GradingRecordingPanel.tsx is 995 against a 1000 ceiling, so the extraction is IN the chunk, not after it), and sabotage S22 is expected NOT to go red - making GradingRow.rubricAreas optional passes everything, which is why the artifact argues REQUIRED on construction grounds instead of claiming a guard that does not exist. OWNER ANSWER 3, 2026-09-20: A RECORDING-TOOL TREND COVERS THE ROWS THAT RUN JUST GRADED - not every row carrying the assessment label. This settles the check''s B1, which was the item''s real blocker. THE PROBLEM IT CLOSES, measured: handleGradeAll grades gradingRows.rawRows UNFILTERED (GradingRecordingPanel.tsx:560-571), i.e. every row in the course scope across ALL assessment labels against one rubricText - while the revision''s cohort was rawRows filtered by the currently-typed assessmentId. Those are different sets, and the artifact called the second one "the batch for this tool". Worse, `assessment` is stamped at CAPTURE time and never at grade time (setAllRows has one caller, the extraction sync at :465, and the panel''s own hint at :810-813 says the label "will apply to submissions captured from then on, not to rows already recorded"), and the control is a freeSolo Autocomplete whose onInputChange writes state on EVERY KEYSTROKE (:797-806). So: capture 30 rows with the label blank, click Grade All, then type "Essay 2" and the trends panel DISAPPEARS mid-keystroke - the silent-empty state owner answer 2 exists to prevent, reached from the other direction, and uncatchable here because nothing renders. THE FIX IS BUILDABLE NOW: the id set handleGradeAll submitted already exists in memory at :560 and is already logged as a count at :604. Define the cohort from the run, not from the live text field. REVISION 3, 1226 lines, all seven blockers addressed; round-3 check in flight. THE COHORT IS NOW THE RUN, per owner answer 3: lastRunCohort = {at, ids} set ONCE inside handleGradeAll from the submissions array already built at :561-565, never from assessmentLabel, assessmentId, rows or filterText, with an assertion pinning that dependency set. Multi-label contamination is now DISCLOSED to the instructor rather than falsely filtered away - which is the honest version of the same fact. A CONSEQUENCE THE OWNER SHOULD KNOW, and it is a product limit rather than a defect: THE COHORT IS useState AND DOES NOT SURVIVE A RELOAD. Grade a batch, see trends; refresh, and the trends are gone until the next run, while the graded rows themselves persist. That simplification is what let H10 - persisting rubricAreas to the wire - be WITHDRAWN, which keeps the frozen 16-key oracle at grading-row-serialization.test.ts:620-637 at SIXTEEN and makes it stronger, because its sabotage now runs against an oracle that was never widened. An upgrade path to persistence is recorded rather than foreclosed. The check is asked whether the panel DISCLOSES that on reload or merely vanishes - a silently vanishing panel is the empty-state failure the owner rejected twice. OTHER RESOLUTIONS: the SCALE leverage claim is WITHDRAWN as inherited - 14 files already batch, measured with canaries - and restated as click-cost/reachability under leverage.md''s own "accept the cost explicitly" move, with a removal test that now traces to what is claimed. A16-1''s owns is derived with a STATED COMMAND and gains five files, including classTrendsDraft.not-postable.test.ts, because ClassTrendsPanel.tsx IS a canary root and A16-1 EDITS it - the earlier exclusion answered whether A16-1 ADDS a file that layer reaches, which was the wrong question. REGRESSION 359''s standing extraction debt is confirmed at :34299 and the extraction is IN A16-1 before its own code. H4 is respecified BY SYMBOL after the line citations proved wrong at the edit point. And student: "" is WITHDRAWN - the adapter passes the run BY REFERENCE, A16-3 emits real names, and the guards that actually protect privacy are named and left untouched (the panel never reads