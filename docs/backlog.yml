ge renders an EMPTY warning-coloured div - strictly worse than today''s wrong-but-present text - and the revert sabotage reds against the blank version too, so it does not discriminate. And the criterion "no returned string instructs the instructor to press a control that does not exist" HAS NO INSTRUMENT in this repo while sitting under a pass condition claiming to range over it; close it by CONSTRUCTION - freeze the leaf''s emitted copy set as literals and assert the returned set equals it, so any new instruction is a diff. ALSO CORRECTED, and it belongs in A12 too: this row''s premise "nothing in the review table shows that row''s reason" is PARTLY FALSE - it is shown, under the wrong label, in an editable textarea. The honest reframe is MISLABELLED AND UNMARKED, not absent, and that changes both the copy and the value claim. And a client-bundle hazard the artifact never names: the new leaf must value-import from @/lib/grade/types, NOT the barrel - gradingResultsHelpers.ts:58-70 records that the barrel drags next/headers into the client bundle and fails next build while tsc, eslint and vitest all stay green. ROUND 2 CHECK: NOT CLEAN, 3 blockers, and one needed a RULING before the artifact could be revised coherently. RULING R - REGISTER THE LEAF AND NARROW THE PATTERN; DO NOT DUPLICATE. The landed client-bundle guard at gradingResultsHelpers.test.ts:824-889 BANS the exact specifier AC-8 mandates - its BANNED_IMPORT_PATTERNS includes /from ["'']@\/lib\/grade\// which matches @/lib/grade/types - and its CLIENT_FILES is a hardcoded eight-entry list with NO COMPLETENESS ASSERTION, so a new leaf simply escapes the directory''s own guard, silently and forever. Measured, and it decides the ruling: src/lib/grade/types.ts has EXACTLY ONE import and it is type-only (import type { CodeRunResult }), so it is genuinely client-safe and the pattern is OVER-BROAD for it. THE RULING HAS FOUR PARTS, all inside that one test file, which therefore moves from do-not-edit into owns: (1) register the new leaf in CLIENT_FILES; (2) narrow the pattern to exempt @/lib/grade/types specifically; (3) ADD A GUARD THAT types.ts STAYS IMPORT-FREE, so the exemption cannot quietly become false - an exemption with no guard is how this class returns; (4) ADD A COMPLETENESS ASSERTION to CLIENT_FILES so a future file cannot escape by omission. I rejected the directory''s local-duplication precedent deliberately: duplication is what this repo keeps filing rows about - L13 is 53 duplicated stripComments copies of which one silently diverged - and duplicating a type-guard predicate buys the same debt for a smaller reason. THE OTHER TWO BLOCKERS ARE DESIGN, for the author: AC-6''s condition is scoped to isUngraded(result), but engine.ts:152 sets strengths = outcome.message for BOTH members of UngradedOutcome, so driven over the kinds it MANDATES OVERWRITING a grading-failed row''s only diagnostic with a frozen leaf literal - directly contradicting this chunk''s own account of the defect. Scope it to kind === "not-attempted" and state the grading-failed behaviour. And AC-3b cannot freeze what section 5 requires: the bound exists ONLY inside the engine''s message template, classifyRow''s signature is (result, edit) with no run and no count, so the leaf can state the count only by parsing the message - which G2 forbids - and if it interpolates, the emitted string is not a frozen literal and fails AC-6''s own membership test. AC-3b also collects strings from classifyRow ALONE, missing the replacement copy that actually lands in the instructor''s textarea - so the chunk could ship a FRESH false instruction in the same box with every gate green. ALSO: the seeder correction is right and STRONGER than argued - :181-191 is a render-phase setState, not an effect; had it been an effect the first render after a run change WOULD have used the previous map and the uncorrected sentence. The conclusion survives on a fact the artifact never opened. SHIPPED 2026-09-20 at b7e62fe and 917d29f, the same two commits as A12 (git show --stat on both, 2026-09-22). `unscoped` here now means the REMAINDER is unscoped, not that A13-2 is unbuilt. RESIDUALS. RES-7, THE COMMENT-SATISFIED TEST, which docs/a12-a13-scope.md promised to file as a backlog row at this chunk''s push and did not: grade-result-doors.wiring.test.ts is satisfied by a COMMENT - its assertion is a raw-source match, so commenting the wiring out leaves it green. OWNER: a test seat. INSTRUMENT: strip comments before the assertion (the present-not-absent half of L9''s triage rule), then prove the tightened test goes RED with the wiring commented out - a guard nobody has watched fail is not a guard. STEP: the next chunk that touches grade-result-doors.wiring.test.ts, or L9''s triage wave, whichever lands first; a grep for referencesUngradedFlag across docs/backlog.yml returned 0 before this note, which is how it was lost. RES-4 (whether the disclosure reads correctly on a real screen) and RES-5 (its contrast in BOTH themes) are owner items: no component is rendered by any test here and nothing computes contrast, so they need the owner and a real browser, on the owner-verification pass. RES-1, the engine''s false "Re-run to grade the rest" copy that this row''s own note identified as already on screen in the strengths textarea, is now ROW A31.'
- id: 'L11'
  state: 'unscoped'
  kind: 'chore'
  area: 'loop-and-docs-maintenance'
  title: 'Make the owns-list caller check MECHANICAL instead of remembered. L10 shipped the procedure into docs/loop/parallel-disjointness.md, and the implementer who wrote it said plainly in its own report that prose will not be enough - and it is right. The evidence is L10''s own history: the correct definition was already in that card, was quoted at people twice, and was still missed five times in one day, the fifth by the orchestrator ONE COMMIT AFTER writing the rule down. A sixth card is not the fix.'
  owns: []
  verify: null
  blocked_by: []
  instrument: 'L10 implementation report, 2026-09-15, plus the five instances recorded in L10 before it closed (A1, N15, A2, A5 fixtures, A5 index.tsx)'
  from: 'L10'
  note: 'THE PROPOSAL, which is the implementer''s and which I endorse: the WAVE GATE runs the grep the card describes and diffs it against the submitted owns list, rather than a human or an agent remembering to run it. The gate already executes git status --short against the assignment, so the machinery and the moment both exist; this adds a second, cheaper question to the same step. WHY THIS IS UNSCOPED AND NOT JUST DISPATCHED - three things have to be settled first and none of them is obvious. (1) WHAT TO GREP FOR. A change to a function has a symbol; a change to a type, a prop, a CSS class or a string constant has a different one, and some have none an implementer could name. A gate that only works for named exports will be silently useless for the other half of waves. (2) FALSE POSITIVES ARE THE WHOLE RISK. Every caller of a widely-used symbol would be flagged, and a gate that cries wolf on a forty-hit grep gets ignored within a week, which is worse than no gate because it looks like coverage. Something has to distinguish "reached by this change" from "merely mentions the symbol", and that judgement may not be mechanisable - in which case the honest answer is a gate that REPORTS the hits for a human to classify rather than one that passes or fails. (3) WHERE IT LIVES. This repo''s gates are vitest files; a wave-gate check is not obviously one, since it is about a brief rather than about the tree. It may be a script the orchestrator runs, which makes it exactly as skippable as the card - and if so, say that out loud rather than shipping a gate that is a card with extra steps.'
- id: 'L12'
  state: 'unscoped'
  kind: 'chore'
  area: 'loop-and-docs-maintenance'
  title: 'The 1000-line ceiling measures the wrong thing for a canary file, and this repo now has the instance to prove it. repoGrades.wiring.test.ts went red on main (1037 lines) because A5 added 91 lines of new guards, and was split under duress in 25ffe9c. The implementer who split it argued - and I agree - that growth in that file is not rising complexity but a growing COUNT OF INDEPENDENT GUARANTEES: every block declares its own path constant, its own describe and its own assertions, with almost no coupling to its neighbours. So the file will hit the wall again every few features however well it is organised internally, and each hit costs a split done under a red gate rather than by design.'
  owns: []
  verify: null
  blocked_by: []
  instrument: 'The 25ffe9c split and its implementer''s reported analysis, 2026-09-15; the ceiling itself is src/file-size-ceiling.structure.test.ts:30'
  from: 'N14 wave 2 implementation, which found the red gate from outside the directory'
  note: 'THE PROPOSAL, which is the implementer''s: adopt a convention of ONE GUARD FILE PER GUARDED COMPONENT from the start, rather than accreting a single wiring file until it breaches and then cutting it. That is a convention change, not a code change, which is why this is unscoped - it needs a decision before it needs a file list. THREE THINGS TO SETTLE FIRST. (1) IS THE CEILING ITSELF WRONG HERE, or only its application? An exemption list is the obvious move and the obvious trap - an exemption that says "test files may grow forever" removes the pressure that produced two genuinely good splits in this repo''s history. Anything proposed must say what still constrains these files. (2) THE SPLIT THAT JUST HAPPENED WAS GOOD, and that argues against the convention as much as for it: the seam it found (click-gating guards versus linking guards) only became visible once both waves existed, and a one-file-per-component rule written in advance would have produced a different, probably worse, cut. So the honest question is whether the convention beats splitting-when-a-real-seam-appears, not whether it beats splitting-under-duress. (3) WHAT ACTUALLY FAILED HERE WAS THE VERIFY LIST, not the ceiling: A5''s verify named five commands and the ceiling test was not among them, so nobody ran it - not the implementer, not the verifier, not me. A convention change would not have caught that, and the cheaper fix may be that every verify list in this queue includes the ceiling gate whenever the wave adds lines to an existing file. Consider that before the larger change.'
