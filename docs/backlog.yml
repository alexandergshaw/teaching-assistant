HAT THE OWNER ASKED FOR HAS TWO HALVES AND THEY ARE NOT THE SAME SIZE. (1) PLACEMENT - trends renders alongside each grading tool instead of only in Drafted Grades. (2) TRIGGER - "when i run a tool over a series of assignments, THAT RUN should generate trends", i.e. trends become an OUTPUT OF A RUN rather than a thing the instructor navigates to afterwards. Half (2) is the substantive one: it needs the run to carry enough identity to group its results into a series, and the scope must establish whether each grading tool''s run already has that or whether it is being invented. A CONSTRAINT FROM THIS REPO''S OWN HISTORY, and it is the one to watch: recording-split.structure.test.ts holds HARDCODED COUNTS for that strip - exactly 12 sub-tab entries, exactly 11 role=tabpanel occurrences, and panelTargets.size === 11 - and the card records that adding a sub-tab breaks three of those and passes the fourth FALSELY. If the answer is a new strip entry, that test is in owns and its counts move in the same commit. If the answer is a panel WITHIN each existing grading tool, they may not move at all - which is an argument for the second shape. ALSO: the DraftedGradesTab site is not obviously to be deleted - decide whether trends move or fan out, because a run-generated panel and a per-entry review panel answer different questions. And note N13a/N13b are open against this same code; sequence them, since N13b (name the SUBSET of students who missed the same area) is what makes a per-run trend worth reading at all. SCOPED 2026-09-20 to docs/a16-scope.md, and THE OWNER ANSWERED TWO FORKS THE SAME DAY. OWNER ANSWER 1 - "A SERIES" MEANS ONE RUN OVER MANY STUDENTS'' SUBMISSIONS FOR THE SAME ASSIGNMENT, not trends spanning several assignments. That is the smaller path and it is available today: every grading tool already does exactly that, so trends can attach to a run without inventing a multi-assignment run object. This matters because the scoping measured that NO INTERACTIVE GRADING TOOL RUNS OVER A SERIES OF ASSIGNMENTS AT ALL - GradingRunEntry is ONE assignment (types.ts:320-338), and the only GradingRunEntry[] producers are the workflow grade step (steps.grading-run.ts:425,496) and GradingDraftPayload.runs (grading-drafts.ts:33), whose consumer is the Drafted Grades site trends ALREADY occupies. Cross-assignment accumulation is therefore a separate, larger item and is NOT in A16. OWNER ANSWER 2 - FIX THE RECORDING TOOL''S DATA GAP INSIDE A16. Measured: "Grading (from a recording)" CANNOT feed trends at all, because composeGradingRowResult parses rubricAreas and then THROWS THEM AWAY, returning only four strings (grading-feedback-prompt.ts:146-155; GradingRecordingFeedback at :47-58), while computeClassTrends reads result.rubricAreas[].area/.score. Mounting today''s panel there would render "Trends (0)" FOREVER. Snapshot grading is unaffected (snapshot-row.ts:122-124). The owner chose to widen that result rather than ship one of the two strip grading tools without trends - a silent empty panel being worse than no panel. THREE MEASURED FINDINGS THAT RESHAPE THE ROW. (1) TRENDS IS ALREADY IN THE TOOLS TAB - tab-sections.ts:40 has manual: "Tools" - so the ask is not to move it INTO that tab but to stop it being a DESTINATION within it. (2) The "three other grading surfaces" are four MODES OF ONE COMPONENT (GradingMode = zip|canvas|livefeed|github, GradingTab.tsx:26), three of which render the same GradingResults.tsx - so ONE mount there serves four surfaces. (3) RECOMMENDATION FAN OUT, DO NOT MOVE: the Drafted Grades site is the only multi-assignment view and is baselined at REGRESSION 422; a run-generated panel and a per-entry review panel answer different questions. PANEL INSIDE EACH TOOL, NO NEW STRIP ENTRY - and the hardcoded strip counts are the SECOND reason, the first being that a 13th tab is a destination, which is the thing the owner asked to stop building. SEQUENCING CONSTRAINT, stated loudly by the seat rather than routed around: A16-1 is disjoint from the live work, but the two surfaces the owner most likely pictures are snapshot-grading/ and grading-recording/, both held by other chunks today. N13b is FOLLOWED not carried - it shares two files and redefines AreaTrend, which A16 would otherwise design against. CORRECTIONS: class-trends-draft.ts is 228 lines, not the 214 this row and my brief both said. GradingRecordingPanel.tsx is 995, not the 964 in this-repo.md - five lines of headroom on the very file a panel-inside reading edits first. And recording-split.structure.test.ts:219''s panelTargets.size is computed from the test''s OWN hardcoded key list, so it does pass falsely exactly as the card warns, while its strip regex silently misses a hyphenated key. REVISED 2026-09-20 on the owner answers; docs/a16-scope.md is now 845 lines. FOUR FINDINGS, and the first corrects MY OWN FRAMING in the most consequential way. (1) THE RECORDING TOOL''S BATCH BOUNDARY ALREADY EXISTS AND ALREADY PERSISTS. I told the seat no interactive grading tool had a run object; that is FALSE for this one. GradingRecordingPanel.tsx:791-807 renders an assessment selector, :291 derives assessmentId, :310 passes it into useGradingRows, useGradingRows.ts:362 stamps it, and `assessment` is in the persisted wire key set. What misled both me and revision 1 is a STALE COMMENT: grading-row.ts:156-162 states as an "HONEST FINDING, verified directly against GradingRecordingPanel.tsx" that the panel "has no assessment selector of any kind today" and that "nothing currently calls stampGradingRowsWithAssessment with a real value". Both false against the tree. FOURTH stale comment to mislead a pass today. The click at handleGradeAll:537-571 is a real batch and a per-run log record already exists. (2) SNAPSHOT GRADING GENUINELY HAS NO BOUNDARY - no course field, no assessment field, and SnapshotGradingPanel.tsx:931 records that the table survives reloads. Every candidate delimiter is an invention. SO MOUNTING TRENDS THERE FIRST WOULD SHIP THE EXACT CROSS-ASSIGNMENT MIXING THE OWNER''S ANSWER 1 PUT OUT OF SCOPE, and it would ship green. The assessment label is that surface''s first requirement, not the panel. (3) THE OWNER''S ANSWER 2 REVERSES A PINNED DECISION, not an unmade one - and the pin''s rationale is a BUNDLE. grading-submission-grade.test.ts:99 is titled "a graded row has exactly {id, totalScore, strengths, improvements, overallComment, failed} - no student, no userId, no rubricAreas, no feedback field" and :117 asserts not.toHaveProperty("rubricAreas") beside not.toHaveProperty("student"), not.toHaveProperty("userId") and JSON.stringify(result).not.toContain("userId"). That neighbourhood is a PII / minimal-surface constraint, and rubricAreas is THE ONE MEMBER OF THAT LIST THAT IS NOT PII - it is rubric area names and scores, already shown to the instructor. So the reversal does not violate the pin''s REASON, but the test title and the assertion both move and the commit must say why. (4) THE DATA FIX CROSSES 12 HOPS AND THE SECOND TRAP IS A COLLISION: applyAssessmentResult (assessment-row.ts:159-165) ENUMERATES SIX FIELDS RATHER THAN SPREADING, so a widened result type is SILENTLY DROPPED there - and that file belongs to A11''s live remediation, so the fix routes around it through grading-rows.ts''s own wrapper, following the useSnapshotGrade.ts:266-272 precedent. WITHDRAWN: revision 1''s "widen the panel''s prop" - GradingResults.tsx has no assignmentName to pass, so the widened prop had a hole at its very first consumer. Replaced by per-surface pure adapters building a GradingRunEntry, which leaves the panel prop, DraftedGradesTab.tsx, class-trends.ts and all three existing pins untouched and dissolves the contract-wave coupling. CHUNKING: A16-1 (adapter + defaultExpanded + ONE mount in GradingResults.tsx, serving all four LMS modes) and A16-2 (the recording data fix, no UI) run CONCURRENTLY - file-disjoint and informationally independent, because A16-2 has zero design freedom (computeClassTrends reads .area/.score and the type is the existing RubricAreaResult). A16-3/4/5 sequence after. TWO THINGS FOR THE CHECKER: A16-3''s line budget is a HARD BLOCKER (GradingRecordingPanel.tsx is 995 against a 1000 ceiling, so the extraction is IN the chunk, not after it), and sabotage S22 is expected NOT to go red - making GradingRow.rubricAreas optional passes everything, which is why the artifact argues REQUIRED on construction grounds instead of claiming a guard that does not exist. OWNER ANSWER 3, 2026-09-20: A RECORDING-TOOL TREND COVERS THE ROWS THAT RUN JUST GRADED - not every row carrying the assessment label. This settles the check''s B1, which was the item''s real blocker. THE PROBLEM IT CLOSES, measured: handleGradeAll grades gradingRows.rawRows UNFILTERED (GradingRecordingPanel.tsx:560-571), i.e. every row in the course scope across ALL assessment labels against one rubricText - while the revision''s cohort was rawRows filtered by the currently-typed assessmentId. Those are different sets, and the artifact called the second one "the batch for this tool". Worse, `assessment` is stamped at CAPTURE time and never at grade time (setAllRows has one caller, the extraction sync at :465, and the panel''s own hint at :810-813 says the label "will apply to submissions captured from then on, not to rows already recorded"), and the control is a freeSolo Autocomplete whose onInputChange writes state on EVERY KEYSTROKE (:797-806). So: capture 30 rows with the label blank, click Grade All, then type "Essay 2" and the trends panel DISAPPEARS mid-keystroke - the silent-empty state owner answer 2 exists to prevent, reached from the other direction, and uncatchable here because nothing renders. THE FIX IS BUILDABLE NOW: the id set handleGradeAll submitted already exists in memory at :560 and is already logged as a count at :604. Define the cohort from the run, not from the live text field. REVISION 3, 1226 lines, all seven blockers addressed; round-3 check in flight. THE COHORT IS NOW THE RUN, per owner answer 3: lastRunCohort = {at, ids} set ONCE inside handleGradeAll from the submissions array already built at :561-565, never from assessmentLabel, assessmentId, rows or filterText, with an assertion pinning that dependency set. Multi-label contamination is now DISCLOSED to the instructor rather than falsely filtered away - which is the honest version of the same fact. A CONSEQUENCE THE OWNER SHOULD KNOW, and it is a product limit rather than a defect: THE COHORT IS useState AND DOES NOT SURVIVE A RELOAD. Grade a batch, see trends; refresh, and the trends are gone until the next run, while the graded rows themselves persist. That simplification is what let H10 - persisting rubricAreas to the wire - be WITHDRAWN, which keeps the frozen 16-key oracle at grading-row-serialization.test.ts:620-637 at SIXTEEN and makes it stronger, because its sabotage now runs against an oracle that was never widened. An upgrade path to persistence is recorded rather than foreclosed. The check is asked whether the panel DISCLOSES that on reload or merely vanishes - a silently vanishing panel is the empty-state failure the owner rejected twice. OTHER RESOLUTIONS: the SCALE leverage claim is WITHDRAWN as inherited - 14 files already batch, measured with canaries - and restated as click-cost/reachability under leverage.md''s own "accept the cost explicitly" move, with a removal test that now traces to what is claimed. A16-1''s owns is derived with a STATED COMMAND and gains five files, including classTrendsDraft.not-postable.test.ts, because ClassTrendsPanel.tsx IS a canary root and A16-1 EDITS it - the earlier exclusion answered whether A16-1 ADDS a file that layer reaches, which was the wrong question. REGRESSION 359''s standing extraction debt is confirmed at :34299 and the extraction is IN A16-1 before its own code. H4 is respecified BY SYMBOL after the line citations proved wrong at the edit point. And student: "" is WITHDRAWN - the adapter passes the run BY REFERENCE, A16-3 emits real names, and the guards that actually protect privacy are named and left untouched (the panel never reads .student; the route anonymises; the insight type carries no name field). N13b is unblocked rather than foreclosed. IT ALSO CORRECTED THE ROUND-2 CHECKER on a measured point: ALLOWED_OVERAGE is at :64-81, not :68-85, confirmed on the working tree and against git show HEAD:, and recorded so it is not "fixed" back. STATE CORRECTED 2026-09-22 from actionable to verification: every wave is in git (2e34886, 61b229f, cbe84e2, 434ad5e, e57b1c5, e9670d1, 6ecc226, plus the f8d65eb fix pass) and what remains is owner-only - RES-W3-1/2/3/5, RES-V-6 and the W3V browser claims - plus conditional triggers RES-V-1/3/4/7/8, each already carrying an owner, an instrument and a step above. No agent-buildable wave remains. actionable also never made this row selectable: selectNext requires isScoped (src/tools/backlog/types.ts:84-86), which needs a non-empty owns AND verify, and this row has neither. GradingRecordingPanel.tsx measures 990 lines today (@(Get-Content).Count, 2026-09-22), matching the note above.'
