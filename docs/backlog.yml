- id: 'L9'
  state: 'unscoped'
  kind: 'chore'
  area: 'loop-and-docs-maintenance'
  title: 'Source-scanning tests in this repo can be satisfied by COMMENTED-OUT code, and most of them do not defend against it. Found by the N14 wave 1 verification, on the one assertion least able to afford it: the wiring canary whose entire purpose is to stop the snapshot keyboard layer dying silently. The verifier commented out window.addEventListener while leaving removeEventListener in place and NOTHING caught it - tsc, lint, 311 tests and next build all stayed green, because the canary is a regex over raw source and a regex matches text inside a comment exactly as well as live code. MEASURED 2026-09-15: grep -rln readFileSync --include=*.test.ts src returns 176 files; grep -rln stripComments over the same set returns 57. So on the order of 119 source-scanning test files have no comment defence, though not all of them need one.'
  owns: []
  verify: null
  blocked_by: []
  instrument: 'Get-ChildItem -Path src -Recurse -Include *.test.ts | Select-String -Pattern readFileSync -List (176 files) and the same with -Pattern stripComments (57 files), re-measured 2026-09-15 (equivalent to grep -rln readFileSync --include=*.test.ts src / grep -rln stripComments over the same set, which the row''s own instrument names).'
  from: 'N14 wave 1'
  note: 'THE WAVE 1 INSTANCE IS ALREADY FIXED - this row is about the other 119. UNSCOPED because a blanket sweep is the wrong shape and would be worse than nothing: stripComments is NOT always correct. Some assertions deliberately scan comments (this repo pins RULES and CITATIONS in comments, and docs/REGRESSION.md treats a stale comment as a defect, so a test asserting a comment exists is legitimate). Others assert a string is ABSENT, where stripping comments makes the test WEAKER rather than stronger. So the work is a triage, not a sweep, and the triage rule has to be authored before any file is touched. THE RULE I WOULD START FROM, for whoever scopes this: an assertion that something IS PRESENT in code - a call, a registration, a guard - must strip comments, because commented-out code satisfies it while doing nothing. An assertion that something is ABSENT must NOT strip them, because a commented-out forbidden call is still a signal worth failing on. Assertions about comments themselves are a third category and are left alone. WHERE TO LOOK FIRST: the five *.structure.test.ts files, since those are the ones this repo uses as construction guards, and any test whose name contains canary or wiring.'
