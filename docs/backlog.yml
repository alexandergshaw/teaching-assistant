  instrument: 'Scope check of scratchpad/n15-scope.md, 2026-09-15: DEFECTIVE, 8 blockers, 4 majors. Verdict: may not be built as scoped.'
  from: 'owner request, 2026-09-15'
  note: 'RETURNED TO UNSCOPED DELIBERATELY. The owns list it carried was computed from the description rather than from the code, and the check named eleven files missing from it - including src/app/actions.ts (the barrel GradingTab imports through, without which the action ships dead), src/lib/grade/types.ts (GradeResult has NO id field, so the stable-row-id fix cannot be made without it), src/lib/grade/engine.test.ts (five describe blocks on the very function both chunks call), and action-guard-coverage.test.ts (a new server action fails it unless requireOwner() is textually first in its body). Keeping a wrong owns list would be worse than having none. THREE FINDINGS AN ARCHITECT PASS MUST CARRY, each measured: (1) GradingTab.tsx:150-155 smooth-scrolls to the results section on every run change, so in an incremental flow it drags the viewport away from the file input ONCE PER STUDENT - X-1''s named defect, sitting in an owned file, uncounted. (2) The results table sorts by student name unconditionally (DEFAULT_SORT, gradingResultsHelpers.ts:99-102, pinned by a landed source-reading test), so incremental rows insert ALPHABETICALLY, not at the end - the just-graded row lands anywhere in a class of 30. (3) gradeAction''s Gemini path is a Promise.all of THREE calls plus a fourth when the rubric box is blank; gradeStudentEntries returns fullCreditChecklist: [] hardcoded (engine.ts:276), so per-upload grading silently ships a degraded results panel with every gate green - and if the rubric box is blank, each upload generates its OWN rubric, so students are graded against different rubrics. Also unsized: the owner''s primary input is a phone photo, UPLOAD_WIRE_BUDGET_BYTES is 3.5MB (upload-budget.ts:41) and base64 inflates by 4/3, so a real photo fails on upload one. OWNER DECISION 2026-09-15, recorded here because it arrived while scoping a different item and it CONFIRMS this row''s premise from the other direction. Verbatim: "each student will have their own zip". It was given as the answer to a re-run identity question on bound-stopped grading runs - the zip path has no durable per-student id, so a stopped run could not name what to re-run. One upload per student dissolves that: the upload is the identity. TWO CONSEQUENCES FOR THIS ITEM. (1) The per-upload-is-one-student mode is not only a convenience for the owner''s grading workflow, it is what gives every downstream feature a re-run key on the zip path - so the checkbox this row describes carries more weight than its size suggests, and A12''s not-attempted rows depend on it for that path. (2) THE QUESTION THIS ROW MUST STILL ANSWER: whether the multi-student bulk zip stays supported alongside it. If it does, two identity regimes coexist and every consumer of a stopped or failed row has to know which it is looking at; if it does not, that is a removal with its own blast radius. Do not default it.'
