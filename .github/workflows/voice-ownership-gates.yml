          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "6e1ca69fb9d94192573c64afabd3e692de19a216"
          test "$(git rev-parse 'HEAD^{tree}')" = "b60a30393aa484d768a843cd5d666f6ef081686b"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - if: matrix.gate == 'lint'
        run: npm run lint
      - if: matrix.gate == 'types'
        run: npx --no-install tsc --noEmit
      - if: matrix.gate == 'regression'
        env:
          VITEST_MAX_WORKERS: '2'
        run: npm test
      - if: matrix.gate == 'build'
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: local-build-only
        run: npm run build
      - if: matrix.gate == 'focused'
        env:
          VITEST_MAX_WORKERS: '2'
        run: npm run test:paths src/app/actions/eleven-voice-library.test.ts src/app/actions/media-voice.guard.test.ts src/app/actions/media-voice.budget.test.ts src/app/components/lecture-videos src/app/components/ui/modalAdoption.wiring.test.ts src/app/url-state.rec-view.test.ts src/lib/recording-launch.test.ts src/app/components/recording/recording-split.structure.test.ts src/file-size-ceiling.structure.test.ts
