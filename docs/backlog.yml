  area: 'grading-run-survival-and-disclosure'
  kind: 'bug'
  note: 'FILED SEPARATELY AND DELIBERATELY, out of the N15a design that found it: this is live on main, independent of any queued feature, and it changes grades rather than presentation - so it must not be entangled with a feature whose shape is still moving. THE FIX IS NOT OBVIOUS AND SHOULD BE DESIGNED, NOT GUESSED: the parent path segment is the identity carrier on the nested-zip path, but the Canvas 4-part convention branch and the inferred-lookup branch both key off the leaf, so a naive "prefer parentPath" changes behaviour on paths that work today. FIRST STEP, cheap and owed before any fix: write the missing tests against utils.ts for both functions with a nested-zip fixture, and prove they FAIL on the current code - this repo has shipped a guard test that could not fail. THE OWNER-VISIBLE SYMPTOM, for triage: students missing from the results table entirely, and a row whose student name is a bare filename stem like "main" or "submission". TWO CORRECTIONS TO THIS ROW, both measured during the fix and both to claims made here rather than by the implementer. (1) A COST MODEL UNDERSTATED: a coincidental 4-part leaf inside correctly-named student zips creates a phantom row that STEALS THAT FILE FROM EVERY STUDENT, not "one file" as first priced - measured, a path ending src/my_test_file_here.py yields a merged row named "my", and that shape is ordinary in real CS submissions. Unchanged from HEAD so not a regression of the fix, and deliberately left unfixed. (2) STILL OPEN AFTER THE FIX: two different students whose zips share an identical non-Canvas name still merge, and separating them by the field after the student name was ATTEMPTED AND WITHDRAWN - the evidence cited for it was this app''s own synthetic packer (canvasWorkToZipBase64), not a real Canvas archive, and utils.ts:70 says the real convention puts a DATE in that position, which would have split ONE student into two UI-identical rows sharing one edit entry and therefore one grade. It needs one real Canvas submissions zip''s filenames from the owner to settle; nothing in this checkout can supply that. Also measured and unfixed: files nested past MAX_NESTED_ZIP_DEPTH = 3 vanish with no failedSupportedFiles entry. OWNERS FOR THE THREE OPEN ITEMS, which were recorded with none and were therefore deletions as written (docs/backlog-reconciliation-2026-09-21.md section 3, cc12a8e). (1) THE SANITIZED-NAME COLLISION (two students whose zips share an identical non-Canvas name still merge). OWNER: the repo owner. INSTRUMENT: the filenames from one real Canvas bulk-download zip - nothing in this checkout can supply them, and the attempt that was withdrawn was priced on this app''s own synthetic packer instead. STEP: the owner pastes or attaches one real archive''s filename list; until then this stays open and unbuilt, and no agent should guess at the convention. (2) THE PHANTOM ROW FROM A COINCIDENTAL 4-PART LEAF (a path ending src/my_test_file_here.py yields a merged row named "my", stealing that file from every student). OWNER: the repo owner decides whether to fix it, because the fix changes behaviour on paths that work today; it was left unfixed deliberately, which is a decision, not an absence. INSTRUMENT: a fixture in src/lib/grade/utils.test.ts driving parseSubmissionFileName over a 4-part non-Canvas leaf, red before any fix. STEP: the owner''s answer, then a scoping seat. (3) FILES NESTED PAST MAX_NESTED_ZIP_DEPTH = 3 VANISH with no failedSupportedFiles entry. OWNER: an implementer - this one needs no decision, only a disclosure. INSTRUMENT: a test asserting that a file dropped for depth appears in failedSupportedFiles, red on today''s code. STEP: the next chunk that may write src/lib/grade/extraction.ts. A silent drop is the same class this row was filed for, so it must not ride out on the fix that closed the identity half.'
- id: 'L13'
  state: 'unscoped'
  title: 'A CRLF-blind stripComments copy silently stops defending its own assertions, and the repo has no check that the 53 duplicated copies agree. CORRECTED 2026-09-16 - THE FIRST FILING OF THIS ROW WAS WRONG and the correction is the useful part. It claimed all 53 copies were blind, from a SYNTAX filter (does the source mention a carriage-return escape). A BEHAVIOURAL probe - extract each stripComments body, eval it, feed it a CRLF fixture whose only comment is a line comment, ask whether the comment survived - says otherwise: of 53 files defining the helper, 45 strip correctly, 8 were unparseable by the probe and read CR-safe by hand, and exactly ONE is genuinely blind: src/app/components/snapshot-grading/snapshot-role-setrole-callsites.structure.test.ts, which does split on a bare line feed then replaces with a pattern lacking the multiline flag. THE RULE THE FIRST FILING MISSED: in JavaScript a multiline dollar matches BEFORE a carriage return (CR is a line terminator), so the dominant shape - 28 of 53 files - is CR-safe despite never mentioning CR. Only a form that splits on a bare line feed AND drops the multiline flag is blind.'
  owns: []
  verify: null
  blocked_by: []
  instrument: 'Behavioural probe, 2026-09-16, run from the repo root: enumerate grep -rl "function stripComments" --include=*.test.ts src (53 files), brace-match each body out of its file, eval it, and apply it to a fixture built with String.fromCharCode(13) so no tool can materialize the escape. Result: 45 CR-tolerant, 0 blind among the parseable, 8 unparseable (inspected by hand: six use the multiline flag or an explicit non-CR character class and are safe; one is the SQL-specific stripCommentsAndDollarQuotes; one is the snapshot-grading chunk''s own copy, fixed in that chunk). The single blind file was then confirmed directly. The two-direction demonstration that produced this row stands for the copy it was run on: with the directory forced to CRLF a sabotage that should fail stayed GREEN, and separately a comment carrying an unmatched open paren survived stripping and tripped a bracket-counting throw, turning a green test hard red on a clean checkout. core.autocrlf=true, no .gitattributes, and git ls-files --eol src | grep -c "w/crlf" returns 453, so CRLF working files are the normal case here.'
  from: 'N15c remediation verification 2026-09-16; corrected by the A15 round-3 check the same day'
  area: 'loop-and-docs-maintenance'
  kind: 'bug'
  note: 'WHY THIS IS STILL WORTH A ROW AFTER THE CORRECTION SHRANK IT: the defect is one file, but the exposure is that nothing detects divergence among 53 copies that the repo REQUIRES to be duplicated (cross-test-file imports re-run the other file''s describe blocks, so importing is not available). One copy drifted; nothing would have caught a second. So the row is a decision, not a patch: either give these helpers a single non-test home that test files may import, or add a mechanical check that every copy agrees on a shared CRLF fixture. RELATED TO L9, NOT THE SAME: L9 is "most source-scanning tests have no comment defence at all"; this is "a defence that exists can stop working invisibly". A fix for L9 that mints more hand-rolled copies makes this row worse - sequence them. METHOD NOTE, recorded because it cost a wrong filing: a syntax filter over a helper''s SOURCE does not measure that helper''s BEHAVIOUR, and this repo''s own rule that a measurement names its command is not enough when the command measures the wrong thing. SECOND CORRECTION 2026-09-20, and it corrects THIS ROW''S OWN RECOMMENDATION as well as every orchestrator brief this session. THERE ARE TWO FAILURE MODES, NOT ONE, AND THE FORM THIS ROW RECOMMENDED IS BLIND TO THE SECOND. Measured with a node one-liner against a CRLF fixture and a trailing-comment fixture. MODE 1, the original finding: split on a bare line-feed, then strip with a line-comment pattern carrying no multiline flag. CRLF-BLIND. One file has it. MODE 2, and this is the one the row got wrong: the anchored multiline form (caret, then optional spaces or tabs, then the comment pattern, with the m flag) is CR-SAFE BUT TRAILING-COMMENT-BLIND, because the leading anchor only matches a comment that begins its own line. THE SAFE FORM, and it is what the tree already uses at snapshot-grading.structure.test.ts:14-20 and useSnapshotGrade.wiring.test.ts:44-51: split on a CR-tolerant line-feed pattern, then strip an UNANCHORED line-comment pattern per line. Safe on both modes - the split consumes the carriage return, and the unanchored pattern catches a comment anywhere on the line. WHY MODE 2 MATTERS AS MUCH AS MODE 1: useSnapshotGrade.wiring.test.ts:38-43 records an EXECUTED DEFEAT that forced the in-tree form - replacing live code with a void statement plus the same code as a TRAILING comment left every assertion GREEN under a line-start-only strip. That is the L9 defect exactly, and the anchored form does not stop it. CONSEQUENCE FOR THIS ROW''S OWN FIX: converting 53 copies to the anchored form would close mode 1 and OPEN mode 2 across the whole repo. Convert toward the in-tree form instead, and keep the CR canary that useSnapshotGrade.wiring.test.ts:58-70 builds with String.fromCharCode(13). METHOD NOTE, the second this row has earned: the first filing measured SYNTAX rather than BEHAVIOUR and was wrong by a factor of 53; this correction is about probing ONE failure mode and generalising to "safe". A probe that only tries the input you already suspect confirms whatever you already believe - vary the input along every axis the helper claims to cover.'

- id: 'L14'
  state: 'unscoped'
  title: 'A multi-path `vitest run` SILENTLY DROPS a path that matches nothing and still exits 0, so every verify command built as a list of files reports green while covering less than it claims. MEASURED 2026-09-20 twice, independently: `npx vitest run src/lib/no-emojis.test.ts src/does-not-exist.test.ts` prints "Test Files  1 passed (1)" / "Tests  18 passed (18)" and EXIT=0. Trailing arguments are FILTERS, not paths, and a filter matching nothing is not an error. Compounding it, the backlog''s own closure-runner cannot catch the shortfall: src/tools/backlog/closure-runner.ts:31 TESTS_SUMMARY_RE matches the "Tests" line and never the "Test Files" line, and it requires only that at least one assertion passed - so a verify whose paths are half typos closes its row green.'
  owns: []
  verify: null
  blocked_by: []
  instrument: 'Found by the A10 scoping revision and re-run independently by the orchestrator from PowerShell, same output and same exit code both times. Scope of the exposure TODAY: none live - `grep -c "^  verify: " docs/backlog.yml` is 30 and every one of them is null, so no open row rests on a multi-path command. The exposure is FORWARD: the A8 re-scope already proposes a THIRTEEN-path verify, and a single-path verify IS runner-decidable because a missing or renamed sole path exits 1 with "No test files found" (covered by an executing test at closure-runner.test.ts:34-41). Also worth recording alongside: runVerify has ZERO production callers (grep -rn "runVerify" src returns 8 lines, 4 in closure-runner.ts and 4 in its own test; its doc comment at :71-76 says so), so a verify string is documentation of a decidable check rather than an executing gate until something calls it.'
  from: 'A10 scoping revision, 2026-09-20; re-measured independently the same day'
  area: 'loop-and-docs-maintenance'
  kind: 'bug'
  note: 'SCOPED 2026-09-21, docs/l14-scope.md revision 1 (commit 1fdc622; round 0 was 7bda6ca); state left unscoped until the orchestrator rules. This paragraph REPLACES the residual text filed at 0b96cab - it is the only current version. RECOMMENDED FIX: a paths-only wrapper, npm run test:paths <p1> <p2> ..., in a new src/tools/vitest-paths/. It requires every argument to exist on disk as a file or a directory, runs ONE vitest process (node on node_modules/vitest/vitest.mjs, no shell) with --reporter=default --reporter=json --outputFile.json=<a temp path under os.tmpdir()>, and lets vitest''s substring rule choose only what RUNS. COVERAGE is credited per argument ONLY by executed files whose resolved path is EQUAL to a file argument or lies INSIDE a directory argument - never by substring, because five real test-less paths (docs, supabase, src/lib/workflows/presets, src/lib/workflow-triggers, src/lib/resource-links; find <p> -name "*.test.ts" returns 0 for each) each contain-match other test files and would otherwise pass. An argument must be credited at least one file with at least one passed assertion; a non-zero vitest exit is propagated, a signal-killed child (exit null) is exit 1, a missing report fails closed. It ships in ONE wave with its surface: this-repo.md section 1, traps-tests.md, ALL EIGHT .claude/agents definitions (loop-ac, loop-architect and loop-top wrote three of the five live instruments), and gate-commands.structure.test.ts, which pins the string test:paths in all ten routing files plus package.json, and uses a detector covering EVERY spelling that reaches vitest run (npx vitest run, npx vitest a b, npx vitest --run, npm test, npm t, npm run test with or without --, any npm script whose value starts with vitest, YAML block scalars, fenced commands with paths on following lines, and string literals inside spawn/exec calls). It holds raw multi-path commands at ZERO in agent definitions, loop cards, AGENTS.md/CLAUDE.md, package.json scripts, workflows and every src file importing child_process; counts path arguments on EVERY family INCLUDING the wrapper in each non-null backlog verify; and freezes the exact SET of existing hits (file plus normalised command) in docs/**/*.md, red on a new hit and on a stale entry. The single-path verify ruling below is KEPT; that check is its first enforcer. RESIDUALS, each with owner / instrument / step. R1: implementer briefs are prompt text outside the tree, so nothing can scan them for a raw multi-path gate. Owner: orchestrator, plus the checker of every wave. Instrument: the implementer report quoting the exact command it ran (loop-implementer.md will say: if a brief spells a raw multi-path test command, run the wrapper instead and say so), read by the Verify seat. Step: Verify of every wave after the wrapper lands. R2: open items carry live raw multi-path INSTRUMENTS a future wave will copy - docs/a19-scope.md:945 (A19, 2 paths), docs/a22-scope.md:1443 (A22, gate step 2, a directory plus a file), docs/a23-criteria.md:513 and :623 and docs/a23-test-notes.md:1297 (A23, AC-7, 2 paths each). All their paths exist today, so none is partial yet. Owner: each item next plan or test seat, converting to the wrapper - and because the docs hit set is EXACT, that seat write set must include src/tools/vitest-paths/gate-commands.structure.test.ts so the entry is removed in the same commit. Instrument: the frozen docs hit set. Step: each item next revision round. R3: closure-runner.ts:31 TESTS_SUMMARY_RE stays blind to file counts; acceptable ONLY while the verify check rejects two or more paths on EVERY command family, the wrapper included (round 0 missed npm test a b and npm run test:paths a b). Owner: the verify check in gate-commands.structure.test.ts. Instrument: that check, whose canary is a fixture row with a two-path WRAPPER verify, and sabotages that give a row a two-path verify once as vitest run and once as the wrapper. Step: every npm test. R4: runVerify still has zero production callers (grep -rn runVerify src: only closure-runner.ts and its own test), so a verify string documents a decidable check rather than executing one. Owner: orchestrator, to decide whether a backlog-automation item gives it a caller; needs its own row. Instrument: that grep. Step: the next backlog-automation item. R5: npm swallows flags given without a preceding -- in BOTH shells - measured in Bash, npm test <file> -t zzNoSuch echoed "vitest run <file> zzNoSuch" (the -t was lost and its value became a path filter, silently dropped) and npm test <file> --reporter=verbose echoed no reporter at all; the round-0 checker also measured --json, --outputFile and --testNamePattern= being swallowed. In PowerShell, npm resolves to npm.ps1 and PowerShell strips a bare -- when calling a .ps1 script, so even npm test -- <file> -t name loses the -t; quoting ''--'' or calling npm.cmd preserves it (checker measurement). CONSEQUENCE: through npm run test:paths the wrapper refuse-any-flag rule almost never fires. What protects the run is that a displaced flag VALUE arrives as a positional and fails the existence check, and a flag npm swallows whole only makes a run BROADER; the refusal still fires on the direct node form. The raw npm test path is unchanged. Owner: the L14 implementer, as a docs/loop/traps-tests.md entry saying exactly this - it must NOT claim the wrapper refuses flags. Instrument: none mechanical - a documented hazard. Step: the L14 wave. R6: the docs hit set is EXACT in both directions, so converting any old doc forces a one-line edit of the structure test in the same commit (the price of closing the count ratchet slack round 0 had). Owner: accepted cost; stated in R2. Instrument: the frozen docs hit set. Step: none - accepted cost. R7: the detector counts only PATH-SHAPED arguments (containing a slash, or ending .test.ts) and stops at the first bare word, which is what keeps prose after a command and unquoted multi-word -t names from counting; so a raw run of two bare substrings (npx vitest run foo bar) is not caught statically. The wrapper refuses it at runtime because each argument must exist on disk. Owner: accepted limit. Instrument: the detector unit test table (40 cases). Step: none - accepted limit. R8: docs/REGRESSION.md has no entry for gate tooling (grep -ac "closure-runner|vitest-paths|test:paths" docs/REGRESSION.md returns 0). Owner: baseline seat, recording the reproduction matrix below before hand-off. Instrument: grep -ac "test:paths" docs/REGRESSION.md greater than 0. Step: before the L14 implementer hand-off. R9: L15 walker count is stale - its row says 32, grep -rlE "readdirSync|walkTsxFiles" --include=*.test.ts src | wc -l returns 38 on 2026-09-21 - and the L14 wave adds one docs-walking structure test and one test that spawns real vitest, both in L15 class. Revision 1 enforces the L14 side: every it() in the end-to-end test and the structure test must carry an explicit timeout (30_000 in the end-to-end test) and the structure test must read its corpus once, outside any test body, checked as source text; the end-to-end tests nest vitest only over light files (src/tools/backlog/ids.test.ts, areas.test.ts). Owner: orchestrator, into the L15 row. Instrument: that grep. Step: L15 scoping. R10, THE TRAP, so no agent repeats it: vitest --json takes an OPTIONAL argument, so whatever positional argument follows it - a test file path - is silently consumed as the JSON OUTPUT PATH and OVERWRITTEN. Measured 2026-09-21: npx vitest list --filesOnly --json src/lib/no-emojis.test.ts src/does-not-exist.test.ts replaced src/lib/no-emojis.test.ts with the two bytes [] (302 lines deleted), and every gate touching that file then failed with "No test suite found in file". Restored by git checkout -- because it was unmodified at session start (had it carried uncommitted work, that restore would have destroyed it - copy first). RULE: never put a bare --json, --outputFile or any optional-value flag directly before a path; always use the joined --flag=value form (for example --outputFile.json=<absolute path outside the repo>), and never let a report path point inside the repo. Owner: the L14 implementer - the wrapper builds its own argv, with a unit test that fails if ANY element starting with - lacks =, or if the report path lies inside the repo root; plus a docs/loop/traps-tests.md entry stating the rule. The round-0 checker built the wrapper in a sandbox and confirmed it cannot recur through it. Instrument: that unit test, and git status --short after any measurement run. Step: the L14 wave. Incident disposition: orchestrator checked on 2026-09-21 - the file is identical to HEAD with 18/18 passing, A16 wave 3 committed at 08:51 after the restore and re-ran its gates, so nothing shipped on a false result. R11: the residual text first filed here at 0b96cab described round-0 R2, R3, R5, R6 and R7 (a count ratchet, a verify check blind to the wrapper, a claim that the wrapper refuses flags). DISCHARGED 2026-09-21 by this replacement, which states them as revision 1 does. REPRODUCTION (vitest 4.1.9, exact argv from Bash): a missing path, a missing path next to a directory, a quoted glob, a typo, an existing .tsx, and an existing file outside src/ (docs/DEV_LOOP.md) are ALL dropped silently with exit 0 whenever one other argument matches, and the same holds for every spelling that reaches vitest run (npm test a b, npm test -- a b, npm run test -- a b, npx vitest a b, npx vitest --run a b); any single argument that matches nothing exits 1. Cause: filterFiles in node_modules/vitest/dist/chunks/cli-api.24X8XwN1.js:10860-10871 unions all filters with .some() and never checks each one; no CLI or config option makes a filter strict (vitest run --help, 65 options, only --strictTags matches strict). In the JSON reporter numTotalTestSuites is NOT a file count (34 suites against 14 files in one run) - use testResults.length. PRIOR TEXT FOLLOWS. THE FIX IS A CHOICE and should be decided before the next verify is written, because two open items (A8, A10) are about to need one. (a) RULE that a verify is always SINGLE-PATH - simplest, runner-decidable, and it forces the oracle for a chunk into one file, which is arguably the right pressure anyway; the cost is that a chunk whose guarantees genuinely span several landed test files cannot name them all, and must lean on the wave gate instead. (b) TEACH THE RUNNER to read the "Test Files N passed (N)" line and compare N against the number of paths in the command - mechanical, but it has to parse the command. (c) REQUIRE `--reporter=json` and assert the collected file set - most precise, most work. RELATED: this is the same family as L13 - an instrument that reads clean while measuring nothing - and the same family as the repo''s standing rule that a measurement names its command, extended to say the command must be shown to MEASURE WHAT IT CLAIMS. Whoever takes this should also settle whether runVerify ever gets a caller, since a decidable verify nothing runs is still not a gate. RULED 2026-09-20: SINGLE-PATH IS NOW REPO POLICY for a row''s verify, option (a). A checker flagged that this row left the fix as an open CHOICE while three artifacts had already adopted single-path as if settled - so the precedent was being set by drift rather than by decision, which is how an unruled choice becomes an unexamined default. The reason (a) wins over (b) and (c): a single path is DECIDABLE BY THE EXISTING RUNNER - a missing sole path exits 1 with "No test files found", covered by an executing test at closure-runner.test.ts:34-41 - whereas both other options need the runner taught to parse something it does not read today. The stated cost stands and must be stated in each row: a chunk whose guarantees genuinely span several landed test files cannot name them all in verify, and leans on the wave gate instead. That is acceptable precisely BECAUSE the closure is verify AND wave gate, never verify alone. SHIPPED 2026-09-20 at c80fa68, which landed the wrapper and gate-commands.structure.test.ts (git show --stat, 2026-09-22). R5 and R10 landed in docs/loop/traps-tests.md:89-99. R1, R2, R6 and R7 are standing or accepted by design. THREE ARE NOT DISCHARGED AND HAD NO HOME (docs/backlog-reconciliation-2026-09-21.md section 2.4, cc12a8e). R4, runVerify HAS ZERO PRODUCTION CALLERS, so a verify string documents a decidable check rather than executing one. OWNER: the orchestrator, to decide whether a backlog-automation item gives it a caller or whether the function is deleted. INSTRUMENT: grep -rn runVerify src - today it hits only src/tools/backlog/closure-runner.ts and closure-runner.test.ts. STEP: the next backlog-automation item. A decidable verify that nothing runs is still not a gate, so the decision is a real one either way. R8, NO REGRESSION ENTRY FOR THE GATE TOOLING. Re-measured 2026-09-22: grep -ac "test:paths" docs/REGRESSION.md returns 0, after c80fa68 shipped - so the baseline that was owed BEFORE hand-off was never written, and the document now has no record of how the wrapper behaves. OWNER: the baseline seat. INSTRUMENT: that grep, greater than 0, plus the reproduction matrix this row already carries. STEP: the next chunk that touches src/tools/vitest-paths/ or src/tools/backlog/closure-runner.ts - it cannot be "before hand-off" any more, so it is re-owed at the next edit. R9, THE L15 WALKER COUNT, is DISCHARGED by this reconciliation: L15 now carries 39, re-measured 2026-09-22 by grep -rlE "readdirSync|walkTsxFiles" --include=*.test.ts src | wc -l. R9 itself said 38 on 2026-09-21, so the set grew by one in a day, which is why the number is recorded with its command rather than as a constant.'

- id: 'L15'
  state: 'verification'
  title: 'A whole-tree walker runs under vitest''s 5-SECOND DEFAULT timeout, so any gate in this repo can go falsely RED under concurrent load. MEASURED 2026-09-20 by a checker mid-run: `npm test` returned "Test Files 1 failed | 1070 passed (1071)" with src/source-bytes.structure.test.ts > "carries no UTF-8 BOM" reporting "Test timed out in 5000ms" at an elapsed 9588ms. Re-run in isolation the same file passes in 538ms, and two full-suite runs either side of it returned a clean 1071/21297 - so it is LOAD-DEPENDENT, not a defect in the test. vitest.config.ts sets NO testTimeout (grep for testTimeout returns nothing), so the 5000ms default applies to a test that walks every file in src/.'
  owns: []
  verify: null
  blocked_by: []
  instrument: 'Found by the A8-R scoping check while the machine was running several agents; reproduced as a NEGATIVE by the orchestrator - `npx vitest run src/source-bytes.structure.test.ts` alone is 538ms, and `npm test` immediately after was 1071/21297 green. That asymmetry IS the finding: the failure only appears when the box is loaded, which is exactly when an agent is most likely to be running a gate. Other whole-tree walkers share the exposure - `grep -rlE "readdirSync|walkTsxFiles" --include=*.test.ts src | wc -l` returns 39 files (re-measured 2026-09-22; this row said 32, and L14''s R9 said 38 on 2026-09-21, so the set is growing). NOTE THE -E: the spelling this row used to carry, grep -rln without -E, returns 0 on this tree, because basic grep treats the pipe as a literal character - the row''s own stated instrument measured nothing, and at least file-size-ceiling.structure.test.ts, no-emojis.test.ts and page-module-css-orphan-classes.test.ts walk all of src/ under the same default.'
  from: 'A8-R scoping check, 2026-09-20; reproduced as a negative the same day'
  area: 'loop-and-docs-maintenance'
  kind: 'bug'
  note: 'SHIPPED 2026-09-22 AT 2a2c147, recorded here because the new shipped-but-uncited guard flagged this row on the very next turn - its second true positive, and the first against the orchestrator own push. THE FIX: 38 of the 39 walker files get one vi.setConfig({ testTimeout: 30_000 }) line; the thirty-ninth already carried an explicit timeout on every it(). MEASURED BEFORE CHOOSING THE NUMBER, which is what makes it trustworthy: no single assertion exceeds about 400ms alone (worst 312ms), so the multi-second file totals are transform and import overhead and the real hazard is a STARVED assertion under concurrent runs, not a slow test. 30s matches the value already vetted in this repo for slow tests and still fails a hung test in 30s rather than minutes. NOTHING ANY WALKER ASSERTS WAS TOUCHED, proven by sabotage: a real emoji violation was introduced and no-emojis still caught it, naming the file and the codepoint. npm test ran TWICE with identical counts (22325), which is the actual pass condition - the same run must not give two answers. FIX (c) WAS CONSIDERED AND REJECTED WITH ITS REASON STATED: several files walk the same directory two or three times, measured at hundreds of ms against multi-second totals dominated by import overhead, so de-duplicating would restructure test scope for little gain. That remains open as the only unaddressed half of this row. WHAT IS LEFT: nothing an agent can do here - the row closes when the owner is satisfied the gates are no longer crying wolf. OBSERVED LIVE 2026-09-21: closure-runner.test.ts > runVerify against real vitest subprocesses > treats a filter matching zero tests in a real file ... as a FAILED verify went RED once, taking 38876ms, while another agent was running vitest concurrently in the same checkout - and passed 7/7 when re-run alone seconds later. A test that spawns real vitest subprocesses is load-sensitive, so it fails under exactly the concurrency this loop runs at. THE ORCHESTRATOR ALSO COMMITTED PAST THAT RED: the gate was piped through grep inside an && chain, so grep succeeding on the word FAIL let the commit proceed. The commit was docs-only and could not have caused the failure, but a gate whose failure does not stop the chain is not a gate. WHY THIS MATTERS MORE THAN A FLAKE: this repo''s whole method rests on a red gate meaning something. A load-dependent false RED trains the reader to re-run and move on, which is precisely how a REAL red gets waved through - and it lands on the structural tests, the ones that catch the defects no other instrument sees. It is also the mirror of L14: there an instrument read clean while measuring nothing; here an instrument reads RED while nothing is wrong. Both make the gate''s output uninformative, in opposite directions. THE FIX IS A CHOICE, and it should be decided before the next long wave: (a) set an explicit testTimeout in vitest.config.ts generous enough for a whole-tree walk - simplest, one line, but it slows the detection of a genuinely hung test everywhere; (b) give only the walkers a per-test timeout via the third argument to it(), so the default stays tight for unit tests - more precise, needs every walker found, and the walker set is itself a floor (39 files by the grep above, re-measured 2026-09-22); (c) make the walkers cheaper - most re-read the whole tree per assertion rather than reading once into a shared fixture. Recommend (b) plus (c) for the three worst offenders. WHOEVER TAKES THIS should also decide whether a gate that can flake belongs in a row''s verify at all, or whether the wave gate is the only honest place for a whole-tree walker. SECOND INSTANCE 2026-09-20, ON A DIFFERENT FILE - this is a CLASS, not one file, and the row should be re-read that way. The A11 implementer''s full-suite run failed on src/lib/recording-files.kinds.test.ts with the same signature: a 5000ms timeout under concurrent load, passing in 400ms (5 tests) when re-run in isolation, and the full re-run then came back clean at 1072 files / 21331 tests. So the exposure is not specific to source-bytes.structure.test.ts and is not specific to whole-tree WALKERS either - recording-files.kinds.test.ts is a migration test, which widens the suspected cause from "walks all of src/" to "any test whose cost is load-sensitive under vitest''s unconfigured 5s default". PRACTICAL CONSEQUENCE ALREADY VISIBLE: two separate agents have now had to distinguish a real red from a flake by re-running in isolation, and both did so correctly - but that is exactly the habit that lets a REAL red through, which is the whole reason this row exists. Whichever fix is chosen, an explicit testTimeout is now the minimum, because the per-walker option (b) cannot cover a file that is not a walker. CORRECTION TO THE PARAGRAPH ABOVE, 2026-09-20, and it reverses that paragraph''s conclusion. I wrote that recording-files.kinds.test.ts "is a migration test, not a whole-tree walker", that the mechanism therefore widened beyond walkers, and that fix option (b) could not cover it. ALL THREE ARE WRONG. Measured: recording-files.kinds.test.ts:19 calls fs.readdirSync over supabase/migrations and :23 readFileSync-s EVERY .sql in it - 108 files, 519K (ls supabase/migrations/*.sql | wc -l; du -sh) - and newestKindMigration() is called FOUR TIMES, once per test, so the directory is fully re-read four times per run. It is already a member of this row''s own instrument set: grep -rlE "readdirSync|walkTsxFiles" --include=*.test.ts src returns 39 files today and this is one of them. SO: L15 is still a CLASS by file count, but the MECHANISM DID NOT WIDEN - it is walkers, as originally filed - option (b) DOES cover this file, and this file is a textbook case for option (c), because it re-reads the whole directory per assertion instead of once into a shared fixture. Isolated three times: 1 file / 5 tests, 3.42s / 1.17s / 1.17s. METHOD NOTE, the third this session: I generalised from a file''s NAME ("migration test") instead of opening it. The row''s own first filing made the same error in the other direction, measuring syntax instead of behaviour. THIRD AND FOURTH INSTANCES, AND THEY CHANGE THE ROW FROM A FLAKE TO A BULK FAILURE MODE. Reported by the orchestrator on 2026-09-21 and again on 2026-09-22 and recorded here as reported - this reconciliation did NOT reproduce them: whole-tree walkers under vitest''s 5-second default timed out IN BULK under concurrent load, 25 failures in a single run, and the same files passed in seconds when run alone. Every earlier instance in this row was ONE file at a time, which is what made "re-run it in isolation" a workable habit. Twenty-five at once is not a flake a reader triages; it is a run whose output carries no information at all, and it arrives exactly when several agents are working, which is this loop''s normal operating state. That makes fix option (a) - an explicit testTimeout in vitest.config.ts - the MINIMUM rather than one of three alternatives, and it should be decided before the next long wave rather than after it. OWNER: the orchestrator, as a one-line config decision. INSTRUMENT: grep -n testTimeout vitest.config.ts, which still exits 1 today. STEP: before the next multi-agent wave.'

- id: 'L16'
  state: 'unscoped'
  title: 'The stop guard cannot tell "actionable and idle" from "actionable and BEING BUILT RIGHT NOW", so it fires every turn while an implementer is mid-flight and the orchestrator has to argue with it instead of reading it. MEASURED 2026-09-20: it blocked three consecutive turns on A11 while A11''s implementer was running, which is exactly the behaviour the guard exists to produce when the queue is idle and exactly the wrong signal when it is not. BacklogState is "actionable" | "owner" | "verification" | "unscoped" (src/tools/backlog/types.ts:19) - there is no member meaning "dispatched, in flight".'
  owns: []
  verify: null
  blocked_by: []
  instrument: 'Read from source rather than inferred: stop-guard.ts:63-75 blocks whenever selectNext returns an actionable item, with no other condition, and its own header (:10-17) records WHY it deliberately asks only a queue-local question - a "did I make progress this session" check is the B5 trap, because in a shared working tree the tree is always dirty from somebody and the check silently never fires. That reasoning is SOUND and must be preserved by any fix. The gap is not that the guard asks the wrong question; it is that the schema cannot EXPRESS the answer. Note the guard is self-limiting - escape 2 (stopHookActive) means it blocks at most once per turn - so this is friction and a misleading signal, not a trap.'
  from: 'Observed across three turns, 2026-09-20; guard source read the same day'
  area: 'loop-and-docs-maintenance'
  kind: 'chore'
  note: 'THE FIX THAT RESPECTS THE GUARD''S OWN DESIGN is a fifth state, because a state is QUEUE-LOCAL and needs no session-scoped tracking - the precise property stop-guard.ts:10-17 argues for. Proposed: "building", set when a row is dispatched to an implementer and cleared at its push, with selectNext treating it like actionable for ORDERING but not for BLOCKING. That is a real chunk, not a one-liner: it touches types.ts''s union and BACKLOG_STATES, isBacklogState, yaml-codec''s validation, render.ts''s section logic, next.ts''s selectNext, stop-guard.ts, and each of their tests, plus the header doc in docs/BACKLOG.md that enumerates the states. AN ALTERNATIVE WORTH WEIGHING FIRST, because it may be cheaper and better: do nothing to the schema and accept that the guard is a floor rather than a signal - it fires, the orchestrator confirms work is running, and the turn continues. The cost of that is real though: a signal that is routinely correct to ignore is a signal that trains you to ignore it, which is the same failure mode as L15''s flaky gate and L14''s vacuous verify. This row is the third in that family and the family is the point - THIS REPO''S WHOLE METHOD RESTS ON A GATE MEANING SOMETHING, and three separate instruments now say something other than what they appear to. WHOEVER TAKES THIS should decide the family together rather than one row at a time: L14 (an instrument reading clean while measuring nothing), L15 (one reading red while nothing is wrong), L16 (one reading block while the work is already running).'

