  title: 'An LLM call with no timeout runs under the platform default, not 60s. callLlm takes no AbortSignal, so nothing bounds a first attempt; learning-resource-links.ts:55-66 documents a 90-100s case and says the mitigation is RETRY_BUDGET_MS = 32_000 (:121), which gates RETRY decisions and does not bound the first attempt. Compounding it: src/app/page.tsx exports NO maxDuration (grep -n maxDuration src/app/page.tsx returns nothing), and this repo already records in its own comments (src/app/api/automations/run-now/route.ts:35-37, course-intel/ask/route.ts:48-59) that Next honours maxDuration for Server Actions only at the PAGE level. So these actions run under the platform default rather than the 60s Hobby figure. When the platform kills the invocation the action''s own catch never runs, so the client gets a raw transport failure instead of the {error} string the action would have returned. Reachable today via discussion-replies.ts:786 and learning-resources-generator.ts:229. Recorded because two separate G3 design passes found it and filed it nowhere.'
