- id: 'L9'
  state: 'unscoped'
  kind: 'chore'
  area: 'loop-and-docs-maintenance'
  title: 'Source-scanning tests in this repo can be satisfied by COMMENTED-OUT code, and most of them do not defend against it. Found by the N14 wave 1 verification, on the one assertion least able to afford it: the wiring canary whose entire purpose is to stop the snapshot keyboard layer dying silently. The verifier commented out window.addEventListener while leaving removeEventListener in place and NOTHING caught it - tsc, lint, 311 tests and next build all stayed green, because the canary is a regex over raw source and a regex matches text inside a comment exactly as well as live code. RE-MEASURED 2026-09-22 from the repo root: grep -rl readFileSync --include=*.test.ts src | wc -l returns 203 and grep -rl stripComments --include=*.test.ts src | wc -l returns 69. So on the order of 134 source-scanning test files have no comment defence, though not all of them need one. The 176/57 this row was filed with on 2026-09-15 is superseded: the undefended gap has WIDENED by 15 files in a week, not narrowed.'
  owns: []
  verify: null
  blocked_by: []
  instrument: 'grep -rl readFileSync --include=*.test.ts src | wc -l (203 files) and grep -rl stripComments --include=*.test.ts src | wc -l (69 files), both re-measured 2026-09-22 from the repo root. The equivalent PowerShell form is Get-ChildItem -Path src -Recurse -Include *.test.ts | Select-String -Pattern readFileSync -List; the two forms agreed at 176/57 on 2026-09-15, and only the grep form was re-run today, so a disagreement between them has not been re-checked.'
  from: 'N14 wave 1'
  note: 'THE WAVE 1 INSTANCE IS ALREADY FIXED - this row is about the other 134. UNSCOPED because a blanket sweep is the wrong shape and would be worse than nothing: stripComments is NOT always correct. Some assertions deliberately scan comments (this repo pins RULES and CITATIONS in comments, and docs/REGRESSION.md treats a stale comment as a defect, so a test asserting a comment exists is legitimate). Others assert a string is ABSENT, where stripping comments makes the test WEAKER rather than stronger. So the work is a triage, not a sweep, and the triage rule has to be authored before any file is touched. THE RULE I WOULD START FROM, for whoever scopes this: an assertion that something IS PRESENT in code - a call, a registration, a guard - must strip comments, because commented-out code satisfies it while doing nothing. An assertion that something is ABSENT must NOT strip them, because a commented-out forbidden call is still a signal worth failing on. Assertions about comments themselves are a third category and are left alone. WHERE TO LOOK FIRST: the 22 *.structure.test.ts files (find src -name "*.structure.test.ts" | wc -l, 2026-09-22 - this row said five, and docs/loop/this-repo.md says twelve in one section and seventeen in another; none of the three is right today, so re-measure rather than quoting any of them), since those are the ones this repo uses as construction guards, and any test whose name contains canary or wiring. ONE LIVE INSTANCE FIXED 2026-09-23 AT 6125260 - the row itself stays OPEN, because this closed the single armed defect the scoping pass could prove, not the class. THE DEFECT: a presence assertion searched for a needle that ALREADY APPEARED IN A DOC COMMENT in the file it checks, so it passed whether or not the real code existed. Proven by flipping only the SECOND occurrence - the actual JSX prop, leaving the comment untouched - and watching all 70 tests stay green. That is a test that had never been able to see the capability it named. THE FIX requires the attribute to sit directly after role=dialog with only whitespace between, which the comment prose cannot satisfy because it separates them with a comma. Proven in both directions: green with the real prop present, and exactly one failure - the target assertion - with it deleted, restored from a cp backup each time rather than any repo-wide git operation. NO NEW STRIPPING CALL SITE WAS ADDED, AND THAT WAS THE POINT. A42 established the same day that this repo comment-stripping idiom treats a MIME wildcard as a comment opener and eats source to the next close, so fixing L9 by copying that idiom would WIDEN A42 blast radius from 85 files toward the 205-file scanning population. A positional regex was sufficient here and invokes none of it. Any later L9 wave must hold that line: the scope records the two rows as adjacent-but-in-tension rather than one fix. WHAT REMAINS ON THIS ROW: the second verified finding, an absence guard that correctly ignores a line comment and FALSELY FIRES on the same import inside a block comment, deliberately left untouched because it is dormant and in another file; and the census itself, which the scope measured as a 113-file floor rather than the row original number, explicitly caveated as not exhaustive. The scoping pass also caught its OWN instrument returning a false clean from a slightly wrong pattern - identical to a true absence - which is the failure class this row is about and is why its numbers carry canaries.'
