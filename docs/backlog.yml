  title: 'The grading CAP became an honest bound of 40 plus a wall-clock deadline (shipped 7c409a6) - still owed: remove the class-trends-draft FLOOR (class-trends-draft.ts:18, enforced at :154) and correct its stale :86-88 comment, which still claims the floor and cap are both 5 and cites the constant''s old gemini.ts:25 location.'
