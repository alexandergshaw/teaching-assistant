  instrument: 'L4 verification, 2026-09-15, against docs/loop/leverage.md and a grep for any test asserting on the keyboard layer''s reachability'
  from: 'L4, the leverage directive'
  note: 'UNSCOPED because both halves need a decision before a file list means anything. For (a): a removal test for LIVE-LOOP is hard here for the reason the whole repo is hard - no component renders under vitest, so "usable without a mouse" cannot be asserted by rendering. The nearest buildable form is a source-order or handler-presence assertion, which is weaker than the GUARANTEED class''s import-prefix guard, and whether that is worth building is a judgement about how much a weak guard is worth. For (b): re-derivation has no natural trigger - it is not per-feature and not per-release, and a cadence nobody honours is worse than no cadence. The honest options are to re-derive when a feature needs a class STRETCHED to fit (the owner''s directive already names stretch as the signal that a class is missing) or to not schedule it at all and let the stretch signal fire naturally. The second is cheaper and probably right.'
- id: 'A3'
  state: 'unscoped'
  kind: 'feature'
  area: 'ask-ai-modal'
  title: 'Persist AskAiModal answers so a later session reads them back. The ideation pass ranked this FIRST; the check demoted it, because as scoped it is not the corpus class - it asserted the WRITE and left the read-back unguarded, and docs/loop/leverage.md:61 strikes generic persistence except where a record is "genuinely read back later, not for merely writing a row". Delete the read-back and the proposed test stays green.'
  owns: []
  verify: null
  blocked_by: []
  instrument: 'L7 ideation check, 2026-09-15: four required changes, two of which contradict the proposal''s own "no schema change" headline'
  from: 'owner request, 2026-09-15'
  note: 'UNSCOPED because two of the four changes are design decisions rather than edits. (1) THE REUSE CONTAMINATES A SHIPPED FEATURE, and this is the serious one: course-intel.ts:113 calls listAllCourseIntelAnswers(supabase, user.id) with NO course filter and NO feature filter, and :132 calls clearAllCourseIntelAnswers on the same scope. So writing AskAiModal answers into course_intel_answers makes them appear in the Course Intel tab history list and puts them under that tab Clear history button - every gate green, another feature user-facing list quietly filling with unrelated rows. The honest fix is a source discriminator column or a separate table, which is the schema change the proposal said it avoided. (2) THE ROW SHAPE DOES NOT FIT: AppendCourseIntelAnswerCommon (history.ts:415-431) requires citedStudents, omissions, assembledAt and tier: AssemblyTier, and AssemblyTier is signals or signals+text (types.ts:385) - an AskAiModal answer is neither, so the build either writes a false tier or widens a union across three files. (3) The read-back must move into a server action to be assertable at all, since nothing renders here. (4) Persisting forces a userId and therefore an auth guard onto askAboutCourseAction, which is PINNED as deliberately unguarded at action-guard-coverage.test.ts:248 in a list of 28 - a correction to my own "about twenty", measured by awk over the block plus grep -c. That test is exact-set equality, so the pin comes out in the same commit; the check rules this the CHEAP part. Also unflagged by the ideation pass: llm-content.ts imports no Supabase at all today, so this puts a service-role DB dependency on the path of a user-facing modal that currently needs none, and an insert that throws must not cost the instructor the answer they just waited for.'
