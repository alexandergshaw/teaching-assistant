- id: 'A8'
  state: 'unscoped'
  kind: 'bug'
  area: 'discussion-reply-grading'
  title: 'The discussion grader treats a student''s REPLIES as independent posts. Owner, 2026-09-15, with a screenshot of the submission view: one student''s three contributions to a Student Introductions topic are listed as three peer items - their actual introduction, plus two replies addressed to other students ("@Seth Vander Vorst", "@Luke Demmel") - under a heading that calls all of them the assignment''s submissions. A reply to a classmate is not a second introduction, and grading it as one both misreads the work and inflates whatever a rubric counts.'
  owns: []
  verify: null
