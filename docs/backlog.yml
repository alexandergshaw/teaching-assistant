  note: 'SHIPPED 2026-09-23 AT 781f0ba - the guard fifth true positive, and the third of this family fixed today after A31 (72058f9) and A34 (9eade3e). All five sites now use the gradedResults helper A31 introduced rather than a third way of asking the same question, and the four summary lines disclose the remainder WITHOUT asserting why a row is ungraded, because that reason does not hold on every reachable state. TWO THINGS THE FILING PASS GOT WRONG, both found by reading rather than by grep: the fifth site does not match the pattern the filing used at all - it names a different variable - so a census built only on that grep would have shipped four of five; and a SIXTH of the same SHAPE exists and is deliberately not fixed, a sum across every run in a batch standing in for graded, in the text saved as a draft own summary. That sixth is reported, not absorbed. WHAT REMAINS: the sixth site above needs its own disposition - it is a different quantity, so whether the fix is the same helper or a different sentence is a real question, not a copy edit. OWNER: the next chunk writing steps.grading-draft-flow.ts. INSTRUMENT: drive a batch whose runs carry never-attempted rows and assert the saved summary number against the graded total. STEP: that chunk. OWNER: the next chunk whose write set includes any of the four step files. This is agent work and needs no decision from anyone. INSTRUMENT: gradedResults (src/lib/grade/types.ts:204) for the number that means work done, and ungradedResults (:208) for the disclosure the summary should carry instead of silence, plus a test that drives a run into the bound. OBJECT: the summary line a step emits for a run holding at least one not-attempted row. DIRECTION OF FAILURE: RED when that line''s number equals run.results.length rather than gradedResults(run.results).length - which is what today''s code does, so the test must be watched failing before the fix lands. STEP: the next chunk that may write src/lib/workflows/registry/steps.grading-*.ts or src/lib/grading-draft-checklist.ts. CORRECTION TO THE DOCUMENT THAT FILED THIS, made by re-measuring rather than inheriting: docs/a31-scope.md SIBLING 2 says six sites and names src/lib/grading-draft-view.ts:24 as one of them. Re-read 2026-09-23, that line is a doc comment on DraftSection.passingGrades, which counts results that survived FILTERING and is not run.results.length - so it is not a site. Five sites are real: the four above plus grading-draft-checklist.ts:50.'
- id: 'A36'
  state: 'verification'
  kind: 'bug'
  area: 'grading-run-survival-and-disclosure'
  title: 'The zip grading surface and the GitHub grading panel SHARE ONE localStorage key for review-table edits, and inside it rows are keyed by bare student name - so an edit stored on one surface is seeded onto the other for any student whose name matches. GradingResults persists under ta-grading-results-edits:${canvasUrl} and two of its three mount sites pass an empty canvasUrl (the GitHub panel passes the literal empty string; the zip path passes a state that stays empty until a Canvas URL is typed), so both read and write the single key ta-grading-results-edits: with nothing after the colon.'
  owns: []
  verify: null
  blocked_by: []
  instrument: 'Measured 2026-09-23 from the repo root (Git Bash). THE MOUNT SITES: grep -rn "<GradingResults" src --include=*.tsx returns three mounts - src/app/components/GithubGradingPanel.tsx:852, src/app/components/GradingTab.tsx:427 and src/app/components/LiveFeedPanel.tsx:430 (the other two hits are the forwardRef definition at GradingResults.tsx:170 and a ref declaration at LiveFeedPanel.tsx:141, neither a mount). GithubGradingPanel.tsx:854 passes canvasUrl="" literally. GradingTab.tsx:429 passes its canvasUrl state, declared const [canvasUrl, setCanvasUrl] = useState("") at GradingTab.tsx:77 and set only from the Canvas URL field, so on the zip path it is empty too. THE KEY: src/app/components/grading-results/gradingResultsHelpers.ts:538-539 gradingResultsEditsKey returns ta-grading-results-edits: followed by canvasUrl; read at :617 by loadGradingResultsEdits and written at :629 by persistGradingResultsEdits. THE INNER KEY IS THE BARE STUDENT NAME: seedEdits sets seeded[result.student] at :287, and loadPersistedEdits merges the stored record over the seeded map per student at :604-605, so a stored entry for a name reaches any run containing that name on either surface.'
  from: 'docs/a31-scope.md revision 2 section 8.2 (A31-R4), commit f1a9a33, where it was MEASURED and folded into a requirement rather than entered in that document''s own residual register - section 10 lists RES-A31-1 to RES-A31-5 and this is none of them. Filed as a row 2026-09-23 after re-measuring every hop.'
  note: 'SHIPPED 2026-09-23 AT 6aa8e29 - the guard sixth true positive. THE HAZARD WAS REAL AS STATED and needed a same-named student across the two surfaces, which the fix pass established precisely rather than inheriting: three real mounts, two of which pass an empty canvasUrl, so both produced the byte-identical key and the loader merged whatever was stored there onto any student by name with no assignment or course check. THE FIX PROTECTS WHAT IS ALREADY SAVED, which was the binding constraint: the surface discriminator applies ONLY when canvasUrl is empty, so a real assignment key is byte-identical to before and nothing stored under it is stranded; values already under the shared empty key are read as a FALLBACK and never rewritten, following A31 precedent that correcting on read is safe while rewriting an instructor saved text is not. THE SIBLING SWEEP FOUND NOTHING OF THE SAME SHAPE - two producers, one shared key, an empty-able discriminator - across every ta- prefixed key builder, and the pass was honest that this was a STRUCTURAL sweep over call sites, not an exhaustive review of every key runtime values. A DEFECT THE ORCHESTRATOR CAUGHT: an older test still called the key function with the old single argument - green under vitest, red under tsc. THAT IS THE FOURTH BUILD IN A ROW where the type gate caught what the suite could not, which is worth reading as a pattern rather than four accidents. WHAT REMAINS: whether an instructor edit stored before this ship is still found is a READING CLAIM - nothing renders here, and the fallback path is proven by unit test only. OWNER: repo owner, in a real browser with existing stored edits. STEP: the owner verification pass. WHAT A31 CLOSED AND WHAT IT DID NOT, because the difference is this whole row: A31 shipped correctUngradedFeedbackSeed (src/app/components/grading-results/ungradedDisclosure.ts:158-176), which rewrites edit.strengths ONLY, and only when it equals a current or retired not-attempted message or contains "Re-run to grade". Every other field, and any text an instructor typed, is returned untouched - so a real comment, score or improvement stored for a student on the GitHub panel is still seeded onto a zip run''s row for a student of the same name, and the other way round. OWNER: the next chunk whose write set includes src/app/components/grading-results/gradingResultsHelpers.ts. It is agent work once scoped, but it is NOT a one-line fix and must not be guessed: the key needs a discriminator the surface actually holds, and the measurement in A37 shows the surface cannot today tell the zip path from the GitHub path apart, because two of the three mounts pass the identical canvasUrl. INSTRUMENT: a unit test over gradingResultsEditsKey and loadPersistedEdits. OBJECT: the RowEdit returned for a run on one surface after a different surface stored an edit under the same student name. DIRECTION OF FAILURE: RED when the stored value crosses - which is what today''s code does, so the test must be watched failing first. STEP: the next chunk that may write gradingResultsHelpers.ts, and no later than the next change to what is persisted under that key - adding a field to a key that already collides makes the collision wider. WHAT THIS CHECKOUT CANNOT SHOW: nothing here observes a real stored value - vitest is node-env and renders no component (docs/loop/this-repo.md section 6) - so the collision is traced through code and only the owner''s browser can watch it happen.'
- id: 'A37'
  state: 'unscoped'
  kind: 'feature'
  area: 'grading-run-survival-and-disclosure'
  title: 'A31''s shipped not-attempted copy names no action the instructor can take, because nothing in the grading path knows which caller produced the row: the engine cannot tell, and neither can the review-table surface. Whether a source discriminator is added at all - and if so whether as a GradingResults prop or as a GradingRunOptions member - is owed before any per-surface copy or any re-run control is designed.'
  owns: []
  verify: null
  blocked_by: ['A12', 'A13']
  instrument: 'THE ENGINE CANNOT TELL: GradingRunOptions has exactly one member, deadlineMs. Opened 2026-09-23 with sed -n 127,133p src/lib/grade/engine.ts - the interface is declared at :127 and its sole member, readonly deadlineMs?: number, is at :133. docs/a31-scope.md revision 2 section 5.3 (commit f1a9a33) cites the same fact as :126-133; :126 is the closing line of the preceding comment, so the declaration range is :127-133. THE SURFACE CANNOT TELL EITHER, and this half was re-measured 2026-09-23 from the repo root (Git Bash): grep -rn "<GradingResults" src --include=*.tsx returns three mounts - GithubGradingPanel.tsx:852, GradingTab.tsx:427 and LiveFeedPanel.tsx:430 - and two of them pass an identical canvasUrl value (GithubGradingPanel.tsx:854 passes the literal empty string; GradingTab.tsx:429 passes a state declared useState("") at GradingTab.tsx:77), so the leaf cannot distinguish the zip surface from the GitHub surface by the props it already receives.'
  from: 'docs/a31-scope.md revision 2 section 6 and section 10 RES-A31-2 and RES-A31-1 (commit f1a9a33); filed as a row 2026-09-23. docs/a31-rulings.md RULING 5 (commit 5ff763f) rejected this residual''s first owner - a design pass A12''s own note records as promised and never run - because A31 exists precisely because a residual routed that way was lost.'
  note: 'WHAT IS ACTUALLY TRUE PER CALLER, already measured so this row starts ahead: on the zip path an instructor could upload a zip holding only the ungraded students, but no in-app control builds one; on the GitHub path removing the already-graded repos from the queue works and the panel has that control; on the Canvas path there is nothing in the attended UI at all; and on every path raising GRADE_MAX_SUBMISSIONS works but is an OWNER action in the Vercel dashboard that must never appear in instructor copy (docs/a31-scope.md section 5.3). OWNER: the chunk that takes this row - a scoping seat then an implementer - which is why it is filed as a row rather than handed to a pass. BLOCKED_BY A12 AND A13 ON PURPOSE: both hold the identity question (a GradeResult carries no id and src/lib/grade/types.ts:143-149 states sourceIndex is not a re-run key), and a per-surface remedy that names a re-run before that is answered ships a second false sentence. INSTRUMENT: the mount-site grep above plus opening each mount site''s canvasUrl argument. OBJECT: the set of distinct discriminator values the three mounts can supply. DIRECTION OF FAILURE: fewer distinct values than surfaces means no per-surface copy is possible and the honest answer is to keep saying nothing. STEP: before any per-surface copy or re-run control is designed - gated on A12 and A13 being answered, never on a promised pass. ALSO CARRIED HERE, FOLDED IN RATHER THAN GIVEN ITS OWN ROW (docs/a31-scope.md section 10 RES-A31-1): ONE OF THE TWO not-attempted disclosure members has never been on the review table. deadlineMs reaches the engine only through the runDeadlineMs form field, and grep -rn "runDeadlineMs" src --include=*.ts --include=*.tsx | grep -v "\.test\." (2026-09-23) shows its only four writers are unattended workflow steps - steps.grading-cartridge.ts:105, steps.grading-draft-flow.ts:265, steps.grading-run.ts:478 and :539 - while src/app/actions/grading.ts:727-730 is the reader. No unattended run renders through GradingResults; those runs become drafts rendered by DraftedGradesTab. So the run-deadline member is copy for a state its own surface cannot reach, and submission-count-bound is the one an instructor on the review table actually sees. It is NOT dead and must not be deleted - the disclosure leaf''s switch needs both members for exhaustiveness. IT GETS NO ROW OF ITS OWN BECAUSE NOTHING IS OWED: it is a fact that narrows this row''s decision (a per-surface remedy only ever has to speak about the count bound on the review table), not work. Its OWNER is the chunk that takes this row, plus the next chunk whose write set includes src/app/actions/grading.ts, the file where an attended writer would have to appear. Its INSTRUMENT is the runDeadlineMs grep above, and its DIRECTION OF FAILURE is a fifth writer outside those four step files, which means the member has gone live on the review table. Its STEP is whichever comes first: that grep growing a writer, or this row being scoped.'
- id: 'A38'
  state: 'unscoped'
  title: 'OWNER ASKED 2026-09-23, choosing between a single-row and a subset control and answering: Single row. Grade ONE submission on the recording grader, rather than the whole table. Today handleGradeAll is the only way to grade there and it always sends every row, which is why TWO false sentences had to be deleted rather than made true - A31 said re-run to grade the rest and A34 said retry this row on its own, and neither named anything the instructor could do.'
  owns: []
  verify: null
  blocked_by: []
  instrument: 'MEASURED ACROSS A31 AND A34, 2026-09-23. The only production caller of gradeCapturedSubmissionsAction is GradingRecordingPanel.tsx:593, inside handleGradeAll, which builds its submissions list from gradingRows.rawRows - the whole table - on every press, wired to one button. A31 established the same shape on the five engine entry points: a re-run grades the same prefix, so the bound overflow has no remedy today. THE PRECEDENT ALREADY EXISTS ON A SIBLING SURFACE: Repo Grades has a per-cell Grade button, and A30 shipped its outcome classification through the same pure function the bulk path uses - so the shape to copy is known and the classifier to reuse is named.'
  from: 'Owner, 2026-09-23, answering the fork A34 raised'
  area: 'grading-run-survival-and-disclosure'
  kind: 'feature'
  note: 'WHY THIS IS THE FIRST FEATURE OF ITS FAMILY RATHER THAN A COPY EDIT: two shipped fixes this week could only DELETE a promised action, because the action did not exist. A per-row Grade turns both of those sentences back into something true - the bound overflow gets a remedy, a single failed row can be retried without paying for the whole table again, and a rubric edit can be tested on one submission. THE OWNER CHOSE SINGLE ROW OVER A SUBSET, and the reasoning is recorded so a later round does not relitigate it: single row covers every case named above at the cost of one button per row, while a subset adds selection state, a count and a grade-N-selected flow, and only pays off when the instructor wants a specific ten of forty. Subset is a legitimate later row, not this one. WHAT THE SCOPE MUST SETTLE, and must not default silently. (1) THE BOUND: does a single-row grade count against the same submission limit, and what happens when the table is already past it? The limit is read per run from the environment, so a one-row run is trivially under it - say whether that is intended or an accident to guard. (2) THE RUBRIC: the bulk path resolves one rubric for the whole run and reuses it; a single-row grade must not silently resolve a DIFFERENT rubric than the row beside it was graded against, which would make two rows on one screen incomparable. (3) COST DISCLOSURE: one row is one model call, and the instructor should be able to tell what a press will spend. (4) THE COPY THAT WAS DELETED: A31 and A34 now say what happened and offer nothing, because nothing was available. If this ships, those sentences may offer the action - but only where it is genuinely reachable, and the rule from A31 ruling 1 binds: a sentence may assert only what holds on every caller and every reachable state. (5) CONCURRENCY: A26 shipped a lock because two clicks during a rubric fetch double-graded every repo. A per-row button multiplies the click surface, so say whether the same lock covers it or whether per-row presses may interleave. NOTHING RENDERS UNDER VITEST HERE, so the button appearing and its disabled state are reading claims - route them to owner verification rather than implying coverage.'
  question: 'ANSWERED 2026-09-23: what shape the spend cap should take - a hard stop, a confirm above N, or disclosure only. The owner chose confirm above N - see docs/owner-decisions-2026-09-23.md.'
- id: 'A39'
  state: 'unscoped'
  kind: 'feature'
  area: 'grading-setup-interaction-cost'
  title: 'OWNER REPORT, 2026-09-23: grading an assignment is FASTER IN AN LLM CHAT than in this app. The owner''s chat path is paste the rubric, paste the assignment description, then paste each submission. The app is supposed to beat that and does not, which is the question docs/loop/leverage.md requires every feature to answer - answered wrong at the level of the whole product rather than one feature. This row owns the measurement and the remedy: count every interaction the app demands from rubric to graded, count the same for the chat, and close the gap.'
  owns: []
  verify: null
  blocked_by: []
  instrument: 'NOT YET MEASURED - that is the first deliverable, and it must be a COUNT, not an impression. The instrument is an interaction census of both paths for one assignment of N submissions: for the chat, the owner''s own three-paste loop, which is 2 + N pastes and no navigation; for the app, every click, field, upload, wait and page transition from a cold start to a graded table, taken from the real code rather than from a design document. The census must separate PER-ASSIGNMENT setup cost from PER-SUBMISSION cost, because they scale differently and the chat''s advantage is almost certainly in setup: a paste has no file dialog, no format requirement and no upstream state. DIRECTION OF FAILURE: any step the app requires that the chat does not, which does not buy something the chat cannot do, is a defect - and the app''s answer to a step it cannot remove is to REMEMBER it, since a rubric pasted once should never be pasted again, which is a thing a chat genuinely cannot do.'
  from: 'Owner, 2026-09-23, unprompted, while the backlog was working on grading disclosure rows: "currently to grade assignments using an llm chat, i paste/drop the rubric in, do the same for the assignment description, and then do the same for each submission - it''s much faster to use an llm chat today - plan a way to make this app faster to use than llms and then implement".'
  note: 'WHY THIS ROW OUTRANKS THE FEATURE ROWS AROUND IT: docs/loop/leverage.md asks what this app does that a chat cannot, and it is asked per feature. The owner has just answered it for the PRODUCT, and the answer is that the chat wins on the axis the instructor actually feels. A backlog full of correctness fixes on a surface that is slower than the alternative is a backlog optimising something nobody reaches. WHAT THE SCOPE MUST NOT DO: it must not assume the remedy is a faster upload. The chat''s three pastes are not fast because pasting is fast - they are fast because the chat asks for NOTHING ELSE: no course selection, no assignment selection, no format, no naming convention, no connection, no waiting on a list to load. Every one of those is a step this app may be adding before the first submission is even seen. Measure them before designing anything. THE THREE CANDIDATE SHAPES, recorded so the scope argues against something concrete rather than inventing freely. (1) PERSISTENCE: the rubric and the assignment description are pasted EVERY TIME in a chat, once per app, and never again - if the app already stores them, the defect is that reaching the stored one costs more than re-pasting. (2) ONE SURFACE: if the three inputs live on three screens, the app has turned a linear paste loop into navigation, and no amount of per-field polish recovers that. (3) NO UPSTREAM GATE: any requirement to connect an LMS, pick a course, or produce a correctly-named zip BEFORE the first grade is a cost the chat does not charge, and it is paid before the instructor has seen any value at all. WHAT WOULD MAKE THE APP GENUINELY FASTER RATHER THAN EQUALLY FAST, which is the bar - CORRECTED 2026-09-23 BY docs/a39-research.md (ecdc5f8), WHICH FALSIFIED TWO OF THIS ROW''S OWN PREMISES WITH SOURCES, so the original wording is recorded here rather than quietly replaced. IT SAID: the chat cannot remember a rubric, cannot grade while the instructor is away, cannot hand the same rubric to a second assignment, and cannot write the grade back. TWO OF THOSE ARE FALSE. A chat CAN remember a rubric - Projects carry persistent per-project instructions and uploaded knowledge, so an instructor pastes it once, ever. A chat CAN write grades back - community MCP servers document Canvas grade-writing tools against a personal access token. WHAT ACTUALLY SURVIVES, and what any leverage claim must now rest on: PROVENANCE, because a project''s instructions can be edited with no record of what was in force when a grade was produced, so a chat cannot say which rubric version produced a given grade; UNATTENDED RUNS; CONSISTENCY across a class in one invocation; and REMOVED SETUP rather than unavailable capability, which is the honest form of the LMS write-back claim. THE LOAD-BEARING CONSEQUENCE, which outranks both corrections: the chat''s advantage is in FIXED cost and this app''s is in MARGINAL cost, so the curves cross - and a design must therefore win at N = 1, because an instructor who finds the app slower on their first assignment never reaches the N where batching pays. NOTHING RENDERS UNDER VITEST HERE (docs/loop/this-repo.md section 6), so no interaction count can be verified by running the suite. The census is a READING claim traced from control to code, and the owner is the only one who can confirm the count matches what the screen asks for - route that confirmation rather than implying coverage. OWNER: a scoping seat, then an architect pass, then implementation. This row is deliberately not scoped in the same breath as being filed, because the measurement is the part that decides the shape and it has not been taken. A LIVE DEFECT FROM THIS FAMILY SHIPPED 2026-09-23 AT a9d9771, found in passing by the rubric-picture scoping pass (docs/n15-rubric-picture-scope.md), which concluded that row is a WAVE of A39 rather than an independent item. THE DEFECT: the zip grading path had NO wire-budget check at all, while the rubric text and the zip share one request body. Measured rather than assumed - grep -nE "upload-budget|checkWireBudget" src/app/actions/grading.ts exited 1 against a canary of grep -c "formData.get" returning 8, proving the instrument reached the file. THE CEILING IT ENFORCES IS NOT THE CONFIGURED ONE: serverActions.bodySizeLimit is set to 10mb and that is DEAD CEILING, because the platform caps the body at about 4.5MB and the setting cannot raise it (src/lib/upload-budget.ts:5-9), so the operative refusal threshold is 2752512 bytes - 2.625MB on disk - re-derived independently this pass as the wire budget divided by the base64 inflation factor. THE FIX REUSES checkFileWireBudget rather than computing a second threshold, because two size limits that disagree is a bug nobody sees until a real upload lands between them, and it means the MB figure in the refusal is always the number the code enforces rather than one typed into a sentence. BOTH HALVES WERE WATCHED FAILING: removing the check, and forcing it to always refuse. The second is the one that matters - a size guard that refuses work which would have succeeded is a denial of service on the app''s own users, and no other assertion would have caught it. WAVE 1 SHIPPED 2026-09-23 AT c031050 - the first production code from this row, and deliberately the N=1 case rather than the impressive one, because the design target is to win at ONE submission: an instructor who finds the app slower on their first assignment never reaches the class size where batching pays. A single dropped file now routes to the per-entry path instead of requiring an archive. THE TRAP THE WAVE WAS WRITTEN TO AVOID, and the reason classification is by EXTENSION and never by sniffing bytes: a .docx IS a zip, so a magic-number check classifies every Word document as an archive and tries to unpack it. The sabotage produced exactly that - a Corrupted zip? error against a real document - which is why the leaf was watched failing against that specific hazard shape rather than against a generic mutant. TWO SMALLER THINGS LANDED WITH IT: the refusal names what was actually uploaded rather than always saying zip, and the over-budget path is asserted to refuse WITHOUT calling the grader, so an oversized file cannot spend a model call before being rejected. THE TYPE GATE EARNED ITS PLACE AGAIN: tsc caught a bad tuple cast in the new test that the suite had accepted, the fourth time in one day that tsc caught what vitest could not - vitest here bundles a transform that erases types without reading them, so a green suite says nothing about types. SCOPE HELD AND IS STATED RATHER THAN IMPLIED: the non-Gemini provider branches are untouched and their single-file limitation is recorded as PRE-EXISTING rather than quietly absorbed, and the form still has exactly one action call site, so the pin guarding against a second submit path is unchanged. WAVE 3a-i SHIPPED 2026-09-23 AT 87fb303, under the owner branch (a) decision - tsx components with NO oracle, a cost recorded rather than dressed up: the moved markup has no executing instrument, leaving the ceiling number, the structure assertions and an owner check. SnapshotGradingPanel.tsx went 989 to 881 against a 940 gate, measured on both counters. RULING 33 WAS RIGHT AND CONSERVATIVE. Two grouped components rather than five small ones, because each extraction boundary costs its own call site: the arithmetic predicted 932-937 and the measured result is 881, while the five-small shape would have landed at 950-957 and missed. Anyone tempted to split these further should re-read that ruling first. THE EXTRACTION CROSSED MORE ANCHORS THAN THE PLAN NAMED - two anticipated, four not. Three structure tests pinned content to the panel own source that moved: the choose-files control added earlier the same day, two autofire onClick literals, and a disclosure paragraph plus a checkbox. Each was repointed per RULING 34 - an anchor an extraction crosses becomes part of its write set - preserving each check intent and reusing the file own combined-directory-source idiom rather than inventing a pattern, with new props named after the handlers they carry so the call-name pins still hold. LINT EARNED ITS PLACE as a mandatory gate here: the first run caught a real regression this wave introduced, an unused import in a new leaf, and the recorded React Compiler preserve-manual-memoization hazard on this file did not fire. ONE HONEST NOTE, carried rather than hidden: the full suite failed once with six timeouts in whole-tree scanning tests, none of them touching this directory, and passed when those four files were re-run in isolation - concurrent load under many parallel agents, not a regression. A24 WAS GATED ON THIS COMMIT (docs/a24-a39-sequencing.md RULING 32) and is unblocked by it, with its own target to be RE-DERIVED against this tree rather than adjusted from the old one.'
  question: 'ANSWERED 2026-09-23: whether to keep the written policy that the rubric is never persisted. The owner chose to drop it - see docs/owner-decisions-2026-09-23.md.'
- id: 'A40'
  state: 'unscoped'
  kind: 'bug'
  area: 'grading-setup-interaction-cost'
  title: 'CartridgeDropPanel.tsx''s rubric field has no effect on the run when it is typed after the archive is chosen, and nothing tells the instructor. The file input''s onChange (:338) fires handleFileSelect (:161-233), which uploads via saveCartridgeDrop (:210) using whatever rubricText the component held at that instant; the rubric textarea (:405-418, id=cartridge-rubric at :411) sits BELOW the file input in render order (:330-344 the file field, :405-418 the rubric field), so an instructor who reads the form top to bottom, or who edits the rubric after already picking the file, has that edit silently excluded from the upload that already fired - no error, no confirmation, no reopen. Compounding it: four of the five form fields persist across reloads via a ta-cartridge-* localStorage key with its own effect (courseLabel :38-41/:66-70, assignmentLabel :42-45, pointsPossible :46-49, lms :50-54) and the rubric is the only field that is plain useState('''') with no persisting key (:55), actively cleared after every successful upload (:220 setRubricText('''')). This is NOT the RubricInputModal.tsx non-persistence policy applied here: that policy (:29-34) is written for a different component - the recording-grader''s rubric modal, reachable only on paths F and G - and is scoped by its own acceptance criteria (docs/grading-via-recording-acceptance-criteria.md section 2, "The rubric modal", R2) to that one upload-then-extract flow; CartridgeDropPanel.tsx never imports or renders RubricInputModal and states no policy of its own for treating its rubric field differently from its four siblings.'
  owns: []
  verify: null
  blocked_by: []
  instrument: 'RE-MEASURED 2026-09-23 directly against the tree (not inherited from docs/a39-census.md''s citations); every line below opened via the Read tool on the real committed files. src/app/components/CartridgeDropPanel.tsx: file input :334-341 with onChange={handleFileSelect} at :338; handleFileSelect spans :161-233 and calls saveCartridgeDrop at :210, with setRubricText('''') only at :220, AFTER the upload call returns - so the payload sent to saveCartridgeDrop carries whatever rubricText held at invocation, and an edit made afterward cannot reach it. Rubric field :405-418 (id=cartridge-rubric at :411) sits after the file field :330-344 in one continuous JSX block, confirming render order. The four persisting fields and their own effects: courseLabel useState+localStorage.getItem at :38-41, its useEffect at :66-70; assignmentLabel :42-45; pointsPossible :46-49; lms :50-54 - the comment directly above this block, "Form state - persisted" at :37, labels exactly these four and stops before rubricText. rubricText itself is plain useState('''') at :55, with no matching localStorage key anywhere in the file (grep -n "ta-cartridge-rubric" src/app/components/CartridgeDropPanel.tsx returns no match and exits 1; grep -n "ta-cartridge" on the same file confirms the other four keys exist and none is rubric-named, so the absence grep is a real absence, not a broken pattern), and it is cleared at :220. POLICY SCOPE CHECKED, per this row''s own instruction to establish coverage before calling the omission a defect: RubricInputModal.tsx:29-34''s non-persistence statement cites "AC section 2"; opened docs/grading-via-recording-acceptance-criteria.md:71-97, whose section 2 ("The rubric modal", R2) scopes the no-linger rule to reusing the syllabus extract-without-persisting flow for THAT modal, rendered only by GradingRecordingPanel.tsx on paths F and G. grep -rn "RubricInputModal" src/app/components/CartridgeDropPanel.tsx returns no match - the component neither imports nor renders it, and carries no comment of its own invoking any non-persistence rationale, so the policy does not cover this field and the persistence gap stands as a second, separate defect alongside the ordering one.'
  from: 'docs/a39-census.md section 5.2 ("The specific defect the row predicted, found") and residual RES-A39-3 (section 8), commit 66e8104. Filed as a row 2026-09-23 per the census''s own instruction that an unfiled residual does not exist (docs/DEV_LOOP.md step 0); every citation re-opened and confirmed independently rather than inherited (see instrument).'
  note: 'NARROWER THAN RES-A39-3 ON PURPOSE. RES-A39-3 in the census bundles two findings under one id: (a) the rubric-field ordering and persistence gap this row files, and (b) that Path H''s assignment-description field is REPLACED entirely by two labels ("${courseLabel} - ${assignmentLabel}", steps.grading-cartridge.ts:95, not re-opened for this row) rather than collecting real instructor text. This row deliberately covers only (a); (b) is a distinct defect on a different mechanism (workflow-step input construction, not this component''s form) and is NOT filed here - it remains an open, unfiled finding and must not be read as closed by A40 landing. WHAT THE SCOPE MUST SETTLE: whether the fix is reordering alone (move the rubric field above the file input, or block/queue the upload until the instructor confirms), or reordering plus giving the rubric field the same ta-cartridge-* persistence its four siblings already have - and if the latter, whether that collides with RES-A39-1 (the repo-wide, still-open question of whether rubric text should ever persist to localStorage at all, given RubricInputModal.tsx''s stated sensitivity rationale for a DIFFERENT component). This row''s own re-measurement settles the logically prior question for THIS field specifically: no written policy anywhere in CartridgeDropPanel.tsx or its own comments covers rubricText''s non-persistence, so its silence reads as an oversight, not a considered exception - the scope should not assume RES-A39-1''s eventual answer and should treat this field as ungoverned until that owner decision lands. NOTHING RENDERS UNDER VITEST HERE (docs/loop/this-repo.md section 6): the render-order claim and the "nothing tells the instructor" claim are reading claims traced from source, not an observed screen. OWNER: repo owner, in a real browser, confirming the upload actually fires before the rubric field is touched and that no toast or inline message appears afterward. INSTRUMENT: load Tools > LMS > Grading, scroll to Submissions, pick a file with the rubric box still empty, then type a rubric, and check whether the resulting run reflects it. STEP: the owner verification pass, before or alongside the scoping seat that decides the fix''s shape.'
- id: 'A41'
  state: 'unscoped'
  kind: 'bug'
  area: 'grading-run-survival-and-disclosure'
  title: 'A zip whose filenames do not follow the four-part studentname_date_time_filename convention silently collapses multiple students into ONE row, with no error and no visible signal beyond a graded table shorter than the class. matchStudentFileConvention (grade/utils.ts:87-107) requires at least four underscore-separated parts (:95-97); when a filename does not match - including the common case of a generic, non-underscored title such as "essay.docx" or "Homework Final.docx" - parseSubmissionFileName (:176-260) falls through, in order, past a per-file model inference and a base-name model guess (both unused at the real call site) and a zip-crossing-chain check (empty on a flat zip), all the way to leafStemFallback (:121-126), which takes the LEADING ALPHANUMERIC RUN of the filename stem as the student identity. groupSubmissionsByStudent (:290-316) then merges every file whose computed key collides into one entry''s file list with no distinct-identity safeguard, so two or more different students whose files happen to share that leading run - which does not require identical names, only a shared prefix before the first non-alphanumeric character - are graded and returned as a single row. GradingTab.tsx:240 is the UI''s entire statement of the input requirement: "Upload a zip archive that contains the student submissions," naming no naming convention at all.'
  owns: []
  verify: null
  blocked_by: []
  instrument: 'RE-MEASURED 2026-09-23 directly against the tree; every claim below opened via the Read tool, and the collapsing behaviour was additionally executed with node -e against the real regex and function logic copied verbatim from source (not simulated from memory). src/lib/grade/utils.ts: matchStudentFileConvention at :87-107, the four-part requirement at :90 (parts = name.split("_")) and :95-97 (if (parts.length < 4) return null); leafStemFallback at :121-126, regex /^([A-Za-z0-9]+)/ against the extension-stripped stem at :123. THE CENSUS''S OWN WORKED EXAMPLE DOES NOT HOLD AND IS CORRECTED HERE: docs/a39-census.md section 4 (P7) and the brief that filed this row both state that "essay1.docx, essay2.docx, essay3.docx" collapses into one student called "essay". Running the extracted leafStemFallback logic in node shows each of essay1.docx/essay2.docx/essay3.docx produces a DISTINCT key (essay1, essay2, essay3), because the trailing digit is itself alphanumeric and the regex captures the whole leading run, not just the letters - so that specific example does NOT collapse and must not be cited as a demonstrated failure. The regex DOES collapse files that share an identical leading run up to the first non-alphanumeric character: the same node run confirms "Homework Final.docx" and "Homework Draft.docx" both key to "homework", and "Essay Submission.pdf"/"Essay Reflection.pdf" both key to "essay" - two differently-named, plausible student submissions producing the same key, which is the shape that actually collapses. THE FALLTHROUGH IS REACHED IN PRACTICE, not merely possible in theory: parseSubmissionFileName''s priority order, read at :176-260 (step 1 byRaw :188-198, step 2 leaf-convention :200-208, step 3 zip-crossing-chain :210-226, step 4 byBase :228-239, step 5 innermost-crossing stem :241-251 only when zipChain is non-empty, step 6 leafStemFallback :253-259), and the real production call site, src/lib/grade/extraction.ts:138, calls groupSubmissionsByStudent(submissions, undefined, rawData, zipParents) with inferredLookup hard-coded to undefined - confirmed by grep -n "groupSubmissionsByStudent" src/lib/grade/extraction.ts, one call, second argument literally "undefined" - so steps 1 and 4 (the only ones inferredLookup feeds) never fire on this path, and a flat zip (no nested per-student zip, so zipParents[filePath] is empty or absent) skips step 3 and step 5 too, landing on step 6 for every non-conforming file. groupSubmissionsByStudent''s merge at :301-316 keys a Map by inferred.key with no check that colliding keys came from the same student (:304-315: grouped.get(inferred.key), and on a hit the file is simply pushed onto existing.files at :315) - confirmed no dedup or disambiguation logic exists between :301 and :316. GradingTab.tsx:240 quoted verbatim, read directly: "Upload a zip archive that contains the student submissions." - no mention of any naming convention, checked against the surrounding :228-242 block for any nearby requirement text; none exists.'
  from: 'docs/a39-census.md section 4, prerequisite P7 (the paragraph beginning "P7 is the one that deserves its own paragraph") and residual RES-A39-4 (section 8), commit 66e8104. Filed as a row 2026-09-23 per the census''s own instruction that an unfiled residual does not exist (docs/DEV_LOOP.md step 0); the census''s own illustrative filenames were re-run against the real source and found not to demonstrate the collapse - see instrument for the corrected example.'
  note: 'THE MORE SERIOUS OF THE TWO ROWS FILED FROM THIS CENSUS PASS: this defect silently produces a WRONG result (fewer students than submitted, one student''s grade and feedback built from a mix of different people''s work) rather than no result, and nothing in the UI or the returned table distinguishes a correctly-parsed roster from a collapsed one - the only symptom is a table shorter than the class, which an instructor grading forty submissions has no reliable way to notice. THE HONEST REMEDY SPACE, stated without choosing among them because that choice belongs to the architect pass, not this row: (1) REFUSE the zip outright when a meaningful fraction of entries fail the naming convention, forcing the instructor to fix names or re-export before any grade is produced - simplest, but rejects real zips that would have parsed fine except for a few stray files. (2) DISCLOSE the parse result before grading - show the instructor the student list groupSubmissionsByStudent actually produced, with a count, before any model call is spent, so a collapsed roster is caught at zero cost instead of after N grades are already written. (3) SUPPORT the simple convention outright - detect the common real-world shape (one file per student, filename is the student''s own name or a bare Canvas-export name with no assignment-convention suffix) as a first-class case rather than routing it through a fallback built for a different failure mode. NONE OF THESE IS PREFERRED HERE. WHAT THE SCOPE MUST ALSO SETTLE: this defect is shared by path A (Upload ZIP) and path H (cartridge drop) - both call the same groupSubmissionsByStudent through extraction.ts:138 - so a remedy scoped to only one UI surface leaves the other exposed; the scope must name both call sites or say explicitly why only one is being fixed. ANY USER-FACING SENTENCE the remedy adds may assert only what holds on every caller and every reachable state (A31 ruling 1, carried forward by A38''s note) - in particular, a disclosure message must not claim a student count is authoritative when inferredLookup is unpopulated at the only real call site (see instrument), since that is exactly the condition under which the fallback silently fires. NOT IN SCOPE FOR THIS ROW: the A14 rulings'' own known-open item (a sanitized-name collision inside the CONVENTION-MATCHING path itself, utils.ts:76-85, "a known-open item again, not fixed here") is a related but textually distinct defect in a different branch of the same function and is not re-litigated or re-filed by A41. NOTHING RENDERS UNDER VITEST HERE (docs/loop/this-repo.md section 6): the collapse itself was confirmed by executing the real fallback logic directly in node against copied source, which is stronger than a pure reading claim but still short of observing the actual grading UI; whether the returned table''s row count is what an instructor actually sees on screen remains a reading claim like the rest of this census and is not settled by this row. OWNER: the chunk whose write set includes grade/utils.ts or GradingTab.tsx. INSTRUMENT: a unit test over groupSubmissionsByStudent (or parseSubmissionFileName directly) asserting the returned entry count for a fixture of three files sharing a leading alphanumeric run but no other content in common - RES-A39-4''s own instrument, carried forward, corrected to use a real colliding fixture rather than the census''s non-colliding one. DIRECTION OF FAILURE: RED when three distinct-content files collapse to fewer than three returned entries, which is today''s measured behaviour. STEP: the first A39-family implementation chunk that touches ingestion, no later than the next change to groupSubmissionsByStudent or matchStudentFileConvention.'
- id: 'A42'
  state: 'unscoped'
  kind: 'bug'
  area: 'loop-and-docs-maintenance'
  title: 'The stripComments helper duplicated across ~85 source-text test files treats a literal /* inside a MIME-wildcard accept value (image/*, video/*, audio/*) as a block-comment open, silently deleting real source up to the next unrelated */ before any assertion runs on the stripped text'
  owns: []
  verify: null
  blocked_by: []
  instrument: 'CENSUS, via the Grep tool (ripgrep-backed) and git-bash grep -F, never grep -P which docs/loop/this-repo.md section 5 documents as reporting false "clean" results on a real pattern: the shared middle-and-close of every /\*[\s\S]*?\*\/ variant, the literal text [\s\S]*?\*\/, appears in 85 files under src/, 102 occurrences total (Grep tool, pattern matching that literal substring, path src, no glob). Restricted to *.test.ts (grep -rlF ''[\s\S]*?\*\/'' src --include=*.test.ts): 84 files, 101 occurrences; the one file outside that glob is src/app/components/ui/modalAdoptionScan.ts:146 (export function stripComments), imported by two test files - src/app/components/ui/modalAdoptionWiring.attributes.test.ts:20 (import { stripComments, ... } from "./modalAdoptionScan") and src/app/components/ui/modalAdoption.wiring.test.ts:47 (the closing line of the same import). 64 of the 85 files define their OWN local "function stripComments(" (Grep tool, pattern function stripComments\(, path src: 64 files, 64 occurrences) - confirming this is overwhelmingly copy-pasted per file rather than shared, exactly as the repo''s own comment states: src/app/components/grading-recording/GradingRecordingPanel.wiring.test.ts:38, "stripComments is DUPLICATED from submission-kind-callsites.structure.test.ts rather than imported - this repo forbids importing a helper from another *.test.ts file". ABSENCE CANARY: the same Grep tool searching src/ for a nonexistent placeholder string (stripCommentsZZCANARYZZNONEXISTENT) returns "No files found", proving the tool used here actually distinguishes presence from absence, unlike grep -P. TRIGGER FILES CONFIRMED IN THE REPO TODAY (grep for image/\*|video/\*|audio/\*|text/\*|application/\*|\*/\* over src/, hand-filtered to drop the pervasive false-positive prose citing the vitest include glob src/**/*.test.ts): nine real, non-comment accept= MIME-wildcard attributes - src/app/account/voice-style/page.tsx:362 (audio/*), src/app/components/caption-studio/VideoSource.tsx:74 (video/*), src/app/components/course-planning/SyllabusMode.tsx:351 (image/*), src/app/components/courses/AddCourseForm.tsx:375 (image/*), src/app/components/courses/TextbookPhotoModal.tsx:358 (image/*,application/pdf), src/app/components/recording/SourceDevicesPanel.tsx:449 (image/*), src/app/components/recording/SpeedPanel.tsx:101 (video/*), src/app/components/slide-studio/VideoModeSection.tsx:80 (video/*), src/app/components/slide-studio/VoiceCloneSection.tsx:111 (audio/*,video/webm,video/mp4). WHICH TESTS ACTUALLY READ THOSE FILES TODAY: two of the 85 are directory-walkers whose scan roots include several of the nine - src/app/components/ui/buttonVariant.test.ts''s sectionFourTsxFiles() (:96-105, SECTION_4_DIRS includes recording/, slide-studio/, caption-studio/) and src/app/components/ui/confirmArmButtons.test.ts''s walkTsxFiles(path.join(process.cwd(), "src/app/components")) at :199 (recursive over the whole tree, files.length > 50 asserted at :200) - so it walks all nine. Re-ran each test''s own stripping logic with node against the real files: in SpeedPanel.tsx the accept="video/*" at :101 opens a match the regex does not close until :241 (measured: first /* at char 4715 = line 101, next */ at char 10768 = line 241) - 140 real lines deleted before buttonVariant.test.ts counts anything over that file. VideoModeSection.tsx''s accept="video/*" at :80 has NO later */ anywhere in the file (checked to end of file), so that match never closes and nothing is actually deleted there today. VoiceCloneSection.tsx :111 eats only 2 lines, a JSX-comment boundary at :87-89. Checked whether any of this changes what buttonVariant.test.ts (:215, :233) or confirmArmButtons.test.ts (:198-207) currently assert: raw-vs-stripped counts of variant="contained" and of the ? "contained" : "outlined" ternary literal are IDENTICAL for every one of SpeedPanel.tsx, SourceDevicesPanel.tsx, VideoModeSection.tsx, VoiceCloneSection.tsx and VideoSource.tsx (measured with node, replaying buttonVariant.test.ts''s own stripComments verbatim) - SpeedPanel.tsx''s one real "contained" site is at :280, outside the erased :101-241 span, so the FROZEN_PRIMARY_SITES value of 1 for that file (buttonVariant.test.ts:178) is undisturbed, and no ternary literal exists in any of the nine files raw, so the zero-ternary canary (buttonVariant.test.ts:212-219) is also undisturbed. For confirmArmButtons.test.ts''s repo-wide onBlur-beside-consequence scan: onBlur appears in only 20 .tsx files repo-wide (Grep tool, path src/app/components, glob *.tsx) and NONE of the nine trigger files is among them, so there is nothing in those nine for the corruption to hide from that assertion today either.'
  from: 'Found in passing while building 837f2e3 (fix(a11y): the snapshot image intake was drag-only, failing SC 2.5.7). That commit''s own message names the trap directly: "the test family''s comment stripper treats a literal image/* in source as the start of a block comment and eats everything to the next unrelated */, corrupting the stripped source so an assertion silently matches the WRONG element" - the concrete case was SnapshotGradingPanel.tsx''s file-input onChange assertion grabbing a different TextField''s onChange instead; the commit worked around it by naming concrete MIME types instead of image/* in that one file, which is why SnapshotGradingPanel.tsx is not among today''s nine live trigger files. Filed as a row 2026-09-23 per docs/DEV_LOOP.md step 0, a defect that lives only in a commit message does not exist.'
  note: 'PRIORITY: the blast radius is wide (85 files, 64 independently duplicated local copies of the same vulnerable regex) but, measured directly rather than assumed, NOT CURRENTLY LIVE in the sense of producing a wrong pass or fail today - every currently-asserted number checked (buttonVariant.test.ts''s two frozen canaries, confirmArmButtons.test.ts''s repo-wide onBlur scan) comes out identical whether the corruption happens or not, because the corrupted spans in the nine known trigger files happen not to contain anything those specific assertions count. This is a TRAP, not yet a sprung one, for those two tests - but 837f2e3 is direct proof the same class of corruption already produced exactly this wrong-match failure once, on a different file and a different assertion, before being noticed by a human reading the diff rather than by any gate. THIS ROW DOES NOT CLAIM TO HAVE CHECKED ALL 85 DEPENDENTS: only the two directory-walking tests (buttonVariant.test.ts, confirmArmButtons.test.ts) whose scan roots are known to include one or more of the nine trigger files were traced end to end; the remaining files each target a single named SOURCE_PATH outside those roots and were not individually cross-referenced against a repo-wide /*-outside-comment sweep - that full sweep is the fix wave''s own first step, not this filing pass''s. REMEDY SPACE, not chosen here: (1) a stricter stripper that tracks quote/attribute context so a /* inside a string or JSX attribute value is never treated as a comment opener; (2) a different anchoring idiom for the assertions that currently lean on stripComments - index-of bounded slices or a minimal tokenizer scoped to a known-safe region, instead of deleting comments globally first and searching blind afterward; (3) an implausibility guard that refuses (throws) when a single non-greedy block-comment match spans more than some threshold of lines or of the file, on the theory that no real block comment this repo''s own style ever writes spans 140 lines, so an oversized match is itself the signal that /* was not a real comment open. THE CONSTRAINT THAT MATTERS: this exact regex is independently duplicated in at least 64 named functions across 85 files rather than shared through one helper - GradingRecordingPanel.wiring.test.ts:38 documents that this duplication is deliberate house style (no cross-test-file imports) - plus one shared production module (modalAdoptionScan.ts) imported by two more test files, so any fix, even applied to only one copy, changes what THAT copy''s dependents see, and a repo-wide fix changes it for all 85. This repo''s own rule that a refactor which silently changes output is the classic defect applies directly: whichever remedy is chosen needs a FROZEN ORACLE - stripComments''s output on a representative set of real files, captured before the change and diffed deliberately against the after, not discovered as a side effect of some unrelated test going red - to prove the fix removes only the false corruption and changes no stripping decision the 85 dependents currently rely on. OWNER: the scope or architect pass that picks among (1)-(3) and decides whether to fix the shared module, the 64 duplicates, or both. INSTRUMENT: none yet - the fix''s own test-author pass owns building the frozen oracle described above. STEP: the next chunk that touches src/app/components/ui/modalAdoptionScan.ts or adds a new *.structure.test.ts / *.wiring.test.ts using this idiom, whichever comes first, so the trap does not silently spread to more duplicates in the meantime.'
