  instrument: 'git show 7c409a6 --stat, 2026-09-15, confirms the cap/deadline half shipped (engine.ts deadlineMs at :187/:207-210, GradeResult -> GradedResult | UngradedResult union in types.ts). Direct read, 2026-09-15: gemini.ts:32 (DEFAULT_MAX_SUBMISSIONS = 40), gemini.ts:129-133 (getGeminiMaxSubmissions), class-trends-draft.ts:18 (DEFAULT_CLASS_TRENDS_DRAFT_FLOOR = 5, unremoved), :86-88 (stale comment), :154 (floor still enforced), class-trends.ts:124-196 (AreaTrend/classifyDirection, unchanged and still accurate).'
  from: 'N13, owner decision 1, 2026-09-15'
  note: 'THE FLOOR is NEXT_PUBLIC_CLASS_TRENDS_DRAFT_FLOOR - layer C refuses to draft below 5 graded submissions. Straight removal, no replacement. RECORD THAT IT WAS DELIBERATE: the floor existed because the draft is addressed to STUDENTS rather than to the instructor who did the grading, so a message written off two submissions goes out to a whole class. The recommendation on file was keep-the-floor-raise-the-cap; the owner overrode it knowingly and that is the owner''s call to make. THE CAP is DEFAULT_MAX_SUBMISSIONS (src/lib/gemini.ts:25), read via GRADE_MAX_SUBMISSIONS (:124-125) and applied by .slice(0, maxSubmissions) at src/lib/grade/engine.ts:126. DO NOT SIMPLY DELETE IT, and this is the whole reason this row exists separately: the cap is not only a cost knob, it is also what keeps a grading run inside the platform function limit. This deploys to Vercel Hobby, where maxDuration is capped at 60s. Delete the constant with no replacement bound and a large class times out MID-RUN - strictly worse for the instructor than a capped run that completes, because a timeout loses the work already done. The scoping must measure the real constraint (the route''s maxDuration, the per-submission latency assumptions, any existing batching) and propose what replaces it: a much higher explicit ceiling, batching, a resumable run, or something better. Obeying the instruction literally here would ship the failure, so the deliverable is the bound, not the deletion. OWNER SET THE BOUND 2026-09-15, so it is no longer a question to escalate. Verbatim, in two messages: "we need to raise that to at least 20", then "raise it to 40 - we''ll rarely go that high". THE CAP BECOMES 40, and the second half of that sentence is the part that changes the design rather than just the number: 40 is intended as a RARELY-TOUCHED SANITY CEILING, not as the working limit. THE CONSEQUENCE THE OWNER HAS ACCEPTED, stated so nobody re-litigates it: the count bound is no longer what keeps a run inside the platform invocation ceiling. That protection has been deliberately traded away, so src/lib/visualizer/selection-coverage.ts:62-100''s written rule - that the count bound IS the actual defense against a platform kill - cannot simply be ported to this loop. Whatever ships must either argue why the grading loop differs or supply a different survival mechanism. THE ARITHMETIC THAT REFRAMES THE ITEM, modelled and NOT measured, flagged as such because the real per-call latency is not measurable in this checkout: engine.ts:207-209 applies getGeminiInterRequestDelayMs between entries (DEFAULT_INTER_REQUEST_DELAY_MS = 1200, gemini.ts:60) and this repo''s own written model in selection-coverage.ts puts an LLM call at roughly 5s, so a student costs on the order of 6.2s and a run of TEN is already near a 60s grant. If that holds, the cap of 5 has been MASKING a pre-existing timeout, and raising it does not create the problem so much as expose it - which also means the owner''s own working case, a class of 9 to 12, may already be at the ceiling today. That reframing, not the constant, is the item. SO THE DELIVERABLE IS NOW SURVIVAL, not sizing: incremental persistence so finished students are durable before an invocation dies, a Route Handler that declares its own ceiling, or chunked/resumable execution across invocations - with the not-attempted disclosure as the REPORTING half rather than the protection half. IMMEDIATE LEVER, owner-only and requiring no deploy: GRADE_MAX_SUBMISSIONS is read at runtime from the environment (gemini.ts:122-127), so setting it to 40 in the Vercel dashboard raises the bound in production now; DEFAULT_MAX_SUBMISSIONS = 5 in code is only the fallback, and parsePositiveInt silently falls back to it on a malformed or non-positive value, so a typo in the dashboard reverts to five without complaint. Raising the constant in code is still owed, because the fallback should not contradict the owner''s decision. NOTE THE COLLISION this creates, already documented at class-trends-draft.ts:87-88: the class-trends draft floor and the cap are both 5 today and that file''s comments reason about them being equal. At 40 they are not, and those comments go stale in the same change that deletes the floor. DISPOSAL ROUND 2026-09-15. The round-2 artifact came back NOT READY (4 blockers, 7 majors), and under iteration-caps.md this artifact is now AT ITS DISPOSAL ROUND on two independent grounds: cap 2, because round 2 was its second revision, and cap 1, because owns-list-caller-misclassification has now failed TWICE and the second attempt strengthened the same mechanism - a longer, better-cited owns list - instead of changing kind. No further revision of the owns list by a design seat is legal. THE FOUR DISPOSALS. (a) RELOCATE, the owns list: it moves to a step that DERIVES it with its own instrument rather than authoring it again. RECEIVER: the implementer wave that opens the build. OBLIGATION: run the enumeration itself over gradeAction, getGeminiMaxSubmissions, composeClassTrendsDraft and below-floor, treat every list in these artifacts as a FLOOR and never as the set, and open every call site rather than describing it. The instrument is grep plus opening the file; the step is the wave gate, which already diffs git status --short against the assignment. WHAT THE SECOND FAILURE ACTUALLY MISSED, recorded so the derivation starts ahead rather than level: GradingTab.tsx is NOT a caller of the grading path (it imports only fetchCanvasMetaAction and a type), while the real callers are src/app/page.tsx:63 via useActionState, and three workflow registry steps - steps.grading-run.ts:473,533, steps.grading-draft-flow.ts:262 and steps.grading-cartridge.ts:100 - none of which appeared in either round. src/lib/grade/engine.test.ts and src/lib/grade/class-trends.test.ts are also owed. (b) REDUCE, two questions to the owner, batched and not gating. (c) RESIDUAL, the owner-blocked measurements, escalated rather than parked with a future implementer: the REAL platform grant for the current Server-Action path, and ONE timed grading run against a live key. Until both exist every per-student latency figure in these artifacts is modelled, the chunk size is a starting point and must be labelled one, and at this repo''s own 25 percent margin standard that starting point is SEVEN, not eight. (d) DELETE: nothing. ORCHESTRATOR RULINGS, mine, because the check''s stopping point was rulings and re-dispatching the author on them is forbidden. RULING 1, SCOPE: N13a COVERS THE UNATTENDED CALLERS, and this is the finding that would have shipped a silent regression. getGeminiMaxSubmissions is read ONCE, at engine.ts:122, on the shared path - so raising the default to 40 raises it for EVERY caller, including three workflow registry steps that run server-side inside a cron tick whose route declares maxDuration = 60 (src/app/api/cron/run-schedules/route.ts:56). Built as round 2 specified - client-driven chunking - the browser path would be safe and the unattended path would attempt up to 40 students inside a 60s tick and lose the entire run, with lint, tsc, next build and all 94 tests green, because nothing here renders a component or runs a tick. A mechanism that only exists in the browser cannot bound a knob that is read on the server. RULING 2, REINSTATE THE WALL-CLOCK DEADLINE. Round 2 withdrew it on the ground that the owner''s decision "superseded" it; that is a non-sequitur - the owner settled a COUNT, which says nothing about whether the loop should refuse to START entry N+1 past a deadline. The withdrawal removed the only proposed mechanism that works inside a single server-side invocation, which is exactly what ruling 1 requires. It is also already shipped in this tree and was never cited: cron/run-schedules/route.ts:123-126 computes runDeadlineMs = now + 50_000 and stops starting new institutions past it so the rest resume next tick, threaded as deadlineMs at :372 and :515. That is the precedent to port. RULING 3, THE NOT-ATTEMPTED ROW IS A SEAM, not a detail, and it goes to the TOP TIER rather than to a design seat: A12 and N13b are both blocked on its exact shape, three downstream consumers read it (class-trends.ts, gradeReposAction''s reporting arrays, grading.ts''s Canvas post), and round 2 both demoted it to "the reporting half" and left it unspecified while asserting elsewhere that it folds into unscoredCount. Those two cannot both hold. THE CONSTRAINT THAT SHAPE MUST SATISFY, discovered by the check and load-bearing: a not-attempted row must be appended to results BEFORE engine.ts:226''s canonical-column reconciliation. Appended after, it reproduces the exact 4-of-5 coverage defect recorded against N13b - N13a''s own feature resurrecting the defect this pass spent a page retiring. AND IT MUST NOT BE POSTABLE TO CANVAS: see A13, filed separately, where a FAILURE row already reaches the student today. ONE RECORDED DEFECT IS RETIRED, with a caveat. The check settled by reading what round 2 could only call likely: engine.ts:226-247 gives every result an entry for every canonical area, blank-filling at :245, and class-trends.ts:274 counts every entry present, so a failure row leaves resultsWithArea equal to totalResults and the clause DOES render. The "executed, not reasoned" 4-of-5 example in N13b''s note does NOT reproduce against the real engine and was almost certainly executed on a hand-built fixture whose failure row never passed through reconciliation - this repo''s own recorded failure mode. N13b''s ruling that clauses disclose their own denominator still stands on its own merits; only the worked example is withdrawn. The confirming test, when written, must build the row THROUGH gradeStudentEntries, or it will re-confirm the fixture instead of the code. ALSO CORRECTED: round 2 misquoted its own margin anchor - selection-coverage.ts:68 says roughly 15s and 25 percent, not 13s and 22 - and labelled the Server-Action grant "confirmed" when selection-coverage.ts:51-58 says in terms that it was never independently verified. SEAM DISPOSAL AND SIX RULINGS 2026-09-15. The not-attempted row seam (scratchpad/not-attempted-seam.md) reached its disposal round: round 2 was its second revision, and its round-2 check returned 6 blockers over FOUR classes, EVERY ONE A REPEAT. Under iteration-caps.md cap 1 a repeat goes to disposal immediately and a third attempt would be strengthening the same mechanism, which is forbidden; under cap 2 round 3 produces only dispositions. THE AUTHOR IS NOT RE-DISPATCHED. The check also established that with these six rulings applied THE SEAM IS SHIPPABLE: its type shape compiled clean over ten requirements the author never probed, its door table was independently re-derived and matches at all 8 call sites, its consumer enumeration was accurate at every line opened, and its reconciliation against the landed checkRowPostability (6 of 8 doors covered, the 2 CSV doors left as the seam''s own residual) is correct. RULING 1, THE FAILURE MESSAGE: ungraded.message CARRIES the "This submission could not be graded: " prefix. The artifact defined it two incompatible ways - section 2''s field doc said the verbatim thrown message, section 5 said the prefix is its opening - and an implementer pasting section 2''s code block would have picked the one that silently changes today''s string and falsifies the artifact''s own byte-identity claim. Carrying the prefix preserves engine.test.ts:108 and today''s displayed text. CONSEQUENCE THAT MUST SHIP WITH IT, closing the artifact''s major 6: GRADING_FAILURE_PREFIX currently lives at src/app/components/grading-recording/grading-rows.ts:214, and src/lib/grade/engine.ts MUST NOT import from a component directory - that is the layer inversion the seam itself forbids three paragraphs earlier. MOVE the constant into src/lib/grade/ and have grading-rows.ts import it from there. Do not duplicate the literal; two copies of a user-visible prefix is exactly the drift this repo keeps re-discovering. RULING 2, THE CSV DOORS: the refusal at the gradebook-CSV doors is isUngraded(row) AND checkRowPostability(...).postable === false - NOT isUngraded alone. The artifact mandated an unconditional isUngraded refusal, which contradicts the shipped A13 guard and the owner''s own decision: steps.grading-singles.ts:592 admits a row only when a reviewer typed a real numeric grade, which is precisely the RESCUED row that A13 clause (c) deliberately lets through. Unconditional refusal would post a rescued row to Canvas while silently vanishing the same row from the gradebook CSV built from the same approved set - a divergence no gate here can see. RULING 3, THE REVIEW INSTRUCTION IS BY PROPERTY, NOT BY SPELLING: NO CONSTRUCTION MAY PRODUCE AN OBJECT CARRYING BOTH userId AND ungraded. The artifact told reviewers to look for `as GradeResult`, and the check compiled two CHEAPER escapes that carry no cast and no assertion for a grep to find - Object.assign onto a typed row, and assignment through a loosely-typed alias - both of which are the natural shape in parseGradeResult and coerceGradeResult, which build field by field from untrusted input. A spelling-based review instruction cannot catch them. The sanctioned repairs are a branch or a conditional spread. RULING 4: add fillGradebookCsv to the wiring oracle''s builder-name seed. The door TABLE is complete, but the durable instrument was seeded with only postCanvasGradesAction, buildCanvasGradebookCsv and buildMoodleGradebookCsv, and fillGradebookCsv (steps.grading-singles.ts:660, writing scores into a real gradebook file at gradebook-csv.ts:463) would let a future module reach a gradebook through a door the oracle cannot see. RULING 5, AND THIS IS THE SILENT-GREEN ONE: the factory carries codeExecution, gradedRepo and gradedRef UNCHANGED, and the oracle asserts all three. The artifact''s field table omitted them while its prose claimed byte-identity with today''s failure row, so built literally a failed repo grade would lose the repo and commit that types.ts:154-159 exists to record - the evidence for defending a grade to a student - and lose the sandbox run. Nothing here would catch it: the allowlist coverage test uses a hand-built sentinel rather than the engine, engine.test.ts asserts none of the three, and no component renders. RULING 6, THE SENTINEL GUARANTEE: every field on every sentinel EXCEPT that member''s own excluded key (a two-element exclusion set) - NOT the artifact''s proposed SENTINELS.some(...), which is strictly WEAKER than the check it replaces while being described as stronger. Under .some, a future optional field given a value on the graded sentinel and omitted from the ungraded one passes, and the ungraded sentinel''s three round-trips then preserve it trivially - verbatim the defect that check''s own comment says it exists to catch. ALSO CARRIED FORWARD, from the check and not disputed: engine.ts:162-171 does NOT compile under the union and the fix is narrowing gradeSubmission to Promise<GradedResult>; "unpostable by construction" is honestly "closes the one hole present today"; two producers were missing from the table (embedded-grader/index.ts:196-211 and discussion.ts:471-486, hidden from a grep requiring "resubmitNotice:"); submissionTruncated has NO production rule on a not-attempted row and cannot be "carried from the entry" because StudentSubmissionEntry has no such field and truncateSubmission never runs for an unattempted one; report.ungraded needs a stated production rule; and the O1/O4/O6 oracles must pin a rubric that actually parses criteria or they pass vacuously. N13b IS SETTLED IN THE SEAM''S FAVOUR: the empty-canonical path is real and reachable, a not-attempted row with an empty rubricAreas raises totalResults without raising resultsWithArea, so the class-trends exclusion is REQUIRED rather than optional - the author was right to decline to agree with the orchestrator''s paraphrase, and this is recorded as an instance of a seat correctly refusing a handed-down claim. REMEASURED 2026-09-15 - THE FLOOR HALF OF THIS ROW''S OWN TITLE IS STILL OPEN. class-trends-draft.ts was not touched by 7c409a6 (absent from its file list) - DEFAULT_CLASS_TRENDS_DRAFT_FLOOR = 5 still stands at :18 and is still enforced at :154 exactly as before. The header comment at :86-88 is now wrong on two counts, not one: it claims the floor and GRADE_MAX_SUBMISSIONS "are both 5" (the cap is 40 now) and cites "gemini.ts:25" as the cap''s location (the constant is at gemini.ts:32; :25 is now an unrelated comment). Whoever removes the floor must also fix or delete this comment rather than leave a citation that points at the wrong constant. The row''s instrument line numbers for gemini.ts and engine.ts are themselves now stale post-implementation and are corrected above - re-cite them rather than reusing the pre-7c409a6 numbers. The full ruling history already on file above (the six seam rulings, the owner quotes setting the bound at 40, the sequencing rulings) is KEPT as an accurate record of what was decided and built, confirmed against 7c409a6.'
- id: 'N13b'
  state: 'unscoped'
  kind: 'feature'
  area: 'grading-run-survival-and-disclosure'
  title: 'Make the class-trends draft worth sending: count and name a SUBSET of students who missed the same area, not just an all-or-nothing whole-class verdict. Owner, 2026-09-15. Split out of N13 because it is a feature, while N13a is a bounding change.'
  owns: []
  verify: null
  blocked_by: []
  instrument: 'Direct read of src/lib/grade/class-trends.ts:124-196, src/lib/gemini.ts:25,124-125 and src/lib/grade/engine.ts:126, 2026-09-15'
  from: 'N13, owner decision 2, 2026-09-15'
  note: 'OWNER, VERBATIM: "make the draft more worthwhile. even in a class of 9 where 4 students miss the same area of the homework in a way that doesn''t meet the current criteria for drafting an announcement, it''s still worth sending out an announcement or contacting those 4 students individually". WHY THE CURRENT DESIGN CANNOT SAY THAT, measured: classifyDirection (src/lib/grade/class-trends.ts:178-196) reads "consistently" literally - EVERY percent value in an area must be >= HIGH_PERCENT_THRESHOLD or <= LOW_PERCENT_THRESHOLD - so 4 of 9 is neither high nor low and renders no clause at all. On any realistically mixed class the modal output is the opening sentence and nothing else, which is what made the original N13 decision 2 a question about whether the feature was worth sending at all. The owner''s answer is that it is, once it can see a subset. THREE PARTS. (a) A SUBSET/CLUSTER classification beside the existing direction, with a DERIVED rather than arbitrary threshold - and an explicit answer for small classes, where a fraction is loud but a count is not (3 of 4? 2 of 3?). (b) PER-STUDENT ATTRIBUTION, which layer A does not have: AreaTrend (class-trends.ts:124-150) carries percentValues as an ANONYMOUS number[], so even once a subset is counted the feature cannot NAME the students the owner wants to contact. Identity exists upstream (GradeResult carries student, a Canvas run carries userId); the design must say exactly where attribution enters. (c) TWO OUTPUTS, because the owner named two actions - an announcement to the class and a per-student list. A CLASS ANNOUNCEMENT NAMING STUDENTS IS A PRIVACY DEFECT: the announcement must describe the area without naming anyone while the per-student list stays instructor-facing, and that distinction needs an oracle that FAILS if a student name can reach the class-addressed text. HARD CONSTRAINT INHERITED FROM N11: prose generation stays WITHDRAWN. REGRESSION 423 records that layer C deliberately does not call a model, because every claim it makes was already typed by layers A and B, and reintroducing generation reopens the provenance problem the two-renderer construction closes by type. The fix is MORE COUNTED SIGNAL IN LAYER A. Anyone who concludes generation is unavoidable must argue it explicitly, never smuggle it in. Both outputs are surfaces, so per this repo''s own rule the surface is a layer - do not ship a library with no way to reach it. ClassTrendsPanel.tsx and classTrends.wiring.test.ts are the existing surface. OWNER SET THE THRESHOLD 2026-09-15, so it is no longer something to derive. Verbatim: "honestly, i want any trend where three or more students missed points on the same sections called out". THREE OR MORE STUDENTS, AN ABSOLUTE COUNT, not a fraction of the class - so 3 of 4 and 3 of 30 both qualify, and the small-class question this row used to pose is answered by not asking it. AND THE PART THAT CHANGES MORE THAN THE NUMBER: "MISSED POINTS" IS ANY DEDUCTION, not the existing low-score rule. The shipped design only ever notices a student at or below LOW_PERCENT_THRESHOLD (60), so a student who scored 8/10 on an area is invisible to it today. Under the owner''s rule that student HAS missed points and counts toward the three. That is a much broader signal than classifyDirection''s and it is the real reason the current feature renders nothing useful: it was looking for failure, and the owner wants to see FRICTION. The scoping must therefore establish, and not default: what counts as a deduction when a score is unparseable or carries no scale (the module already refuses to invent a denominator - requirement 4, class-trends.ts:182-187 - and that refusal must not silently become a not-missed), and whether a trivial deduction (19.5/20) should count, since under a literal reading it does. Recommend, do not decide silently. The existing high/low direction is NOT replaced by this - it is a separate, stricter signal that can stay; the subset call is additive. ORCHESTRATOR RULING 2026-09-15, settling the one design decision the check (round 1, NOT READY, 3 blockers) said could not be relocated to an implementer because the implementer''s safe-looking default is the SILENT one. THE GATE: class-trends-draft.ts:179-182 filters EVERY clause through areaFullyCovered, which requires area.resultsWithArea === report.totalResults. The design never said whether the new subset clause passes that filter, and both branches are defective as written. RULING: THE SUBSET CLAUSE IS NOT GATED ON FULL COVERAGE. The owner''s rule is an absolute count - three or more students missed points on the same section - and that fact is TRUE whether or not every other submission was gradeable. Suppressing it because one submission failed to grade is precisely the silence the owner asked us to fix. THE DISCLOSURE THAT MAKES IT HONEST, and it is not optional, because the existing gate exists for a real reason (the header at :86-93 warns that a clause backed by 5 of 30 with nothing disclosing the gap is the hazard): the subset clause must state its OWN denominator - "4 of the 8 submissions that included this section" - rather than inheriting the opening line''s totalResults. Tie every rendered clause''s basis to the number it was actually computed from. A LIVE DEFECT THE CHECK FOUND ON THE WAY, which is a second and independent cause of the owner''s "renders nothing" report and is NOT fixed by the subset signal alone: because the gate compares against totalResults, ONE FAILED SUBMISSION IN A RUN OF FIVE SWITCHES THE WHOLE DRAFT OFF, today, at shipped defaults. Executed, not reasoned: 5 graded with 4 low on Testing plus 1 grading-failure row gives coverage 4/5 and status=empty, while the same five with no failure row gives status=ok. N13a makes this ROUTINE rather than exceptional, because a deadline-stopped run produces failure rows by design. The same ruling covers it - clauses disclose their own basis instead of being suppressed - and the fix lands in class-trends-draft.ts, which is already in both owns lists. RES-W3-4, OWED HERE BY A16 WAVE 3 (docs/a16-wave3-scope.md): on Repo Grades, every trends cohort result carries student = the repo''s FULL NAME (github-repos.ts:618-619, label or digest.fullName), not the bound roster student - invisible today because ClassTrendsPanel never reads .student and the insight route anonymises, but N13b''s per-student attribution would name repos, not students, on that surface. Owner: the N13b scoping seat. Instrument: grep -n student: src/app/actions/github-repos.ts, plus an N13b criterion stating which name a Repo Grades attribution shows (the repo, or the binding''s roster student - the binding lives in RepoGradeRow.binding, repoGradesRows.ts). Step: N13b''s scoping pass, which already follows A16.'
- id: 'N15a'
  state: 'unscoped'
  kind: 'feature'
  area: 'one-upload-per-student-grading'
  title: 'The owner''s one-upload-per-student workflow on the assignment-upload tool: tick a checkbox meaning each upload is one student, then upload repeatedly, each upload recognized as a different student and graded as it lands. FORMERLY TWO ROWS (N15a dispatch, N15b queue) - MERGED by Ruling N15-3 after the scope check showed the seam was cut through the middle of one correctness property: per-upload dispatch WITHOUT the queue is not a smaller working feature, it is an unserialized dispatcher, because getGeminiInterRequestDelayMs is applied only BETWEEN entries inside one gradeStudentEntries call (engine.ts:207-209), so N one-entry calls pay it zero times. What survives from the scoping pass: gradeEntries (engine.ts:333-341) really is a generic per-entry wrapper, and canvasWorkToEntry (extraction.ts:153) is a real precedent for building one entry directly.'
  owns: []
  verify: null
  blocked_by: []
  instrument: 'Scope check of scratchpad/n15-scope.md, 2026-09-15: DEFECTIVE, 8 blockers, 4 majors. Verdict: may not be built as scoped.'
  from: 'owner request, 2026-09-15'
  note: 'RETURNED TO UNSCOPED DELIBERATELY. The owns list it carried was computed from the description rather than from the code, and the check named eleven files missing from it - including src/app/actions.ts (the barrel GradingTab imports through, without which the action ships dead), src/lib/grade/types.ts (GradeResult has NO id field, so the stable-row-id fix cannot be made without it), src/lib/grade/engine.test.ts (five describe blocks on the very function both chunks call), and action-guard-coverage.test.ts (a new server action fails it unless requireOwner() is textually first in its body). Keeping a wrong owns list would be worse than having none. THREE FINDINGS AN ARCHITECT PASS MUST CARRY, each measured: (1) GradingTab.tsx:150-155 smooth-scrolls to the results section on every run change, so in an incremental flow it drags the viewport away from the file input ONCE PER STUDENT - X-1''s named defect, sitting in an owned file, uncounted. (2) The results table sorts by student name unconditionally (DEFAULT_SORT, gradingResultsHelpers.ts:99-102, pinned by a landed source-reading test), so incremental rows insert ALPHABETICALLY, not at the end - the just-graded row lands anywhere in a class of 30. (3) gradeAction''s Gemini path is a Promise.all of THREE calls plus a fourth when the rubric box is blank; gradeStudentEntries returns fullCreditChecklist: [] hardcoded (engine.ts:276), so per-upload grading silently ships a degraded results panel with every gate green - and if the rubric box is blank, each upload generates its OWN rubric, so students are graded against different rubrics. Also unsized: the owner''s primary input is a phone photo, UPLOAD_WIRE_BUDGET_BYTES is 3.5MB (upload-budget.ts:41) and base64 inflates by 4/3, so a real photo fails on upload one. OWNER DECISION 2026-09-15, recorded here because it arrived while scoping a different item and it CONFIRMS this row''s premise from the other direction. Verbatim: "each student will have their own zip". It was given as the answer to a re-run identity question on bound-stopped grading runs - the zip path has no durable per-student id, so a stopped run could not name what to re-run. One upload per student dissolves that: the upload is the identity. TWO CONSEQUENCES FOR THIS ITEM. (1) The per-upload-is-one-student mode is not only a convenience for the owner''s grading workflow, it is what gives every downstream feature a re-run key on the zip path - so the checkbox this row describes carries more weight than its size suggests, and A12''s not-attempted rows depend on it for that path. (2) THE QUESTION THIS ROW MUST STILL ANSWER: whether the multi-student bulk zip stays supported alongside it. If it does, two identity regimes coexist and every consumer of a stopped or failed row has to know which it is looking at; if it does not, that is a removal with its own blast radius. Do not default it.'
