rvives on other grounds but not on that argument. (5) The "Showing N of M submissions" heading renders only when a filter is non-empty (GradingTable.tsx:168). RE-CHUNKED 2026-09-20 by the top tier; it corrected THREE OF MY FOUR RULINGS and the corrections change what gets built. (1) RULING B''S CONCLUSION IS RIGHT, ITS REASON IS WRONG, and the difference is concrete. I said the snapshot surface refutes the claim that a pixel input makes reply recognition impossible. Measured: the snapshot role is INSTRUCTOR-DECLARED, NOT MODEL-RECOGNISED - snapshot-keys.ts:24 ROLE_BY_DIGIT arms a role by keypress BEFORE capture, snapshot-shot.ts:130 setShotRole writes it, and snapshot-role-suggestion.ts:8-13 states in bold that a suggested role must NEVER become the effective role without an explicit instructor action, implemented at :83-92 where the only writer runs on a click. So the surface proves a narrower thing: a code-held closed union can exist on a pixel surface WHEN A HUMAN SUPPLIES THE VALUE. The screen-capture path sweeps MANY submissions in one capture and has NO per-submission moment before capture, so it cannot copy the arming half - it must INVERT the order: the model SUGGESTS at extraction, the instructor CONFIRMS per row. A receiver told only "adopt the role model" would try to build a pre-capture arming control for a surface with no per-submission capture moment. (2) RULING B MUST NOT BE READ AS "IMPORT SnapshotRole". Three source headers forbid that boundary crossing - snapshot-shot.ts:6-9, grading-submission-merge.ts:9-13, grading-extraction-prompt.ts:9-14. Adopt the SHAPE - closed union, Record labels, a label emitted into the prompt by construction, suggest-never-auto-apply, a pinned call-site canary - declared FRESH in src/lib/grade/, the layer grading-feedback-prompt.ts:25-33 already imports from. (3) RULING D AIMED AT THE WRONG FILE. I budgeted grading.ts at 905/1000. Under this chunking NO chunk''s work lands there - gradeCanvasUrl and gradeSubmissions are