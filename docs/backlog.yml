- id: 'A33'
  state: 'unscoped'
  kind: 'bug'
  area: 'loop-and-docs-maintenance'
  title: 'Two more source-text import guards carry A23''s regex hole. src/lib/workflows/course-schedule-docx.test.ts and src/lib/workflows/registry/steps.weekly-announcement-schedule.test.ts assert banned imports with patterns of the form /from ["'']<specifier>["'']/, which require the literal token "from" and therefore cannot see a bare side-effect import, a require(), or a dynamic import(). Both are DIRECT-ONLY - each reads one file''s own source rather than anything transitive - so they are cheaper to fix and weaker than the three sites A23 chartered.'
  owns: []
  verify: null
  blocked_by: []
  instrument: 'Re-measured 2026-09-22 from the repo root, after A23 shipped: grep -c ''from \["'' src/lib/workflows/course-schedule-docx.test.ts returns 2 (the assertions at :42 and :47) and the same command over src/lib/workflows/registry/steps.weekly-announcement-schedule.test.ts returns 14 (first at :63). Every one of the 16 is the /from ["'']...["'']/ shape. A23''s note said sites 4 and 5 were at :42-48 and :63-69; the first is right and the second understates its own file, which carries the pattern in five separate blocks, not one.'
  from: 'A23 architecture pass, 2026-09-20, which found and opened both and recorded them in A23''s note "so the next reader knows" with no owner and no step - a deletion as written (docs/backlog-reconciliation-2026-09-21.md section 2.3, cc12a8e); filed 2026-09-22'
  note: 'OWNER: whoever next edits either test file, or a dedicated sweep chunk - deliberately NOT chartered into A23, whose charter was already widened once from two sites to three, and widening it a second time on the same reasoning would turn a bounded row into an open-ended sweep. INSTRUMENT: replace each pattern set with the runtime-import walk A23 shipped (src/lib/module-graph/runtime-import-graph.ts), and prove the replacement goes RED on a bare side-effect import and on a require() - the two forms the regex cannot see - before trusting it. A guard that enumerates spellings of a banned import fails SILENTLY, because an un-enumerated form is simply permitted; five independent authors wrote five variants of that same pattern here. STEP: the next chunk that edits either file, and no later than the next time a banned specifier is ADDED to either list, because adding to a list with a known hole is what makes the hole permanent. WHY IT IS ITS OWN ROW: A23 became an owner row (the twelve-module decision) at this reconciliation, and an agent-buildable guard fix inside an owner row is invisible. SHIPPED 2026-09-23 AT 6aed083. THE HOLE WAS MEASURED RATHER THAN INHERITED, in node against constructed strings: the pattern requires the literal token from, so a side-effect import, a dynamic import and a require all pass it, while export-star is a RED HERRING the old regex actually catches because it contains the word. So three forms were missed, not four, and this row''s own list of three was exactly right. THE FIX REUSES A23''S scanRuntimeEdges (src/lib/module-graph/runtime-import-graph.ts), which enumerates edges by AST node kind rather than by text pattern, instead of inventing a third spelling of one guard - the A17 pass measured five different labels for one act elsewhere in this app on the same day, so a third spelling was the live risk. Direct edges only, never the transitive walk, because both files guard their own source; that choice is stated in a comment in each file rather than left to be rediscovered. BOTH GUARDS WERE WATCHED FAILING with the banned dependency injected in a form the old pattern missed, then restored from a cp backup and diffed byte-identical - which is the whole point of the row, since a guard that cannot fail is the defect and the regex is only how it got that way. ONE DETAIL WORTH KEEPING for whoever writes the next guard of this shape: a literal require CRASHED module collection instead of producing a clean assertion failure, so the dynamic-import form is what demonstrates the guard. The guard covers the require form either way - the AST scanner enumerates it - but it cannot be DEMONSTRATED this way, and an implementer who tries will read the crash as a broken test.'
- id: 'A34'
  state: 'verification'
  kind: 'bug'
  area: 'grading-run-survival-and-disclosure'
  title: 'The recording panel''s grading action tells the instructor to "Retry this row on its own" for every submission past the bound, and no control retries one row. src/app/actions/grading-submission-grade.ts:196 composes "Too many submissions in one grading run (limit ${maxSubmissions}). Retry this row on its own." for each overflow submission, while its sole production caller builds its submission list from the whole table on every press - so pressing the one control again re-sends the same array, re-takes the same prefix, and the overflow row gets the identical message back. Same class as the defect A31 shipped a fix for at 72058f9, and still live.'
  owns: []
  verify: null
  blocked_by: []
  instrument: 'Measured 2026-09-23 from the repo root (Git Bash). THE SENTENCE: grep -rn "Retry this row on its own" src --include=*.ts --include=*.tsx returns exactly two lines - src/app/actions/grading-submission-grade.ts:196 and that action''s own test at src/app/actions/grading-submission-grade.test.ts:306. SEARCH CANARY: the same command over "Retry this row on its OWN PLANET" prints nothing and exits 1, so an empty result from this instrument is a real absence. THE BOUND AND THE SLICE, the same pair the engine uses (grep -n, not counted off a sed window): :142 const maxSubmissions = getGeminiMaxSubmissions(), then :147 const toGrade = submissions.slice(0, maxSubmissions) and :148 const overflow = submissions.slice(maxSubmissions). WHY THE INSTRUCTION IS FALSE: grep -rn "gradeCapturedSubmissionsAction" src --include=*.ts --include=*.tsx gives exactly ONE production call site, src/app/components/grading-recording/GradingRecordingPanel.tsx:593 (every other hit is that action''s own test file or a doc comment). That call sits inside handleGradeAll (:563), which builds its submissions array from gradingRows.rawRows at :579-584 - the entire table, always, with no selection - and grep -n "handleGradeAll" on that file returns :22, :220, :563, :852 and :869, of which only :869 is a control (the single Grade submissions button''s onClick). WHAT WAS NOT MEASURED: whether some other control anywhere grades a subset. The claim proved here is narrower and sufficient - THIS action has one caller and that caller always sends the whole table.'
  from: 'docs/a31-scope.md revision 2 section 7 SIBLING 4 and section 10 RES-A31-5 (commit f1a9a33); filed as a row 2026-09-23. A31 shipped at 72058f9 without it, and docs/DEV_LOOP.md step 0 rules that a residual living only in a scope document does not exist.'
  note: 'SHIPPED 2026-09-23 AT 9eade3e, recorded because the shipped-but-uncited guard flagged it on the next turn - its fourth true positive and third against the orchestrator own push. THE COPY HALF IS DONE: the overflow message reuses A31 vocabulary from types.ts rather than minting a second wording for the same state, says what happened, and offers no action; the file header repeated the same false claim in English and was corrected too. The caller census was re-run and holds - one production call site, building its list from the whole table on every press, so no control grades a subset. A DEFECT FOUND IN PASSING AND FIXED: every success fixture in that test file carried status and body, fields the success branch of the result type structurally cannot have. The return type was INFERRED rather than annotated, so the excess-property check never fired and every test in the file exercised a shape production can never emit - the fixtures-must-match-emitted-shape class, caught by reading rather than by any gate. WHAT REMAINS, and it is the owner fork this row was deliberately not allowed to settle: SHOULD GRADING BE ABLE TO RUN ON A SINGLE ROW OR A SUBSET? The panel is all-or-nothing today. Asked, unanswered, and NOT blocking - the false sentence is gone either way. If the answer is yes, this row becomes a feature and the copy can offer that action; if no, the row closes as shipped. ALSO NOT MEASURED: the control sweep over the panel - only that the one grading action has one caller, not that no other control anywhere grades a subset. OWNER: the repo owner for the fork, then an implementer. THE FORK, stated so nobody guesses at it: either add a per-row grade control (which makes the sentence true) or correct the copy (which stops it being false). Only the owner picks, because the first is a new capability on that surface and the second is a text change. THE COPY HALF NEEDS NO DECISION and is owed whichever way the fork goes: docs/a31-rulings.md RULING 1 (commit 5ff763f) is that a sentence may assert only what holds on every caller and every reachable state, and this one holds on none of them. INSTRUMENT: the measurement above is complete, so what a fix owes is an EXECUTING guard, and A31 already paid for the shape - assert over the string the action EMITS for an overflow row (the value handed to composeFailedGradingRow at :195-197, inside the overflow loop at :192-199), never over the source text of the file that spells it, because a retired literal kept as a correction allowlist makes a file grep print lines on correct code forever (docs/a31-rulings.md RULING 4). OBJECT: the emitted overflow message. DIRECTION OF FAILURE: RED when that emitted string contains Retry, Re-run or queue; today it contains Retry, so the guard must be watched going red on this code before it is trusted. STEP: the next chunk whose write set includes src/app/actions/grading-submission-grade.ts or src/app/components/grading-recording/GradingRecordingPanel.tsx, and no later than the next change to that message. WHY ITS OWN ROW AND NOT A NOTE ON A31: A31 is a verification row awaiting an owner browser check, and closing it would delete this - the exact way this defect''s sibling was lost once already.'
