  state: 'actionable'
  title: 'Surface common trends across a CLASS''s submissions for ONE assignment - what students commonly struggled with, what they commonly understood - so it can inform future announcements and interactions with the class. Owner ask, 2026-09-14, and it applies to ALL grading tools rather than one surface.'
  owns: ['src/lib/grade/class-trends.ts', 'src/lib/grade/class-trends.test.ts']
  verify: 'npx vitest run src/lib/grade/'
  blocked_by: []
  instrument: 'MEASURED 2026-09-14 before filing, and the result makes this SMALLER than it sounds. (1) NOTHING aggregates across submissions today: grep -rliE "cohort|classTrend|commonMistake|trendAnalys|acrossSubmissions|classSummary" over src/ returns three files and all three are unrelated - the only real hits are "cohort" in src/app/actions/github.ts:96 and steps.github.ts, both about repository TOPICS for organising repos by section. Canary proving the instrument works: grep -rli rubric over src/ returns 410 files. So this is genuinely new, not hidden. (2) BUT THE PER-STUDENT MATERIAL ALREADY EXISTS, STRUCTURED AND PERSISTED. AssessmentFeedback (src/app/components/assessment-shared/assessment-row.ts:64-69) is { totalScore, strengths, improvements, overallComment }, and AssessmentRowCore (:84-96) extends it with studentName, state, error, userEdited. EVERY grading surface builds on this through useAssessmentRowStore, which is why the owner''s "all grading tools" framing is satisfiable in ONE place rather than per surface. So the feature is AGGREGATION over an existing shape, not new capture - the strengths and improvements fields per student per assignment are already there.'
  from: 'owner ask, 2026-09-14'
  note: 'RE-SCOPED 2026-09-14 TO LAYER A ONLY, after the owner chose to NARROW THE CLAIM: "trends across the submissions you have graded so far, said plainly". That is the disposal the denominator problem actually needed - two rounds went into hunting a count that could stand for "the class" and there is none, while changing what the feature CLAIMS costs nothing and makes the count already in hand truthful. run.results.length is now correct because it is no longer asked to mean the class. THE COPY RULE IS THE FEATURE: every output states the set it covers and never implies completeness - the phrases "the class", "all students", "every student" and "the cohort" are forbidden, because this design never establishes that the graded set is the whole roster. "Across the 5 submissions graded so far, 4 scored below 60% on Thesis" is honest; "students commonly struggled with Thesis" is the claim the owner cannot check and would act on with thirty people. WHAT NARROWING DOES NOT FIX, and must still be built: areas may not be comparable even within one entry (per-folder rubrics are assembled into one entry whose area list is results[0]''s, and engine.ts:217-224 falls back to one student''s model-invented list), so layer A groups by NORMALISED name via the existing normalizeAreaName (prompts.ts:19) and reports per-area COVERAGE - an area present for 2 of 5 results is reported as such, never averaged as though all five were scored on it. THE FLOOR SPLITS: no floor on the instructor-facing display, because they graded these submissions and already know who they are; a floor of 5 on the DRAFTED message, because that text is addressed to students. LAYER A IS THE WHOLE OF THIS ITEM: one pure function over a GradingRunEntry - no network, no model, no storage, no component - which in this repo makes it the rare feature that is fully testable. The LLM insight layer (B) and the copyable-not-postable draft (C) are designed in scratchpad n9-architect.md revisions 1-2 and become their own items once A lands, so the reliable half is not held behind the expensive half. Original note follows. BACK TO UNSCOPED 2026-09-14, and this is the useful finding rather than a setback. THIS SYSTEM DOES NOT CURRENTLY RECORD "a class''s submissions for one assignment" AS A UNIT, so the feature as asked has no cohort source to aggregate. Four verified mechanisms, each at the producer: engine.ts:126 slices studentSubmissions to DEFAULT_MAX_SUBMISSIONS = 5 (gemini.ts:25) and GradingRun has NO field for what was dropped - grading-submission-grade.ts:52-57 documents that silence deliberately, on the premise that "its caller owns the whole result list", and this feature is exactly a caller that does not; canvas/submissions.ts:99,107 skip unsubmitted and already-graded work by design, so one assignment becomes several run entries; grade-zeros.ts:112-120 puts non-submitters in a SEPARATE entry with rubricAreaNames: []; and the repo path drops students by bare continue (steps.grading-repos.helpers.ts:251,269,278,292). SHARPEST DETAIL, which nobody including me noticed until the check: the default cap is 5 and the recommended cohort floor was 5, so at default configuration every LLM run holds exactly five results whether the class has five students or thirty - the feature would either always fire on a 5-of-30 slice or never fire. THREE CANDIDATE COHORT SOURCES, and picking one is an owner/architect decision rather than an agent default: (1) the ROSTER via listStudents as the denominator with graded results joined onto it - honest, makes "8 of 30, 22 not yet graded" sayable, needs a live Canvas call; (2) STITCH run entries sharing an assignmentId - cheaper but inherits every gap above and needs a grouping contract that does not exist; (3) NARROW the feature to "trends across the submissions you have graded so far", said plainly - buildable today and arguably what an instructor mid-marking actually wants. THE TWO OWNER ADDITIONS ARE DESIGNED AND UNAFFECTED: an LLM insight layer beside the counted layer (visibly distinguished, never replacing counts, no student names at input or output), and a COPYABLE-NOT-POSTABLE drafted announcement in which only COUNTED trends may be asserted. Both sit on top of whatever cohort source is chosen. Design and its three disposal rounds are in scratchpad n9-architect.md and n9-acceptance-criteria.md. Original note follows. SEAM CORRECTED 2026-09-14 by the architect pass, and owns/verify moved with it. I had scoped this at assessment-shared and the SNAPSHOT rows; the check on my criteria found that wrong and the right structure already exists in src/lib/grade/types.ts: GradingRunEntry (:199) carries assignmentName and assignmentId, its GradingRun (:178) carries results: GradeResult[] AND rubricAreaNames: string[] - ONE canonical area list for the whole run - and each GradeResult (:120) carries student plus rubricAreas: RubricAreaResult[] (:31, { area, score, comment }). GradingDraftPayload.runs persists them. So one assignment''s cohort is ALREADY a persisted object: a run IS an assignment, run.results.length IS the cohort, and every student in it was scored against the same area list BY CONSTRUCTION rather than by a prompt instruction holding. Four separate problems my criteria struggled with dissolve at this seam - which assignment, an unknowable denominator, whether area strings are comparable, and rows graded against different confirmed area sets being pooled. V1 COVERS THE LMS/REPO GRADING PATH ONLY: snapshot rows are a different shape with no persisted area list, and forcing them in via normalizeAreaName would reintroduce every defect the disposal round removed. That is a real narrowing of the owner''s "all grading tools" and is stated rather than discovered - snapshot coverage becomes its own item once G2 is settled. Original note follows. UNBLOCKED FROM G2 2026-09-14. I had marked this blocked_by G2 and that was wrong - G2 is a RISK to one of this feature''s behaviours, not a gate on designing or building it. The risk, carried forward as a design requirement instead of a dependency: the rows this aggregates come from the shared useAssessmentRowStore, and G2 asks whether that store''s localStorage-seeded initializer actually restores them after a page reload. If it does not, trends computed after a reload would analyse a PARTIAL cohort and report "the class understood X" having seen three submissions of twelve - the same silent-confident-wrong-answer family as G1, N4 and N5, landing where it would shape how the owner addresses a whole class. SO THE DESIGN MUST NOT ASSUME THE ROW SET IS COMPLETE: it states the cohort size it actually analysed (n of m submissions), and refuses or warns rather than generalising from a set it cannot confirm is whole. That requirement is correct whether or not G2 turns out to be a real defect, which is precisely why this does not need to wait for it. Original note follows. BLOCKED BY G2, and that is not bureaucratic: the rows this feature would aggregate are the very rows G2 is about. G2 asks whether a localStorage-seeded useState initializer in the SHARED useAssessmentRowStore actually restores the completed-assessment list on reload. If it does not, a trend feature built on those rows inherits the bug and would silently analyse an empty or partial cohort - which is the false-claim family again, in the one place where the wrong answer ("students understood this well") would shape how the owner talks to a whole class. Settle G2 first; it needs one reload. THREE THINGS TO SETTLE WHEN SCOPING. (a) SMALL-N DISCLOSURE: "students commonly struggled with X" is an aggregate, but in a class of five it is close to naming them, and the rows carry studentName. Decide the minimum cohort size below which a trend is not shown, and whether the trend text may ever carry a name - default should be never. (b) WHETHER IT REACHES A MODEL, and how: the material is per-student feedback text, so summarising it means sending student-derived content to a model. That is already true of grading itself, so it is not novel, but the announcement integration the owner names would then carry class-derived text into an ANNOUNCEMENT prompt - a different audience from a private grading note, and the one place a leak would be public. (c) GROUND IT IN THE RUBRIC, NOT FREE TEXT, if possible: confirmedRubricAreas already exist per grading run (ConfirmedRubricAreasEditor, N2), so "struggled with X" can key on an area the instructor already confirmed rather than on a concept a model invents from prose - which also makes the output checkable. DO NOT build a second aggregation per surface: the shared row shape is the seam, and N6''s survey showed these surfaces already converge on shared assessment-shared modules.'
