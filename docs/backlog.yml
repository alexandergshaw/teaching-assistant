in NO wave; and seven of the fifteen tsc-red factory bases are unassigned while copy-feedback.test.ts sits in wave 2 although wave 1 makes the fields required. B6 (a signal dropped at an unpinned hop - REPEAT of round 1''s transport class): RELOCATE the row-level invariant to the test seat with grading-capture-sync.test.ts as instrument. Measured: TR-4 says the suggestion travels WITH the text, but grading-capture-sync.ts:162 pushes only studentName and submissionText onto the existing row, so after a merge REPLACE the row holds the NEW text beside the OLD suggestion and cue - the owner''s bug inverted, and batch-accept eligible, so one click confirms the wrong kind. CORRECTIONS RECORDED AT DISPOSAL, not re-argued: G-R0''s stated bound exceeds its oracle - the extraction prompt changes for every user on every run with no confirmation anywhere, and the sentinel passes "SYS" so the system-prompt half is unfrozen. The new whole-src canary is specified by copying snapshot-role-setrole-callsites.structure.test.ts, which backlog L13 measured as THE ONE genuinely CRLF-blind stripper in the repo - and the artifact also prescribes a comment naming an identifier the same canary forbids, which is a hard RED on a correct implementation. The safe form was already in a file the artifact cites (copy-feedback.test.ts, CR-tolerant split plus a CR canary). Counts: the stated 45 paths itemise to 44 and the true figure is at least 47; "five by-path panel readers" lists six. SUBMISSION_KINDS is a hand-written array beside a hand-written union, so a fifth member escapes both coverage loops silently - derive the union from the array. A8-R SHIPPED 2026-09-20: wave 0 at 58a4254, wave 1 at d5a3e2c, wave 2 inside db747cc (whose SUBJECT describes only an A18 doc relocation, while git show --stat db747cc lists sixteen source files under grading-recording/ and src/lib/grade/), and 75bd7d4. The earlier "A8-R IS PARKED BEHIND A16" sentence was written before those landed and is deleted rather than