  note: 'db747cc IS AN UNRELATED MENTION, answered 2026-09-22 when the new shipped-but-uncited guard flagged it. That commit is titled docs(a18-scope): relocate AC-5 off recording-split.structure.test.ts to stay disjoint from A20, and it names A18 and A20 only to explain a FILE-SET DISJOINTNESS decision between them. What it actually carries is 799 lines across 18 files of A8-R production code (git show --stat db747cc), which is recorded on A8. So this row shipped nothing in that commit, and the guard is right to have asked: a commit whose message describes a docs relocation while carrying another row''s code is exactly the bookkeeping this project has been bitten by. RECONCILED 2026-09-21 BY THE A18 AC PASS, AND THIS ROW WAS STALE IN SIX PLACES. MOST OF A18 ALREADY SHIPPED at f9f29c1 (2026-09-20 16:10:43 -0500) against an earlier criteria document, docs/a18-scope.md (AC-1..AC-6); the row was never updated and still said unscoped with no owns and no verify. CORRECTIONS, each re-measured: the panel is 985 lines not 979 (wc -l and @(Get-Content).Count agree), so 15 lines of headroom not 21; walkthrough-announcement.ts is 608 not 602; the panel lives under components/walkthrough-announcement/ not under recording/; :883, the two server-action strings and the fieldset WHILE YOU RECORD string are all GONE, reworded to capture; the house-style subtitle moved to :727-728; the :244 notes label was never a defect locus and contains no record-family word. A grep for the record family over the tool''s four user-facing files returns 17 hits and NOT ONE IS A RENDERED STRING - comments, ../recording/ import paths, and Record<string, unknown>. THE ROW''S FOUNDING CLAIM SURVIVES: :515 still calls start({ saveVideo: false }). WHAT IS ACTUALLY LEFT, AND NO PRIOR ROUND LOOKED THERE: src/lib/walkthrough-announcement-prompt.ts:130 and :334 both say screen-recorded, and they are EMITTED TO THE MODEL on the announcement path, so this is the one remaining place the app asserts a recording happened and it reaches student-visible output. a18-scope.md never mentions that file. CORRECTED 2026-09-21 BY THE CRITERIA CHECK, AND THE ERROR WAS MINE - THE SENTENCE THIS REPLACES SAID THE SCRIPT PROMPT IS OTHERWISE CORRECT ABOUT RECORDING. IT IS NOT. walkthrough-script-prompt.ts emits FIVE model-facing strings asserting a recording was made of the PAST capture: :158 (WALKTHROUGH_MATERIALS_FRAMING - read directly off the instructor''s screen DURING THE RECORDING, which is the script path''s anti-injection framing and the structural sibling of the :130 object), :161, :171, :174 (only what could be read off THE RECORDING, and THE RECORDING occasionally reads it wrong - attributing the app''s own OCR error to a recording that does not exist) and :219. THE OBJECT SET FOR A18''S REMAINDER IS THEREFORE SEVEN STRINGS, not two: announcement-prompt :130 and :334, plus script-prompt :158, :161, :171, :174, :219. ONLY :165/:166 ARE GENUINELY ABOUT THE FUTURE RE-RECORDING and must survive. NOTE THE CLASS, because it has now happened twice on this row: both frontiers were drawn by GREPPING A TOKEN over a file set - record over three files in round one, screen-recorded in round two - rather than by enumerating the strings emitted on each path and reading each one. RESIDUAL: grep -ac A18 docs/REGRESSION.md returns 0 - the f9f29c1 fix shipped with no regression entry, and its six enforcers are measured GREEN but nobody measured that any of them CAN GO RED. Criteria: docs/a18-ac.md. SCOPE THE BOUNDARY BEFORE TOUCHING ANYTHING - a find-and-replace on the word record is the wrong shape and would break things. THREE DISTINCT LAYERS, and only the first is clearly in scope. (1) USER-FACING COPY IN THIS TOOL: the strings listed in the instrument, which should say the app READS what is on your screen rather than that it records. :725-726 is already correct and is the house style to match. (2) IDENTIFIERS AND KEYS: the walkannounce view id, the ta-rec localStorage namespace, the Recording