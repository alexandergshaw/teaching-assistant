  question: 'TWO NEW OWNER ITEMS 2026-09-23, both BEFORE the migration lands, since migrations auto-apply on push here. (1) PRIVACY, and the design created it: fixing the blocker required storing the model''s ANSWER, and an answer can quote roster names back, because the roster is sent verbatim (course-facts.ts:109-110). So this design digests the roster precisely in order to store NO NAME, and then stores an answer that may contain names anyway. There is no instrument for it in this checkout - no database, no model call - and the scope says so rather than inventing one. Options: store the answer as designed and accept it; store only a digest of the answer, which costs the panel its usefulness; or redact before storing, which needs a detector nothing here can test. MY RECOMMENDATION: store it, because the answer is the instructor''s own material about their own course on their own account, and the roster it could quote is data they supplied - but this is yours, not mine, because it is the one place the feature writes student names to a durable store. (2) On a facts-shape version mismatch, refuse all comparison, or compare the labels present in both and report the change separately? RECOMMENDATION: compare what is comparable - refusing everything turns the feature dark exactly when an instructor most wants it, after something changed. Both are shaped so either answer ends the activity. ANSWERED 2026-09-23: the owner took the recommendation - REDESIGN AROUND PROVENANCE, dropping recall as the goal, with the retrieval interaction part of the deliverable rather than a follow-up. See docs/owner-decisions-2026-09-23.md DECISION 11. The existing scope was written against the old premise and must be re-scoped from this one. OPEN, AND docs/loop/leverage.md FORBIDS AN AGENT TO DEFAULT IT. Re-measured 2026-09-23: the 2026-09-15 check was right and is still right on today''s tree, so this row''s premise does not survive. Nothing persists an Ask AI answer - AskAiModal.tsx:44-45 holds it in useState, CoursesTab.tsx:448 unmounts the modal on close and destroys it, and the action at llm-content.ts:855-921 documents itself as deliberately free of the storage row shape. TWO THINGS KILL THE ROW AS WRITTEN. First, the value it claimed is gone: a39-research.md section 5 established that a chat CAN persist across sessions via Projects, so remembering an answer is not an advantage. What survives is narrower - PROVENANCE, which facts produced which answer - and that is a different feature from the one this row proposes. Second, the one existing precedent for reading an answer back (CourseIntelHistory.tsx) costs a tab switch plus an expand click plus an unscoped scan, which is MORE expensive than re-asking - the same failure shape measured for the rubric this week. A stored answer that costs more to find than to re-ask is worse than not storing it. THE FORK IS YOURS: (a) REDESIGN around provenance - store which facts produced an answer and show that, dropping recall as the goal; (b) ACCEPT the cost and build recall anyway, with a retrieval interaction cheaper than re-asking specified FIRST, not as a follow-up; or (c) REJECT the row and delete it. COST OF BEING WRONG: (a) is a different and probably smaller feature than what was filed and is the one I recommend; (b) is the expensive branch and it must beat re-asking on clicks or it ships a surface nobody uses; (c) is the only one-way door, though the row is recoverable from git. WHAT IS NOT BLOCKED: nothing else on that surface, and the A4 question about the same modal''s chips is independent of this one.'
