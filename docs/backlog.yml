  instrument: 'MEASURED 2026-09-21 BY THE A16 PLAN AND RE-VERIFIED HARD BY ITS CHECK, WITH A CANARY. There is genuinely no run boundary in snapshot grading: grep -n for assessmentId, courseScope and assessmentLabel over SnapshotGradingPanel.tsx returns NOTHING (canary: grep -c useState on the same file returns 21, so the instrument fires). handleGrade at useSnapshotGrade.ts:108 resolves ONE row, and commitSessionRows(upsertSnapshotRow(...)) at :272 upserts ONE. The panel itself says so at SnapshotGradingPanel.tsx:931: Completed assessments (n) - some may be from an earlier session, restored on reload. So mounting today''s panel there would group whatever happens to be in the session, which is the cross-assignment mixing the owner put out of scope in A16 - and it would ship GREEN, because nothing renders under vitest here.'
  from: 'Orchestrator, 2026-09-21, disposing a residual the A16 plan created'
  area: 'grading-run-survival-and-disclosure'
  kind: 'feature'
  note: 'WHY THIS IS A ROW AND NOT A RESIDUAL INSIDE A16. The A16 plan routed snapshot grading out and gave the disposal a step of A16-4''s own scoping, before any wave - which is self-referential: nothing schedules it, and a grep for A16-4 across the backlog returned exactly ONE hit, inside A16''s own note. DEV_LOOP step 0 rules that closing an item DELETES it, so when A16''s waves land, the only record of snapshot-grading trends would go with the row. That is a deletion of half the owner''s top-priority ask, by the plan''s own standard for what counts as a deletion. THE FACTUAL RULING IS NOT REOPENED: there is no run boundary today, and A16 was right not to mount the panel there. THE QUESTION THIS ROW OWNS is what a run means on a surface that grades one row at a time - whether a session IS the cohort and the honest move is to disclose it (which is exactly what A16 wave 2 does on the recording surface, per its own RES-P-7), or whether snapshot grading needs a run boundary invented before trends can mean anything there. THE CHECK CAUGHT A16 ARGUING BOTH WAYS ON THIS: it excluded snapshot grading partly because mixing is out of scope, while accepting disclosed mixing on the recording surface. If mixing is disclosable on one surface it is disclosable on the other, so ONLY THE RUN-BOUNDARY ARGUMENT IS LOAD-BEARING and the mixing sentence must not be reused as precedent. BLOCKED BY NOTHING, but sequence it AFTER A16 - wave 2 is building the cohort-and-disclosure shape this row would copy. NOT A SHIP: a9d9771 names this row for a SEQUENCING DECISION, not for any A24 code. No A24 file changed in it. THE DECISION, recorded at docs/a24-a39-sequencing.md RULING 32: A24 and A39 claim the same two paths - SnapshotGradingPanel.tsx and snapshot-grading.structure.test.ts - and both order an extraction from the same 970-line panel with CONFLICTING numeric targets, 928 against 940. A39 extracts FIRST, and A24''s target is then RE-DERIVED against the tree A39 leaves rather than adjusted arithmetically, because whichever lands second is otherwise measuring against a file the first already changed - and a ceiling gate passes silently either way, so that error would never surface. UNTIL A39''S EXTRACTION COMMITS, no A24 wave touching either path may be dispatched. TWO THINGS TO CARRY INTO THE RE-DERIVATION rather than rediscover at a gate: the 928 target is UNREACHABLE by per-block extraction, because each boundary costs its own call site - five separate components land at 931-938 while two GROUPED components land at 913-918, so the constraint is fewer and larger components, the opposite of the instinct - and an 18th serialized field moves THREE places in snapshot-row-serialization.test.ts, not the two the check named. If A39''s extraction already groups the same region, A24 may need no extraction at all. SHIPPED 2026-09-23 AT da03e20, built under owner DECISION 4 - a derived, non-reversible cohort digest, so nothing identifying is stored, no new control, no new ta-snap key and no key-canary bump, with the disclosure saying more than one assignment and never naming one. THE EXTRACTION WAVE WAS CORRECTLY NOT RUN, and a number decided it. RULING 32 required the target be RE-DERIVED against the tree A39 left rather than adjusted arithmetically: the panel measured 881 after 87fb303, giving 119 lines of headroom against a full-feature estimate of 72, so no extraction was needed at all. The feature then cost +29, not +72, ending at 910 on both counters. An inherited number would have caused a pointless extraction of a file that had already been extracted from that morning - which is the whole reason that ruling exists. THE COST DECISION 4 DOES NOT REMOVE WAS PROVEN BEFORE IT WAS PAID: adding the field to the type ALONE passed tsc silently, confirming that the as-unknown-as cast in the serializer masks a forgotten field exactly as the decision warns. So all three instruments were bumped to their final state BEFORE the codec was touched and watched failing - the exact 17-key literal, the degradation-coverage set, and the it.each table whose rows that set hand-mirrors. THREE places, not the two an earlier check had named; a brief naming two would have shipped a red gate. TWO REMOVAL TESTS were watched failing by deleting what they guard and restoring from a cp backup: the panel mount and the disclosure gate. The mount check is the reachability guard this repo keeps needing, since a capability that renders nowhere passes every other gate. WHAT REMAINS, and why this row is in verification rather than closed: nothing renders under vitest, so every claim about what the instructor SEES is a reading claim. The owner check is that the trends panel appears on the snapshot surface once more than one assignment has been graded in a session, that the disclosure line reads correctly, and that no assignment name appears anywhere in it.'
