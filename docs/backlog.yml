- id: 'N13'
  state: 'owner'
  title: 'Two product decisions left open by N11 (layer C, the copyable class-trends draft), which SHIPPED with both explicitly unresolved rather than silently defaulted. Neither blocks anything; both change one line.'
  owns: []
  verify: null
  blocked_by: []
  instrument: 'DECISION 1 - THE FLOOR AGAINST THE CAP. Layer C refuses to draft below a floor of 5 graded submissions, because that text goes to STUDENTS rather than to the instructor who did the grading. But the default grading cap is ALSO 5 - DEFAULT_MAX_SUBMISSIONS at src/lib/gemini.ts:25, applied by .slice(0, maxSubmissions) at src/lib/grade/engine.ts:126. So at default settings a run holds exactly five results and the draft is available at exactly that one configuration. The floor is now NEXT_PUBLIC_CLASS_TRENDS_DRAFT_FLOOR with an explicit < comparison, so lowering it is a config change; raising the cap is GRADE_MAX_SUBMISSIONS. MY RECOMMENDATION, unchanged from when I escalated it mid-build: keep the floor at 5 and raise the cap, because the floor protects students in a message addressed to them while the cap is a cost knob you already control. NOTE the floor being NEXT_PUBLIC_ makes its value readable by anyone who opens the page - judged acceptable because it discloses one policy integer, strictly less than the draft itself already tells the same audience. DECISION 2 - WHETHER THE DRAFT IS WORTH SENDING AT ALL. Measured during the design check, not speculated: a clause renders only when an area is fully covered AND classifyDirection returns high or low, which requires EVERY parsed percent score in that area to be >= 70 or <= 60. So on any realistically mixed set the modal output is the opening sentence plus nothing. The build handles that honestly - when there are no body clauses the panel explains itself and WITHHOLDS the copy control, so there is never a Copy button beside an empty message - but the deeper point stands: THIS DESIGN CANNOT PRODUCE ACTIONABLE ADVICE. AreaTrend carries none, and the only prose with substance (an inferred observation reading) is opt-in and absent by default. What it can say is which areas went well and which did not.'
  from: 'N11 design checks, 2026-09-14'
  note: 'NO AGENT SHOULD DEFAULT EITHER OF THESE - that is why they are here rather than in a code comment. Decision 1 is a privacy-versus-usefulness trade that belongs to whoever answers to the students. Decision 2 is a judgement about whether a strictly honest but thin message is better than none: the alternative that would make it richer is a model call to write the prose, which the design deliberately WITHDREW (see docs/REGRESSION.md entry 423) because every claim layer C needs was already typed by layers A and B - reintroducing generation would reopen the whole provenance problem that the two-renderer construction closes by type. If the answer to 2 is "too thin to send", the honest fix is more counted signal in layer A, not prose generation on top of it.'
