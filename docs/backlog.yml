  from: 'N13a round-2 check, 2026-09-15, re-read hop by hop by the orchestrator'
  note: 'A13-1 SHIPPED (commit ac8002b, 2026-09-15) and is confirmed wired at every payload builder the original row named, so the title''s LIVE ON MAIN TODAY claim about internal error text reaching students is now FALSE and must not be repeated. A13-2 is the sole remaining scope: the review table (GradingResults.tsx and its row renderer, plus the repo-grades equivalents) must mark a postable:false row as a DISTINCT visible state rather than rendering it like an ordinary graded row, and must offer a re-run control wired to gradeOneSubmissionAction (grading.ts:597, currently called only from steps.grading-singles.ts:238, a workflow step, never from UI). Re-runnability needs identity - GradeResult carries no id field (confirmed: no id or id-optional property in src/lib/grade/types.ts) - so whether a failed/ungraded row can be re-dispatched, and whether that identity survives a reload, is still to be established, not assumed. This converges with A12''s identical residual (a visible not-attempted disclosure plus re-run), and the two should not invent separate mechanisms. SCOPED WITH A12 2026-09-20 into ONE chunk, artifact at docs/a12-a13-scope.md. BOTH HALVES OF A13-2 ALREADY SHIP on the repo-grades grid: RepoGradeCellControl.tsx:617 renders checkRowPostability''s refusal reason and :572-575 is a per-cell re-grade button. So the remaining gap is one file, GradingResults.tsx. THE STRONGEST LIVE DEFECT IS NAMED BY NEITHER ROW: GradingResults.tsx:626 renders a HARDCODED "Not posted - no grade or comment to send" for the skipped status and DISCARDS status.message - the field holding both the A13-1 refusal reason (set at :392, :300, :325, :339, :355) and Canvas''s own skip reason. postable.ts:100-103 says the predicate returns a reason SO A CALLER CAN SURFACE IT; the one UI caller drops it and substitutes text that blames the instructor. Two-line fix, inside owns. RE-RUN IS DEFERRED, NOT DROPPED, and the reason is identity: repoDigestToEmbeddedEntry (github.ts:574-596) sets