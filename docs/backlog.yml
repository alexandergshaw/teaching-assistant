  kind: 'feature'
  note: 'OWNER ANSWERED OC9 2026-09-23, VERBATIM: no courses should exceed 100. THAT IS THE ANSWER THE WHOLE LEDGER EXISTS FOR, AND IT REMOVES MOST OF THE BUILD. Canvas documents that a single POST to recipients[]=course_<id> with group_conversation at its default of false creates INDIVIDUAL PRIVATE CONVERSATIONS with each recipient - one request, no roster exposed, no reply-all - and the over-100 sentence that forced bulk_message and group_conversation to true is the ONLY reason the design fanned out per student at all. Under 100 it does not apply. SO THE PER-STUDENT PUMP, THE DURABLE ATTEMPT LEDGER, THE CLAIM-ONE-ROW CAS, THE STALE SWEEP AND THE RESUME MACHINERY ARE ALL UNNECESSARY - and five of the six blockers the last check found live in exactly that machinery. WHAT SURVIVES AND STILL MATTERS: the live-roster read with its enrollment-state filter and its silent-pagination disclosure; the confirm step showing course, count and the message; the honest limit that Canvas accepted it rather than that an email arrived; and the single-recipient allow-pattern, which still binds because course_<id> is a DIFFERENT recipient form, not a list of ids - the builder must accept exactly one recipient token and that token may be the course form. THE PRICE OF THE SIMPLER SHAPE, stated rather than buried: ONE request means ONE outcome for the whole class, so there is no per-student receipt - the app can report that Canvas accepted the message, and nothing about which students it reached. That is the same honest limit the notification-preference fact already forces. RE-SCOPED ON THIS ANSWER; the earlier architecture stands as the record of what the over-100 case would need if a course ever crosses it. OWNER ANSWERED THE FORK 2026-09-21, VERBATIM: for bulk email: message on canvas and also use canvas built in emailer. THAT IS OPTION (A), and it supersedes the (B-prime) working default. Read together, the two halves are one mechanism: a Canvas conversation IS how Canvas emails - Canvas delivers each Inbox message to the student by email through its own notification system, so sending the message through Canvas uses Canvas built-in emailer. There is no separate Canvas send-an-email endpoint to call in addition. ONE HONEST LIMIT THE UI MUST STATE: whether the email copy actually goes out is decided by EACH STUDENT OWN Canvas notification preferences, which the app cannot see or override - so the app can report that Canvas accepted the message, never that an email arrived. CONSEQUENCES: the Sent Items privacy question is moot (it applied only to the Outlook option); no student address is ever read or handled by the app, which removes the address-source criterion entirely; and the batch- versus per-recipient receipt question changes, because a Canvas conversation send may report per recipient where a BCC could not. The Canvas facts still unverified here decide the build shape and belong to the architecture pass: whether POST /conversations accepts course_<id>_students or a bulk_message / async mode, whether a multi-recipient send creates ONE group conversation (every student sees every other) or one per student - a privacy question in its own right - and the rate limits on fanning out. RULINGS 2026-09-21 in docs/a29-rulings.md, after the revision-1 check returned 4 blockers (2 repeat): the double-send guard is keyed on the COURSE having an unresolved attempt, never on the body, because clearing the body at confirm guarantees a retyped retry differs; the attempt record is DURABLE, written before the first outbound request, since a function killed at 60s keeps no in-memory state; the confirmation is SERVER-ISSUED and consumed once; the client receives only the summariser output so no display can compute its own count; and the capability wall measures the REQUESTS a send makes, not import closure - measured red on day zero, since today tree already reaches both model clients from the course reader. OWNER QUESTION ADDED: the existing Outlook send keeps every BCC address permanently in the instructor own Sent Items. STALE TEXT IN THIS ROW, CORRECTED: the old R3 (a component-only double-send guard) is superseded by the server-issued confirm, and R4 means only the delivery residual. CRITERIA REVISION 1, 2026-09-21: DEFAULT FORK IS NOW (B-PRIME), real email from the instructor connected Outlook - closest to the owner words, and mostly built. Put to the owner; not settled. CORRECTION TO WHAT I TOLD THE OWNER: I said a whole-class email is one click away today. IT IS NOT, FROM A FREE-TEXT COMPOSE. The Send by email path works only on an announcement draft that carries a course tile, and those are created only by the recording take path, the weekly kickoff step and a workflow step - so a direct compose-and-send for a course is something A29 genuinely adds. ALSO MEASURED: that existing whole-class confirm CAN GO STALE - its arm signature covers the draft id, action, body and title but NOT THE ROSTER, so an armed N students in COURSE survives a change to the tile roster. Pre-existing and outside A29 wording; recorded in the criteria section 10. RESIDUAL R4, NEW: under EVERY option, actual delivery to a student inbox is outside what the app can observe - Graph 202 means accepted, Canvas notification email is Canvas business - owner, a test student own inbox, at the owner verification pass. CORRECTED 2026-09-21 BY THE A29 CRITERIA PASS, AND THE ERROR IS MINE: I said the app has no way to send real email. IT DOES. sendMessageDraftByEmailAction (src/app/actions/messaging-outlook.ts:128) sends through the instructor OWN connected Outlook via Microsoft Graph (src/lib/microsoft-graph.ts:92), and for an announcement draft it ALREADY BCCs the course tile whole roster (messaging-outlook.ts:167-178). My grep for a mail-provider package was correct and my conclusion was not - it measured a DEPENDENCY, not a CAPABILITY. And my grep for code reading student emails was scoped to two directories; elsewhere, message drafts carry recipientEmail (message-drafts.ts:31) and the nudge path passes on emails from the gradebook CSV. The narrower claim survives: nothing reads the address CANVAS holds, and the roster readers never request include[]=email. SO THE OWNER HAS THREE OPTIONS, NOT TWO: (A) Canvas Inbox fan-out; (B) real email to the Canvas profile address via a new provider; and (B-prime) real email from the INSTRUCTOR CONNECTED OUTLOOK, which already exists and already reaches whole rosters, costing none of (B) - no provider, no sender domain, no bounce plumbing, and it arrives from the instructor rather than from Canvas. This is the same wrong-directory error the A21 row records, repeated by me the same day. CRITERIA: docs/a29-ac.md, C1-C17 plus L1. THREE FACTS THE CRITERIA MEASURED: the feature gate is canLms (courses-table-helpers.ts:603), and a failed roster read must send NOTHING and must keep not-connected separate from connected-but-unreachable; the roster readers stop SILENTLY at 20 pages of 100, about 2000 students (CANVAS_PAGINATION_PAGE_CAP); and A21 drafter produces MARKDOWN while every existing Inbox drafter asks for plain text, so reusing it as-is would put literal Markdown into students messages. RESIDUALS - CORRECTED, I MISRECORDED THESE ON FIRST FILING and the criteria check caught it: R1-R3 are in section 8, not 7, and they are OWNER BROWSER CHECKS, not API facts. R1: the owner verification items OV1-OV3 - owner, a real browser plus a Canvas sandbox, verify before the push. R2: under (A), Canvas notification delivery by email is entirely outside the app observation - owner, a test student own email inbox, at OV1. R3: the double-send guard, if the architect places it only in the component - owner, a real browser double-clicking confirm, at verify. SEPARATELY, the Canvas and Graph API facts that nothing here can measure (network blocked, no key) belong to a research pass before the build: whether Canvas native POST /conversations already bulk-sends to course_<id>_students, which enrollment states the roster query returns by default, whether a multi-recipient send creates a group conversation, and the Exchange Online sending limits that decide whether a per-student Outlook send can finish inside the 60s Vercel cap. R4: two existing roster readers use DIFFERENT enrollment-state filters (listings.ts:248 and :286 against :318) - owner of whichever build touches roster reading, instrument a fixture with each enrollment state, step that build. OWNER DECISIONS E1-E4 are listed in the criteria. A PRODUCT FORK THE SCOPE MUST NOT SETTLE BY DEFAULT, because the two readings are very different builds. (A) SEND THROUGH CANVAS INBOX: fan createConversation out across the roster. Canvas then delivers each message to the student by email according to THAT STUDENT notification preferences, it arrives from Canvas, and replies land in the instructor Canvas Inbox where the app already reads them. No email provider, no sender domain, no address handling, and it stays inside the LMS record. (B) SEND REAL EMAIL to the address on each Canvas profile: needs the app to READ student emails (Canvas exposes them only under certain permissions, so it may not be available for every institution), plus an email provider the app does not have, a verified sender domain, bounce handling, and it takes student addresses outside the LMS - a privacy decision in its own right. The owner wording, via the email they have in canvas, reads as (B); reading (A) reaches the same inbox for most students at a fraction of the cost. ORCHESTRATOR DEFAULT PENDING THE OWNER: FIRST (A), NOW SUPERSEDED BY (B-PRIME) - see below. THINGS EITHER READING MUST DESIGN FOR: a confirm step before a bulk send, since a mistaken send to a whole class cannot be recalled; rate limits on the Canvas API when fanning out; a per-recipient success and failure report rather than one aggregate; and the LEVERAGE question, since drafting a message is chat-equivalent - the credible advantage is the roster, the course context and the delivery, not the text. RELATED: A21 (announcement from a prompt) already drafts course-addressed text; reuse it rather than building a second composer. ALSO RELATED: an announcement already reaches every student - the scope should say plainly when a bulk message is the right tool and when an announcement is.'
  question: 'ANSWERED 2026-09-23: whether to measure the single-recipient Canvas behaviour first, or design a named refusal and ship without knowing. The owner chose the named refusal - see docs/owner-decisions-2026-09-23.md.'
