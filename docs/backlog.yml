ent.test.ts pin the moved markup to the panel and WILL go red - they are re-pointed at the leaf, never deleted, and a gate row counts it blocks before and after so a silent deletion cannot make the refactor green. RESIDUAL W1-3, WHICH THE SEAT CORRECTLY CALLED A DELETION RATHER THAN DRESSING IT UP: that the fieldset still LOOKS and BEHAVES identically after the move - tab order, fieldset and legend grouping, the autocomplete opening - has an owner and an instrument but NO STEP, because nothing renders under vitest here and the post-deploy visual check is suspended. It is an accepted, named gap. ALSO MEASURED AND WORTH KEEPING: three of the eight source-text readers reach the panel through a DIRECTORY WALK rather than an import, so a name-shaped grep does not find them at all. PLANNED 2026-09-21 TO docs/a16-plan.md, AND THE PLAN RESHAPES THE ROW: A16-1 AND A16-2 ALREADY SHIPPED, on 2026-09-20 at 6ecc226 and e9670d1, while this row still said unscoped with owns empty. GradingResults.tsx:593 already renders <ClassTrendsPanel entry={classTrendsEntry} defaultExpanded /> behind hasTrendableResults, and GradingRow carries a required rubricAreas at grading-row.ts:224 - so the scope doc''s chunking, its owns lists and its V and S series are HISTORY, NOT A PLAN. THE SHAPE IS A PANEL WITHIN EACH TOOL, NO NEW STRIP ENTRY, and the hardcoded strip counts provably do not move: recording-split.structure.test.ts readdirSyncs recording/ NON-RECURSIVELY and cannot see grading-recording/ at all (grep -c grading-recording on that file returns 0, with a canary proving the instrument fires). That is the argument the row already suspected was the stronger one. FOUR WAVES, ALL SEQUENTIAL: wave 0 is the REGRESSION baseline at entry 433; wave 1 is the panel headroom extraction gated on <= 945 lines by both counters; wave 2 is the run cohort plus an adapter leaf, the cohort disclosure line and the gated mount; wave 3 is Repo Grades, which scopes itself first. A16-4, SNAPSHOT GRADING, IS ROUTED