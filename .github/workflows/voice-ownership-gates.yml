name: Narrated Videos release gates
on:
  push:
    branches: [codex/voice-ownership-gates]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gate: [lint, types, regression, build, focused]
    env:
      TZ: America/Chicago
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 16e87ba101ef7b3e2cb012d380af9bb5b69e5393
          fetch-depth: 0
          persist-credentials: false
      - run: |
          test "$(git rev-parse HEAD)" = "16e87ba101ef7b3e2cb012d380af9bb5b69e5393"
          test "$(git rev-parse 'HEAD^{tree}')" = "6549aa21079754e19148cd1f6c903b2583684e5b"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - if: matrix.gate == 'lint'
        run: npm run lint
      - if: matrix.gate == 'types'
        run: npx --no-install tsc --noEmit
      - if: matrix.gate == 'regression'
        env:
          VITEST_MAX_WORKERS: '2'
        run: npm test
      - if: matrix.gate == 'build'
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: local-build-only
        run: npm run build
      - if: matrix.gate == 'focused'
        env:
          VITEST_MAX_WORKERS: '2'
        run: npm run test:paths src/app/actions/eleven-voice-library.test.ts src/app/actions/media-voice.guard.test.ts src/app/actions/media-voice.budget.test.ts src/app/components/lecture-videos src/lib/caption-burn.test.ts src/app/components/ui/modalAdoption.wiring.test.ts src/app/url-state.rec-view.test.ts src/lib/recording-launch.test.ts src/app/components/recording/recording-split.structure.test.ts src/file-size-ceiling.structure.test.ts
