  instrument: 'Measured 2026-09-20 from the repo root. NO UPLOAD PATH: grep -rni for upload, accept=, type="file" and videoFile across src/app/components/walkthrough-announcement/ returns exactly ONE hit, WalkthroughAnnouncementPanel.tsx:47 importing checkWireBudget/sumBase64WireBytes from lib/upload-budget for the frame wire budget - no file input exists. The capture is live: :515 calls start({ saveVideo: false }). THE SLOT MACHINERY IS SHIPPED: announcement-draft-slots.ts defines TemplateChoice at :50 with four kinds (default, pasted, saved, none), ResolvedTemplate at :60 with three (default cannot appear once a draft exists), Drafted at :68 carrying builtFrom as a REQUIRED field, FIRST_SLOT_ID at :44, choiceId at :148, defaultOptionLabel at :158, receiptLabel at :209, and a documented invariant at :216-225 that the dropdown always contains an option matching slot.choice - written after a bug where the dropdown showed one format while resolveChoice drafted from another. Multiple slots already exist and the panel at :886 tells the instructor to add another slot or use Regenerate when every slot is full. THE PROMPT SEAM: lib/walkthrough-announcement-prompt.ts exports buildWalkthroughAnnouncementPrompt at :266, renderOutlineBlock at :193, truncateMaterialsForPrompt at :93 and WALKTHROUGH_ANNOUNCEMENT_MATERIALS_CAP = 32000 at :78. There is a sibling lib/walkthrough-script-prompt.ts, so a SECOND prompt module for a second output shape is an established precedent in this exact feature. FILE SIZE, and it is the binding constraint: WalkthroughAnnouncementPanel.tsx is 979 lines against the 1000-line ceiling (wc -l), so 21 lines of headroom - any new control in that panel needs the extraction IN the chunk, not after it.'
  from: 'Owner, 2026-09-20'
  area: 'walkthrough-announcement-surface'
  kind: 'feature'
  note: 'OWNER SETTLED THIS 2026-09-20: TWO TONES OVER THE SAME CAPTURED PAGES (reading A below). Reading B - a midweek draft reflecting what has actually happened since the first announcement - is OUT OF SCOPE and must not be built or implied. The tool reads no gradebook, counts no submissions and has no memory of the earlier announcement, so any copy that SOUNDS like the midweek draft knows who is behind would be false confidence. The scope must state that limit explicitly and check no generated copy claims knowledge of student progress. The original fork is kept below because the rejected reading is what the guard exists to prevent. THE SCOPING QUESTION IS WHAT BEGINNING-OF-WEEK AND MIDWEEK ACTUALLY MEAN, and it must be settled before any code, because the two readings build different things. READING A - TWO TONES OVER THE SAME MATERIAL: one capture session produces a looking-ahead announcement (here is what is coming this week, what to start) and a checking-in one (you should be partway through, here is the common sticking point). Same captured pages, two prompts, two drafts. READING B - TWO TIMINGS: the midweek draft is meant to reflect what has happened SINCE the beginning-of-week one went out, which this tool cannot know - it has no gradebook read, no submission counts and no memory of the earlier announcement. READING A IS BUILDABLE TODAY AND READING B IS NOT, so the working assumption is A unless the owner says otherwise. If the owner means B, the honest version is still A plus an explicit disclosure that the midweek draft is written blind to actual student progress - a draft that SOUNDS like it knows who is behind while knowing nothing is the exact false-confidence failure this backlog already carries rows about. THE LIKELY SHAPE, to be confirmed by scoping rather than assumed: this is a per-slot ANNOUNCEMENT KIND that is ORTHOGONAL to the existing TemplateChoice - kind says what the announcement is FOR, choice says what FORMAT it copies - and conflating them would be wrong, because an instructor can reasonably want a midweek announcement in a saved exemplar format. Adding a fifth member to TemplateChoice is therefore the wrong move; a separate field is the right one. WATCH THE FROZEN INVARIANT at announcement-draft-slots.ts:216-225: the dropdown must always contain an option matching the slot state, and that rule exists because it was once violated. A second dimension multiplies the option set, so whatever enforces that invariant must be re-derived, not assumed to carry over. FOUR THINGS THE SCOPE MUST SETTLE: (1) the two readings above; (2) whether kind lives on the slot, the draft, or both - Drafted.builtFrom is REQUIRED precisely because an optional field let a caller omit it with every gate green, and the same argument applies here; (3) whether the two kinds share buildWalkthroughAnnouncementPrompt with a parameter or get their own module, with walkthrough-script-prompt.ts as the precedent for splitting - the default-arm-byte-identical technique this repo has used before is the safe way to add a parameter to a live prompt; (4) the panel''s 21 lines of headroom, which almost certainly forces an extraction into the same chunk. NO COMPONENT IS RENDERED BY ANY TEST HERE, so a new control cannot be verified by the suite - the reachability of whatever gets built must be traced from the control to the code by hand. RELATED: A17 (the regenerate control already exists but reads as absent - if a new per-slot control is added, it lands next to the one already being missed) and A18 (this tool should stop saying it records).'
