ludes grading-recording and whose FROZEN_PRIMARY_SITES pins GradingRecordingPanel at 3 with GradingTable and GradingTableRow at 0 - so the batch accept control moves one of those numbers; and page-module-css-orphan-classes.test.ts, which WRITES docs/css-orphans.md on every run, so any new CSS class makes the wave gate show a path the assignment does not list. ALSO CORRECTED, mine: the 77-object-literal figure behind the optional-field decision measures the wrong object - every row fixture funnels through a Partial<GradingRow> factory, so the true cost of REQUIRED is about ELEVEN (seven factory bases plus four bare oracle literals), not 77, and the architectural decision rested on a number an order of magnitude out. The 960 wave-0 target has no derivation against what A8-R actually adds to the panel, which is the exact gap Ruling D was created to close - derive it. And "three source headers forbid that crossing" is wrong on two of three: grading-submission-merge.ts:9-13 and grading-extraction-prompt.ts:9-14 ban reusing the DISCUSSION-CAPTURE helpers, not the snapshot directory; only snapshot-shot.ts:6-9 is on point. The conclusion survives on layering grounds but the citation does not. AND THE WEAKEST REQUIREMENT, which no ruling had touched: "the suggestion must render its BASIS". On the SNAPSHOT surface the basis discriminates because it is a transcript of a DIFFERENT shot. Here the basis would be a slice of the model''''s transcription of the submission, and GradingTableRow.tsx:259 already renders row.submissionText in full one block below - the evidence is the thing itself, restated, identical whether the model was right or wrong. That is a rubber stamp with a decoration on it, the very thing snapshot-role-suggestion.ts:21-23 exists to prevent. THE DISCRIMINATING BASIS HERE IS THE CUE, NOT THE TEXT: the @Name opener, a "Replying to" line, reply indentation, a thread position - what the model claims to have SEEN. Scope it that way or drop the basis requirement and