  title: 'Owner asked 2026-09-20: for each video uploaded to the announcement-from-walkthrough tool, offer to generate a BEGINNING-OF-WEEK announcement and/or a MIDWEEK one. Two corrections to the framing, both measured, and neither changes what the owner wants. (1) THE TOOL HAS NO VIDEO UPLOAD - there is no file input anywhere in it; it reads a live shared screen and discards the frames, so the per-item unit is A CAPTURE SESSION, not an uploaded file. (2) THE MULTI-DRAFT MACHINERY THIS NEEDS ALREADY EXISTS - draft slots, a per-slot template choice and a regenerate path are all shipped, so this is most likely a new CHOICE KIND plus prompt work, not a new subsystem.'
  owns: []
  verify: null
  blocked_by: []
  instrument: 'Measured 2026-09-20 from the repo root. NO UPLOAD PATH: grep -rni for upload, accept=, type="file" and videoFile across src/app/components/walkthrough-announcement/ returns exactly ONE hit, WalkthroughAnnouncementPanel.tsx:47 importing checkWireBudget/sumBase64WireBytes from lib/upload-budget for the frame wire budget - no file input exists. The capture is live: :515 calls start({ saveVideo: false }). THE SLOT MACHINERY IS SHIPPED: announcement-draft-slots.ts defines TemplateChoice at :50 with four kinds (default, pasted, saved, none), ResolvedTemplate at :60 with three (default cannot appear once a draft exists), Drafted at :68 carrying builtFrom as a REQUIRED field, FIRST_SLOT_ID at :44, choiceId at :148, defaultOptionLabel at :158, receiptLabel at :209, and a documented invariant at :216-225 that the dropdown always contains an option matching slot.choice - written after a bug where the dropdown showed one format while resolveChoice drafted from another. Multiple slots already exist and the panel at :886 tells the instructor to add another slot or use Regenerate when every slot is full. THE PROMPT SEAM: lib/walkthrough-announcement-prompt.ts exports buildWalkthroughAnnouncementPrompt at :266, renderOutlineBlock at :193, truncateMaterialsForPrompt at :93 and WALKTHROUGH_ANNOUNCEMENT_MATERIALS_CAP = 32000 at :78. There is a sibling lib/walkthrough-script-prompt.ts, so a SECOND prompt module for a second output shape is an established precedent in this exact feature. FILE SIZE, and it was the binding constraint: WalkthroughAnnouncementPanel.tsx measured 979 lines when this row was filed; today it is 985 (@(Get-Content src/app/components/walkthrough-announcement/WalkthroughAnnouncementPanel.tsx).Count in PowerShell, 2026-09-22), so 15 lines of headroom against the 1000-line ceiling, not 21. Any further control in that panel needs the extraction IN the chunk.'
  from: 'Owner, 2026-09-20'
  area: 'walkthrough-announcement-surface'
  kind: 'feature'
  note: 'OWNER SETTLED THIS 2026-09-20: TWO TONES OVER THE SAME CAPTURED PAGES (reading A below). Reading B - a midweek draft reflecting what has actually happened since the first announcement - is OUT OF SCOPE and must not be built or implied. The tool reads no gradebook, counts no submissions and has no memory of the earlier announcement, so any copy that SOUNDS like the midweek draft knows who is behind would be false confidence. The scope must state that limit explicitly and check no generated copy claims knowledge of student progress. The original fork is kept below because the rejected reading is what the guard exists to prevent. THE SCOPING QUESTION IS WHAT BEGINNING-OF-WEEK AND MIDWEEK ACTUALLY MEAN, and it must be settled before any code, because the two readings build different things. READING A - TWO TONES OVER THE SAME MATERIAL: one capture session produces a looking-ahead announcement (here is what is coming this week, what to start) and a checking-in one (you should be partway through, here is the common sticking point). Same captured pages, two prompts, two drafts. READING B - TWO TIMINGS: the midweek draft is meant to reflect what has happened SINCE the beginning-of-week one went out, which this tool cannot know - it has no gradebook read, no submission counts and no memory of the earlier announcement. READING A IS BUILDABLE TODAY AND READING B IS NOT, so the working assumption is A unless the owner says otherwise. If the owner means B, the honest version is still A plus an explicit disclosure that the midweek draft is written blind to actual student progress - a draft that SOUNDS like it knows who is behind while knowing nothing is the exact false-confidence failure this backlog already carries rows about. THE LIKELY SHAPE, to be confirmed by scoping rather than assumed: this is a per-slot ANNOUNCEMENT KIND that is ORTHOGONAL to the existing TemplateChoice - kind says what the announcement is FOR, choice says what FORMAT it copies - and conflating them would be wrong, because an instructor can reasonably want a midweek announcement in a saved exemplar format. Adding a fifth member to TemplateChoice is therefore the wrong move; a separate field is the right one. WATCH THE FROZEN INVARIANT at announcement-draft-slots.ts:216-225: the dropdown must always contain an option matching the slot state, and that rule exists because it was once violated. A second dimension multiplies the option set, so whatever enforces that invariant must be re-derived, not assumed to carry over. FOUR THINGS THE SCOPE MUST SETTLE: (1) the two readings above; (2) whether kind lives on the slot, the draft, or both - Drafted.builtFrom is REQUIRED precisely because an optional field let a caller omit it with every gate green, and the same argument applies here; (3) whether the two kinds share buildWalkthroughAnnouncementPrompt with a parameter or get their own module, with walkthrough-script-prompt.ts as the precedent for splitting - the default-arm-byte-identical technique this repo has used before is the safe way to add a parameter to a live prompt; (4) the panel''s 21 lines of headroom, which almost certainly forces an extraction into the same chunk. NO COMPONENT IS RENDERED BY ANY TEST HERE, so a new control cannot be verified by the suite - the reachability of whatever gets built must be traced from the control to the code by hand. RELATED: A17 (the regenerate control already exists but reads as absent - if a new per-slot control is added, it lands next to the one already being missed) and A18 (this tool should stop saying it records). THE SCOPE''S RESIDUAL REGISTER, WHICH LIVED ONLY IN docs/a19-scope.md SECTION 8 AND THEREFORE DID NOT EXIST (DEV_LOOP step 0; docs/backlog-reconciliation-2026-09-21.md section 2.3, cc12a8e). RES-1, RES-2 and RES-3 are discharged: the UX pass landed at 26bf0d0, the panel measures 985 lines today (@(Get-Content).Count, 2026-09-22) against the 1000 ceiling, and the sequencing question is moot now that all three commits are in. THE FOUR THAT REMAIN. RES-4, ACCESSIBILITY OF THE NEW PER-SLOT TIMING CONTROL. OWNER: the wave-3 accessibility seat. INSTRUMENT: reading the diff, and it must SAY it is a reading claim - no component is rendered by any test in this repo. STEP: the follow-up accessibility pass on the as-built diff. RES-5, WHETHER THE OWNER WANTS A STICKY PANEL-WIDE DEFAULT TIMING for new slots, which would be a named departure from this repo''s standing "every new control persists under a ta- key" rule. OWNER: the repo owner. INSTRUMENT: a direct question, batched, never gating - the per-new-slot default ships either way. STEP: if the owner wants persistence, the mount-effect requirement ships in the SAME commit that adds the ta- key, never as a follow-up, because a localStorage-seeded useState initializer never shows on reload. RES-6, THE OUTPUT-SIDE RECEIPT. Stated plainly: the guard this chunk shipped tests OUR OWN STATIC LITERAL - the string timingClause returns - and never the model''s actual output, because there is no API key here and every LLM path is mocked. A post-hoc check on the RETURNED announcement text for presumptive-progress language is the only mechanism that could ever check real compliance. OWNER: the repo owner (a scope question, batched with RES-5, non-gating). INSTRUMENT, if approved: a receipt function shaped like course-intel/ask/route.ts''s unexplainedStudentIndices, or the permitted-URL enforcer already running on this feature''s own model output. STEP: a future chunk. RES-7, THE TWO HONEST LIMITS OF THE 10c GUARD: a field named to evade the denylist (attendanceSummary, caughtUp) or added inside the nested AnnouncementOutline type rather than at the top level carries the banned meaning invisibly. OWNER: whoever next adds a field to WalkthroughAnnouncementPromptArgs, WalkthroughAnnouncementDraftInput or AnnouncementOutline - a reviewer convention, because semantic detection of "does this field represent progress" is not buildable here. INSTRUMENT: none automated; this residual IS the instrument. STEP: every future change to those three types, indefinitely. RES-8, leverage.md''s "not exhaustive" escape: this chunk''s leverage fact (generalizing an existing per-slot dispatch mechanism to a second field) maps onto no named class. OWNER: whoever next revises docs/loop/leverage.md. INSTRUMENT: none automated. STEP: the next revision of that file. RES-G4, from 33f7557''s own commit body: the untrusted-content framing enumerates its items while also claiming "everything below this line", and the two do not agree. OWNER: the architect seat, to which 33f7557 routed it. INSTRUMENT: read the framing block in src/lib/walkthrough-announcement-prompt.ts against its own enumeration. STEP: the next architect pass on this prompt. SHIPPED 2026-09-20: 3d2f07f is the feature, 26bf0d0 the UX-pass edits, and 33f7557 the guard-instrument replacement (which deleted the BAN_WHO/BAN_HOWMANY regexes after docs/a19-guard-gap-notes.md measured them catching zero of nine attack constructions, and replaced them with a frozen-literal oracle over timingClause plus a digit class under its own two-sided corpus). The title above still reads as a pre-scope feature request and is kept only as the record of what was asked; `unscoped` here now refers to the residuals below, not to the feature.'
- id: 'A20'
  state: 'verification'
  title: 'Owner asked 2026-09-20: on each of the recording pages, offer to AUTO-DOWNLOAD the video right after recording. Measured the same day: the blob already exists and is already held in memory on the paths that record at all - useDiscussionCapture.ts:465-479 builds it on recorder.onstop, creates an object URL and hands it to state. So the missing piece is the DOWNLOAD, not the recording. THE SCOPE QUESTION IS WHICH PAGES, because each of these recording pages is not one set: three capture surfaces pass saveVideo: false UNCONDITIONALLY and have no blob to download at all.'
  owns: []
  verify: null
  blocked_by: []
  instrument: 'Measured 2026-09-20. THE BLOB PATH EXISTS: useDiscussionCapture.ts:382 is start({ saveVideo }), :465 is the if (opts.saveVideo) branch, and :466-479 constructs a MediaRecorder, accumulates chunks, then on stop builds a Blob, calls URL.createObjectURL, and sets recordingUrl/recordingBytes state - with an explicit revoke when the component has unmounted. WHO PASSES TRUE: the discussion-replies path (useDiscussionReplies.ts:619 passes saveVideoRef.current, seeded from a persisted control at discussion-persisted-controls.ts:139 and exposed at :198) and the message-replies path (useMessageReplies.ts:592, control at MessageCaptureSettings.tsx:117 as a Checkbox, persisted at useMessagePersistedControls.ts:104 under its own storage key). So TWO surfaces already have a user-facing Save video checkbox. WHO PASSES FALSE, UNCONDITIONALLY - these have no blob and cannot download one without first being given the option to record it: GradingRecordingPanel.tsx:531, LegibilityProbeModal.tsx:168, and ModuleDeckCapturePanel.tsx:455. The last one is DELIBERATE and documented as an acceptance criterion in its own header at :30 and again at :126 (AC13 point 3: saveVideo is ALWAYS false, a recording blob never exists). The walkthrough-announcement tool also passes false (WalkthroughAnnouncementPanel.tsx:515). DOWNLOAD PRECEDENT ALREADY IN THE TREE, so nothing needs inventing: useTakes.ts:116 does the anchor-and-click with a computed filename and extension; courses-tab-helpers.ts:302-305 is the same shape; announcementImagePipeline.ts:116 documents the createObjectURL/anchor/click/revoke dance and is a no-op when there is nothing ready. Re-measure the surface set with: grep -rn saveVideo src --include=*.ts --include=*.tsx | grep -v .test.'
  from: 'Owner, 2026-09-20, mid-turn'
  area: 'recording-capture-surfaces'
  kind: 'feature'
  note: 'db747cc IS AN UNRELATED MENTION, answered 2026-09-22 when the new shipped-but-uncited guard flagged it. That commit is titled docs(a18-scope): relocate AC-5 off recording-split.structure.test.ts to stay disjoint from A20, and it names A18 and A20 only to explain a FILE-SET DISJOINTNESS decision between them. What it actually carries is 799 lines across 18 files of A8-R production code (git show --stat db747cc), which is recorded on A8. So this row shipped nothing in that commit, and the guard is right to have asked: a commit whose message describes a docs relocation while carrying another row''s code is exactly the bookkeeping this project has been bitten by. A20 SHIPPED at 13cef3b (feat(a20): auto-download the recording on stop, discussion plus message replies), with an aria-describedby follow-up at 36aaad3 and a UX pass on the as-built diff at bab26ad - and this row still read unscoped with round-2 check in flight. It is the THIRD row found stale this way on 2026-09-21, after A18 and A21, which makes it a pattern rather than an incident: work ships and the row is never told. RECLASSIFIED TO verification because the only thing left is the item this row already named as the one that matters and the one this checkout cannot discharge: WHETHER A REAL BROWSER ALLOWS THE DOWNLOAD. A programmatic download fired from recorder.onstop is not adjacent to a user gesture, and the failure mode is NO FILE AND NO ERROR. Owner, in a real browser, on both surfaces: record, stop, and check that a file actually arrives. SCOPED to docs/a20-scope.md; round 2 at 886b32d, round-2 check in flight. ITS RESIDUALS ARE RECORDED HERE because DEV_LOOP step 0 says a residual that is not in the backlog does not exist, and the scoping seat could not reach this file (its write scope was its own artifact). Live in docs/a20-scope.md: residuals R1-R5, two batched owner questions in section 13, and the section 8 OWNER-VERIFICATION item. THE OWNER-VERIFICATION ITEM IS THE ONE THAT MATTERS AND IT CANNOT BE DISCHARGED IN THIS CHECKOUT: a browser may REFUSE a programmatic download that is not adjacent to a user gesture, and recorder.onstop is an event callback, not a click. The failure is NO FILE AND NO ERROR. Nothing here can observe it - vitest is node-env and renders no component - so a real browser on both surfaces is the only instrument, and a green suite must never be read as covering it. THREE ORCHESTRATOR RULINGS ARE ALREADY BAKED IN and must not be re-argued: the auto-download uses the house triggerFileDownload helper (both in-scope files already import it, and one carries a header rule saying never to hand-roll the alternative); ONE extension rule serves BOTH the auto-download and the manual link, because letting them diverge would put two names on one recording with one of them unopenable; and the post-stop UI MUST DIFFER between auto-download-requested and not, since the pre-existing link renders identically in all three outcomes and therefore cannot disclose a silent failure. THAT LAST ONE CORRECTS THIS ROW: the note below originally nominated the existing review link as the visible fallback, and that was the defect, not the fix. OWNER SETTLED THIS 2026-09-20: JUST THE TWO THAT ALREADY RECORD - discussion replies and message replies. GROUP 2 IS OUT OF SCOPE AND STAYS OUT. Do not add recording to the grading-from-a-recording panel, the legibility probe, the module deck capture or the walkthrough announcement tool, and DO NOT touch ModuleDeckCapturePanel.tsx ACCEPTANCE CRITERION AC13 point 3 (its header at :30 and :126, a recording blob never exists) - that AC stands. A scope or an implementer that widens saveVideo on any group-2 surface has exceeded this row. The group-2 analysis is kept below because it is the reason the boundary exists, not a pending option. THE ASK IS SMALL ON TWO SURFACES AND A DIFFERENT FEATURE ON THE OTHERS, and the scope must not blur them. GROUP 1 - DISCUSSION REPLIES AND MESSAGE REPLIES: these already record on request and already hold the blob. Auto-download here is genuinely just a second persisted control (Download automatically when recording stops) plus a call into the existing anchor-and-click helper at the point where recorder.onstop already fires. This is the part that matches the owner words right after recording exactly. GROUP 2 - GRADING FROM A RECORDING, THE LEGIBILITY PROBE, THE MODULE DECK CAPTURE AND THE WALKTHROUGH ANNOUNCEMENT: these pass saveVideo: false unconditionally, so there is NO VIDEO TO DOWNLOAD. Giving them auto-download means first giving them the ability to record at all, which is a materially larger change with a privacy dimension - these surfaces read gradebooks, student submissions and LMS pages, and the module-deck one has a WRITTEN ACCEPTANCE CRITERION (ModuleDeckCapturePanel.tsx:30 and :126, AC13 point 3) that a recording blob never exists. DO NOT QUIETLY REVERSE A DOCUMENTED AC TO SATISFY A FEATURE REQUEST - if the owner wants recording on those surfaces, that is an explicit decision with its own row, and the AC and its comment must be rewritten to say why, the way A16-2 handled reversing a pinned assertion. RECOMMENDED SHAPE: ship group 1 now as the literal reading of the ask, and put group 2 to the owner as one batched non-gating question naming the privacy trade and the documented AC. THINGS THAT WILL BITE. (1) EVERY NEW CHECKBOX MUST PERSIST ACROSS RELOADS in this repo, and a localStorage-seeded useState initializer NEVER SHOWS on reload without a mount effect - React only warns on the hydration mismatch. Both existing saveVideo controls are the pattern to copy. (2) A BROWSER MAY BLOCK A PROGRAMMATIC DOWNLOAD that is not user-gesture-adjacent, and recorder.onstop is an event callback, not a click. The failure mode is silent - no file, no error - and NOTHING IN THIS SUITE CAN SEE IT, because vitest is node-env and no component is rendered by any test. Whatever ships needs a visible fallback (the existing review link) and an owner verification row, not a green suite. (3) THE OBJECT URL LIFETIME: the current code revokes only on unmount-before-stop. An auto-download adds a second consumer of the same URL, so decide ownership explicitly rather than revoking under the anchor. (4) FILENAME: useTakes.ts:116 already computes a safe name and extension - reuse it rather than minting a second convention, and note the recorder mime type is negotiated (pickRecorderMimeType), so the extension is not always webm. BASELINE AND ONE RESIDUAL CLOSED, 2026-09-23. A20 shipped with NO regression baseline at all: a coverage grep over docs/REGRESSION.md returned two hits for A20/auto-download and both belonged to the workflow lecture-zip, neither to a capture surface. 719d88b appends REGRESSION 435, recording what the code does at HEAD - one download call at useDiscussionCapture.ts:513 serving both the Discussion and Message surfaces, BOTH stop paths (the app button and the browser sharing bar via the track ended listener at :451, which the copy advertises), the post-stop contract binding the line to the stopped session''s own request, and the one-extension rule keeping the auto-download filename and both manual links in agreement. 6be7aa8 then closes that entry''s first residual, BL435-1: the ordering that makes the manual link survive a REFUSED automatic download - setRecordingUrl at :503 before triggerFileDownload at :512-517 - had no executing enforcer, with a grep for setRecordingUrl across every test file returning 0 against a canary of 14 for triggerFileDownload. The new test RUNS the hook and asserts an observed marker sequence rather than reading source text, and it was watched failing with the download moved above the state setters while all nine pre-existing source-text tests in the same file stayed green - which measures how little they were covering. It carries a second assertion guarding the INSTRUMENT, because the setter is identified by a magic slot index into the hook''s useState order: insert a useState above recordingUrl and the marker moves to the wrong setter, and the failure would arrive disguised as an ordering violation that never happened. That guard was proven by inserting one and watching it name the real cause. WHAT REMAINS OPEN, and why this row stays in verification: a browser''s refusal of the automatic download is UNDETECTABLE in JS as written - triggerFileDownload returns void and nothing reads a result - and nothing renders under vitest here, so whether any real browser honours the download, and whether the two new checkboxes rehydrate after a reload, are owner-only checks. docs/a20-owner-check.md carries both, now including the sharing-bar stop path, and REGRESSION 435 carries residuals BL435-2/3/4 routing them. ALSO RECORDED THERE, not fixed: a throw inside recorder.onstop reaches no user, because the try/catch at :491/:524 wraps only recorder construction and start(), and onstop runs in a later task.'
- id: 'A21'
  state: 'verification'
  title: 'Owner asked 2026-09-20: a feature that generates an announcement FROM A PROMPT, with a template OPTIONALLY supplied. CORRECTED 2026-09-20 - THIS ROW ORIGINALLY CLAIMED THE PROMPT HALF DID NOT EXIST, AND THAT WAS WRONG. Both halves already ship, in different surfaces, with nothing between them: a mounted free-prompt field at Manual rail > LMS > Announcements, and a persisted saved-exemplar library with a four-kind template choice whose none member already means draft without a template. SO A21 IS A JOIN, NOT A NEW SOURCE - and the join genuinely does not exist, because the template-carrying surface refuses an empty materials input and therefore cannot be driven from a prompt alone.'
  owns: []
  verify: null
  blocked_by: []
  instrument: 'RE-MEASURED AND CORRECTED 2026-09-20, twice - by the A21 architect pass and then independently by its checker, which opened every link. THE ORIGINAL VERSION OF THIS FIELD SAID THERE IS NO FREE-PROMPT ENTRY POINT ANYWHERE. THAT WAS FALSE, and the mistake is worth keeping: the grep behind it was scoped to src/lib, so it was a correct negative ABOUT THAT DIRECTORY and an incorrect inference about the tree. THE ATTENDED PROMPT PATH, verified end to end: announcements-panel.tsx:87 calls draftAnnouncementAction(draftPrompt.trim(), provider) behind a mounted TextField labelled "Draft with AI (optional)" at :218-241, reached via manual-rail.ts:57 (id lms-announcements), mapped at manual-rail.ts:213, rendered at ContentTab.tsx:774-775 -> page.tsx:554 -> CanvasTab.tsx:12. REACHABILITY WAS CHECKED AGAINST THE TWO FAILURE MODES THIS REPO HAS SHIPPED: the announcements branch at ContentTab.tsx:772-777 sits ABOVE the !loaded guard so it renders with no course loaded, TabRail.tsx (94 lines) contains no details/summary/collapse tokens so the rail is flat and one click, and no flag gates it. THE UNATTENDED PROMPT PATH: steps.announcements.ts:213-249, step type draft-announcement, a single required longtext input named instruction, handed to the same action at :236. Third caller at lms-generation.ts:495. The action itself is messaging.ts:405. WHY THE JOIN IS STILL MISSING: draftWalkthroughAnnouncementAction refuses an empty materialsText at walkthrough-announcement.ts:395, so the only template-carrying composer cannot be driven from a prompt alone. THE TEMPLATE HALF, shipped: announcement-exemplars.ts is a complete persisted library (listAnnouncementExemplars, getMostRecentAnnouncementExemplar, saveAnnouncementExemplar, deleteAnnouncementExemplar), and announcement-draft-slots.ts declares TemplateChoice at :60 (four kinds) and ResolvedTemplate at :70. CITATIONS IN THIS FIELD WERE ALSO STALE and are corrected here: buildWalkthroughAnnouncementPrompt is at :321 not :266, the materials cap at :91 not :78, renderOutlineBlock at :243 not :193, TemplateChoice at :60 not :50, ResolvedTemplate at :70 not :60. Re-derive with: grep -rn "draftPrompt" src --include=*.tsx --include=*.ts | grep -v "\.test\."'
  from: 'Owner, 2026-09-20'
  area: 'announcement-composition-surfaces'
  kind: 'feature'
  note: 'A21 ALREADY SHIPPED, AND THIS ROW DID NOT SAY SO FOR 48 COMMITS. It landed at bc950c4 on 2026-09-20 while the row still read unscoped with empty owns and verify, and I briefed a checker on 2026-09-21 to gate its BUILD - ruling from the backlog doc instead of the tree, which is the exact mistake this row itself records. The checker caught it. WHAT THE CHECK OF THE SHIPPED CODE FOUND: the production code is believed correct, but its TESTS let real defects through. THE FOURTH ONE-LAYER-UP INSTANCE EXISTS, and this row predicted it: six mutants at the action and route stay green, including one that reintroduces the 896-token truncation the design exists to prevent, one where a saved template is silently ignored, and one where a templated draft posts as PLAINTEXT so its headings appear literally. The fix is a change of kind - capture the whole request handed to the model and assert it deep-equals what the route produces, across all three template kinds - not a seventh per-value test. ALSO: the post handler''s pin tests presence rather than meaning, so flipping which poster is chosen passes; the only guard that the typed prompt restores in a useState initializer rather than a forbidden mount effect was withdrawn in a restructure, and the mount-effect mutant WIPES THE PROMPT ON EVERY RELOAD while passing; the import walker has A23''s regex hole and should reuse walkRuntimeGraph; and two shipped tests assert expect(true).toBe(true). Instrument fixes dispatched against the shipped files. OUTSTANDING AFTER THEM: a REGRESSION entry for bc950c4, which does not exist. CORRECTED 2026-09-20 BY THE A21 ARCHITECT PASS, AND THE CORRECTION IS TO THIS ROW''S CENTRAL CLAIM. THIS ROW SAID THE PROMPT HALF DOES NOT EXIST. IT DOES. Measured: announcements-panel.tsx:87 calls draftAnnouncementAction(draftPrompt.trim(), provider) behind a shipped, mounted field labelled "Draft with AI (optional)" at :218-241, reachable at Manual rail > LMS > Announcements (manual-rail.ts:57 -> ContentTab.tsx:774 -> CanvasTab.tsx:12). A SECOND free-prompt path runs unattended at steps.announcements.ts:214-249, a workflow step whose only input is a required longtext instruction. MY GREP WAS SCOPED TO src/lib AND THE GREP WAS RIGHT - THE INFERENCE WAS NOT. A negative measured over the wrong directory is still a negative about that directory, not about the tree, and this is the second time a scoping pass on this backlog has concluded a surface is absent when it was simply somewhere else. SO A21 IS A JOIN, NOT A NEW SOURCE: both halves ship, in different surfaces, with nothing between them - this repo''s own recorded library-and-endpoint-with-no-surface failure, one level up. SECOND REFUSAL, also correct: this row claimed the forbidden-completeness-phrase refusal protects the other announcement generators. It lives at class-trends.ts:27, on the GRADING path, and is on NO announcement path at all - A21 inherits it from nowhere, and it is a phrase denylist anyway, which this backlog has now measured to be worthless as a guard. SCOPED to docs/a21-scope.md - round 2 at commit a95c762, 1942 lines. THE state FIELD STILL READS unscoped AND THAT IS CORRECT, not a contradiction: this repo derives scoped-ness from the row carrying a non-empty owns AND a non-empty verify (types.ts isScoped), not from whether a scope document exists. There is no scoped state in BACKLOG_STATES. A21 has a finished design and empty owns/verify, so it reads unscoped until those are populated from the artifact - populating them is what makes it dispatchable. Round-2 check returned 3 blockers, all disposed to the test seat as missing or mis-bound INSTRUMENTS rather than to a fourth authoring round, per the iteration caps; their notes are docs/a21-instrument-notes.md. DO NOT hand an implementer the whole scope document: sections 4, 5, 7, 8.1, 9 and 10 are the build packet, and sections 1-3 and 11-16 are argument addressed to the checker and the orchestrator. PLACEMENT RECOMMENDATION: upgrade announcements-panel.tsx in place (349 lines, ~650 of headroom), priced against the walkthrough panel at 985/1000 with a five-key canary, a thirteenth strip entry moving three hardcoded counts, and a new rail destination behind a tsc-checked Record. LEVERAGE: GUARANTEED, earned - the posted body provably contains no URL absent from the inputs, held in TypeScript AFTER the model returns, and stripUnpermittedUrls has exactly ONE application site today (walkthrough-announcement.ts:496) out of four announcement paths. No advantage is claimed for the generation itself. The three-way call is the owner''s. TWO BUGS THE DESIGN WOULD HAVE SHIPPED, both caught by reuse survey rather than by a test: renderOutlineBlock on an empty outline returns "The exemplar had no discernible structure", which is FALSE for the no-template case where no exemplar was supplied; and the walkthrough token clamp yields 896 against the plain path''s 1024, so naive reuse SILENTLY TRUNCATES the no-template output. RESIDUALS, RECORDED HERE IN SUBSTANCE rather than as a pointer, because DEV_LOOP step 0 says a residual that lives only in another document is the same deletion with extra steps - and because a pointer goes stale, as this one did within one round. AFTER ROUND 2 they are RES-1 to RES-9, and round 1''s RES-5, RES-6 and RES-9 were reclassified as owner questions Q4, Q5 and Q2. WHAT IS ACTUALLY OUTSTANDING AND WHO OWNS IT: (a) whether the typed prompt survives a reload - owner, a real browser, the owner-verification pass; (b) whether a live model OBEYS the two-region framing at all - owner, a real browser plus a live key, same pass; nothing in this checkout can test model output; (c) whether the saved-exemplar routing reaches the composer end to end - owner, a real browser against real Supabase; (d) that nothing here can prove the Draft click does not also invoke the poster, because the panel is a .tsx that legitimately imports both actions and no component is rendered by any test - this one has an explicit non-discriminating sabotage row so no criterion is credited with catching it; (e) an out-of-scope defect worth its own row: postWalkthroughAnnouncementAction passes four of the SIX parameters createAnnouncementFromMarkdown accepts (announcements.ts:420-426), dropping delayedPostAt, so the walkthrough surface cannot SCHEDULE an announcement although the library beneath it can. RES-10 IS NOW ROW A32, filed 2026-09-22 with an owner, an instrument and a step; the measured figure is FOUR of SIX parameters, not four of five - the duplicated sentence that stood here said both. TWO THINGS LANDED 2026-09-20 THAT CHANGE WHAT THIS ROW OWES. (1) THE OUTLINE GAP WAS WORSE THAN TWO PASSES REPORTED. Mutant M14 - the composer ignores args.outline and always renders the empty arm, which is exactly the instructor picks a saved format and the draft ignores it failure - was reported by the round-3 checker as killed only by AC-5(d) and AC-7(b). Re-measured against the REAL minted header constant: AC-5(d), AC-5(f) AND AC-7(b) ARE ALL GREEN UNDER M14. The kill count of two was really ZERO, and the disposal round''s honest limit was understated rather than merely honest. Closed by a new variance instrument, AC-5(g): vary the OUTLINE, hold the kind fixed, assert the composed prompt differs - built as a rule over the four fields renderOutlineBlock actually reads, with the two it never reads held EQUAL so attribution stays clean. Proven by a rebuilt reference: 12/12 green on a correct composer, and six mutants executed, including a no-op control that must survive. The instructive one is MV2, a JSON.stringify echo: it DEFEATS a bare variance check, which is why the clause set also carries a containment and an attribution clause. (2) A NEW GAP ONE LAYER UP, RES-12, recorded here because DEV_LOOP step 0 says a residual that is not in the backlog does not exist. AC-18 proves the outline reaches the REQUEST and AC-5(g) proves the COMPOSER uses what it is handed, but NOTHING PROVES THE ACTION THREADS request.outline INTO THE COMPOSER. An action that builds composer args with EMPTY_ANNOUNCEMENT_OUTLINE is green on both and reproduces M14 one layer up. Owner: the implementer''s sabotage pass. Instrument: drive draftPromptAnnouncementAction under a mocked llm module, capture the text handed to callLlm, and apply the containment and attribution clauses to it - the production path, never importing the composer into the action''s test. Step: the wave writing src/app/actions/prompt-announcement-draft.ts. Named mutant M21. WATCH THIS PATTERN: the same one-layer-up shape has now bitten this row THREE times - the action holding promptText independently of the route union, the nonce being fresh at the leaf but constant at the call site, and now the outline. Whoever builds this should assume the fourth instance exists and go looking rather than waiting for a checker to find it. THE REUSE IS THE WHOLE POINT, and getting it wrong is the main risk. A21 must NOT mint a second template notion: TemplateChoice plus the exemplar library already answer with a template optionally supplied, including the none case, and this repo has a recorded class where a capability shipped twice because the first copy was not found. Survey before building - the scope owes a vetted list of what it reuses versus what it adds, and the answer should be mostly reuse. THE REAL DESIGN QUESTION IS WHERE THIS LIVES. A prompt-driven announcement has NO CAPTURE STEP, so it does not belong behind a screen-share flow, and the three existing generators are each welded to their own material source. Candidates: a fourth mode inside an existing announcement surface, or its own small surface. The owner has separately asked (A18) to stop this area pretending to record things and (A16, top priority) to STOP BUILDING DESTINATIONS - a thirteenth tab in the tools strip is exactly the shape that was rejected there, and the strip has HARDCODED COUNTS in recording-split.structure.test.ts that a new entry moves. Weigh that before proposing a new tab. THE LEVERAGE QUESTION IS SHARP HERE AND MUST BE ANSWERED HONESTLY, because generate text from a prompt is the single thing a plain chat with an LLM does best. docs/loop/leverage.md requires naming what this app does that a chat cannot, and the credible answers are all about the SURROUNDINGS rather than the generation: the saved exemplar library means the draft matches THIS instructor''s established format; the course context and knowledge base are already resolvable; the result can be posted to the right Canvas course; and the same anti-injection framing, link guard (walkthrough-announcement-link-guard.ts) and completeness-phrase refusal that protect the other generators apply. IF THE SCOPE CANNOT NAME A LEVERAGE CLASS BEYOND drafting text, SAY SO PLAINLY rather than inventing one - an honest no claim is a legitimate result and the card says to record the fired trigger. FOUR THINGS THE SCOPE MUST SETTLE: (1) what the prompt IS - a topic line, a full brief, or bullet points - and whether course/module context is auto-attached or purely typed; (2) whether the output joins the existing draft-slot machinery (getting regenerate, template choice, copy and post for free) or stands alone, with the click cost of each priced; (3) what happens with NO template - the none kind exists but what it produces must be specified, not left to the model; (4) whether the prompt persists across reloads, which in this repo is a REQUIREMENT for every new textbox, and note the mount-effect rule is NARROWER than this row first stated: measured at LectureScriptPanel.tsx:46-54, it applies to a BOOLEAN rendered as a checked control, not to a text input. A21''s prompt box is a text input and uses the guarded-initializer idiom already in its own file at announcements-panel.tsx:24-26. An implementer who adds a mount effect here is building what the scope forbids. GUARDS THAT MUST CARRY OVER: instructor-typed text reaching a prompt is an INJECTION SURFACE - the walkthrough path already frames untrusted material with a header it never reformats, and a typed prompt is strictly more attacker-shaped than a captured page. The link guard must apply here too. NOT the forbidden-completeness-phrase refusal - see the correction above; it is on the grading path only, A21 inherits it from nowhere, and it is a phrase denylist, which this backlog measured at 0 of 9 attacks caught. RELATED: A19 adds an announcement TIMING dimension to the walkthrough tool and A18 rewords it; if A21 lands in the same surface, sequence it behind both. SHIPPED: bc950c4 and 91ede74, the latter being the instrument-fix pass ("The whole request handed to the model is now compared... Two expect(true) tests deleted"); its --stat was read, its assertions were not. STATE CORRECTED 2026-09-22 from actionable to verification: (a) through (d) above are all owner items needing a real browser or a live key, and the one agent-buildable defect left in this row - RES-10 - has moved to A32. STILL OWED AND NOT OWNER-BLOCKED: a REGRESSION entry for bc950c4, which does not exist - re-measured 2026-09-22, grep -acE "(^|[^A-Za-z0-9])A21([^0-9]|$)" docs/REGRESSION.md returns 0 (canary: the same instrument returns 8 for A16). OWNER: the baseline seat. INSTRUMENT: that grep, greater than 0. STEP: before this row is closed.'
- id: 'A22'
  state: 'unscoped'
  title: 'A16-1 added grading-results/classTrendsEntry.ts, which TYPE-ONLY imports GradingRun and GradingRunEntry from the banned @/lib/grade barrel rather than @/lib/grade/types. A12/A13''s completeness guard cannot register the file without failing BANNED_IMPORT_PATTERNS, which does not distinguish a type-only import from a value import. The A12/A13 implementer refused to silently weaken the guard or to edit a file outside its owns, and instead added a NAMED, DOCUMENTED carve-out. That carve-out is the debt this row closes.'
  owns: []
  verify: null
  blocked_by: []
  instrument: 'Found 2026-09-20 by the A12/A13 implementer while making its R4 directory-completeness sweep pass; recorded rather than papered over. The carve-out is KNOWN_UNREGISTERED_LOCAL_FILES - which has MOVED since this row was filed and now lives at src/app/components/grading-results/gradingResultsHelpersWiring.test.ts:81-84 with its consuming filter at :142, relocated when gradingResultsHelpers.test.ts was split at 999 lines against a 1000 ceiling, following this repo''s existing DELIBERATELY_UNREGISTERED idiom so it is visible in the test file rather than hidden. The offending import is in src/app/components/grading-results/classTrendsEntry.ts (46 lines, added by A16-1 in commit 6ecc226). The guard it collides with is BANNED_IMPORT_PATTERNS, whose entries are anchored to the @/lib/grade alias. NOTE the same commit also added FilesCell.tsx without registering it in CLIENT_FILES; the A12/A13 implementer registered that one directly after verifying it carries no banned imports, so FilesCell is CLOSED and only classTrendsEntry remains. Re-measure with: grep -n "@/lib/grade" src/app/components/grading-results/classTrendsEntry.ts'
  from: 'A12/A13 implementer, 2026-09-20, flagged as a follow-up rather than fixed out of scope'
  area: 'grading-run-survival-and-disclosure'
  kind: 'chore'
  note: 'TWO LEGITIMATE FIXES AND THE CHOICE IS A DESIGN CALL, not a cleanup. (1) CHANGE THE IMPORT to @/lib/grade/types, which is the narrow specifier A12/A13''s Ruling R deliberately exempted. Cheapest, and it makes the carve-out unnecessary. Check first that every symbol the file needs actually lives in types.ts - Ruling R exempted types.ts precisely because it is the type surface, and the A12/A13 round also added a guard that types.ts itself stays free of value imports, so widening what flows through it is not free. (2) TEACH THE GUARD to distinguish a TYPE-ONLY import from a value import, and accept type-only barrel imports explicitly. More honest if other files will hit this, but note the A12/A13 round ALREADY REPLACED a regex guard here with a walled-set check after the regex was shown to miss export-from, export-star, require and dynamic import - so do not reintroduce a regex-shaped answer. WHY THIS IS WORTH A ROW RATHER THAN A DRIVE-BY: a named carve-out is a guard with a hole in it, and this repo''s recorded failure mode is exactly an instrument that reads clean while measuring less than it claims. The carve-out is currently CORRECT and VISIBLE; it becomes a defect the moment a second file is added to it without argument. Whoever takes this should also decide whether the carve-out list should exist at all once the one entry is gone - an empty escape hatch invites use. SHIPPED 2026-09-20 at 7375a21, which narrowed the specifier and deleted KNOWN_UNREGISTERED_LOCAL_FILES outright - which also answers this row''s closing question about whether the carve-out list should exist at all: it does not any more. RES-A22-1 was discharged in substance by 4dad288, which replaced the raw-source pattern guard with an AST walk. RES-A22-4, FROM docs/a22-scope.md SECTION 11 AND RECORDED NOWHERE ELSE: seventeen other files type-only-import from a barrel the same way classTrendsEntry.ts did, so the same collision is latent wherever the next guard is added. The scope doc assigned it to "a note on whichever row adds the next sweep" and no such row was ever named, which is the deletion. OWNER: whoever adds the next import guard in this directory. INSTRUMENT: re-derive the set with the same walk 4dad288 shipped rather than reusing the number 17, which is a FLOOR taken from the scope doc and not re-measured by this reconciliation. STEP: the next chunk that adds or widens an import guard under src/app/components/grading-results/. RES-A22-3 (whether A23''s directoryRoots enumerates .js files and subdirectories) is NOT settled: it needs someone to read directoryRoots in src/lib/module-graph/runtime-import-graph.ts. OWNER: whoever closes this row. INSTRUMENT: that file. STEP: this row''s closure - it must not be closed without it.'
- id: 'A23'
  state: 'verification'
  title: 'A SHIPPED GUARD IS BROKEN IN BOTH DIRECTIONS, found 2026-09-20 by the A22 scoping pass while it was rejecting a proposal to build a second one like it. The type-only import classifier at repoGradesFeedbackAndFiles.wiring.test.ts:295-297 collects ONLY lines matching /^\s*import\b/, so a MULTI-LINE VALUE IMPORT of the banned @/lib/grade barrel is never tested at all - and separately it flags an inline all-type import that should pass. This is live code, in a different directory from A22, and nothing downstream knows the guard is hollow.'
  owns: []
  verify: null
  blocked_by: []
  instrument: 'EXECUTED 2026-09-20 by the A22 architect pass, against the real classifier extracted from the file. Three probes, three results: a single-line VALUE import was flagged (want true) - TRUE, correct; a MULTI-LINE VALUE import was flagged (want true) - FALSE, a false negative; an inline all-type import was flagged (want false) - TRUE, a false positive. So the guard misses the thing it exists to catch AND fires on the thing it exists to permit. The mechanism is the line filter: an import whose specifier sits on a later line never matches /^\s*import\b/ on the line carrying the banned path, so it is never classified at all. Re-measure by extracting the classifier body and running it against three fixtures, not by reading it - the reading is what made it look fine for however long it has shipped. Located at src/app/components/repo-grades/repoGradesFeedbackAndFiles.wiring.test.ts:295-297.'
  from: 'A22 architect pass, 2026-09-20, found while rejecting a proposal to build a second classifier like it'
  area: 'grading-run-survival-and-disclosure'
  kind: 'bug'
  note: 'WIDENED 2026-09-20, SAME DAY, BECAUSE A SECOND GUARD OF THE SAME FAMILY MEASURED BROKEN - AND THIS ONE IS THE REPLACEMENT THE ORCHESTRATOR ORDERED FOR THE FIRST. A12/A13 Ruling U3 withdrew a regex guard after it was shown to miss export-from, export-star, require and dynamic import, and replaced it with a WALLED-SET check asserting that src/lib/grade/types.ts contains exactly one from-clause. That replacement lives at gradingResultsHelpersWiring.test.ts:128-130 (the filter) with its frozen literal at :131 - RE-PINNED 2026-09-20 AFTER A22 LANDED AT 7375a21 AND MEASURED, not predicted: the file went 218 to 241 lines, and the U3 block moved from :122-131 to :123-132, its it( to :123, its filter from :127-129 to :128-130. The predicted +1 for lines at or past :86 held exactly and it tests line.includes of a DOUBLE-QUOTED from clause ONLY. Five hazards executed against the real types.ts: a double-quoted server import is CAUGHT; a SINGLE-QUOTED server import, a require(), a dynamic import() and a single-quoted export-star ALL PASS. So TWO of the four constructs that got the original regex withdrawn still escape its replacement, and single-quoting defeats the other two. docs/a12-a13-scope.md:862-864 claims the replacement can only be defeated by an unusually-formatted comment; that is FALSE. THIS IS A DEFECT AGAINST THE ORCHESTRATOR''S OWN RULING, recorded as such: I ordered a walled set, accepted the words walled set, and never ran it - which is the same failure this row exists to document, committed by the person ruling on it. It matters because types.ts is NOT a pure types file (it already ships composeOverallComment, RESUBMIT_NOTICE, isUngraded, gradedResults and ungradedResults as value exports) and because A22 inherited the belief and was about to hand it forward to the next directory that grows a sweep. SO THIS ROW NOW COVERS TWO GUARDS, not one, because they are the same class with the same corrective rule: a text filter inferring import intent, defeated by a form nobody enumerated. Fix them together or neither. A THIRD INSTRUMENT NOTE, carried from the A22 check: whoever takes this must state WHICH DIRECTION each frozen fixture pins - the third repo-grades fixture currently pins WRONG behaviour, so freezing all three as canaries without saying so would freeze the bug. SEQUENCING, RULED 2026-09-20 AND NOT OPTIONAL: A23 IS NOT CONCURRENTLY DISPATCHABLE WITH A22, AND A22 GOES FIRST. Widening this row to cover the U3 filter put it in the SAME FILE as A22 - gradingResultsHelpersWiring.test.ts is one of A22 two files - so they intersect BY EXACT PATH, which parallel-disjointness.md:12-14 makes disqualifying, and in the second sense too: A22 AC-3 pins the U3 frozen literal as a criterion, so A22 designs against the very fact A23 is chartered to change, which is the failure that passes every file-level check and is invisible until integration. THAT COLLISION IS THE ORCHESTRATOR DOING, not either author: I widened this row after A22 was scoped and did not re-derive the intersection. LINE SHIFT, OWED BY ME AFTER A22 LANDS: A22 edits net +1 for every line at or past :86, so the U3 block moves from :122-131 to :123-132 and its filter from :127-129 to :128-130. THE ADDRESSES PINNED IN THIS ROW ARE PRE-A22 - re-pin them before dispatching this row, or whoever reads them second inherits the tenth stale citation on this backlog. AN OWNER DECISION IS OWED AT THE PUSH, AND THE ARCHITECTURE ASKED THE WRONG QUESTION - measured by the as-built verification. The old guard banned the WHOLE @/lib/grade/* subtree by name; the capability walk bans only what REACHES a server-only capability. Measured over all sixteen modules under src/lib/grade: FOUR stay banned (the barrel, engine, extraction, rubric) and TWELVE become freely importable (class-trends and its two siblings, constants, parsing, postable, prompts, repo-content, rubric-tiers, submission-kind, types, utils). Eleven of those twelve were banned by name before this row and are not now. BY THE CRITERION A23 IS CHARTERED AGAINST - client-bundle safety - NOTHING IS LOST: all twelve walk to zero violations and zero unallowed. But the standing rule the architecture itself invokes is never ship a loosened guard without the feature it was loosened for, and the architecture framed this as a one-line question about re-banning the BARREL by name, which would restore ONE of the eleven. THE OWNER IS BEING ASKED THE WRONG QUESTION and the measured list is the right one. RECORDED HERE BECAUSE IT WAS RECORDED NOWHERE: it lived only in docs/a23-architecture.md, and DEV_LOOP step 0 rules that a residual living only in another document is the same deletion with extra steps - a grep for it across both backlog files returned ZERO. It blocks nothing in the wave. THE CLASS HAS FIVE SITES IN THIS TREE, NOT THREE - found by the A23 architecture pass and verified by opening both. Sites 4 and 5 are course-schedule-docx.test.ts:42-48 and workflows/registry/steps.weekly-announcement-schedule.test.ts:63-69, and they carry the identical hole for the identical reason: every pattern is of the form /from ["'']<specifier>["'']/, so it requires the literal token `from` and therefore cannot see a bare side-effect import, a require(), or a dynamic import(). They differ from the three chartered sites in being DIRECT-ONLY - each checks one file''s own source rather than anything transitive - which makes them cheaper to fix and weaker to begin with. NOT CHARTERED INTO A23, deliberately: the charter has already been widened once today, from two sites to three, and widening it a second time on the same reasoning would turn a bounded row into an open-ended sweep. They are recorded here so the next reader knows the family is wider than the row that fixes part of it. THE REAL POINT, and it is the argument for the shape A23 chose: a guard that enumerates spellings of a BANNED import fails SILENTLY, because an un-enumerated form is simply permitted. Five independent authors wrote five variants of that same pattern and all five have the same hole, which is what a class looks like when the mechanism is wrong rather than the instance. A THIRD CORRECTION, AND IT IS TO THE ORCHESTRATOR''S RULING RATHER THAN TO THE ROW - VERIFIED BY OPENING THE CODE. I ruled that guard 1''s LINE FILTER misses a bare side-effect import. It does not. /^\s*import\b/ MATCHES that line and /^\s*import\s+type\b/ does not, so the line REACHES THE PATTERN STAGE and escapes THERE: all four patterns at repoGradesFeedbackAndFiles.wiring.test.ts:259-262 require the literal token `from`, which a bare side-effect import has none of. Same verdict, DIFFERENT STAGE, and the difference is load-bearing - A FIX AIMED ONLY AT THE LINE FILTER LEAVES IT OPEN. The criteria bind it in two places for that reason. This is the second time today a seat has corrected a ruling of mine by opening the code I reasoned about; both times the seat was right. A NEW HAZARD NEITHER ROUND HAD, measured and verified: grading-results/SubmittedFilesPanel.tsx:25 carries a LIVE dynamic(() => import("../MonacoFileEditor")) inside a file guard 2''s whole-file sweep covers - and because every pattern requires `from`, A DYNAMIC IMPORT OF A BANNED SPECIFIER ADDED THERE TODAY IS CAUGHT BY NOTHING. Escalated rather than folded in, pending a ruling on whether it is chartered; if it is, the criterion''s object widens from one file to the whole sweep. NOTE THE SHAPE: this is the same construct class that got the ORIGINAL regex withdrawn under Ruling U3, found live in a THIRD place, which is evidence that the family is wider than two guards and that enumerating forms is the wrong answer here. THE CORRECTION BELOW WAS ITSELF OVER-CORRECTED, AND THE CHECKER SETTLED IT BY EXECUTION - THIS ROW''S ORIGINAL FRAMING WAS CLOSER TO RIGHT. The criteria pass measured guard 2 against six hazards and guard 1 against only the three probes THIS ROW handed it, then wrote a symmetry claim from that asymmetric evidence - the same shape as the defect the row exists to fix. Executed independently: GUARD 1 HAS THE IDENTICAL NON-IMPORT HOLE. Its filter misses export-star, export-from, require(), dynamic import() AND a bare side-effect import - the same four constructs that got VALUE_IMPORT_PATTERN withdrawn under Ruling U3, plus a fifth. And GUARD 2 IS NOT WRAP-IMMUNE after all: it catches a brace-wrapped import (so H6 holds and challenging the blanket claim was warranted) but a wrap BETWEEN from AND THE SPECIFIER escapes it, as does a tab there, because its filter needs space-from-space-quote contiguous on one line. SO THE MEASURED TRUTH IS: the two guards DO share a corrective rule, which is what this row said; what they do not share is a single hole, which is what the correction said. Both are true and neither alone is. THE FIX MUST BIND EACH GUARD TO EACH CONSTRUCT PER WRAP POSITION PER QUOTE STYLE, measured, not reasoned from one guard to the other. ORCHESTRATOR RULING, 2026-09-20: OPTION (b) - delete the classifier and let the whole-file ban stand unconditionally - IS OFF THE TABLE. It fails this row''s own no-better-pattern constraint on its own ground: the unconditional sweep is four regexes over raw source that MISS a bare side-effect import, so it is exactly the enumerate-syntactic-forms shape the row forbids. Independently, one guarded file legitimately needs a type-only barrel import (repoGradesCellEdits.ts:30), which the criteria require be PERMITTED. Two live options remain: a walled set derived from the tree at test time, or a transitive import-graph walk. A METHOD HAZARD WORTH A TRAP CARD, reproduced by two agents: a bash grep for an anchored import pattern returns EMPTY through shell escaping while the Grep tool finds every site. A canary - grepping for a string known to match - is what distinguishes a false absence from a true one. DO NOT CONCLUDE A PATTERN IS ABSENT FROM A BASH GREP ALONE; this backlog has already had one scoping pass reach a wrong conclusion from a correctly-run grep over the wrong scope. TWO CORRECTIONS TO THIS ROW FROM ITS OWN CRITERIA PASS, 2026-09-20, AND BOTH ARE AGAINST THE ORCHESTRATOR. (1) THE CITATION WAS STALE IN THE ROW THAT WARNS ABOUT STALE CITATIONS. This row cited guard 1''s line filter at :287-291 in both its title and its instrument; measured, it is at :295-297 in a 305-line file. A22''s own scope had already recorded that as stale, and when I re-pinned guard 2 after A22 landed I did not re-pin guard 1. Corrected here. (2) THE ROW''S CLAIM THAT BOTH GUARDS SHARE THE SAME CORRECTIVE RULE IS TOO STRONG. The criteria pass added a sixth hazard - a MULTI-LINE DOUBLE-QUOTED import - and GUARD 2 CATCHES IT. So the two share a CLASS (a text filter inferring import intent) but NOT a FAILURE MODE: guard 1 is defeated by LINE WRAPPING, guard 2 by QUOTE STYLE and by non-import constructs. A criterion written as close the multi-line hole in both would have bound guard 2 to a hole it does not have. Fix them together still stands, because the class and the forbidden answer are shared; the SPECIFIC HOLE is not. MEASURED BEFORE ANY FIX, discharging this row''s own first-step obligation: a multi-line-aware scan of repo-grades (32 non-test files, 171 import statements) finds 3 banned-specifier hits, ALL SINGLE-LINE, zero multi-line, zero require, zero dynamic - so the permissive direction has NOT shipped a live defect, and this row is hygiene rather than a bug fix ON THAT TEST. Two qualifications that stop it being comfortable: the MULTI-LINE FORM IS ALREADY INSIDE THE GUARDED FILES (useRepoGradesGradingActions.ts carries 2, useRepoGradesBulkGrade.ts 1), so the guard silently skips real statements today and only the specifier has not yet been a banned one; and the scan sees the working tree, not history, so it cannot prove the guard has never been decorative. RESIDUALS FROM THE CRITERIA PASS, recorded here because DEV_LOOP step 0 says a residual that lives only in another document does not exist. Full text in docs/a23-criteria.md. The two worth reading before building: RES-A23-1, a dynamic import() whose specifier is COMPUTED AT RUNTIME cannot be caught by any construction available in this repo - the criteria bind to static string literals and say so rather than pretending otherwise. RES-A23-2, COVERAGE BY OMISSION AND A DIFFERENT CLASS: repoGradesPosting.ts:56 value-imports @/lib/grade/postable, which IS banned by prefix, and that file is ABSENT from the guard''s own file list - so the guard does not fail on it, it never looks at it. Not a bundle hazard today (postable.ts''s single import is type-only) and deliberately NOT folded into A23, but it means the guard''s coverage is bounded by a hand-maintained list, which is the same shape A22 just replaced one directory over. Also recorded: a THIRD site of the same line-filter idiom at snapshot-grading.structure.test.ts:801 (not leaking today, partial backstop at :806) - a scope question, not a defect. A METHOD WARNING WORTH KEEPING: a grep for that pattern through bash returned EMPTY because of shell escaping while the Grep tool found both sites. A canary caught the false absence. Do not conclude a pattern is absent from a bash grep alone. WHY THIS IS ITS OWN ROW AND NOT PART OF A22. A22 closes a NAMED, VISIBLE carve-out in the grading-results sweep, and it REJECTED building a type-aware classifier precisely because this one exists and is broken - the rejection is the evidence. Folding the fix into A22 would entangle a hygiene chore in one directory with a live defect in another, and A22''s own recommendation is a construction (set equality) that does not need a classifier at all. WHAT THIS ROW MUST NOT DO: reach for a better regex. This backlog has now measured two separate pattern-shaped guards failing - a phrase denylist catching ZERO of nine attack constructions, and this classifier failing in both directions - and iteration-caps forbids answering a repeat failure by strengthening the same mechanism. A12/A13''s Ruling U3 already replaced one regex guard here with a WALLED-SET check after the regex was shown to miss export-from, export-star, require and dynamic import; that is the shape to follow. THE HONEST OPTIONS: (a) replace the line filter with a construction that cannot miss a multi-line form - the walled-set idiom, or a real import-graph walk like the transitive-prefix shape at classTrendsDraft.not-postable.test.ts which this repo already trusts for exactly this question; (b) delete the classifier and let the barrel ban stand unconditionally in that directory, if no file there legitimately needs a type-only barrel import - MEASURE whether any does before choosing this; (c) if a type-only exemption is genuinely needed, express it the way client-state-sweep.registry.test.ts:137-143 does, as a Record whose every entry is asserted to name a live object and carry a reason, not as a filter that infers intent from text. FIRST STEP, owed before any fix: find out what the guard was protecting and whether the false negative has already let something through. A guard broken in the permissive direction does not fail loudly - it passes, which is this repo''s single most repeated defect class. Check whether any file in repo-grades currently carries a multi-line value import of the barrel; if one does, the guard has been decorative and the row is a bug fix, not a hygiene chore. SHIPPED 2026-09-20 at 4dad288 and 38f0e95, which landed the transitive walk; 4de8a59 (02:39) records that an owner decision is owed and this row has never recorded an answer. STATE CORRECTED 2026-09-22 from unscoped to owner: the code shipped, and what is left is one human decision - whether the twelve now-freely-importable modules under src/lib/grade should stay that way, or whether any of the eleven that were banned by name before this row should be re-banned. The architecture asked a narrower question (re-ban the barrel, which restores one of the eleven); the measured twelve-module list above is the right question. OWNER: the repo owner. INSTRUMENT: the module list above, plus the walk''s own zero-violation result for all twelve. STEP: the owner''s answer; it blocks nothing in the meantime. SITES 4 AND 5 ARE NOW ROW A33, filed 2026-09-22 with an owner, an instrument and a step - they were recorded here "so the next reader knows" with neither, and this row becoming an owner row would have buried them.'
  question: 'ANSWERED 2026-09-23: the owner took the recommendation - LEAVE the twelve modules freely importable, no re-ban by name. This was the row''s last open item. What it deliberately accepts: the walk enforces client-bundle safety, never layering, so that boundary is now unenforced by choice. See docs/owner-decisions-2026-09-23.md DECISION 13. OPEN, and it is the last thing left on this row - the code shipped at 4dad288 and 38f0e95. WHAT CHANGED UNDER YOU: the old guard banned ''@/lib/grade (or a submodule)'' BY NAME (git show 4dad288^:src/app/components/repo-grades/repoGradesFeedbackAndFiles.wiring.test.ts, :287-291). The replacement bans by RESOLVED PATH PREFIX instead - FORBIDDEN_PATH_PREFIXES = [''lib/supabase''] at src/lib/module-graph/client-boundary-policy.ts:18 - so a grade module is banned only when it actually reaches server-only code. RE-MEASURED 2026-09-23 by running the shipped walk itself (walkRuntimeGraph with SHIPPING_OPTIONS from docs/a23/_lib.mjs, one root per module, sixteen modules): FOUR still fail - lib/grade.ts, grade/engine.ts, grade/extraction.ts, grade/rubric.ts - and TWELVE now pass with zero violations and zero unallowed specifiers: class-trends.ts, class-trends-draft.ts, class-trends-insight.ts, constants.ts, parsing.ts, postable.ts, prompts.ts, repo-content.ts, rubric-tiers.ts, submission-kind.ts, types.ts, utils.ts. THE QUESTION: do those twelve stay freely importable from client code, or do you want any of them re-banned BY NAME on top of the walk? The architecture put a narrower question to you - re-ban just the barrel - and that is the wrong question; this twelve-module list is the right one. WHAT EACH ANSWER COSTS. LEAVE THEM OPEN: one rule survives instead of two, re-derived from the tree on every test run, and by the criterion this row is chartered against - client-bundle safety - nothing is lost, since all twelve walk to zero violations. RE-BAN: it restores a LAYERING boundary the walk does not enforce (the walk answers ''does this reach the server?'', never ''should a component reach into grading internals?'') and it does not measure client-bundle SIZE either way - but it would fail four live, currently-clean value imports, so choosing it means changing those call sites or writing named exceptions for them: src/app/components/repo-grades/classTrendsFolderEntry.ts:29 and repoGradesBulkGrade.ts:43 and src/app/components/grading-results/ungradedDisclosure.ts:24 on grade/types, and src/app/components/repo-grades/repoGradesPosting.ts:56 on grade/postable. NOTHING IS BLOCKED ON YOUR ANSWER: the walk is live and green either way, sites 4 and 5 moved to row A33, and no other work on this row is waiting - only the decision is.'
