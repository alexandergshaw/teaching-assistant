 RESOLVE IS RESOLVED BY DEMOTION: TrackedSubmission becomes a PROJECTION. GradingRow is the home of record, seedTrackedFromRows reads the pair back off the row, and submissionKind never touches TrackedSubmission at all - which dissolves the conflict between "written once at mint" and the home-of-record finding instead of trading one against the other. AND "written once at mint" is WITHDRAWN outright against mergeExtractedSubmissions:416-421, replaced by "the suggestion travels with the text, earlier reading wins on a join". THE GUARANTEE IS BACK AND IS FOUR, not the one I conceded: the prompt header via a Record lookup in a pure unit-testable leaf; the label Record plus a source-text pin on GradingTableRow; the pinned call-site canary; and a NEW freeze-before-migrate byte-identity oracle proving the request body is unchanged until an instructor confirms. The call-site canary differs from its precedent deliberately - snapshot-role-setrole-callsites.structure.test.ts scans ONE directory non-recursively while A8-R''''s composers span three, so this one walks all of src/ with canaries. Second independent kill of the ?? path the check found: all three fields are REQUIRED, so there is no optional field to ?? against. THE BASIS IS NOW THE CUE, per the ruling: the extraction contract returns what the model claims to have SEEN, an EMPTY CUE IS ITSELF INFORMATIVE, and batch-accept eligibility is a three-condition rule with an eight-case product oracle. A8-R ROUND 2: DEFECTIVE, 6 blockers, THREE OF THEM REPEAT CLASSES - so under the caps this is a DISPOSAL round producing no new requirements, and the author is NOT re-dispatched. RULING O - AN UNCONFIRMED ROW MUST NOT SAY "Submission". This is the disposal of B1 and it changes the feature. Every guarantee in the artifact is conditioned on "for a row whose kind the instructor confirmed", while "unknown" is the state of EVERY row on EVERY capture until a human clicks - and the design maps "unknown" to today''''s strings (the literal Submission at GradingTableRow.tsx:250, the Submission: header in the request body) and then FREEZES THAT BYTE-FOR-BYTE as guarantee G-R0. Built exactly as written: lint, tsc, next build, vitest and every structure test green, all four guarantees satisfied, and THE OWNER''''S REPORTED DEFECT STILL ON SCREEN AND STILL IN THE REQUEST BODY. The artifact''''s own section 1 names those two literals as the defect itself; preserving them byte-identically is then presented as a virtue. Both halves read as correct and together they say the defect is preserved exactly until a human clicks. THE RULING: "unknown" gets a NEUTRAL label and a HEDGED prompt header, not today''''s bytes. The owner asked that the app not MARK replies as original posts; labelling an unrecognised contribution "Submission" is marking it as an original post. G-R0 is re-aimed at the neutral default rather than at today''''s strings. ESCALATED TO THE OWNER as a one-line question, not as a gate - they may prefer today''''s wording preserved for the non-discussion capture, which is the majority case. DISPOSALS for the three REPEATs, no further argument. B4 (a type-level claim the type system does not hold - REPEAT of the withdrawn brand): DELETE the "requiredness kills the ?? path" claim outright. TypeScript does not error on a ?? b when a is non-nullable, no type-aware lint rule is enabled, and a ternary rewrite is legal anyway; the only enforcement is the call-site canary, and it CANNOT cover GradingTableRow.tsx, which must hold the suggestion AND compose the label. G-R2 stands at its true reduced strength: its two instruments prove the Record has no "Submission" member and the old literals are gone, and pin NOTHING about which field is the argument. B5 (an enumeration is a floor - REPEAT): mechanical re-derivation plus a wave reconciliation, owned by whoever writes the assignment - grading-submission-merge.ts and its test are in NO owns section while a pass condition names that test as its instrument; grading-extraction-prompt.ts, the one change that actually produces recognition, is in NO wave; and seven of the fifteen tsc-red factory bases are unassigned while copy-feedback.test.ts sits in wave 2 although wave 1 makes the fields required. B6 (a signal dropped at an unpinned hop - REPEAT of round 1''''s transport class): RELOCATE the row-level invariant to the test seat with grading-capture-sync.test.ts as instrument. Measured: TR-4 says the suggestion travels WITH the text, but grading-capture-sync.ts:162 pushes only studentName and submissionText onto the existing row, so after a merge REPLACE the row holds the NEW text beside the OLD suggestion and cue - the owner''''s bug inverted, and batch-accept eligible, so one click confirms the wrong kind. CORRECTIONS RECORDED AT DISPOSAL, not re-argued: G-R0''''s stated bound exceeds its oracle - the extraction prompt changes for every user on every run with no confirmation anywhere, and the sentinel passes "SYS" so the system-prompt half is unfrozen. The new whole-src canary is specified by copying snapshot-role-setrole-callsites.structure.test.ts, which backlog L13 measured as THE ONE genuinely CRLF-blind stripper in the repo - and the artifact also prescribes a comment naming an identifier the same canary forbids, which is a hard RED on a correct implementation. The safe form was already in a file the artifact cites (copy-feedback.test.ts, CR-tolerant split plus a CR canary). Counts: the stated 45 paths itemise to 44 and the true figure is at least 47; "five by-path panel readers" lists six. SUBMISSION_KINDS is a hand-written array beside a hand-written union, so a fifth member escapes both coverage loops silently - derive the union from the array. PRIORITY: A8-R IS PARKED BEHIND A16, which the owner made top priority the same day. A8-R has now consumed two scoping rounds and two checks and is at a disposal round; it resumes after A16 unless the owner says otherwise. OWNER ANSWER 2026-09-20 ON RULING O: an unconfirmed row gets a NEUTRAL LABEL AND A HEDGED PROMPT, not today''''s "Submission" bytes. So the ruling stands as issued: "unknown" reads as not-identified on screen and the model is told the kind is unknown rather than having a submission asserted. The owner accepted the stated cost - every ordinary essay row also reads neutral until confirmed - because the alternative leaves the reported defect on screen and in the request body until someone clicks every row. G-R0 is re-aimed at the neutral default; freezing today''''s strings byte-for-byte is no longer a guarantee, it is the defect.'
