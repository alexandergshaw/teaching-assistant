  from: 'N13a round-2 check, 2026-09-15, re-read hop by hop by the orchestrator'
  note: 'A13-1 SHIPPED (commit ac8002b, 2026-09-15) and is confirmed wired at every payload builder the original row named, so the title''s LIVE ON MAIN TODAY claim about internal error text reaching students is now FALSE and must not be repeated. A13-2 is the sole remaining scope: the review table (GradingResults.tsx and its row renderer, plus the repo-grades equivalents) must mark a postable:false row as a DISTINCT visible state rather than rendering it like an ordinary graded row, and must offer a re-run control wired to gradeOneSubmissionAction (grading.ts:597, currently called only from steps.grading-singles.ts:238, a workflow step, never from UI). Re-runnability needs identity - GradeResult carries no id field (confirmed: no id or id-optional property in src/lib/grade/types.ts) - so whether a failed/ungraded row can be re-dispatched, and whether that identity survives a reload, is still to be established, not assumed. This converges with A12''s identical residual (a visible not-attempted disclosure plus re-run), and the two should not invent separate mechanisms. SCOPED WITH A12 2026-09-20 into ONE chunk, artifact at docs/a12-a13-scope.md. BOTH HALVES OF A13-2 ALREADY SHIP on the repo-grades grid: RepoGradeCellControl.tsx:617 renders checkRowPostability''''s refusal reason and :572-575 is a per-cell re-grade button. So the remaining gap is one file, GradingResults.tsx. THE STRONGEST LIVE DEFECT IS NAMED BY NEITHER ROW: GradingResults.tsx:626 renders a HARDCODED "Not posted - no grade or comment to send" for the skipped status and DISCARDS status.message - the field holding both the A13-1 refusal reason (set at :392, :300, :325, :339, :355) and Canvas''''s own skip reason. postable.ts:100-103 says the predicate returns a reason SO A CALLER CAN SURFACE IT; the one UI caller drops it and substitutes text that blames the instructor. Two-line fix, inside owns. RE-RUN IS DEFERRED, NOT DROPPED, and the reason is identity: repoDigestToEmbeddedEntry (github.ts:574-596) sets no gradedRepo/gradedRef/userId, so a dropped repo''''s row carries only a display label; types.ts:143-149 states outright that sourceIndex is not a re-run key; and gradeOneSubmissionAction is Canvas-only and needs four values GradingResults does not have. A FORBIDDEN-PATH COLLISION, stated not guessed: engine.ts:320''''s message says "Re-run to grade the rest", which on GithubGradingPanel is FALSE - the queue is never pruned (:372-378) and slice(0, maxSubmissions) re-takes the same prefix. Fixing that sentence means editing engine.ts, which was fenced off as live work, so this chunk''''s own copy must not repeat the instruction and the correction is a sequenced residual. SCOPING CHECKED 2026-09-20: NOT CLEAN, 3 blockers, normal revision round. THE STANDOUT FINDING - THE FALSE INSTRUCTION IS ALREADY ON SCREEN, and the scoped chunk would have made it more prominent without correcting it. buildUngradedRow sets strengths = outcome.message (engine.ts:152), defaultRowEdit seeds strengths from the result (gradingResultsHelpers.ts:315-324), and RowFeedbackBoxes.tsx:115,144 renders every FEEDBACK_FIELDS member including strengths - so a count-bound row''''s STRENGTHS BOX on GradingResults.tsx shows "Not graded: this run is limited to 40 submissions. Re-run to grade the rest." TODAY, in an editable textarea, while on that surface re-running does NOT work (the queue is never pruned and the same prefix is re-taken). The artifact noticed this and then mitigated it with a rule that cannot reach it - its AC governs only the leaf''''s own strings. Built as specified, the chunk adds an authoritative badge drawing the instructor to exactly the rows carrying an uncorrected lie two columns over. THE CORRECTION IS ENTIRELY INSIDE owns: the leaf authors the copy and can say what re-running actually does on this surface. TWO MORE BLOCKERS, both about a guarantee asserted rather than constructed: the not-posted branch would render status.message with NO DEFINED FALLBACK, so an absent or empty message renders an EMPTY warning-coloured div - strictly worse than today''''s wrong-but-present text - and the revert sabotage reds against the blank version too, so it does not discriminate. And the criterion "no returned string instructs the instructor to press a control that does not exist" HAS NO INSTRUMENT in this repo while sitting under a pass condition claiming to range over it; close it by CONSTRUCTION - freeze the leaf''''s emitted copy set as literals and assert the returned set equals it, so any new instruction is a diff. ALSO CORRECTED, and it belongs in A12 too: this row''''s premise "nothing in the review table shows that row''''s reason" is PARTLY FALSE - it is shown, under the wrong label, in an editable textarea. The honest reframe is MISLABELLED AND UNMARKED, not absent, and that changes both the copy and the value claim. And a client-bundle hazard the artifact never names: the new leaf must value-import from @/lib/grade/types, NOT the barrel - gradingResultsHelpers.ts:58-70 records that the barrel drags next/headers into the client bundle and fails next build while tsc, eslint and vitest all stay green. ROUND 2 CHECK: NOT CLEAN, 3 blockers, and one needed a RULING before the artifact could be revised coherently. RULING R - REGISTER THE LEAF AND NARROW THE PATTERN; DO NOT DUPLICATE. The landed client-bundle guard at gradingResultsHelpers.test.ts:824-889 BANS the exact specifier AC-8 mandates - its BANNED_IMPORT_PATTERNS includes /from ["'''']@\/lib\/grade\// which matches @/lib/grade/types - and its CLIENT_FILES is a hardcoded eight-entry list with NO COMPLETENESS ASSERTION, so a new leaf simply escapes the directory''''s own guard, silently and forever. Measured, and it decides the ruling: src/lib/grade/types.ts has EXACTLY ONE import and it is type-only (import type { CodeRunResult }), so it is genuinely client-safe and the pattern is OVER-BROAD for it. THE RULING HAS FOUR PARTS, all inside that one test file, which therefore moves from do-not-edit into owns: (1) register the new leaf in CLIENT_FILES; (2) narrow the pattern to exempt @/lib/grade/types specifically; (3) ADD A GUARD THAT types.ts STAYS IMPORT-FREE, so the exemption cannot quietly become false - an exemption with no guard is how this class returns; (4) ADD A COMPLETENESS ASSERTION to CLIENT_FILES so a future file cannot escape by omission. I rejected the directory''''s local-duplication precedent deliberately: duplication is what this repo keeps filing rows about - L13 is 53 duplicated stripComments copies of which one silently diverged - and duplicating a type-guard predicate buys the same debt for a smaller reason. THE OTHER TWO BLOCKERS ARE DESIGN, for the author: AC-6''''s condition is scoped to isUngraded(result), but engine.ts:152 sets strengths = outcome.message for BOTH members of UngradedOutcome, so driven over the kinds it MANDATES OVERWRITING a grading-failed row''''s only diagnostic with a frozen leaf literal - directly contradicting this chunk''''s own account of the defect. Scope it to kind === "not-attempted" and state the grading-failed behaviour. And AC-3b cannot freeze what section 5 requires: the bound exists ONLY inside the engine''''s message template, classifyRow''''s signature is (result, edit) with no run and no count, so the leaf can state the count only by parsing the message - which G2 forbids - and if it interpolates, the emitted string is not a frozen literal and fails AC-6''''s own membership test. AC-3b also collects strings from classifyRow ALONE, missing the replacement copy that actually lands in the instructor''''s textarea - so the chunk could ship a FRESH false instruction in the same box with every gate green. ALSO: the seeder correction is right and STRONGER than argued - :181-191 is a render-phase setState, not an effect; had it been an effect the first render after a run change WOULD have used the previous map and the uncorrected sentence. The conclusion survives on a fact the artifact never opened.'
- id: 'L11'
  state: 'unscoped'
  kind: 'chore'
  area: 'loop-and-docs-maintenance'
  title: 'Make the owns-list caller check MECHANICAL instead of remembered. L10 shipped the procedure into docs/loop/parallel-disjointness.md, and the implementer who wrote it said plainly in its own report that prose will not be enough - and it is right. The evidence is L10''s own history: the correct definition was already in that card, was quoted at people twice, and was still missed five times in one day, the fifth by the orchestrator ONE COMMIT AFTER writing the rule down. A sixth card is not the fix.'
  owns: []
  verify: null
  blocked_by: []
  instrument: 'L10 implementation report, 2026-09-15, plus the five instances recorded in L10 before it closed (A1, N15, A2, A5 fixtures, A5 index.tsx)'
  from: 'L10'
  note: 'THE PROPOSAL, which is the implementer''s and which I endorse: the WAVE GATE runs the grep the card describes and diffs it against the submitted owns list, rather than a human or an agent remembering to run it. The gate already executes git status --short against the assignment, so the machinery and the moment both exist; this adds a second, cheaper question to the same step. WHY THIS IS UNSCOPED AND NOT JUST DISPATCHED - three things have to be settled first and none of them is obvious. (1) WHAT TO GREP FOR. A change to a function has a symbol; a change to a type, a prop, a CSS class or a string constant has a different one, and some have none an implementer could name. A gate that only works for named exports will be silently useless for the other half of waves. (2) FALSE POSITIVES ARE THE WHOLE RISK. Every caller of a widely-used symbol would be flagged, and a gate that cries wolf on a forty-hit grep gets ignored within a week, which is worse than no gate because it looks like coverage. Something has to distinguish "reached by this change" from "merely mentions the symbol", and that judgement may not be mechanisable - in which case the honest answer is a gate that REPORTS the hits for a human to classify rather than one that passes or fails. (3) WHERE IT LIVES. This repo''s gates are vitest files; a wave-gate check is not obviously one, since it is about a brief rather than about the tree. It may be a script the orchestrator runs, which makes it exactly as skippable as the card - and if so, say that out loud rather than shipping a gate that is a card with extra steps.'
