  from: '82f5bde'
  note: 'MOVED TO VERIFICATION 2026-09-14, deliberately, after being measured. It had been given owns and verify while its own evidence said the first step is an OWNER OBSERVATION - that combination would have let an agent start building before the cheap check ran, so the fields are cleared and the row sits where it belongs. THE OWNER STEP, which takes seconds: open a grading surface that has completed assessments, reload the page, and say whether the list still appears. EITHER ANSWER IS USEFUL AND THEY LEAD OPPOSITE WAYS. If the list does NOT appear, this is a live user-visible defect in a SHARED hook with seven importers, and the fix is a known in-repo pattern (below) - re-scope it actionable and build it. If the list DOES appear, then this repo''s own twice-stated rule is WRONG, and that is the more valuable finding: SnapshotGradingPanel.tsx:167-172 and LectureScriptPanel.tsx:9-17/46-60 both assert it as settled, and one of them added a mount effect on its strength. Correcting a false rule two files rely on beats fixing a symptom that does not exist. THE FIX, if it is needed: move the localStorage read out of the initializer into a mount effect using the async-IIFE + cancelled-flag idiom (SnapshotGradingPanel.tsx:174-186 is the working example in the same directory; eslint react-hooks/set-state-in-effect requires setState be reached only after an await). Do it IN THE SHARED HOOK, not per consumer - the finding is that one seed has seven importers - and fix the armedRole seed at useSnapshotShots.ts:100 in the same wave, since splitting them would leave a near-duplicate row. Original scoping note follows. SCOPED 2026-09-14. The fix shape is already demonstrated in-repo twice, so this is a pattern application rather than a design problem: move the localStorage read out of the initializer into a mount effect using the async-IIFE + cancelled-flag idiom (SnapshotGradingPanel.tsx:174-186 is the working example in the same directory; eslint react-hooks/set-state-in-effect requires setState to be reached only after an await). DO IT IN THE SHARED HOOK, not per consumer - the point of the finding is that the defect is one seed with seven importers. Also fix the armedRole seed at useSnapshotShots.ts:100 in the same wave, since it is the same pattern in the same feature and splitting them would leave the queue with a near-duplicate row. CHEAPEST FIRST STEP, before any code: the owner reloads a page with completed assessments and says whether the list appears. If it DOES appear, this row is wrong and the repo''s twice-stated rule needs correcting instead - which would be a more valuable finding than the fix.'
