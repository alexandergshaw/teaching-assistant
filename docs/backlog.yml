- id: 'L6'
  state: 'unscoped'
  kind: 'chore'
  area: 'loop-and-docs-maintenance'
  title: 'Two residuals the L4 build owes, filed together because they share an instrument. (a) LIVE-LOOP is the one derived advantage class with no removal test anywhere in the repo - its example is the snapshot keyboard layer (SnapshotGradingPanel.tsx:516-558), and nothing asserts that the layer stays reachable without a mouse, so the class could erode exactly as the GUARANTEED class''s did before L4 caught it. (b) The six classes were derived from the tree on 2026-09-15 and are a snapshot, not a standing truth - the owner''s own directive says to re-derive them by clustering shipped features, and nothing schedules that.'
