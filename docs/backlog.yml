  note: 'MEASURED SIZES, RE-MEASURED 2026-09-15 (each grew since the row was filed, most from concurrent A5/A6 work in the same directory the row itself flags as a blocker): index.tsx 913 (was 912), RepoGradeCellControl.tsx 651 (was 628), RepoGradesControls.tsx 647 (was 634), RepoGradesGrid.tsx 605 -> 643, LinkUsernamesPanel.tsx unchanged at 453. index.tsx is now 87 lines from the 1000-line ceiling (src/file-size-ceiling.structure.test.ts:30), not 88 - re-measure again before scoping, since A5/A6 may still be landing. So an overhaul CANNOT be additive - it must extract before it adds, and the extraction is the wave, not a follow-up ticket. BLOCKED ON A5 AND A6 BY FILE SET, not by logic: both are in flight against RepoGradesControls.tsx and RepoGradesGrid.tsx right now, and parallel-disjointness.md forbids a third item in the same files. They are small and land first. WHAT THE SCOPING PASS OWES, and the order matters: (1) read docs/repo-grades-ux-overhaul-acceptance-criteria.md FIRST and list what it already decided, so this pass does not re-litigate settled questions or, worse, silently reverse them - it records specific decisions about sticky headers, badge systems, focus styles, the score box, and the mobile reflow; (2) the owner named FOUR things - streamlined, user friendly, intuitive, and TELEGRAPH WHAT STATE THINGS ARE IN - and the fourth is the most concrete and the most testable, so inventory every state this view can be in today (scanning, scan error, per-repo folder-scan failure, ungraded, grading, graded, missing folder, posting, posted, post failed, rate-limited, binding unconfirmed) and say for each where it is shown, how, and whether two states share one appearance; (3) the same doc records that this view runs TWO BADGE SYSTEMS in one surface and calls that a defect, which is exactly a telegraph-the-state problem the owner is now asking about independently - start there. RULING X-1 APPLIES AND IS THE ACCEPTANCE NUMBER: count interactions per graded repo before and after, setup separately from steady state.'
- id: 'A8'
  state: 'unscoped'
  kind: 'bug'
  area: 'discussion-reply-grading'
  title: 'The discussion grader treats a student''s REPLIES as independent posts. Owner, 2026-09-15, with a screenshot of the submission view: one student''s three contributions to a Student Introductions topic are listed as three peer items - their actual introduction, plus two replies addressed to other students ("@Seth Vander Vorst", "@Luke Demmel") - under a heading that calls all of them the assignment''s submissions. A reply to a classmate is not a second introduction, and grading it as one both misreads the work and inflates whatever a rubric counts.'
  owns: []
  verify: null
  blocked_by: []
  instrument: 'Owner screenshot plus a direct read of src/lib/canvas/discussions.ts:106-152, 2026-09-15'
  from: 'owner request, 2026-09-15'
  note: 'OWNER DECISION 2026-09-15, asked and answered: REPLIES ARE GRADED SEPARATELY, AGAINST DIFFERENT CRITERIA. Not excluded, not merely labelled. That is the reading most discussion rubrics already use - an initial post scored on substance against the prompt, and replies scored on engagement with a classmate - and it makes the current behaviour a real scoring error rather than a presentation one: a reply is being measured against criteria written for an introduction it was never trying to be. WHAT THE DECISION IMPLIES, for whoever scopes this. (1) THE RUBRIC GAINS A SECOND AXIS, and that is the design question: does the instructor supply two rubrics, or one rubric with a reply section, or does the app split a single rubric by convention? Do not default it - it decides the whole surface. (2) THE SCORE IS NO LONGER ONE NUMBER per student per discussion, which touches whatever posts to Canvas: check whether the grade path can carry two component scores or whether they must be combined before posting, and if combined, by what rule and whether the instructor sets it. (3) contributionCount (discussions.ts:152) sums posts and replies into ONE NUMBER and must become two, or the separation cannot be counted. (4) A STUDENT WITH NO REPLIES and a student with no initial post are now different failures and must read differently. (5) The UI in the owner''s screenshot lists every contribution as a peer item with no indication which is the initial post - under this decision that is not cosmetic, it is the surface where the two scores have to live. MEASURED BEFORE FILING, and the finding narrows the search usefully: THE DATA LAYER ALREADY KNOWS. DiscussionPost carries isReply (discussions.ts:13-14) and parentUserId (:15-16); extractDiscussionActivity splits a student''s work into initialPosts and replies (DiscussionActivity, :19-22), computing isReply from thread depth at :61 and pushing to the right bucket at :69. So the distinction is captured correctly at the source and something downstream flattens it. TWO CANDIDATES, both visible at discussions.ts:141-152. (1) The text handed to grading is built by concatenating [...initialPosts, ...replies] with each segment prefixed "Post: " or "Reply: " and joined by a --- separator - so the label IS present, and the question is whether the grading prompt is told what those labels MEAN or whether the model just sees three chunks of prose. (2) contributionCount is initialPosts.length + replies.length, ONE NUMBER with the distinction summed away - so anything counting contributions cannot tell a student who wrote one post and two replies from one who wrote three posts. THE SCOPING PASS MUST ALSO CHECK THE UI, which is what the owner actually saw: the screenshot is a submission-list surface that renders each contribution as a peer item with its own timestamp, and nothing in it says which one is the initial post. That may be a separate defect in the same family, and if it is, say so rather than fixing only the model-facing half. WORTH ASKING EARLY, because it changes the fix: does the owner want replies EXCLUDED from grading, graded SEPARATELY against different criteria (most discussion rubrics score the initial post and the replies on different lines), or merely LABELLED so the model and the instructor can tell them apart? Do not default this. SECOND OWNER DECISION 2026-09-15, closing implication (1), the one the scoping pass was told not to default: ONE RUBRIC WITH A REPLY SECTION - "one rubric with a reply section". Not two instructor-supplied rubrics, and not an app-side split of a single rubric by convention. So the rubric input gains an explicit reply section the instructor authors, the initial post is scored against the main body and the replies against that section, and the app never has to guess which criteria belong to which. Implications (2) through (5) are unchanged and still open. DISPOSAL 2026-09-15, under iteration-caps.md cap 2 and the REPEAT-class rule. A8''s scoping had two revisions and two fresh checks; round 2 returned five blockers of which THREE were REPEATs of round 1''s own classes (two false-absence, two pass-condition-too-narrow). Per the routing table a REPEAT goes to disposal NOW, and the orchestrator failed to do that for a round. No further revision of this artifact is legal. Recorded here so the scoping does not restart from zero. (a) RELOCATE - the UI half. Two candidate surfaces were found by render-shape search after an identifier-shaped search wrongly concluded none existed. Candidate 1, recording/DiscussionReplyTable.tsx, DOES render the distinction (a Reply badge at DiscussionReplyRow.tsx:629 and "Replying to X" at :645-646) and DOES render a per-item timestamp (formatCapturedTime at :601 under a "Captured" header) - so the artifact''s stated reason for excluding it was FALSE, though the exclusion itself probably holds on other grounds: it is the multi-student reply-DRAFTING tool, one row per post across students, and no heading calls anything submissions. Candidate 2, the screen-capture submissions list, is live and lives entirely in A9''s directory. OWNER ASKED AND ANSWERED "not sure" on which screen was photographed, so this cannot be settled by more argument: RECEIVER is whoever next opens those two surfaces in the running app, OBLIGATION is to say which one the owner saw. Until then the UI half does not ship. (b) REDUCE - one question for the owner, and it gates A8-2: ON THE EMBEDDED PATH, WHAT CRITERIA DO REPLIES GET once they stop borrowing the initial post''s? Implemented as scoped, A8-2 routes 4 of the 7 union-read signals to the initial-post bucket, after which reply CONTENT is read by exactly one signal (mentions_peer, a first-name substring match at discussion.ts:158-165). A student who writes two substantive, sourced, question-asking replies would earn credit for that content NOWHERE - where today they at least earn Quality-proxy credit. That is graded-separately turning into graded-against-nothing, and it is strictly worse than the defect. A8-2 MUST NOT SHIP until this is answered. (c) RESIDUALS, each with owner/instrument/step in the artifact: the four-column pass condition, the blanket swap guard that contradicts the deliberate distinct_days ruling (Timeliness is invariant under a content swap BY CONSTRUCTION, so the guard goes red on a CORRECT implementation and must be restricted to three columns), and M-b''s construction point - a shared exported constant makes the course-intel literal divergence unrepresentable and is enforced by tsc, which is strictly stronger than the source-text test the artifact proposed. (d) ORCHESTRATOR RULING, mine, correcting the chunking I own: A8-1''s wiring file is src/lib/canvas/discussions.ts, NOT src/lib/grade/extraction.ts. canvasWorkToEntry never reads work.discussion; discussions.ts:144-146 fills work.text and extraction.ts:160-170 merely reads it. As filed, A8-1 could add the module, its test, the barrel line and the prompt clause, never rewire discussions.ts, and pass lint, tsc, next build, vitest and every structure test while the model still receives the old flat text - the assignment-must-include-the-wiring-file trap with the wiring file misidentified. A8-1 also needs one end-to-end assertion on work.text for a discussion fixture; nothing in the repo asserts on that concatenation today. SCOPED AND CHECKED 2026-09-20; the check came back DEFECTIVE and its findings are the durable part. (1) A THIRD GRADING SURFACE EXISTS AND IS THE ONE PHOTOGRAPHED. The scoping concluded neither of two surfaces can list three peer items for one student and floated that the screenshot was Canvas''s own UI. That is the SECOND time this row has produced that conclusion - docs/loop/traps-search.md already records the first, and src/app/actions/grading-submission-extract.ts:60-79 carries a source comment dated 2026-09-15 written because of it. The surface is the SCREEN-CAPTURE grading path: grading-extraction-prompt.ts:77 names "a discussion-style response" as a submission; grading-submission-merge.ts:301-324 isSameSubmission needs a name match AND text similarity, so one author''s introduction plus two replies stay three rows (the bias is pinned deliberately at grading-submission-merge.test.ts:272); GradingTable.tsx:167 renders "Showing N of M submissions" over them. ANY FUTURE PASS MUST SEARCH BY WHAT THE SURFACE HOLDS, NOT BY THE CANVAS-DISCUSSION TYPE NAMES - both wrong conclusions came from grepping the data layer. (2) THE REFRAME, which may make the scoped fix unnecessary: a deterministic reply-aware discussion grader ALREADY SHIPS. embedded-grader/discussion.ts:88-102 computes initialCount, replyCount and peerReplyCount separately and peerReplyCount already excludes self-replies; grading.ts:774-783 routes graded discussions to buildDiscussionRubric /gradeDiscussion WHEN THE PROVIDER IS embedded. So the AI provider is the one that flattens, and the instructor''s provider choice silently decides whether replies are understood. A8 may be a ROUTING defect, not a prompt defect. (3) THE SCOPED AI-PATH FIX IS A HOPE, NOT A GUARANTEE. It ships a renderer plus one sentence appended to buildSystemPrompt''s rule list - competing with ~30 bullets that treat the submission as one blob, including prompts.ts:83-86''s "award full points absent an explicit violation" and grade-generously rules, which make reply-padding HELP the student. It can pass lint, tsc, next build and every test while changing zero grades. (4) A FOURTH ROUTE the scoping never named: grading.ts:619/:636 gradeOneSubmissionAction calls gradeEntries directly, bypassing gradeCanvasUrl, and its work comes from submission-detail.ts:120 where a graded discussion''s body arrives with NO Post/Reply labels and no discussion field at all - so there the defect is worse and the scoped fix changes nothing. BLOCKED ON THE OWNER for three product calls, batched: which screen was photographed; whether a reply with no rubric reply-section is scored against the main criteria, against an app-authored reply standard, or excluded and disclosed; and whether graded discussions should route to the deterministic engine regardless of provider. OWNER DECISIONS 2026-09-20, all three, and they resolve the block. (1) SCREENSHOT: "canvas split out the initial posts from the replies, but this app should recognize the replies as being replies and not mark them as original posts (like it did with the defect i reported)". So CANVAS DELIVERED THE DATA ALREADY SEPARATED and THIS APP re-merged it and labelled replies as original posts. Both scoping passes that blamed Canvas''s own UI were wrong in the same way twice; the defect is this app''s recognition of replies, not Canvas''s presentation. (2) REPLY SCORING when the rubric has no reply section: EXCLUDE the replies from the initial-post criteria and DISCLOSE the gap in the feedback. Do not invent an app-authored reply standard, and do not keep scoring them against the main criteria. (3) ROUTING: DO NOT force graded discussions to the deterministic embedded engine. The provider choice stays authoritative; FIX THE AI PATH. WHAT THAT MEANS FOR THE SCOPE, given the check''s B2: a renderer plus one prompt sentence is NOT sufficient, because the owner chose exclusion, and exclusion is a code decision - the deterministic half. The clause competes with ~30 bullets that treat the submission as one blob (prompts.ts:83-86 awards full points absent an explicit violation, and the grade-generously rules make reply-padding help the student). A re-scope must carry a GUARANTEED-class component: what the code holds regardless of what the model returns. STILL OPEN AFTER THESE ANSWERS, from the check: the fourth route at grading.ts:619/:636 (gradeOneSubmissionAction bypasses gradeCanvasUrl, and submission-detail.ts:120 gives it a body with no labels and no discussion field), and the screen-capture path, which by the owner''s answer is in scope because it is where replies get marked as original posts. RE-SCOPED 2026-09-20 against the three owner decisions; check in flight. THE DURABLE FINDINGS. FIVE AI-REACHING ROUTES, not one - "fix the AI path" is ambiguous and anyone reading it as gradeCanvasUrl misses three: (a) the Canvas-API path; (b) SCREEN CAPTURE; (c) grading.ts:597-641 gradeOneSubmissionAction, which bypasses gradeCanvasUrl entirely and whose submission-detail.ts:120 body arrives with no labels and no discussion field; (d) the external "other" engine, which at canvas/submissions.ts:182-183 writes the merged intro-plus-replies blob to a file literally named _post.txt - the most literal instance in the tree of the app marking replies as an original post, and named in no prior pass; (e) the screen-capture GRADING route, grading-submission-grade.ts:69 -> grading-feedback-prompt.ts:153, which reuses buildSystemPrompt. WHICH SURFACE IS THE SCREENSHOT, settled by a CONSTRUCTION argument rather than a grep - this is what the two earlier wrong conclusions lacked: routes a/c/d/e each produce exactly ONE ROW PER STUDENT per assignment, so none can list three peer items; (b)''s row count is per-extracted-text, because ExtractedSubmission is {name,text} (grading-submission-merge.ts:54-57) with no kind field, isSameSubmission (:301-324) needs a name match AND text similarity so three different texts by one author stay three rows, and nothing groups by name (:395-428). CORRECTION TO THIS ROW''S OWN GLOSS: "this app re-merged it" is true of (a),(d),(e) and FALSE of (b). Route (b) never merges - it fails to merge OR label, presenting three contributions as three peer submissions. A receiver building from the gloss would hunt for a merge that is not there. THE GUARANTEED COMPONENT, which the prior scoping lacked and which is why that one was called a hope: G1 - the model NEVER RECEIVES THE REPLY TEXT. canvasWorkToEntry builds initialPostContent from work.discussion.initialPosts, NEVER by string-filtering work.text, and engine.ts:211-215 selects it when the rubric has no reply section, so reply prose inside the scored content is UNREPRESENTABLE. That is what defeats prompts.ts:84-85 (grade generously; award full points absent an explicit violation) and the other 22 rule bullets - no bullet can act on text that is not in the request body. G2 - the disclosure is composed by CODE via composeOverallComment, the same mechanism types.ts:208-212 documents for resubmitNotice as never model-generated, so it survives callLlm returning an empty string. G3 - the excluded count is a TypeScript integer from replies.length. ROUTE (b) HAS NO GUARANTEE OF THAT CLASS and the scope says so rather than pretending: the input is pixels and ExtractedSubmission has no kind field, so reply RECOGNITION is inherently model-supplied. The best code-held property there is a same-name group count. Any A8-C criteria must state the reduced class explicitly. BLAST RADIUS IS COMPILER-ENFORCED: grade-result-allowlist-coverage.test.ts:47-74 makes tsc fail if a new GradeResult field is missing from ALL_GRADE_RESULT_FIELDS, and a runtime sentinel fails unless three allowlists are threaded (grading-review-rows.ts:53-58, grading-drafts.ts:120, github-grading-run-store.ts:211/:246). A WRONG-REASON TRAP the oracle must dodge: engine.test.ts:8 mocks getGeminiMaxCharsPerSubmission to 20, and at that cap truncateSubmission would strip reply text REGARDLESS of the fix, so a "reply absent" assertion would pass on broken code. The new test must mock a large cap and also assert the initial-post sentinel IS present. CONTRADICTION WITH THIS ROW''S IMPLICATION (3): contributionCount has NINE grep hits and ZERO READERS - one declaration, three writes, five test fixtures. Splitting it into two numbers would change a write-only field. Left out of all three chunks deliberately. RE-SCOPE CHECKED 2026-09-20: DEFECTIVE, 4 blockers. ORCHESTRATOR RULINGS, taken not asked. RULING A - EXCLUSION IS DEFERRED; RECOGNITION SHIPS FIRST. The scoped A8-A would make grading WORSE than the defect it fixes, and this is measured, not feared: prompts.ts:87-89 says an absent required behaviour is an EXPLICIT rubric violation and instructs the model to deduct for it and name it; grading.ts:806-813 REQUIRES non-empty assignmentInstructions on that path and passes them verbatim, and for a graded discussion those instructions ARE the discussion prompt ("reply to two classmates"). Remove the reply text and the demand for it remains, so the model is instructed to deduct for work the student actually did - where today that same text at least earns generosity credit under :84-85. Compounding it, the reply-section AUTHORING SURFACE DOES NOT EXIST yet, so the has-a-reply-section predicate answers no for EVERY rubric and the exclusion would fire universally rather than rarely. The owner''s own words asked for RECOGNITION - "this app should recognize the replies as being replies and not mark them as original posts" - not for removal. So: build recognition and labelling now; exclusion waits until a rubric can actually carry a reply section, and until the instructions shown to the model are narrowed in the same change. Exclusion without narrowing the instructions is the prior round''s disposed class recurring - content removed from a scoring path that costs the student points. RULING B - ADOPT THE EXISTING ROLE MODEL; DO NOT INVENT A WEAKER ONE. The check found a SIXTH route the enumeration missed, and it already contains the mechanism this row proposed to build: snapshot-shot.ts:27 declares SnapshotRole as a CLOSED UNION with "post" and "replies" as separate members (SNAPSHOT_ROLES :29, labels :31-38); snapshot-row.ts:358-365 buildTranscriptBlock emits "Shot N (role: replies):" INTO THE GRADING PROMPT, so the role reaches the model by construction; snapshot-row.ts:391 GradeShotSelection.excludedRoles is already a code-computed excluded-role set. That surface is ALSO a screen-capture surface, which refutes the re-scope''s claim that a pixel input makes reply recognition impossible and that the best available is a same-name group count. The screen-capture grading path adopts this role model rather than inventing a weaker mechanism. This changes A8-C''s shape and therefore the chunking, so re-chunk before dispatching anything. RULING C - A8-A MAY NOT SHIP ALONE. The guarantee as scoped lands on route (a), the ONE route that already labels contributions Post/Reply, while the surface the owner photographed keeps presenting three contributions as three peer submissions. The seam is mechanically disjoint but cuts the correctness property in half. Recognition on the photographed surface is the first chunk, not the last. RULING D - A8-B gets a LINE BUDGET: src/app/actions/grading.ts is 905 lines against LIMIT = 1000 with no ALLOWED_OVERAGE entry. 95 lines of headroom for the chunk whose whole job lives in that file. Extract first or do not start. ALSO CARRY, all measured by the check: (1) a fourth composed part in overallComment IS DESTROYED DOWNSTREAM with nothing going red - gradingResultsHelpers.ts:214 FeedbackField is a hand-written literal union with no type-level link to GradeResult, :331-335 recomputes overall from exactly three fields on any edit, and :553-566 recomputes it ON RELOAD, so a disclosure composed into overallComment evaporates the first time the instructor reloads, while tsc, lint, build, vitest and the byte-identical parity test at gradingResultsHelpers.test.ts:797 all stay green. Any disclosure must survive that, or live in a field that is not recomposed. (2) G1''s "unrepresentable" is overstated: a pseudo-entry''s previewContent reaches the model via code-run-selection.ts:143 -> utils.ts:352-381 -> engine.ts:61, so a runnable extension on a text pseudo-entry leaks it; pin the extension. (3) A SEVENTH route, grading.ts:871 gradeSubmissions(zipBuffer), is also unnamed. (4) The cardinality discriminator is internally false - route (e) IS route (b)''s grading half and shares its cardinality; the identification of (b) as the photographed surface survives on other grounds but not on that argument. (5) The "Showing N of M submissions" heading renders only when a filter is non-empty (GradingTable.tsx:168). RE-CHUNKED 2026-09-20 by the top tier; it corrected THREE OF MY FOUR RULINGS and the corrections change what gets built. (1) RULING B''S CONCLUSION IS RIGHT, ITS REASON IS WRONG, and the difference is concrete. I said the snapshot surface refutes the claim that a pixel input makes reply recognition impossible. Measured: the snapshot role is INSTRUCTOR-DECLARED, NOT MODEL-RECOGNISED - snapshot-keys.ts:24 ROLE_BY_DIGIT arms a role by keypress BEFORE capture, snapshot-shot.ts:130 setShotRole writes it, and snapshot-role-suggestion.ts:8-13 states in bold that a suggested role must NEVER become the effective role without an explicit instructor action, implemented at :83-92 where the only writer runs on a click. So the surface proves a narrower thing: a code-held closed union can exist on a pixel surface WHEN A HUMAN SUPPLIES THE VALUE. The screen-capture path sweeps MANY submissions in one capture and has NO per-submission moment before capture, so it cannot copy the arming half - it must INVERT the order: the model SUGGESTS at extraction, the instructor CONFIRMS per row. A receiver told only "adopt the role model" would try to build a pre-capture arming control for a surface with no per-submission capture moment. (2) RULING B MUST NOT BE READ AS "IMPORT SnapshotRole". Three source headers forbid that boundary crossing - snapshot-shot.ts:6-9, grading-submission-merge.ts:9-13, grading-extraction-prompt.ts:9-14. Adopt the SHAPE - closed union, Record labels, a label emitted into the prompt by construction, suggest-never-auto-apply, a pinned call-site canary - declared FRESH in src/lib/grade/, the layer grading-feedback-prompt.ts:25-33 already imports from. (3) RULING D AIMED AT THE WRONG FILE. I budgeted grading.ts at 905/1000. Under this chunking NO chunk''s work lands there - gradeCanvasUrl and gradeSubmissions are CALLED from grading.ts but the work is inside engine.ts. The real squeeze is GradingRecordingPanel.tsx at 995/1000: FIVE lines of headroom, not ninety-five, on the photographed surface''s own panel. An extraction comes first, and prefer moving a plain function and const (handleDownloadLog + currentGradingLog, :633-656, NO hook-count change) over the run-log state block, because this-repo.md records the sibling panel''s hook extraction failing lint with two React Compiler preserve-manual-memoization errors on an untouched callback. (4) THE PHOTOGRAPHED HEADING IS NOT WHERE THE CHECK SAID. GradingTable.tsx:170 renders "Showing N of M submissions" but :168 gates it on a non-empty filter, so it appears only while the instructor is typing. The UNCONDITIONAL per-item label is GradingTableRow.tsx:249 - a literal Submission span above EVERY row - and :257 aria-label "Submission from <name>". A chunk aimed at the table heading would fix a string that is usually not on screen. THE SHAPE: A8 IS A SERIAL ROW. A8-R (recognition on the photographed surface, routes b+e, 33 files) then A8-P (the LMS-connected AI paths, routes a+g, 10 files). They are FILE-DISJOINT (proven mechanically with sort | uniq -d plus a self-intersect canary) but MUST NOT run concurrently, because A8-P imports the union A8-R invents - a directional informational coupling, so sequence rather than merge. Routes b and e are MERGED into A8-R because the seam between them cuts one property in half: a typed field with no prompt threading ships an export with no caller, and a prompt change with no typed field has nothing to read. Third time this repo has merged for that reason. FIXED IN PASSING 2026-09-20: grading-submission-grade.ts:99-105 said "NOT YET WIRED TO A PRODUCTION CALLER", measurably false - GradingRecordingPanel.tsx imports it at :105 and calls it at :566. That is byte-for-byte the stale-comment shape that already misled an A8 pass on its sibling file (grading-submission-extract.ts, corrected 2026-09-15); the sibling was corrected and this one was not. Now corrected, with the lesson in the comment. A8-R SCOPED AND CHECKED 2026-09-20: DEFECTIVE, 6 blockers, stopping point RULINGS. FIVE RULINGS, and three of them correct MY OWN re-chunk. RULING J - ROUTES (c) AND (d) ARE RESIDUALS WITH OWNERS, NOT SILENCE. My re-chunk assigned them to NO chunk and NO residual, which under iteration-caps.md is a deletion. Route (d) is the one THIS ROW ITSELF calls "the most literal instance in the tree of the app marking replies as an original post" - canvas/submissions.ts:182-183 writes the merged intro-plus-replies blob to a file literally named _post.txt. Dropping it silently while chunking a row ABOUT that defect is the worst kind of scope loss. Both are now residuals: (c) owner = repo owner, instrument = one live single-submission grade against a real graded discussion, step = after A8-R lands, because submission-detail.ts gives it a body with no labels and no discussion field and nothing here can exercise it; (d) owner = repo owner, instrument = one run against the external Deterministic Grading API, step = before any rename, because NOTHING IN THIS REPO READS _post.txt BACK (grep -rn "_post" finds no reader) so the contract is external-only and a rename could make the service miss the submission entirely - a 0 instead of a mislabel, strictly worse. RULING K - "ROUTE G" IS MY INVENTION AND IS WITHDRAWN. This row enumerates routes a-e plus an unlettered sixth and seventh; I labelled one of them g in a brief and it propagated. The zip-upload path (grading.ts:871 gradeSubmissions) is real and belongs to A8-P, but it is to be named by its call site, never by a letter this row never assigned. RULING L - THE GUARANTEE WAS AVAILABLE AND IS NOT CONCEDED. I accepted the seat''s modesty too readily. The check is right: TWO CODE-COMPOSED OUTPUTS exist on this surface and both are npm test-visible - buildGradingRecordingPrompt (grading-feedback-prompt.ts:101-108) is a PURE LEAF returning the model''s request body, and GradingTableRow.tsx:250/:258 are the two literals that ARE the app marking a reply as an original post. Replace both with a Record lookup over the CONFIRMED kind and the guarantee is real: for a row whose kind the instructor confirmed, neither the on-screen label nor the request body can say "Submission". The storage-versus-output dichotomy I accepted is refuted by leverage.md''s own GUARANTEED instance (2), a type-level discriminated tag counted as GUARANTEED precisely because it governs what can be rendered. The NON-guarantee stands unchanged and must still be stated: correct recognition is model-suggested and cannot be code-held on a pixel input. RULING M - DROP THE BRAND; USE THE PINNED CALL-SITE CANARY INSTEAD. G-R4 does not hold, on three traced paths: a Record over the four-member union NECESSARILY accepts the unbranded type, so label(row.submissionKind ?? row.suggestedSubmissionKind) compiles and a ?? fallback is the most natural thing to write against an optional field; fromWire cannot produce a branded value without a cast or a non-click producer call, breaking "sole producer"; and the brand''s only sabotage is tsc-only while the chunk''s verify is npm test, so the strongest claimed guarantee sits outside its own gate. The repo already owns the suite-visible version of exactly this - snapshot-role-setrole-callsites.structure.test.ts, a pinned call-site set, which Ruling B listed and which a SIGNATURE canary is not. RULING N - owns IS A FLOOR OF ~35, AND THE MISSES ARE WALKERS A BY-NAME GREP CANNOT REACH. In owns: grading-row-serialization.ts AND .test.ts (both halves - toWire hand-lists 16 keys and the frozen oracle reds only if you DO thread the field, never if you forget), grading-capture-sync.ts and its test, grading-capture-tombstones.test.ts, plus TWO off-directory walkers nobody had listed: src/app/components/ui/buttonVariant.test.ts, whose SECTION_4_DIRS includes grading-recording and whose FROZEN_PRIMARY_SITES pins GradingRecordingPanel at 3 with GradingTable and GradingTableRow at 0 - so the batch accept control moves one of those numbers; and page-module-css-orphan-classes.test.ts, which WRITES docs/css-orphans.md on every run, so any new CSS class makes the wave gate show a path the assignment does not list. ALSO CORRECTED, mine: the 77-object-literal figure behind the optional-field decision measures the wrong object - every row fixture funnels through a Partial<GradingRow> factory, so the true cost of REQUIRED is about ELEVEN (seven factory bases plus four bare oracle literals), not 77, and the architectural decision rested on a number an order of magnitude out. The 960 wave-0 target has no derivation against what A8-R actually adds to the panel, which is the exact gap Ruling D was created to close - derive it. And "three source headers forbid that crossing" is wrong on two of three: grading-submission-merge.ts:9-13 and grading-extraction-prompt.ts:9-14 ban reusing the DISCUSSION-CAPTURE helpers, not the snapshot directory; only snapshot-shot.ts:6-9 is on point. The conclusion survives on layering grounds but the citation does not. AND THE WEAKEST REQUIREMENT, which no ruling had touched: "the suggestion must render its BASIS". On the SNAPSHOT surface the basis discriminates because it is a transcript of a DIFFERENT shot. Here the basis would be a slice of the model''s transcription of the submission, and GradingTableRow.tsx:259 already renders row.submissionText in full one block below - the evidence is the thing itself, restated, identical whether the model was right or wrong. That is a rubber stamp with a decoration on it, the very thing snapshot-role-suggestion.ts:21-23 exists to prevent. THE DISCRIMINATING BASIS HERE IS THE CUE, NOT THE TEXT: the @Name opener, a "Replying to" line, reply indentation, a thread position - what the model claims to have SEEN. Scope it that way or drop the basis requirement and call the batch accept what it is. A8-R REVISED 2026-09-20, written to docs/a8r-scope.md (934 lines, 0 non-ASCII, no BOM) so a checker can audit its disposition table - round 1 existed only as agent text. RES-7 DISCHARGED BY MEASUREMENT, and it mattered because A11''s implementer was RUNNING while I checked. Ruling I had intersected A11 against A8-R''s OLD 18-path set; this revision derives 45. Re-intersected per-path: the only textual hit is src/lib/grade/prompts.ts, and reading the context it is the sentence in which A8-R states it does NOT own that file. Zero snapshot-grading entries, zero prompts.ts entries in the owned set. Canary: a known A8-R path is found by the same search. A11''s live build was not at risk. CORRECTIONS THE REVISION MADE TO MY OWN RULINGS, all measured. (1) The optional-versus-required figure is FIFTEEN - nine factory bases, two production builders, four bare oracle literals - not the 77 the first pass claimed and not the ~11 I ruled. Two instruments, every hit opened, and one false positive recorded (discussion-table-view.test.ts:220 declares its OWN local interface GradingRow). The decision is REQUIRED, and crucially it is now argued from nameMatch''s in-file precedent rather than from a cost count - so it AGREES with snapshot-row.ts:127-136 instead of out-weighing it with a number. (2) The wave-0 target is DERIVED at 965 = 1000 minus 15 additions minus a 20 margin, both itemised - my 960 had no derivation, which was the exact gap Ruling D existed to close. And the extraction I preferred likely nets ~12 lines, NOT 29, because currentGradingLog reads nine local state values; so wave 0 becomes an ordered two-step ladder with a MEASURED stop (@(Get-Content).Count <= 965) rather than a predicted one. (3) The transport problem is ELEVEN HOPS AND EIGHT hand-enumerated field lists, not the five the check found - it adds grading-submission-extract.ts:170, the merge fold, and grading-submission-grade.ts:120. THE CONTRADICTION I ASKED IT TO RESOLVE IS RESOLVED BY DEMOTION: TrackedSubmission becomes a PROJECTION. GradingRow is the home of record, seedTrackedFromRows reads the pair back off the row, and submissionKind never touches TrackedSubmission at all - which dissolves the conflict between "written once at mint" and the home-of-record finding instead of trading one against the other. AND "written once at mint" is WITHDRAWN outright against mergeExtractedSubmissions:416-421, replaced by "the suggestion travels with the text, earlier reading wins on a join". THE GUARANTEE IS BACK AND IS FOUR, not the one I conceded: the prompt header via a Record lookup in a pure unit-testable leaf; the label Record plus a source-text pin on GradingTableRow; the pinned call-site canary; and a NEW freeze-before-migrate byte-identity oracle proving the request body is unchanged until an instructor confirms. The call-site canary differs from its precedent deliberately - snapshot-role-setrole-callsites.structure.test.ts scans ONE directory non-recursively while A8-R''s composers span three, so this one walks all of src/ with canaries. Second independent kill of the ?? path the check found: all three fields are REQUIRED, so there is no optional field to ?? against. THE BASIS IS NOW THE CUE, per the ruling: the extraction contract returns what the model claims to have SEEN, an EMPTY CUE IS ITSELF INFORMATIVE, and batch-accept eligibility is a three-condition rule with an eight-case product oracle. A8-R ROUND 2: DEFECTIVE, 6 blockers, THREE OF THEM REPEAT CLASSES - so under the caps this is a DISPOSAL round producing no new requirements, and the author is NOT re-dispatched. RULING O - AN UNCONFIRMED ROW MUST NOT SAY "Submission". This is the disposal of B1 and it changes the feature. Every guarantee in the artifact is conditioned on "for a row whose kind the instructor confirmed", while "unknown" is the state of EVERY row on EVERY capture until a human clicks - and the design maps "unknown" to today''s strings (the literal Submission at GradingTableRow.tsx:250, the Submission: header in the request body) and then FREEZES THAT BYTE-FOR-BYTE as guarantee G-R0. Built exactly as written: lint, tsc, next build, vitest and every structure test green, all four guarantees satisfied, and THE OWNER''S REPORTED DEFECT STILL ON SCREEN AND STILL IN THE REQUEST BODY. The artifact''s own section 1 names those two literals as the defect itself; preserving them byte-identically is then presented as a virtue. Both halves read as correct and together they say the defect is preserved exactly until a human clicks. THE RULING: "unknown" gets a NEUTRAL label and a HEDGED prompt header, not today''s bytes. The owner asked that the app not MARK replies as original posts; labelling an unrecognised contribution "Submission" is marking it as an original post. G-R0 is re-aimed at the neutral default rather than at today''s strings. ESCALATED TO THE OWNER as a one-line question, not as a gate - they may prefer today''s wording preserved for the non-discussion capture, which is the majority case. DISPOSALS for the three REPEATs, no further argument. B4 (a type-level claim the type system does not hold - REPEAT of the withdrawn brand): DELETE the "requiredness kills the ?? path" claim outright. TypeScript does not error on a ?? b when a is non-nullable, no type-aware lint rule is enabled, and a ternary rewrite is legal anyway; the only enforcement is the call-site canary, and it CANNOT cover GradingTableRow.tsx, which must hold the suggestion AND compose the label. G-R2 stands at its true reduced strength: its two instruments prove the Record has no "Submission" member and the old literals are gone, and pin NOTHING about which field is the argument. B5 (an enumeration is a floor - REPEAT): mechanical re-derivation plus a wave reconciliation, owned by whoever writes the assignment - grading-submission-merge.ts and its test are in NO owns section while a pass condition names that test as its instrument; grading-extraction-prompt.ts, the one change that actually produces recognition, is in NO wave; and seven of the fifteen tsc-red factory bases are unassigned while copy-feedback.test.ts sits in wave 2 although wave 1 makes the fields required. B6 (a signal dropped at an unpinned hop - REPEAT of round 1''s transport class): RELOCATE the row-level invariant to the test seat with grading-capture-sync.test.ts as instrument. Measured: TR-4 says the suggestion travels WITH the text, but grading-capture-sync.ts:162 pushes only studentName and submissionText onto the existing row, so after a merge REPLACE the row holds the NEW text beside the OLD suggestion and cue - the owner''s bug inverted, and batch-accept eligible, so one click confirms the wrong kind. CORRECTIONS RECORDED AT DISPOSAL, not re-argued: G-R0''s stated bound exceeds its oracle - the extraction prompt changes for every user on every run with no confirmation anywhere, and the sentinel passes "SYS" so the system-prompt half is unfrozen. The new whole-src canary is specified by copying snapshot-role-setrole-callsites.structure.test.ts, which backlog L13 measured as THE ONE genuinely CRLF-blind stripper in the repo - and the artifact also prescribes a comment naming an identifier the same canary forbids, which is a hard RED on a correct implementation. The safe form was already in a file the artifact cites (copy-feedback.test.ts, CR-tolerant split plus a CR canary). Counts: the stated 45 paths itemise to 44 and the true figure is at least 47; "five by-path panel readers" lists six. SUBMISSION_KINDS is a hand-written array beside a hand-written union, so a fifth member escapes both coverage loops silently - derive the union from the array. PRIORITY: A8-R IS PARKED BEHIND A16, which the owner made top priority the same day. A8-R has now consumed two scoping rounds and two checks and is at a disposal round; it resumes after A16 unless the owner says otherwise. OWNER ANSWER 2026-09-20 ON RULING O: an unconfirmed row gets a NEUTRAL LABEL AND A HEDGED PROMPT, not today''s "Submission" bytes. So the ruling stands as issued: "unknown" reads as not-identified on screen and the model is told the kind is unknown rather than having a submission asserted. The owner accepted the stated cost - every ordinary essay row also reads neutral until confirmed - because the alternative leaves the reported defect on screen and in the request body until someone clicks every row. G-R0 is re-aimed at the neutral default; freezing today''s strings byte-for-byte is no longer a guarantee, it is the defect.'
- id: 'A12'
  state: 'unscoped'
  kind: 'bug'
  area: 'grading-run-survival-and-disclosure'
  title: 'Grading more than the configured bound of GitHub repos at once no longer silently drops the rest - engine.ts appends a re-runnable not-attempted row per dropped repo (7c409a6) - but nothing in the review table shows that row''s reason to the instructor, the same visible-state gap A13-2 owes.'
  owns: []
  verify: null
  blocked_by: []
  instrument: 'DEFAULT_MAX_SUBMISSIONS = 40 confirmed at src/lib/gemini.ts:32 (row cited :25, stale); engine.ts:311-323 (submission-count-bound tail) and :297-310 (deadline tail) confirmed appending an UngradedResult row with a re-run message for every entry the run does not attempt, referenced 2026-09-15 against the current tree. UI sweep (Select-String for not-attempted/isUngraded/.ungraded across src/app/components, 2026-09-15) found zero rendering of these rows'' reason anywhere, including GithubGradingPanel.tsx and GradingResults.tsx.'
