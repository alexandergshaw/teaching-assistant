t requires setState to be reached only after an await). DO IT IN THE SHARED HOOK, not per consumer - the point of the finding is that the defect is one seed with seven importers. Also fix the armedRole seed at useSnapshotShots.ts:100 in the same wave, since it is the same pattern in the same feature and splitting them would leave the queue with a near-duplicate row. CHEAPEST FIRST STEP, before any code: the owner reloads a page with completed assessments and says whether the list appears. If it DOES appear, this row is wrong and the repo''s twice-stated rule needs correcting instead - which would be a more valuable finding than the fix.'
