- id: 'G4'
  state: 'unscoped'
  title: 'An LLM call with no timeout runs under the platform default, not 60s. callLlm takes no AbortSignal, so nothing bounds a first attempt; learning-resource-links.ts:55-66 documents a 90-100s case and says the mitigation is RETRY_BUDGET_MS = 32_000 (:121), which gates RETRY decisions and does not bound the first attempt. Compounding it: src/app/page.tsx exports NO maxDuration (grep -n maxDuration src/app/page.tsx returns nothing), and this repo already records in its own comments (src/app/api/automations/run-now/route.ts:35-37, course-intel/ask/route.ts:48-59) that Next honours maxDuration for Server Actions only at the PAGE level. So these actions run under the platform default rather than the 60s Hobby figure. When the platform kills the invocation the action''s own catch never runs, so the client gets a raw transport failure instead of the {error} string the action would have returned. Reachable today via discussion-replies.ts:786 and learning-resources-generator.ts:229. Recorded because two separate G3 design passes found it and filed it nowhere.'
  owns: []
  verify: null
  blocked_by: []
  instrument: 'RE-MEASURED 2026-09-14 and the row''s framing does not survive it. THREE findings. (1) BLAST RADIUS is understated ~60x: the row names two reachable paths, but grep -rn "callLlm(" src/ excluding tests returns 124 call sites. callLlm (src/lib/llm.ts:375) takes (req, provider) and no AbortSignal, and llm.ts contains ZERO AbortSignal or timeout references - the single "signal" hit at :718 is prose about something else. So a call-level bound is a 124-site seam change, or it is optional and therefore unenforced. (2) THE PAGE-LEVEL OPTION IS NOT AVAILABLE. src/app/page.tsx is "use client" (line 1), and a client component cannot export route segment config at all - maxDuration is a server-only export. So "page-level maxDuration" is not a cheaper alternative to a call-level bound; it is not on the table without converting the page to a server component. (3) THE REPO ALREADY HAS A THIRD ANSWER and documents it: move the feature off a Server Action to a Route Handler, which CAN declare its own ceiling. Twelve route handlers under src/app/api/ already declare maxDuration, and course-intel/ask/route.ts:48-59 plus automations/run-now/route.ts:35-38 explain they did it FOR EXACTLY THIS REASON. That file also records the constraint any fix inherits: prod is Vercel Hobby, whose hard cap is 60s regardless of what a route requests, and a value above 60 makes the deployment FAIL TO BUILD.'
  from: 'c25bdec-era, pre-existing'
  note: 'STILL UNSCOPED, and the owner decision it needs has CHANGED shape - the old either/or was a false dichotomy (see instrument). The real fork, and it is a genuine product/cost call rather than something an agent should default: MIGRATE the two named reachable features (discussion-replies.ts, learning-resources-generator.ts) off Server Actions onto Route Handlers that declare their own sub-60s ceiling - which is real work and changes how the client calls them, but follows a pattern three routes here already established and documented - OR accept the unknown platform ceiling and the raw transport failure it produces. NOTE the defect itself is NOT the slow call; it is that when the platform kills the invocation the action''s catch never runs, so the client gets a transport failure instead of the {error} string the action would have returned. A bound must therefore sit BELOW the invocation ceiling for the action to return anything at all - which is why knowing the ceiling and bounding the call are two halves of one fix, not alternatives. NOT to be worked as one chunk: at 124 call sites, any callLlm signature change is a repo-wide seam and needs its own chunking.'
