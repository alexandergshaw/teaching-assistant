- id: 'A8'
  state: 'unscoped'
  kind: 'bug'
  area: 'discussion-reply-grading'
  title: 'The discussion grader treats a student''s REPLIES as independent posts. Owner, 2026-09-15, with a screenshot of the submission view: one student''s three contributions to a Student Introductions topic are listed as three peer items - their actual introduction, plus two replies addressed to other students ("@Seth Vander Vorst", "@Luke Demmel") - under a heading that calls all of them the assignment''s submissions. A reply to a classmate is not a second introduction, and grading it as one both misreads the work and inflates whatever a rubric counts.'
  owns: []
  verify: null
  blocked_by: []
  instrument: 'Owner screenshot plus a direct read of src/lib/canvas/discussions.ts:106-152, 2026-09-15'
  from: 'owner request, 2026-09-15'
  note: 'OWNER DECISION 2026-09-15, asked and answered: REPLIES ARE GRADED SEPARATELY, AGAINST DIFFERENT CRITERIA. Not excluded, not merely labelled. That is the reading most discussion rubrics already use - an initial post scored on substance against the prompt, and replies scored on engagement with a classmate - and it makes the current behaviour a real scoring error rather than a presentation one: a reply is being measured against criteria written for an introduction it was never trying to be. WHAT THE DECISION IMPLIES, for whoever scopes this. (1) THE RUBRIC GAINS A SECOND AXIS, and that is the design question: does the instructor supply two rubrics, or one rubric with a reply section, or does the app split a single rubric by convention? Do not default it - it decides the whole surface. (2) THE SCORE IS NO LONGER ONE NUMBER per student per discussion, which touches whatever posts to Canvas: check whether the grade path can carry two component scores or whether they must be combined before posting, and if combined, by what rule and whether the instructor sets it. (3) contributionCount (discussions.ts:152) sums posts and replies into ONE NUMBER and must become two, or the separation cannot be counted. (4) A STUDENT WITH NO REPLIES and a student with no initial post are now different failures and must read differently. (5) The UI in the owner''s screenshot lists every contribution as a peer item with no indication which is the initial post - under this decision that is not cosmetic, it is the surface where the two scores have to live. MEASURED BEFORE FILING, and the finding narrows the search usefully: THE DATA LAYER ALREADY KNOWS. DiscussionPost carries isReply (discussions.ts:13-14) and parentUserId (:15-16); extractDiscussionActivity splits a student''s work into initialPosts and replies (DiscussionActivity, :19-22), computing isReply from thread depth at :61 and pushing to the right bucket at :69. So the distinction is captured correctly at the source and something downstream flattens it. TWO CANDIDATES, both visible at discussions.ts:141-152. (1) The text handed to grading is built by concatenating [...initialPosts, ...replies] with each segment prefixed "Post: " or "Reply: " and joined by a --- separator - so the label IS present, and the question is whether the grading prompt is told what those labels MEAN or whether the model just sees three chunks of prose. (2) contributionCount is initialPosts.length + replies.length, ONE NUMBER with the distinction summed away - so anything counting contributions cannot tell a student who wrote one post and two replies from one who wrote three posts. THE SCOPING PASS MUST ALSO CHECK THE UI, which is what the owner actually saw: the screenshot is a submission-list surface that renders each contribution as a peer item with its own timestamp, and nothing in it says which one is the initial post. That may be a separate defect in the same family, and if it is, say so rather than fixing only the model-facing half. WORTH ASKING EARLY, because it changes the fix: does the owner want replies EXCLUDED from grading, graded SEPARATELY against different criteria (most discussion rubrics score the initial post and the replies on different lines), or merely LABELLED so the model and the instructor can tell them apart? Do not default this. SECOND OWNER DECISION 2026-09-15, closing implication (1), the one the scoping pass was told not to default: ONE RUBRIC WITH A REPLY SECTION - "one rubric with a reply section". Not two instructor-supplied rubrics, and not an app-side split of a single rubric by convention. So the rubric input gains an explicit reply section the instructor authors, the initial post is scored against the main body and the replies against that section, and the app never has to guess which criteria belong to which. Implications (2) through (5) are unchanged and still open. DISPOSAL 2026-09-15, under iteration-caps.md cap 2 and the REPEAT-class rule. A8''s scoping had two revisions and two fresh checks; round 2 returned five blockers of which THREE were REPEATs of round 1''s own classes (two false-absence, two pass-condition-too-narrow). Per the routing table a REPEAT goes to disposal NOW, and the orchestrator failed to do that for a round. No further revision of this artifact is legal. Recorded here so the scoping does not restart from zero. (a) RELOCATE - the UI half. Two candidate surfaces were found by render-shape search after an identifier-shaped search wrongly concluded none existed. Candidate 1, recording/DiscussionReplyTable.tsx, DOES render the distinction (a Reply badge at DiscussionReplyRow.tsx:629 and "Replying to X" at :645-646) and DOES render a per-item timestamp (formatCapturedTime at :601 under a "Captured" header) - so the artifact''s stated reason for excluding it was FALSE, though the exclusion itself probably holds on other grounds: it is the multi-student reply-DRAFTING tool, one row per post across students, and no heading calls anything submissions. Candidate 2, the screen-capture submissions list, is live and lives entirely in A9''s directory. OWNER ASKED AND ANSWERED "not sure" on which screen was photographed, so this cannot be settled by more argument: RECEIVER is whoever next opens those two surfaces in the running app, OBLIGATION is to say which one the owner saw. Until then the UI half does not ship. (b) REDUCE - one question for the owner, and it gates A8-2: ON THE EMBEDDED PATH, WHAT CRITERIA DO REPLIES GET once they stop borrowing the initial post''s? Implemented as scoped, A8-2 routes 4 of the 7 union-read signals to the initial-post bucket, after which reply CONTENT is read by exactly one signal (mentions_peer, a first-name substring match at discussion.ts:158-165). A student who writes two substantive, sourced, question-asking replies would earn credit for that content NOWHERE - where today they at least earn Quality-proxy credit. That is graded-separately turning into graded-against-nothing, and it is strictly worse than the defect. A8-2 MUST NOT SHIP until this is answered. (c) RESIDUALS, each with owner/instrument/step in the artifact: the four-column pass condition, the blanket swap guard that contradicts the deliberate distinct_days ruling (Timeliness is invariant under a content swap BY CONSTRUCTION, so the guard goes red on a CORRECT implementation and must be restricted to three columns), and M-b''s construction point - a shared exported constant makes the course-intel literal divergence unrepresentable and is enforced by tsc, which is strictly stronger than the source-text test the artifact proposed. (d) ORCHESTRATOR RULING, mine, correcting the chunking I own: A8-1''s wiring file is src/lib/canvas/discussions.ts, NOT src/lib/grade/extraction.ts. canvasWorkToEntry never reads work.discussion; discussions.ts:144-146 fills work.text and extraction.ts:160-170 merely reads it. As filed, A8-1 could add the module, its test, the barrel line and the prompt clause, never rewire discussions.ts, and pass lint, tsc, next build, vitest and every structure test while the model still receives the old flat text - the assignment-must-include-the-wiring-file trap with the wiring file misidentified. A8-1 also needs one end-to-end assertion on work.text for a discussion fixture; nothing in the repo asserts on that concatenation today. SCOPED AND CHECKED 2026-09-20; the check came back DEFECTIVE and its findings are the durable part. (1) A THIRD GRADING SURFACE EXISTS AND IS THE ONE PHOTOGRAPHED. The scoping concluded neither of two surfaces can list three peer items for one student and floated that the screenshot was Canvas''s own UI. That is the SECOND time this row has produced that conclusion - docs/loop/traps-search.md already records the first, and src/app/actions/grading-submission-extract.ts:60-79 carries a source comment dated 2026-09-15 written because of it. The surface is the SCREEN-CAPTURE grading path: grading-extraction-prompt.ts:77 names "a discussion-style resp