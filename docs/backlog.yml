  instrument: 'Measured 2026-09-20. THE TOOL DOES NOT RECORD: WalkthroughAnnouncementPanel.tsx:515 calls start({ saveVideo: false }), and :801 already tells the instructor a capture in progress does not survive a reload. THE COPY SAYS OTHERWISE. In-panel: :725-726 opens with Share your screen and click through a series of LMS pages (correct, and the model for the rest); :883 says Record and stop a walkthrough first - nothing has been read yet; :871 offers Generate video script; :937 is the Video script draft legend. In the fieldset: AnnouncementCourseFieldset.tsx:253-254 says frames are sent to be read WHILE YOU RECORD, and :244 labels the notes box Notes for this walkthrough - optional. In the server actions: walkthrough-announcement.ts:392 and :538 both return Nothing was captured yet - record a walkthrough first. SURROUNDING FURNITURE, which needs a scoping decision rather than a find-and-replace: the tool lives under the Recording tab (WalkthroughAnnouncementPanel.tsx:3 documents the path as Manual > Recording > Announcement from a walkthrough), its view id is walkannounce in recording-launch.ts, its persistence keys sit in the ta-rec namespace, and it imports recording/RecordingControls.module.css. FILE SIZES, and the first is tight: WalkthroughAnnouncementPanel.tsx is 979 lines against the 1000-line ceiling (wc -l), so 21 lines of headroom - a copy change fits, a restructure does not. walkthrough-announcement.ts is 602 (wc -l). The mount is pinned by walkthrough-announcement.structure.test.ts, which reads RecordingTab.tsx as source text.'
  from: 'Owner, 2026-09-20, mid-turn'
  area: 'walkthrough-announcement-surface'
  kind: 'feature'
  note: 'RECONCILED 2026-09-21 BY THE A18 AC PASS, AND THIS ROW WAS STALE IN SIX PLACES. MOST OF A18 ALREADY SHIPPED at f9f29c1 (2026-09-20 16:10:43 -0500) against an earlier criteria document, docs/a18-scope.md (AC-1..AC-6); the row was never updated and still said unscoped with no owns and no verify. CORRECTIONS, each re-measured: the panel is 985 lines not 979 (wc -l and @(Get-Content).Count agree), so 15 lines of headroom not 21; walkthrough-announcement.ts is 608 not 602; the panel lives under components/walkthrough-announcement/ not under recording/; :883, the two server-action strings and the fieldset WHILE YOU RECORD string are all GONE, reworded to capture; the house-style subtitle moved to :727-728; the :244 notes label was never a defect locus and contains no record-family word. A grep for the record family over the tool''s four user-facing files returns 17 hits and NOT ONE IS A RENDERED STRING - comments, ../recording/ import paths, and Record<string, unknown>. THE ROW''S FOUNDING CLAIM SURVIVES: :515 still calls start({ saveVideo: false }). WHAT IS ACTUALLY LEFT, AND NO PRIOR ROUND LOOKED THERE: src/lib/walkthrough-announcement-prompt.ts:130 and :334 both say screen-recorded, and they are EMITTED TO THE MODEL on the announcement path, so this is the one remaining place the app asserts a recording happened and it reaches student-visible output. a18-scope.md never mentions that file. CORRECTED 2026-09-21 BY THE CRITERIA CHECK, AND THE ERROR WAS MINE - THE SENTENCE THIS REPLACES SAID THE SCRIPT PROMPT IS OTHERWISE CORRECT ABOUT RECORDING. IT IS NOT. walkthrough-script-prompt.ts emits FIVE model-facing strings asserting a recording was made of the PAST capture: :158 (WALKTHROUGH_MATERIALS_FRAMING - read directly off the instructor''s screen DURING THE RECORDING, which is the script path''s anti-injection framing and the structural sibling of the :130 object), :161, :171, :174 (only what could be read off THE RECORDING, and THE RECORDING occasionally reads it wrong - attributing the app''s own OCR error to a recording that does not exist) and :219. THE OBJECT SET FOR A18''S REMAINDER IS THEREFORE SEVEN STRINGS, not two: announcement-prompt :130 and :334, plus script-prompt :158, :161, :171, :174, :219. ONLY :165/:166 ARE GENUINELY ABOUT THE FUTURE RE-RECORDING and must survive. NOTE THE CLASS, because it has now happened twice on this row: both frontiers were drawn by GREPPING A TOKEN over a file set - record over three files in round one, screen-recorded in round two - rather than by enumerating the strings emitted on each path and reading each one. RESIDUAL: grep -ac A18 docs/REGRESSION.md returns 0 - the f9f29c1 fix shipped with no regression entry, and its six enforcers are measured GREEN but nobody measured that any of them CAN GO RED. Criteria: docs/a18-ac.md. SCOPE THE BOUNDARY BEFORE TOUCHING ANYTHING - a find-and-replace on the word record is the wrong shape and would break things. THREE DISTINCT LAYERS, and only the first is clearly in scope. (1) USER-FACING COPY IN THIS TOOL: the strings listed in the instrument, which should say the app READS what is on your screen rather than that it records. :725-726 is already correct and is the house style to match. (2) IDENTIFIERS AND KEYS: the walkannounce view id, the ta-rec localStorage namespace, the RecordingControls stylesheet import. These are NOT copy, they are contracts - the persistence keys are pinned, the view id validates incoming launches at runtime against a RUNTIME ARRAY rather than the type union, and renaming any of them silently drops every instructor setting already saved under the old key. Changing them is a migration, not a rename, and the default position is LEAVE THEM. (3) THE TOOL LIVING UNDER A TAB CALLED Recording: that is a placement question for the owner, adjacent to A16, which is already about not building destinations. DO NOT bundle it in silently. TWO TRAPS SPECIFIC TO THIS ROW. FIRST, THE VIDEO SCRIPT IS NOT A MISTAKE: :933-934 and :937 are a real feature that drafts a script to read aloud WHILE RE-RECORDING, and :964 downloads walkthrough-video-script.txt. That output genuinely concerns a recording the instructor makes elsewhere, so its wording is CORRECT and must survive this row - it is the one place the word belongs. SECOND, THE PRIVACY DISCLOSURE AT :253-254 MUST NOT GET WEAKER: it currently warns that frames go to a third-party AI provider and to close any gradebook, inbox or student submission first. Rewording it away from record must keep every fact it states; a copy edit that quietly softens a privacy notice is worse than the inaccuracy it fixes. ENFORCEMENT: this repo renders no component under vitest, so a copy requirement needs a source-text assertion over the specific strings - and this repo has a recorded class where source-text tests OVER-SPECIFY and force contorted implementations, so pin the FACT and the ABSENCE of the misleading word, never the exact sentence.'
- id: 'A19'
  state: 'unscoped'
  title: 'Owner asked 2026-09-20: for each video uploaded to the announcement-from-walkthrough tool, offer to generate a BEGINNING-OF-WEEK announcement and/or a MIDWEEK one. Two corrections to the framing, both measured, and neither changes what the owner wants. (1) THE TOOL HAS NO VIDEO UPLOAD - there is no file input anywhere in it; it reads a live shared screen and discards the frames, so the per-item unit is A CAPTURE SESSION, not an uploaded file. (2) THE MULTI-DRAFT MACHINERY THIS NEEDS ALREADY EXISTS - draft slots, a per-slot template choice and a regenerate path are all shipped, so this is most likely a new CHOICE KIND plus prompt work, not a new subsystem.'
