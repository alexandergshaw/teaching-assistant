      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - if: matrix.command == 'lint'
        run: npm run lint
      - if: matrix.command == 'types'
        run: npx --no-install tsc --noEmit
      - if: matrix.command == 'regression'
        run: npm test
      - if: matrix.command == 'build'
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: local-build-only
        run: npm run build
