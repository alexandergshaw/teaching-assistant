  title: 'The 1000-line ceiling measures the wrong thing for a canary file, and this repo now has the instance to prove it. repoGrades.wiring.test.ts went red on main (1037 lines) because A5 added 91 lines of new guards, and was split under duress in 25ffe9c. The implementer who split it argued - and I agree - that growth in that file is not rising complexity but a growing COUNT OF INDEPENDENT GUARANTEES: every block declares its own path constant, its own describe and its own assertions, with almost no coupling to its neighbours. So the file will hit the wall again every few features however well it is organised internally, and each hit costs a split done under a red gate rather than by design.'
  owns: []
  verify: null
  blocked_by: []
  instrument: 'The 25ffe9c split and its implementer''s reported analysis, 2026-09-15; the ceiling itself is src/file-size-ceiling.structure.test.ts:30'
  from: 'N14 wave 2 implementation, which found the red gate from outside the directory'
  note: 'THE PROPOSAL, which is the implementer''s: adopt a convention of ONE GUARD FILE PER GUARDED COMPONENT from the start, rather than accreting a single wiring file until it breaches and then cutting it. That is a convention change, not a code change, which is why this is unscoped - it needs a decision before it needs a file list. THREE THINGS TO SETTLE FIRST. (1) IS THE CEILING ITSELF WRONG HERE, or only its application? An exemption list is the obvious move and the obvious trap - an exemption that says "test files may grow forever" removes the pressure that produced two genuinely good splits in this repo''s history. Anything proposed must say what still constrains these files. (2) THE SPLIT THAT JUST HAPPENED WAS GOOD, and that argues against the convention as much as for it: the seam it found (click-gating guards versus linking guards) only became visible once both waves existed, and a one-file-per-component rule written in advance would have produced a different, probably worse, cut. So the honest question is whether the convention beats splitting-when-a-real-seam-appears, not whether it beats splitting-under-duress. (3) WHAT ACTUALLY FAILED HERE WAS THE VERIFY LIST, not the ceiling: A5''s verify named five commands and the ceiling test was not among them, so nobody ran it - not the implementer, not the verifier, not me. A convention change would not have caught that, and the cheaper fix may be that every verify list in this queue includes the ceiling gate whenever the wave adds lines to an existing file. Consider that before the larger change.'
- id: 'A14'
  state: 'unscoped'
  title: 'A student''s zip loses the student. On a Canvas bulk download where students submitted .zip files, every student''s main.py collapses into ONE row named "main" - contents concatenated, one merged submission graded, the other students silently absent from the results table. LIVE ON MAIN and grade-affecting. extraction.ts:60-68 recurses into a nested zip with parentPath = the outer zip name (which carries the student identity), then utils.ts:77 takes getBaseFileName(...) = "main.py" and DISCARDS the parent segment; parts.length is then 1, the >= 4 Canvas branch at :94-106 is skipped, and the fallback at :108-117 yields studentKey "main". groupSubmissionsByStudent:151-163 groups on that key and :169-174 concatenates.'
  owns: []
  verify: null
  blocked_by: []
  instrument: 'Traced end to end by the N15a seam check, 2026-09-15, which read every cited line. REACHABILITY MEASURED, and it is not an edge case: provider "embedded" on the zip path is DETERMINISTIC - grading.ts:833 calls extractStudentEntries and extraction.ts:125 passes undefined for the inferred lookup, and that path has no LLM rescue by design ("must never depend on a model"). provider "gemini" hits the same fallback whenever inference degrades - engine.ts:411 inferFileNameConvention returns an empty lookup on !result.ok, on a JSON parse failure, and per item on anything failing parseInferredFileNameLookup filters (rubric.ts:171-178). UNTESTED: src/lib/grade/utils.test.ts is 68 lines (@(Get-Content).Count) and contains ZERO tests for parseSubmissionFileName or groupSubmissionsByStudent.'
  from: 'N15a seam check, 2026-09-15'
  area: 'grading-run-survival-and-disclosure'
  kind: 'bug'
  note: 'FILED SEPARATELY AND DELIBERATELY, out of the N15a design that found it: this is live on main, independent of any queued feature, and it changes grades rather than presentation - so it must not be entangled with a feature whose shape is still moving. THE FIX IS NOT OBVIOUS AND SHOULD BE DESIGNED, NOT GUESSED: the parent path segment is the identity carrier on the nested-zip path, but the Canvas 4-part convention branch and the inferred-lookup branch both key off the leaf, so a naive "prefer parentPath" changes behaviour on paths that work today. FIRST STEP, cheap and owed before any fix: write the missing tests against utils.ts for both functions with a nested-zip fixture, and prove they FAIL on the current code - this repo has shipped a guard test that could not fail. THE OWNER-VISIBLE SYMPTOM, for triage: students missing from the results table entirely, and a row whose student name is a bare filename stem like "main" or "submission". TWO CORRECTIONS TO THIS ROW, both measured during the fix and both to claims made here rather than by the implementer. (1) A COST MODEL UNDERSTATED: a coincidental 4-part leaf inside correctly-named student zips creates a phantom row that STEALS THAT FILE FROM EVERY STUDENT, not "one file" as first priced - measured, a path ending src/my_test_file_here.py yields a merged row named "my", and that shape is ordinary in real CS submissions. Unchanged from HEAD so not a regression of the fix, and deliberately left unfixed. (2) STILL OPEN AFTER THE FIX: two different students whose zips share an identical non-Canvas name still merge, and separating them by the field after the student name was ATTEMPTED AND WITHDRAWN - the evidence cited for it was this app''s own synthetic packer (canvasWorkToZipBase64), not a real Canvas archive, and utils.ts:70 says the real convention puts a DATE in that position, which would have split ONE student into two UI-identical rows sharing one edit entry and therefore one grade. It needs one real Canvas submissions zip''s filenames from the owner to settle; nothing in this checkout can supply that. Also measured and unfixed: files nested past MAX_NESTED_ZIP_DEPTH = 3 vanish with no failedSupportedFiles entry.'
- id: 'L13'
  state: 'unscoped'
  title: 'A CRLF-blind stripComments copy silently stops defending its own assertions, and the repo has no check that the 53 duplicated copies agree. CORRECTED 2026-09-16 - THE FIRST FILING OF THIS ROW WAS WRONG and the correction is the useful part. It claimed all 53 copies were blind, from a SYNTAX filter (does the source mention a carriage-return escape). A BEHAVIOURAL probe - extract each stripComments body, eval it, feed it a CRLF fixture whose only comment is a line comment, ask whether the comment survived - says otherwise: of 53 files defining the helper, 45 strip correctly, 8 were unparseable by the probe and read CR-safe by hand, and exactly ONE is genuinely blind: src/app/components/snapshot-grading/snapshot-role-setrole-callsites.structure.test.ts, which does split on a bare line feed then replaces with a pattern lacking the multiline flag. THE RULE THE FIRST FILING MISSED: in JavaScript a multiline dollar matches BEFORE a carriage return (CR is a line terminator), so the dominant shape - 28 of 53 files - is CR-safe despite never mentioning CR. Only a form that splits on a bare line feed AND drops the multiline flag is blind.'
  owns: []
  verify: null
  blocked_by: []
  instrument: 'Behavioural probe, 2026-09-16, run from the repo root: enumerate grep -rl "function stripComments" --include=*.test.ts src (53 files), brace-match each body out of its file, eval it, and apply it to a fixture built with String.fromCharCode(13) so no tool can materialize the escape. Result: 45 CR-tolerant, 0 blind among the parseable, 8 unparseable (inspected by hand: six use the multiline flag or an explicit non-CR character class and are safe; one is the SQL-specific stripCommentsAndDollarQuotes; one is the snapshot-grading chunk''s own copy, fixed in that chunk). The single blind file was then confirmed directly. The two-direction demonstration that produced this row stands for the copy it was run on: with the directory forced to CRLF a sabotage that should fail stayed GREEN, and separately a comment carrying an unmatched open paren survived stripping and tripped a bracket-counting throw, turning a green test hard red on a clean checkout. core.autocrlf=true, no .gitattributes, and git ls-files --eol src | grep -c "w/crlf" returns 453, so CRLF working files are the normal case here.'
  from: 'N15c remediation verification 2026-09-16; corrected by the A15 round-3 check the same day'
  area: 'loop-and-docs-maintenance'
  kind: 'bug'
  note: 'WHY THIS IS STILL WORTH A ROW AFTER THE CORRECTION SHRANK IT: the defect is one file, but the exposure is that nothing detects divergence among 53 copies that the repo REQUIRES to be duplicated (cross-test-file imports re-run the other file''s describe blocks, so importing is not available). One copy drifted; nothing would have caught a second. So the row is a decision, not a patch: either give these helpers a single non-test home that test files may import, or add a mechanical check that every copy agrees on a shared CRLF fixture. RELATED TO L9, NOT THE SAME: L9 is "most source-scanning tests have no comment defence at all"; this is "a defence that exists can stop working invisibly". A fix for L9 that mints more hand-rolled copies makes this row worse - sequence them. METHOD NOTE, recorded because it cost a wrong filing: a syntax filter over a helper''s SOURCE does not measure that helper''s BEHAVIOUR, and this repo''s own rule that a measurement names its command is not enough when the command measures the wrong thing. SECOND CORRECTION 2026-09-20, and it corrects THIS ROW''''S OWN RECOMMENDATION as well as every orchestrator brief this session. THERE ARE TWO FAILURE MODES, NOT ONE, AND THE FORM THIS ROW RECOMMENDED IS BLIND TO THE SECOND. Measured with a node one-liner against a CRLF fixture and a trailing-comment fixture. MODE 1, the original finding: split on a bare line-feed, then strip with a line-comment pattern carrying no multiline flag. CRLF-BLIND. One file has it. MODE 2, and this is the one the row got wrong: the anchored multiline form (caret, then optional spaces or tabs, then the comment pattern, with the m flag) is CR-SAFE BUT TRAILING-COMMENT-BLIND, because the leading anchor only matches a comment that begins its own line. THE SAFE FORM, and it is what the tree already uses at snapshot-grading.structure.test.ts:14-20 and useSnapshotGrade.wiring.test.ts:44-51: split on a CR-tolerant line-feed pattern, then strip an UNANCHORED line-comment pattern per line. Safe on both modes - the split consumes the carriage return, and the unanchored pattern catches a comment anywhere on the line. WHY MODE 2 MATTERS AS MUCH AS MODE 1: useSnapshotGrade.wiring.test.ts:38-43 records an EXECUTED DEFEAT that forced the in-tree form - replacing live code with a void statement plus the same code as a TRAILING comment left every assertion GREEN under a line-start-only strip. That is the L9 defect exactly, and the anchored form does not stop it. CONSEQUENCE FOR THIS ROW''''S OWN FIX: converting 53 copies to the anchored form would close mode 1 and OPEN mode 2 across the whole repo. Convert toward the in-tree form instead, and keep the CR canary that useSnapshotGrade.wiring.test.ts:58-70 builds with String.fromCharCode(13). METHOD NOTE, the second this row has earned: the first filing measured SYNTAX rather than BEHAVIOUR and was wrong by a factor of 53; this correction is about probing ONE failure mode and generalising to "safe". A probe that only tries the input you already suspect confirms whatever you already believe - vary the input along every axis the helper claims to cover.'

- id: 'L14'
  state: 'unscoped'
  title: 'A multi-path `vitest run` SILENTLY DROPS a path that matches nothing and still exits 0, so every verify command built as a list of files reports green while covering less than it claims. MEASURED 2026-09-20 twice, independently: `npx vitest run src/lib/no-emojis.test.ts src/does-not-exist.test.ts` prints "Test Files  1 passed (1)" / "Tests  18 passed (18)" and EXIT=0. Trailing arguments are FILTERS, not paths, and a filter matching nothing is not an error. Compounding it, the backlog''''s own closure-runner cannot catch the shortfall: src/tools/backlog/closure-runner.ts:31 TESTS_SUMMARY_RE matches the "Tests" line and never the "Test Files" line, and it requires only that at least one assertion passed - so a verify whose paths are half typos closes its row green.'
  owns: []
  verify: null
  blocked_by: []
  instrument: 'Found by the A10 scoping revision and re-run independently by the orchestrator from PowerShell, same output and same exit code both times. Scope of the exposure TODAY: none live - `grep -c "^  verify: " docs/backlog.yml` is 30 and every one of them is null, so no open row rests on a multi-path command. The exposure is FORWARD: the A8 re-scope already proposes a THIRTEEN-path verify, and a single-path verify IS runner-decidable because a missing or renamed sole path exits 1 with "No test files found" (covered by an executing test at closure-runner.test.ts:34-41). Also worth recording alongside: runVerify has ZERO production callers (grep -rn "runVerify" src returns 8 lines, 4 in closure-runner.ts and 4 in its own test; its doc comment at :71-76 says so), so a verify string is documentation of a decidable check rather than an executing gate until something calls it.'
  from: 'A10 scoping revision, 2026-09-20; re-measured independently the same day'
  area: 'loop-and-docs-maintenance'
  kind: 'bug'
  note: 'THE FIX IS A CHOICE and should be decided before the next verify is written, because two open items (A8, A10) are about to need one. (a) RULE that a verify is always SINGLE-PATH - simplest, runner-decidable, and it forces the oracle for a chunk into one file, which is arguably the right pressure anyway; the cost is that a chunk whose guarantees genuinely span several landed test files cannot name them all, and must lean on the wave gate instead. (b) TEACH THE RUNNER to read the "Test Files N passed (N)" line and compare N against the number of paths in the command - mechanical, but it has to parse the command. (c) REQUIRE `--reporter=json` and assert the collected file set - most precise, most work. RELATED: this is the same family as L13 - an instrument that reads clean while measuring nothing - and the same family as the repo''''s standing rule that a measurement names its command, extended to say the command must be shown to MEASURE WHAT IT CLAIMS. Whoever takes this should also settle whether runVerify ever gets a caller, since a decidable verify nothing runs is still not a gate. RULED 2026-09-20: SINGLE-PATH IS NOW REPO POLICY for a row''''s verify, option (a). A checker flagged that this row left the fix as an open CHOICE while three artifacts had already adopted single-path as if settled - so the precedent was being set by drift rather than by decision, which is how an unruled choice becomes an unexamined default. The reason (a) wins over (b) and (c): a single path is DECIDABLE BY THE EXISTING RUNNER - a missing sole path exits 1 with "No test files found", covered by an executing test at closure-runner.test.ts:34-41 - whereas both other options need the runner taught to parse something it does not read today. The stated cost stands and must be stated in each row: a chunk whose guarantees genuinely span several landed test files cannot name them all in verify, and leans on the wave gate instead. That is acceptable precisely BECAUSE the closure is verify AND wave gate, never verify alone.'

- id: 'L15'
  state: 'unscoped'
  title: 'A whole-tree walker runs under vitest''''s 5-SECOND DEFAULT timeout, so any gate in this repo can go falsely RED under concurrent load. MEASURED 2026-09-20 by a checker mid-run: `npm test` returned "Test Files 1 failed | 1070 passed (1071)" with src/source-bytes.structure.test.ts > "carries no UTF-8 BOM" reporting "Test timed out in 5000ms" at an elapsed 9588ms. Re-run in isolation the same file passes in 538ms, and two full-suite runs either side of it returned a clean 1071/21297 - so it is LOAD-DEPENDENT, not a defect in the test. vitest.config.ts sets NO testTimeout (grep for testTimeout returns nothing), so the 5000ms default applies to a test that walks every file in src/.'
  owns: []
  verify: null
  blocked_by: []
  instrument: 'Found by the A8-R scoping check while the machine was running several agents; reproduced as a NEGATIVE by the orchestrator - `npx vitest run src/source-bytes.structure.test.ts` alone is 538ms, and `npm test` immediately after was 1071/21297 green. That asymmetry IS the finding: the failure only appears when the box is loaded, which is exactly when an agent is most likely to be running a gate. Other whole-tree walkers share the exposure - `grep -rln "readdirSync|walkTsxFiles" --include=*.test.ts src` returns 32 files, and at least file-size-ceiling.structure.test.ts, no-emojis.test.ts and page-module-css-orphan-classes.test.ts walk all of src/ under the same default.'
  from: 'A8-R scoping check, 2026-09-20; reproduced as a negative the same day'
  area: 'loop-and-docs-maintenance'
  kind: 'bug'
  note: 'WHY THIS MATTERS MORE THAN A FLAKE: this repo''''s whole method rests on a red gate meaning something. A load-dependent false RED trains the reader to re-run and move on, which is precisely how a REAL red gets waved through - and it lands on the structural tests, the ones that catch the defects no other instrument sees. It is also the mirror of L14: there an instrument read clean while measuring nothing; here an instrument reads RED while nothing is wrong. Both make the gate''''s output uninformative, in opposite directions. THE FIX IS A CHOICE, and it should be decided before the next long wave: (a) set an explicit testTimeout in vitest.config.ts generous enough for a whole-tree walk - simplest, one line, but it slows the detection of a genuinely hung test everywhere; (b) give only the walkers a per-test timeout via the third argument to it(), so the default stays tight for unit tests - more precise, needs every walker found, and the walker set is itself a floor (32 files by the grep above); (c) make the walkers cheaper - most re-read the whole tree per assertion rather than reading once into a shared fixture. Recommend (b) plus (c) for the three worst offenders. WHOEVER TAKES THIS should also decide whether a gate that can flake belongs in a row''''s verify at all, or whether the wave gate is the only honest place for a whole-tree walker. SECOND INSTANCE 2026-09-20, ON A DIFFERENT FILE - this is a CLASS, not one file, and the row should be re-read that way. The A11 implementer''''s full-suite run failed on src/lib/recording-files.kinds.test.ts with the same signature: a 5000ms timeout under concurrent load, passing in 400ms (5 tests) when re-run in isolation, and the full re-run then came back clean at 1072 files / 21331 tests. So the exposure is not specific to source-bytes.structure.test.ts and is not specific to whole-tree WALKERS either - recording-files.kinds.test.ts is a migration test, which widens the suspected cause from "walks all of src/" to "any test whose cost is load-sensitive under vitest''''s unconfigured 5s default". PRACTICAL CONSEQUENCE ALREADY VISIBLE: two separate agents have now had to distinguish a real red from a flake by re-running in isolation, and both did so correctly - but that is exactly the habit that lets a REAL red through, which is the whole reason this row exists. Whichever fix is chosen, an explicit testTimeout is now the minimum, because the per-walker option (b) cannot cover a file that is not a walker. CORRECTION TO THE PARAGRAPH ABOVE, 2026-09-20, and it reverses that paragraph''''s conclusion. I wrote that recording-files.kinds.test.ts "is a migration test, not a whole-tree walker", that the mechanism therefore widened beyond walkers, and that fix option (b) could not cover it. ALL THREE ARE WRONG. Measured: recording-files.kinds.test.ts:19 calls fs.readdirSync over supabase/migrations and :23 readFileSync-s EVERY .sql in it - 108 files, 519K (ls supabase/migrations/*.sql | wc -l; du -sh) - and newestKindMigration() is called FOUR TIMES, once per test, so the directory is fully re-read four times per run. It is already a member of this row''''s own instrument set: grep -rlE "readdirSync|walkTsxFiles" --include=*.test.ts src returns 32 files and this is one of them. SO: L15 is still a CLASS by file count, but the MECHANISM DID NOT WIDEN - it is walkers, as originally filed - option (b) DOES cover this file, and this file is a textbook case for option (c), because it re-reads the whole directory per assertion instead of once into a shared fixture. Isolated three times: 1 file / 5 tests, 3.42s / 1.17s / 1.17s. METHOD NOTE, the third this session: I generalised from a file''''s NAME ("migration test") instead of opening it. The row''''s own first filing made the same error in the other direction, measuring syntax instead of behaviour.'

- id: 'L16'
  state: 'unscoped'
  title: 'The stop guard cannot tell "actionable and idle" from "actionable and BEING BUILT RIGHT NOW", so it fires every turn while an implementer is mid-flight and the orchestrator has to argue with it instead of reading it. MEASURED 2026-09-20: it blocked three consecutive turns on A11 while A11''''s implementer was running, which is exactly the behaviour the guard exists to produce when the queue is idle and exactly the wrong signal when it is not. BacklogState is "actionable" | "owner" | "verification" | "unscoped" (src/tools/backlog/types.ts:19) - there is no member meaning "dispatched, in flight".'
  owns: []
  verify: null
  blocked_by: []
  instrument: 'Read from source rather than inferred: stop-guard.ts:63-75 blocks whenever selectNext returns an actionable item, with no other condition, and its own header (:10-17) records WHY it deliberately asks only a queue-local question - a "did I make progress this session" check is the B5 trap, because in a shared working tree the tree is always dirty from somebody and the check silently never fires. That reasoning is SOUND and must be preserved by any fix. The gap is not that the guard asks the wrong question; it is that the schema cannot EXPRESS the answer. Note the guard is self-limiting - escape 2 (stopHookActive) means it blocks at most once per turn - so this is friction and a misleading signal, not a trap.'
  from: 'Observed across three turns, 2026-09-20; guard source read the same day'
  area: 'loop-and-docs-maintenance'
  kind: 'chore'
  note: 'THE FIX THAT RESPECTS THE GUARD''''S OWN DESIGN is a fifth state, because a state is QUEUE-LOCAL and needs no session-scoped tracking - the precise property stop-guard.ts:10-17 argues for. Proposed: "building", set when a row is dispatched to an implementer and cleared at its push, with selectNext treating it like actionable for ORDERING but not for BLOCKING. That is a real chunk, not a one-liner: it touches types.ts''''s union and BACKLOG_STATES, isBacklogState, yaml-codec''''s validation, render.ts''''s section logic, next.ts''''s selectNext, stop-guard.ts, and each of their tests, plus the header doc in docs/BACKLOG.md that enumerates the states. AN ALTERNATIVE WORTH WEIGHING FIRST, because it may be cheaper and better: do nothing to the schema and accept that the guard is a floor rather than a signal - it fires, the orchestrator confirms work is running, and the turn continues. The cost of that is real though: a signal that is routinely correct to ignore is a signal that trains you to ignore it, which is the same failure mode as L15''''s flaky gate and L14''''s vacuous verify. This row is the third in that family and the family is the point - THIS REPO''''S WHOLE METHOD RESTS ON A GATE MEANING SOMETHING, and three separate instruments now say something other than what they appear to. WHOEVER TAKES THIS should decide the family together rather than one row at a time: L14 (an instrument reading clean while measuring nothing), L15 (one reading red while nothing is wrong), L16 (one reading block while the work is already running).'

- id: 'A16'
  state: 'unscoped'
  title: 'TOP PRIORITY, owner 2026-09-20: "this thing needs to live alongside each of the grading tools in the tools tab. when i run a tool over a series of assignments, that run should generate trends" - and "moving that is top priority". Class trends is currently reachable from ONE place: DraftedGradesTab.tsx:627 renders <ClassTrendsPanel entry={entry} />, and that is the only render site in the tree. The owner wants it per-grading-tool, generated BY A RUN rather than visited as a separate destination.'
  owns: []
  verify: null
  blocked_by: []
  instrument: 'Located 2026-09-20. THE LOGIC ALREADY EXISTS AND IS SUBSTANTIAL - src/lib/grade/class-trends.ts (355 lines), class-trends-insight.ts (251), class-trends-draft.ts (214), plus an API route at src/app/api/class-trends-insight/route.ts, each with a sibling test. THE UI IS TWO COMPONENTS - drafted-grades/ClassTrendsPanel.tsx (201) and ClassTrendsDraftPanel.tsx (123), the second mounted by the first at ClassTrendsPanel.tsx:192 - plus classTrendsDraftState.ts and four test files. So this is a PLACEMENT AND TRIGGER change over shipped logic, not a new feature, which is why it can be top priority without being large. THE TOOLS TAB IS RecordingTab.tsx, whose strip at :591 is role=tablist aria-label="Recording tools" with TWELVE entries declared as one inline literal; the grading ones are "grading" (Grading (from a recording)) and "snapgrade" (Grading (from screenshots)). OTHER GRADING SURFACES EXIST OUTSIDE THAT STRIP and the scope must enumerate them rather than assume two: the Live Feed / Canvas path in GradingTab.tsx, repo grades, and the assignment-upload tool. "Each of the grading tools" is the scoping question, not a given.'
  from: 'Owner, 2026-09-20, flagged top priority mid-turn'
  area: 'grading-run-survival-and-disclosure'
  kind: 'feature'
  note: 'WHAT THE OWNER ASKED FOR HAS TWO HALVES AND THEY ARE NOT THE SAME SIZE. (1) PLACEMENT - trends renders alongside each grading tool instead of only in Drafted Grades. (2) TRIGGER - "when i run a tool over a series of assignments, THAT RUN should generate trends", i.e. trends become an OUTPUT OF A RUN rather than a thing the instructor navigates to afterwards. Half (2) is the substantive one: it needs the run to carry enough identity to group its results into a series, and the scope must establish whether each grading tool''s run already has that or whether it is being invented. A CONSTRAINT FROM THIS REPO''''S OWN HISTORY, and it is the one to watch: recording-split.structure.test.ts holds HARDCODED COUNTS for that strip - exactly 12 sub-tab entries, exactly 11 role=tabpanel occurrences, and panelTargets.size === 11 - and the card records that adding a sub-tab breaks three of those and passes the fourth FALSELY. If the answer is a new strip entry, that test is in owns and its counts move in the same commit. If the answer is a panel WITHIN each existing grading tool, they may not move at all - which is an argument for the second shape. ALSO: the DraftedGradesTab site is not obviously to be deleted - decide whether trends move or fan out, because a run-generated panel and a per-entry review panel answer different questions. And note N13a/N13b are open against this same code; sequence them, since N13b (name the SUBSET of students who missed the same area) is what makes a per-run trend worth reading at all. SCOPED 2026-09-20 to docs/a16-scope.md, and THE OWNER ANSWERED TWO FORKS THE SAME DAY. OWNER ANSWER 1 - "A SERIES" MEANS ONE RUN OVER MANY STUDENTS'''' SUBMISSIONS FOR THE SAME ASSIGNMENT, not trends spanning several assignments. That is the smaller path and it is available today: every grading tool already does exactly that, so trends can attach to a run without inventing a multi-assignment run object. This matters because the scoping measured that NO INTERACTIVE GRADING TOOL RUNS OVER A SERIES OF ASSIGNMENTS AT ALL - GradingRunEntry is ONE assignment (types.ts:320-338), and the only GradingRunEntry[] producers are the workflow grade step (steps.grading-run.ts:425,496) and GradingDraftPayload.runs (grading-drafts.ts:33), whose consumer is the Drafted Grades site trends ALREADY occupies. Cross-assignment accumulation is therefore a separate, larger item and is NOT in A16. OWNER ANSWER 2 - FIX THE RECORDING TOOL''''S DATA GAP INSIDE A16. Measured: "Grading (from a recording)" CANNOT feed trends at all, because composeGradingRowResult parses rubricAreas and then THROWS THEM AWAY, returning only four strings (grading-feedback-prompt.ts:146-155; GradingRecordingFeedback at :47-58), while computeClassTrends reads result.rubricAreas[].area/.score. Mounting today''''s panel there would render "Trends (0)" FOREVER. Snapshot grading is unaffected (snapshot-row.ts:122-124). The owner chose to widen that result rather than ship one of the two strip grading tools without trends - a silent empty panel being worse than no panel. THREE MEASURED FINDINGS THAT RESHAPE THE ROW. (1) TRENDS IS ALREADY IN THE TOOLS TAB - tab-sections.ts:40 has manual: "Tools" - so the ask is not to move it INTO that tab but to stop it being a DESTINATION within it. (2) The "three other grading surfaces" are four MODES OF ONE COMPONENT (GradingMode = zip|canvas|livefeed|github, GradingTab.tsx:26), three of which render the same GradingResults.tsx - so ONE mount there serves four surfaces. (3) RECOMMENDATION FAN OUT, DO NOT MOVE: the Drafted Grades site is the only multi-assignment view and is baselined at REGRESSION 422; a run-generated panel and a per-entry review panel answer different questions. PANEL INSIDE EACH TOOL, NO NEW STRIP ENTRY - and the hardcoded strip counts are the SECOND reason, the first being that a 13th tab is a destination, which is the thing the owner asked to stop building. SEQUENCING CONSTRAINT, stated loudly by the seat rather than routed around: A16-1 is disjoint from the live work, but the two surfaces the owner most likely pictures are snapshot-grading/ and grading-recording/, both held by other chunks today. N13b is FOLLOWED not carried - it shares two files and redefines AreaTrend, which A16 would otherwise design against. CORRECTIONS: class-trends-draft.ts is 228 lines, not the 214 this row and my brief both said. GradingRecordingPanel.tsx is 995, not the 964 in this-repo.md - five lines of headroom on the very file a panel-inside reading edits first. And recording-split.structure.test.ts:219''''s panelTargets.size is computed from the test''''s OWN hardcoded key list, so it does pass falsely exactly as the card warns, while its strip regex silently misses a hyphenated key. REVISED 2026-09-20 on the owner answers; docs/a16-scope.md is now 845 lines. FOUR FINDINGS, and the first corrects MY OWN FRAMING in the most consequential way. (1) THE RECORDING TOOL''''S BATCH BOUNDARY ALREADY EXISTS AND ALREADY PERSISTS. I told the seat no interactive grading tool had a run object; that is FALSE for this one. GradingRecordingPanel.tsx:791-807 renders an assessment selector, :291 derives assessmentId, :310 passes it into useGradingRows, useGradingRows.ts:362 stamps it, and `assessment` is in the persisted wire key set. What misled both me and revision 1 is a STALE COMMENT: grading-row.ts:156-162 states as an "HONEST FINDING, verified directly against GradingRecordingPanel.tsx" that the panel "has no assessment selector of any kind today" and that "nothing currently calls stampGradingRowsWithAssessment with a real value". Both false against the tree. FOURTH stale comment to mislead a pass today. The click at handleGradeAll:537-571 is a real batch and a per-run log record already exists. (2) SNAPSHOT GRADING GENUINELY HAS NO BOUNDARY - no course field, no assessment field, and SnapshotGradingPanel.tsx:931 records that the table survives reloads. Every candidate delimiter is an invention. SO MOUNTING TRENDS THERE FIRST WOULD SHIP THE EXACT CROSS-ASSIGNMENT MIXING THE OWNER''''S ANSWER 1 PUT OUT OF SCOPE, and it would ship green. The assessment label is that surface''''s first requirement, not the panel. (3) THE OWNER''''S ANSWER 2 REVERSES A PINNED DECISION, not an unmade one - and the pin''''s rationale is a BUNDLE. grading-submission-grade.test.ts:99 is titled "a graded row has exactly {id, totalScore, strengths, improvements, overallComment, failed} - no student, no userId, no rubricAreas, no feedback field" and :117 asserts not.toHaveProperty("rubricAreas") beside not.toHaveProperty("student"), not.toHaveProperty("userId") and JSON.stringify(result).not.toContain("userId"). That neighbourhood is a PII / minimal-surface constraint, and rubricAreas is THE ONE MEMBER OF THAT LIST THAT IS NOT PII - it is rubric area names and scores, already shown to the instructor. So the reversal does not violate the pin''''s REASON, but the test title and the assertion both move and the commit must say why. (4) THE DATA FIX CROSSES 12 HOPS AND THE SECOND TRAP IS A COLLISION: applyAssessmentResult (assessment-row.ts:159-165) ENUMERATES SIX FIELDS RATHER THAN SPREADING, so a widened result type is SILENTLY DROPPED there - and that file belongs to A11''''s live remediation, so the fix routes around it through grading-rows.ts''''s own wrapper, following the useSnapshotGrade.ts:266-272 precedent. WITHDRAWN: revision 1''''s "widen the panel''''s prop" - GradingResults.tsx has no assignmentName to pass, so the widened prop had a hole at its very first consumer. Replaced by per-surface pure adapters building a GradingRunEntry, which leaves the panel prop, DraftedGradesTab.tsx, class-trends.ts and all three existing pins untouched and dissolves the contract-wave coupling. CHUNKING: A16-1 (adapter + defaultExpanded + ONE mount in GradingResults.tsx, serving all four LMS modes) and A16-2 (the recording data fix, no UI) run CONCURRENTLY - file-disjoint and informationally independent, because A16-2 has zero design freedom (computeClassTrends reads .area/.score and the type is the existing RubricAreaResult). A16-3/4/5 sequence after. TWO THINGS FOR THE CHECKER: A16-3''''s line budget is a HARD BLOCKER (GradingRecordingPanel.tsx is 995 against a 1000 ceiling, so the extraction is IN the chunk, not after it), and sabotage S22 is expected NOT to go red - making GradingRow.rubricAreas optional passes everything, which is why the artifact argues REQUIRED on construction grounds instead of claiming a guard that does not exist. OWNER ANSWER 3, 2026-09-20: A RECORDING-TOOL TREND COVERS THE ROWS THAT RUN JUST GRADED - not every row carrying the assessment label. This settles the check''''s B1, which was the item''''s real blocker. THE PROBLEM IT CLOSES, measured: handleGradeAll grades gradingRows.rawRows UNFILTERED (GradingRecordingPanel.tsx:560-571), i.e. every row in the course scope across ALL assessment labels against one rubricText - while the revision''''s cohort was rawRows filtered by the currently-typed assessmentId. Those are different sets, and the artifact called the second one "the batch for this tool". Worse, `assessment` is stamped at CAPTURE time and never at grade time (setAllRows has one caller, the extraction sync at :465, and the panel''''s own hint at :810-813 says the label "will apply to submissions captured from then on, not to rows already recorded"), and the control is a freeSolo Autocomplete whose onInputChange writes state on EVERY KEYSTROKE (:797-806). So: capture 30 rows with the label blank, click Grade All, then type "Essay 2" and the trends panel DISAPPEARS mid-keystroke - the silent-empty state owner answer 2 exists to prevent, reached from the other direction, and uncatchable here because nothing renders. THE FIX IS BUILDABLE NOW: the id set handleGradeAll submitted already exists in memory at :560 and is already logged as a count at :604. Define the cohort from the run, not from the live text field. REVISION 3, 1226 lines, all seven blockers addressed; round-3 check in flight. THE COHORT IS NOW THE RUN, per owner answer 3: lastRunCohort = {at, ids} set ONCE inside handleGradeAll from the submissions array already built at :561-565, never from assessmentLabel, assessmentId, rows or filterText, with an assertion pinning that dependency set. Multi-label contamination is now DISCLOSED to the instructor rather than falsely filtered away - which is the honest version of the same fact. A CONSEQUENCE THE OWNER SHOULD KNOW, and it is a product limit rather than a defect: THE COHORT IS useState AND DOES NOT SURVIVE A RELOAD. Grade a batch, see trends; refresh, and the trends are gone until the next run, while the graded rows themselves persist. That simplification is what let H10 - persisting rubricAreas to the wire - be WITHDRAWN, which keeps the frozen 16-key oracle at grading-row-serialization.test.ts:620-637 at SIXTEEN and makes it stronger, because its sabotage now runs against an oracle that was never widened. An upgrade path to persistence is recorded rather than foreclosed. The check is asked whether the panel DISCLOSES that on reload or merely vanishes - a silently vanishing panel is the empty-state failure the owner rejected twice. OTHER RESOLUTIONS: the SCALE leverage claim is WITHDRAWN as inherited - 14 files already batch, measured with canaries - and restated as click-cost/reachability under leverage.md''''s own "accept the cost explicitly" move, with a removal test that now traces to what is claimed. A16-1''''s owns is derived with a STATED COMMAND and gains five files, including classTrendsDraft.not-postable.test.ts, because ClassTrendsPanel.tsx IS a canary root and A16-1 EDITS it - the earlier exclusion answered whether A16-1 ADDS a file that layer reaches, which was the wrong question. REGRESSION 359''''s standing extraction debt is confirmed at :34299 and the extraction is IN A16-1 before its own code. H4 is respecified BY SYMBOL after the line citations proved wrong at the edit point. And student: "" is WITHDRAWN - the adapter passes the run BY REFERENCE, A16-3 emits real names, and the guards that actually protect privacy are named and left untouched (the panel never reads .student; the route anonymises; the insight type carries no name field). N13b is unblocked rather than foreclosed. IT ALSO CORRECTED THE ROUND-2 CHECKER on a measured point: ALLOWED_OVERAGE is at :64-81, not :68-85, confirmed on the working tree and against git show HEAD:, and recorded so it is not "fixed" back.'
