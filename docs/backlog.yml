ames the two-line swap. WAVE-2 VERIFY RESIDUALS, IN SUBSTANCE (docs/a16-wave2-verify.md section 9). RES-V-1: GradingRecordingPanel.tsx is at 990 lines, so 10 of headroom, and nothing gates a wave''s own addition count - wave 2 added 72 against a 46-line budget. Owner: the orchestrator. Instrument: git show <pinned base>:<panel> against @(Get-Content <panel>).Count, never HEAD. Step: before dispatch of any wave whose write set contains GradingRecordingPanel.tsx. RES-V-3: handleGradeAll''s dependency array is correctness-neutral only because useGradingRows returns an unmemoized object literal (useGradingRows.ts:500); memoizing that return later silently restores the stale-capture bug, visible only as a lint WARNING. Owner: the orchestrator. Instrument: npx eslint on the panel, warning count against the repo lint baseline. Step: the first wave that adds a useMemo to useGradingRows.ts''s return. RES-V-4: the JOIN KEY and per-row assessment assertions in classTrendsRunCohort.test.ts build their oracle from r.result.student, so they are not independent of the student projection - mutant P14 fires all three. Owner: a loop-test-author. Instrument: re-run P14 (const student = empty string) and count the its that fire. Step: any round that must localise a join-versus-projection defect. RES-V-6: onClearTable and onRemoveRow do not clear lastRunCohort, so the recording trends outlive the rows they describe - never ruled on. Owner: the repo owner, a product decision. Instrument: a real browser. Step: owner verification, asked together with RES-W3-3. RES-V-7: GradingRecordingPanel.wiring.test.ts canaries that renderBody excludes the handler but nothing canaries that the handleGradeAll body excludes the render body. Owner: a loop-implementer, one canary it. Instrument: assert the handler body does not match <GradingTable. Step: the next wave whose write set contains GradingRecordingPanel.wiring.test.ts. RES-V-8: that file''s stripComments truncates any line with // inside a string